name: Tianheng login apply once
on:
  push:
    branches:
      - fix/tianheng-require-login-20260915
permissions:
  contents: write
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require login for Tianheng
        run: python3 scripts/apply-tianheng-login-once.py
      - name: Focused access tests
        run: npx vitest run src/__tests__/AlgorithmGuestAccess.test.ts src/__tests__/MatrixExploreGuest.test.tsx src/__tests__/FirstVisitGuideGuest.test.tsx src/matrix-algorithm-api.test.ts --reporter=verbose
      - name: Protected runtime integrity
        run: npm run check:runtime
      - name: Cloudflare Pages production build
        run: npm run build:pages
      - name: Commit verified change and remove one-off files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tianheng-login-red.yml scripts/apply-tianheng-login-once.py
          git add src/matrix-algorithm-api.ts src/onboarding/FirstVisitGuide.tsx src/__tests__/FirstVisitGuideGuest.test.tsx src/__tests__/AlgorithmGuestAccess.test.ts supabase/migrations/20260915154500_tianheng_requires_login.sql
          git commit -m 'Require login for Tianheng'
          git push origin HEAD:fix/tianheng-require-login-20260915
