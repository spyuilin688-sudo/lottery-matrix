name: Tianheng login red
on:
  push:
    branches:
      - fix/tianheng-require-login-20260915
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/__tests__/AlgorithmGuestAccess.test.ts --reporter=verbose
