name: One-off explore validation summary patch v5

on:
  push:
    paths:
      - '.github/workflows/one-off-explore-validation-summary-v5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify formal source and red state
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const tsx = fs.readFileSync('src/FeaturePages.tsx', 'utf8');
          const css = fs.readFileSync('src/feature-pages.css', 'utf8');
          const oldSummary = '<span><strong>條件摘要</strong>開 {number} 第 {position} 顆｜上 2 期｜第 3 顆｜+14.24｜下 {predictionPeriod} 期開</span>';
          const groups = 'const sourceGroups = [ROAD_VALIDATION_SAMPLE_HISTORY.slice(0, 3), ROAD_VALIDATION_SAMPLE_HISTORY.slice(3, 6)];';
          if (!tsx.includes(oldSummary)) throw new Error('Formal summary source no longer matches expected main.');
          if (!tsx.includes(groups)) throw new Error('Formal validation groups are not already three rows.');
          if (!css.includes('.validation-summary-card strong {')) throw new Error('Formal summary-label CSS source not found.');
          if (!css.includes('.validation-summary-card em { position: absolute; top: 50%; right: 8px; width: 66px; transform: translateY(-50%);')) throw new Error('Formal consecutive-position CSS source no longer matches expected main.');
          if (!tsx.includes('<strong>條件摘要</strong>')) throw new Error('Red-state check unexpectedly passed.');
          console.log('RED confirmed: requested label is still present before patch.');
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Capture baseline type-check
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/tsc-before.txt 2>&1
          echo $? > /tmp/tsc-before-code.txt
          set -e
          grep -E 'error TS[0-9]+' /tmp/tsc-before.txt | sed -E 's/\([0-9]+,[0-9]+\)//g' | sort -u > /tmp/tsc-before-canonical.txt || true
          cat /tmp/tsc-before.txt
          echo "baseline_exit=$(cat /tmp/tsc-before-code.txt)"

      - name: Apply requested changes only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const tsxPath = 'src/FeaturePages.tsx';
          let tsx = fs.readFileSync(tsxPath, 'utf8');
          const oldSummary = '<span><strong>條件摘要</strong>開 {number} 第 {position} 顆｜上 2 期｜第 3 顆｜+14.24｜下 {predictionPeriod} 期開</span>';
          const newSummary = '<span>開 {number} 第 {position} 顆｜上 2 期｜第 3 顆｜+14.24｜下 {predictionPeriod} 期開</span>';
          if (tsx.split(oldSummary).length !== 2) throw new Error('Summary source must match exactly once.');
          tsx = tsx.replace(oldSummary, newSummary);
          fs.writeFileSync(tsxPath, tsx);

          const cssPath = 'src/feature-pages.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          const oldStrong = '.validation-summary-card strong { flex: 0 0 auto; color: #f6c95f; font-size: 12.5px; }\n';
          const oldEm = '.validation-summary-card em { position: absolute; top: 50%; right: 8px; width: 66px; transform: translateY(-50%); color: #f6c95f; font-style: normal; font-weight: 800; text-align: right; white-space: nowrap; }';
          const newEm = '.validation-summary-card em { position: absolute; top: 6px; right: 8px; width: 66px; transform: none; color: #f6c95f; font-style: normal; font-weight: 800; text-align: right; white-space: nowrap; }';
          if (css.split(oldStrong).length !== 2) throw new Error('Summary-label CSS source must match exactly once.');
          if (css.split(oldEm).length !== 2) throw new Error('Consecutive-position CSS must match exactly once.');
          css = css.replace(oldStrong, '').replace(oldEm, newEm);
          fs.writeFileSync(cssPath, css);
          NODE

      - name: Verify green state and exact scope
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const tsx = fs.readFileSync('src/FeaturePages.tsx', 'utf8');
          const css = fs.readFileSync('src/feature-pages.css', 'utf8');
          const expectedSummary = '<span>開 {number} 第 {position} 顆｜上 2 期｜第 3 顆｜+14.24｜下 {predictionPeriod} 期開</span>';
          const groups = 'const sourceGroups = [ROAD_VALIDATION_SAMPLE_HISTORY.slice(0, 3), ROAD_VALIDATION_SAMPLE_HISTORY.slice(3, 6)];';
          if (tsx.includes('<strong>條件摘要</strong>')) throw new Error('條件摘要 label still exists.');
          if (!tsx.includes(expectedSummary)) throw new Error('Summary box content was not preserved.');
          if (!tsx.includes(groups)) throw new Error('Validation grouping changed from three rows.');
          if (css.includes('.validation-summary-card strong {')) throw new Error('Obsolete summary-label CSS remains.');
          if (!css.includes('.validation-summary-card em { position: absolute; top: 6px; right: 8px; width: 66px; transform: none;')) throw new Error('連準次數 is not positioned at the summary upper-right.');
          console.log('GREEN confirmed: requested state is present and three-row grouping is unchanged.');
          NODE
          git diff --check
          git diff -- src/FeaturePages.tsx src/feature-pages.css

      - name: Confirm type-check did not regress
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/tsc-after.txt 2>&1
          AFTER_CODE=$?
          set -e
          BEFORE_CODE=$(cat /tmp/tsc-before-code.txt)
          grep -E 'error TS[0-9]+' /tmp/tsc-after.txt | sed -E 's/\([0-9]+,[0-9]+\)//g' | sort -u > /tmp/tsc-after-canonical.txt || true
          cat /tmp/tsc-after.txt
          echo "baseline_exit=$BEFORE_CODE patched_exit=$AFTER_CODE"
          if [ "$BEFORE_CODE" = "0" ]; then
            test "$AFTER_CODE" = "0"
          else
            test "$AFTER_CODE" = "$BEFORE_CODE"
            diff -u /tmp/tsc-before-canonical.txt /tmp/tsc-after-canonical.txt
          fi

      - name: Build frontend
        run: npx vite build

      - name: Remove temporary workflows and commit to main
        shell: bash
        run: |
          rm -f .github/workflows/one-off-explore-validation-layout.yml
          rm -f .github/workflows/one-off-explore-validation-layout-v2.yml
          rm -f .github/workflows/one-off-explore-validation-layout-v3.yml
          rm -f .github/workflows/one-off-explore-validation-layout-v4.yml
          rm -f .github/workflows/one-off-explore-validation-summary-v5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/FeaturePages.tsx src/feature-pages.css .github/workflows
          git diff --cached --check
          git diff --cached --name-only
          git commit -m 'fix: adjust explore validation summary layout'
          git push origin HEAD:main
