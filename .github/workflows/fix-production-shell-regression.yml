name: Temporary Matrix Explore title action removal

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-production-shell-regression.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Explore Tianyan and Tiangong title actions at source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/FeaturePages.tsx')
          text = path.read_text()

          switcher = '''function MatrixPageSwitcher({ onNavigate }: {
            current?: "explore" | "tianyan" | "tiangong";
            onNavigate: Navigate;
          }) {
            return (
              <nav className="matrix-page-switcher" aria-label="Matrix Core 功能切換">
                <button type="button" aria-label="Matrix 天衍" onClick={() => onNavigate("tianyan")}>
                  <img src="/assets/lottery/functions/Matrix天衍.png" alt="" draggable={false} />
                </button>
                <button type="button" aria-label="Matrix 天工" onClick={() => onNavigate("tiangong")}>
                  <img src="/assets/lottery/functions/Matrix天工.png" alt="" draggable={false} />
                </button>
              </nav>
            );
          }
          '''
          action = '      headerAction={title === "Matrix 探索" ? <MatrixPageSwitcher current="explore" onNavigate={onNavigate} /> : undefined}\n'

          if text.count(switcher) != 1:
              raise SystemExit(f'Expected MatrixPageSwitcher exactly once, found {text.count(switcher)}')
          if text.count(action) != 1:
              raise SystemExit(f'Expected Explore headerAction exactly once, found {text.count(action)}')

          text = text.replace(switcher, '', 1).replace(action, '', 1)
          path.write_text(text)
          PY

      - name: Restore workflow and verify requested scope
        run: |
          git show HEAD^:.github/workflows/fix-production-shell-regression.yml > .github/workflows/fix-production-shell-regression.yml
          git diff --check
          test "$(git diff --name-only | sort)" = "src/FeaturePages.tsx"
          ! grep -q 'function MatrixPageSwitcher' src/FeaturePages.tsx
          ! grep -q 'MatrixPageSwitcher current="explore"' src/FeaturePages.tsx

      - name: Verify build
        run: |
          npm ci --ignore-scripts
          npm run check:runtime
          node --test tests/matrix-explore-fluid-layout.test.mjs tests/mobile-native-scroll.test.mjs tests/mobile-runtime-entry.test.mjs tests/pwa-shell-viewport.test.mjs
          npm run build

      - name: Commit requested change
        run: |
          git config user.name "spy854540-cmd"
          git config user.email "spy854540@gmail.com"
          git add src/FeaturePages.tsx .github/workflows/fix-production-shell-regression.yml
          git commit -m "style: temporarily remove Explore Tianyan Tiangong title actions"
          git push origin main
