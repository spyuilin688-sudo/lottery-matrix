name: Audit Matrix Explore Spec

on:
  push:
    branches: ["探索"]
    paths:
      - ".github/workflows/audit-matrix-explore-spec.yml"

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 探索
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Confirm RED against current branch
        run: |
          set +e
          python .github/scripts/audit_matrix_explore.py check > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected re-audit checks to fail before the fix"
            exit 1
          fi
          echo "RED confirmed"
      - name: Apply document-backed fixes and cleanup
        run: python .github/scripts/audit_matrix_explore.py patch
      - name: Verify document re-audit checks
        run: python .github/scripts/audit_matrix_explore.py check
      - name: Verify focused regression tests
        run: node --test tests/matrix-explore-option-layout.test.mjs
      - name: Verify diff hygiene
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Verify direct Vite production build
        run: npx vite build
      - name: Verify known npm build guard only
        run: |
          set +e
          npm run build > /tmp/npm-build.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat /tmp/npm-build.log
            exit 0
          fi
          cat /tmp/npm-build.log
          grep -Fq "Mobile runtime integrity check failed:" /tmp/npm-build.log
          grep -Fq -- "- src/App.tsx was modified" /tmp/npm-build.log
          grep -Fq "Restore the protected runtime. Put app UI in src/Prototype.tsx and src/prototype.css." /tmp/npm-build.log
          echo "Known baseline npm build guard confirmed"
      - name: Commit verified audit fixes
        run: |
          rm .github/workflows/audit-matrix-explore-spec.yml
          rm .github/scripts/audit_matrix_explore.py
          git config user.name "spy854540-cmd"
          git config user.email "spy854540@gmail.com"
          git add src/feature-pages.css src/FeaturePages.tsx .github/workflows/audit-matrix-explore-spec.yml .github/scripts/audit_matrix_explore.py
          git commit -m "fix(explore): complete document spec re-audit"
          git push origin HEAD:探索
