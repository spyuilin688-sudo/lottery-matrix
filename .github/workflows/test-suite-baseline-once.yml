name: Test suite baseline once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    if: github.head_ref == 'chore/test-suite-consolidation-20260904-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Baseline Full Node
        run: node --test tests/*.test.mjs
      - name: Baseline Build
        run: npm run build
