name: Matrix API wire once

on:
  push:
    paths:
      - '.github/workflows/matrix-api-wire-once.yml'

permissions:
  contents: write

jobs:
  wire-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Wire Matrix APIs into formal frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          api_path = Path('src/lottery-api.ts')
          api = api_path.read_text()
          api = replace_once(api,
          """export type LotteryHistoryResponse = {
            items?: LotteryDrawRecord[];
          } | LotteryDrawRecord[];
          """,
          """export type LotteryHistoryResponse = {
            items?: LotteryDrawRecord[];
          } | LotteryDrawRecord[];

          export type MatrixNumberOrder = '依號碼由小到大排序' | '依實際開獎順序排序';

          export type TongXingRequest = {
            lottery: NumberBallLottery;
            numberOrder: MatrixNumberOrder;
            numbers: string[];
            futureOffset: number;
          };

          export type TongXingPair = {
            lockedEntry: LotteryDrawRecord;
            predictedEntry: LotteryDrawRecord;
          };

          type TongXingResponse = {
            lottery: NumberBallLottery;
            numberOrder: MatrixNumberOrder;
            numbers: string[];
            futureOffset: number;
            groups: TongXingPair[];
          };

          export type NumberReferenceRequest = {
            lottery: NumberBallLottery;
            numberOrder: MatrixNumberOrder;
            historyRange: 1000 | 3000 | 5000;
            numbers: string[];
          };

          export type NumberReferenceItem = LotteryDrawRecord & {
            matchSlots: number[];
          };

          type NumberReferenceResponse = {
            lottery: NumberBallLottery;
            numberOrder: MatrixNumberOrder;
            historyRange: 1000 | 3000 | 5000;
            numbers: string[];
            items: NumberReferenceItem[];
          };
          """, 'lottery api types')
          api = replace_once(api,
          """async function requestJson<T>(path: string): Promise<T> {
            const response = await fetch(`${LOTTERY_API_BASE}${path}`, {
              headers: { Accept: 'application/json' },
            });
          """,
          """async function requestJson<T>(path: string, init?: RequestInit): Promise<T> {
            const headers = new Headers(init?.headers);
            headers.set('Accept', 'application/json');
            const response = await fetch(`${LOTTERY_API_BASE}${path}`, {
              ...init,
              headers,
            });
          """, 'requestJson init')
          api = replace_once(api,
          """function isLatestLotteryEnvelope(data: LatestLotteryResponse): data is LatestLotteryEnvelope {
          """,
          """function normalizeProjectedRecord(lottery: NumberBallLottery, record: LotteryDrawRecord): LotteryDrawRecord {
            const normalizedPeriod = normalizePeriod(lottery, record.period ?? record.issue);
            const normalizedDrawDate = normalizeDrawDate(record.drawDate ?? record.date);
            return {
              ...record,
              period: normalizedPeriod,
              issue: normalizedPeriod,
              drawDate: normalizedDrawDate,
              date: normalizedDrawDate,
              numbers: normalizeNumberList(record.numbers),
              specialNumber: record.specialNumber ?? record.special,
            };
          }

          function isLatestLotteryEnvelope(data: LatestLotteryResponse): data is LatestLotteryEnvelope {
          """, 'projected record normalizer')
          api = api.rstrip() + """

          export async function fetchTongXing(input: TongXingRequest) {
            const data = await requestJson<TongXingResponse>('/api/matrix/tongxing', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(input),
            });
            return {
              ...data,
              groups: data.groups.map((group) => ({
                lockedEntry: normalizeProjectedRecord(input.lottery, group.lockedEntry),
                predictedEntry: normalizeProjectedRecord(input.lottery, group.predictedEntry),
              })),
            };
          }

          export async function fetchNumberReference(input: NumberReferenceRequest) {
            const data = await requestJson<NumberReferenceResponse>('/api/matrix/number-reference', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(input),
            });
            return {
              ...data,
              items: data.items.map((item) => ({
                ...normalizeProjectedRecord(input.lottery, item),
                matchSlots: Array.isArray(item.matchSlots) ? item.matchSlots.map(Number) : [],
              })),
            };
          }
          """
          api_path.write_text(api)

          pages_path = Path('src/FeaturePages.tsx')
          pages = pages_path.read_text()
          pages = replace_once(pages,
          'import { fetchLotteryHistory, type LotteryDrawRecord } from "./lottery-api";',
          '''import {
            fetchLotteryHistory,
            fetchNumberReference,
            fetchTongXing,
            type LotteryDrawRecord,
            type MatrixNumberOrder,
            type NumberReferenceItem,
            type TongXingPair,
          } from "./lottery-api";''', 'FeaturePages api import')
          pages = replace_once(pages,
          '''import {
            buildTongXingPairs,
            filterHistoryRecords,
            isDuplicateLookupNumber,
            normalizeLookupNumber,
          } from "./feature-tool-logic";''',
          '''import {
            filterHistoryRecords,
            isDuplicateLookupNumber,
            normalizeLookupNumber,
          } from "./feature-tool-logic";''', 'remove local tongxing import')
          pages = replace_once(pages,
          '''  const [appliedValues, setAppliedValues] = useState<string[]>([]);
            const [appliedPeriod, setAppliedPeriod] = useState(1);
            const [appliedLottery, setAppliedLottery] = useState<LotteryId>(lottery);
            const [appliedOrder, setAppliedOrder] = useState(order);
            const resultsEndRef = useRef<HTMLDivElement>(null);
            const periodOffset = Number(period.replace(/\\D/g, "")) || 1;
            const history = useLotteryHistory(appliedLottery, Math.max(40, appliedPeriod + 10));
            const historyOrder = getHistoryOrder(appliedOrder);
            const resultColumns = appliedLottery === "六合彩" || appliedLottery === "大樂透"
              ? ["一", "二", "三", "四", "五", "六", "特"]
              : ["一", "二", "三", "四", "五"];
            const resultGroups = useMemo(
              () => buildTongXingPairs(history, appliedValues, appliedPeriod),
              [history, appliedValues, appliedPeriod],
            );''',
          '''  const [appliedValues, setAppliedValues] = useState<string[]>([]);
            const [appliedLottery, setAppliedLottery] = useState<LotteryId>(lottery);
            const [appliedOrder, setAppliedOrder] = useState(order);
            const [resultGroups, setResultGroups] = useState<TongXingPair[]>([]);
            const resultsEndRef = useRef<HTMLDivElement>(null);
            const periodOffset = Number(period.replace(/\\D/g, "")) || 1;
            const historyOrder = getHistoryOrder(appliedOrder);
            const resultColumns = appliedLottery === "六合彩" || appliedLottery === "大樂透"
              ? ["一", "二", "三", "四", "五", "六", "特"]
              : ["一", "二", "三", "四", "五"];''', 'TongXing state')
          pages = replace_once(pages,
          '''  const handleSearch = () => {
              const hasInvalidValue = values.some((value) => value !== "" && !/^(0[1-9]|[1-4][0-9])$/.test(value));
              if (hasInvalidValue) {
                setValues(values.map((value) => /^(0[1-9]|[1-4][0-9])$/.test(value) ? value : ""));
                return;
              }
              setAppliedValues(values.map(normalizeLookupNumber).filter(Boolean));
              setAppliedPeriod(periodOffset);
              setAppliedLottery(lottery);
              setAppliedOrder(order);
              setSearched(true);
              requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                  resultsEndRef.current?.scrollIntoView({ behavior: "smooth", block: "end" });
                });
              });
            };''',
          '''  const handleSearch = async () => {
              const hasInvalidValue = values.some((value) => value !== "" && !/^(0[1-9]|[1-4][0-9])$/.test(value));
              if (hasInvalidValue) {
                setValues(values.map((value) => /^(0[1-9]|[1-4][0-9])$/.test(value) ? value : ""));
                return;
              }
              const normalizedValues = values.map(normalizeLookupNumber).filter(Boolean);
              setAppliedValues(normalizedValues);
              setAppliedLottery(lottery);
              setAppliedOrder(order);
              setResultGroups([]);
              try {
                const response = await fetchTongXing({
                  lottery,
                  numberOrder: order as MatrixNumberOrder,
                  numbers: normalizedValues,
                  futureOffset: periodOffset,
                });
                setResultGroups(response.groups);
              } catch {
                setResultGroups([]);
              }
              setSearched(true);
              requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                  resultsEndRef.current?.scrollIntoView({ behavior: "smooth", block: "end" });
                });
              });
            };''', 'TongXing API search')
          pages = replace_once(pages,
          '''  const [inputs, setInputs] = useTimedState("reference-inputs", ["", "", ""]);
            const [appliedInputs, setAppliedInputs] = useState<string[]>([]);
            const [appliedLottery, setAppliedLottery] = useState<LotteryId>(lottery);''',
          '''  const [inputs, setInputs] = useTimedState("reference-inputs", ["", "", ""]);
            const [appliedLottery, setAppliedLottery] = useState<LotteryId>(lottery);''', 'NumberReference remove local applied inputs')
          pages = replace_once(pages,
          '''  const resultsEndRef = useRef<HTMLDivElement>(null);
            const history = useLotteryHistory(appliedLottery, getHistoryLimit(appliedRange));
            const displayedHistory = useMemo(() => [...history].reverse(), [history]);
            const historyOrder = getHistoryOrder(appliedOrder);''',
          '''  const resultsEndRef = useRef<HTMLDivElement>(null);
            const [referenceItems, setReferenceItems] = useState<NumberReferenceItem[] | null>(null);
            const history = useLotteryHistory(appliedLottery, getHistoryLimit(appliedRange));
            const fallbackHistory = useMemo(() => [...history].reverse(), [history]);
            const displayedHistory = referenceItems ?? fallbackHistory;
            const historyOrder = getHistoryOrder(appliedOrder);''', 'NumberReference API state')
          pages = replace_once(pages,
          '''  const resetReference = () => {
              setInputs(["", "", ""]);
              setAppliedInputs([]);
              setMarkedRows(new Set());
              setMarkedCells(new Set());
            };''',
          '''  const resetReference = () => {
              setInputs(["", "", ""]);
              setReferenceItems(null);
              setMarkedRows(new Set());
              setMarkedCells(new Set());
            };''', 'NumberReference reset')
          pages = replace_once(pages,
          '''  const startReferenceSearch = () => {
              const normalized = inputs.map(normalizeLookupNumber);
              const unique = normalized.filter((value, index) => value && normalized.indexOf(value) === index);
              setInputs(normalized);
              setAppliedInputs(unique);
              setAppliedLottery(lottery);
              setAppliedRange(range);
              setAppliedOrder(order);
              setQueryExpanded(false);
              setQueryFloating(false);
              requestAnimationFrame(() => {
                resultsEndRef.current?.scrollIntoView({ behavior: "smooth", block: "end" });
              });
            };''',
          '''  const startReferenceSearch = async () => {
              const normalized = inputs.map(normalizeLookupNumber);
              const unique = normalized.filter((value, index) => value && normalized.indexOf(value) === index);
              const historyRange = Number(range.replace(/\\D/g, "")) as 1000 | 3000 | 5000;
              setInputs(normalized);
              setAppliedLottery(lottery);
              setAppliedRange(range);
              setAppliedOrder(order);
              try {
                const response = await fetchNumberReference({
                  lottery,
                  numberOrder: order as MatrixNumberOrder,
                  historyRange,
                  numbers: unique,
                });
                setReferenceItems(response.items);
              } catch {
                setReferenceItems([]);
              }
              setQueryExpanded(false);
              setQueryFloating(false);
              requestAnimationFrame(() => {
                resultsEndRef.current?.scrollIntoView({ behavior: "smooth", block: "end" });
              });
            };''', 'NumberReference API search')
          pages = replace_once(pages,
          '''                    const inputIndex = appliedInputs.findIndex((value) => value === num);
                              const manuallyMarked = markedCells.has(`${issue}-${num}`);''',
          '''                    const autoMatch = Array.isArray(record.matchSlots) ? Number(record.matchSlots[index] ?? 0) : 0;
                              const manuallyMarked = markedCells.has(`${issue}-${num}`);''', 'NumberReference API match slot')
          pages = replace_once(pages,
          'data-auto-match={inputIndex >= 0 ? inputIndex + 1 : 0}',
          'data-auto-match={autoMatch}', 'NumberReference data auto match')
          pages_path.write_text(pages)

          logic_path = Path('src/feature-tool-logic.ts')
          logic = logic_path.read_text()
          marker = '\nfunction recordNumbers(record: HistoryRecord) {'
          if logic.count(marker) != 1:
              raise SystemExit(f'feature-tool-logic local TongXing marker count: {logic.count(marker)}')
          logic = logic.split(marker, 1)[0].rstrip() + '\n'
          logic_path.write_text(logic)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run focused existing UI tests
        run: npx vitest run src/__tests__/NumberReferencePage.test.tsx
      - name: Build formal project
        run: npm run build
      - name: Commit verified source and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/matrix-api-wire-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lottery-api.ts src/FeaturePages.tsx src/feature-tool-logic.ts .github/workflows/matrix-api-wire-once.yml
          git commit -m 'feat: connect Matrix tools to API'
          git push origin HEAD:main
