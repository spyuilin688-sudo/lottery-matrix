name: Apply responsive UI cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'bottom-nav-responsive-source-fix-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: RED - updated regression tests fail before source changes
        shell: bash
        run: |
          set +e
          node --test \
            tests/calculator-responsive-layout.test.mjs \
            tests/matrix-explore-fluid-layout.test.mjs \
            tests/tongxing-reference-responsive-layout.test.mjs \
            tests/draw-history-table-layout.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected updated responsive regression tests to fail before the source patch.'
            exit 1
          fi

      - name: Record pre-existing main node-test baseline
        shell: bash
        run: |
          : > baseline-failing.txt
          : > baseline-output.txt
          for file in tests/*.test.mjs; do
            if [ "$file" = "tests/sites-worker.test.mjs" ]; then
              continue
            fi
            echo "===== $file =====" | tee -a baseline-output.txt
            set +e
            node --test "$file" 2>&1 | tee -a baseline-output.txt
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -ne 0 ]; then
              echo "$file" >> baseline-failing.txt
            fi
          done
          sort -u baseline-failing.txt -o baseline-failing.txt
          echo 'Baseline node failures:'
          cat baseline-failing.txt || true

      - name: Record pre-existing Vitest baseline
        shell: bash
        run: |
          set +e
          npm run test:unit 2>&1 | tee baseline-vitest-output.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > baseline-vitest-exit.txt
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('baseline-vitest-output.txt').read_text(errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)
          failures = sorted(set(m.group(1).strip() for m in re.finditer(r'^\s*FAIL\s+(.+)$', text, re.M)))
          if int(Path('baseline-vitest-exit.txt').read_text().strip()) != 0 and not failures:
              failures = ['__vitest_non_test_failure__']
          Path('baseline-vitest-failing.txt').write_text('\n'.join(failures) + ('\n' if failures else ''))
          print('Baseline Vitest failures:')
          print('\n'.join(failures) if failures else '(none)')
          PY

      - name: GREEN - apply exact responsive UI source cleanup
        run: |
          python .github/apply-responsive-ui-cleanup.py
          python .github/update-fixed-position-vitest.py

      - name: Verify requested regression suite
        shell: bash
        run: |
          : > targeted-output.txt
          : > targeted-failing.txt
          status=0
          for file in \
            tests/ui-responsive-cleanup-contract.test.mjs \
            tests/calculator-responsive-layout.test.mjs \
            tests/matrix-explore-option-layout.test.mjs \
            tests/matrix-explore-fluid-layout.test.mjs \
            tests/bottom-navigation-safe-area-position.test.mjs \
            tests/bottom-navigation-height.test.mjs \
            tests/tongxing-reference-responsive-layout.test.mjs \
            tests/draw-history-table-layout.test.mjs
          do
            echo "===== $file =====" | tee -a targeted-output.txt
            set +e
            node --test "$file" 2>&1 | tee -a targeted-output.txt
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -ne 0 ]; then
              echo "$file" | tee -a targeted-failing.txt
              status=1
            fi
          done
          exit "$status"

      - name: Verify Vitest introduces no new failures
        shell: bash
        run: |
          set +e
          npm run test:unit 2>&1 | tee vitest-output.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > vitest-exit.txt
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('vitest-output.txt').read_text(errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)
          failures = sorted(set(m.group(1).strip() for m in re.finditer(r'^\s*FAIL\s+(.+)$', text, re.M)))
          if int(Path('vitest-exit.txt').read_text().strip()) != 0 and not failures:
              failures = ['__vitest_non_test_failure__']
          Path('vitest-failing.txt').write_text('\n'.join(failures) + ('\n' if failures else ''))
          baseline = set(Path('baseline-vitest-failing.txt').read_text().splitlines())
          new = sorted(set(failures) - baseline)
          Path('new-vitest-failing.txt').write_text('\n'.join(new) + ('\n' if new else ''))
          print('Post-change Vitest failures:')
          print('\n'.join(failures) if failures else '(none)')
          print('New Vitest failures:')
          print('\n'.join(new) if new else '(none)')
          if new:
              raise SystemExit(1)
          PY

      - name: Verify production build
        run: npm run build

      - name: Run complete post-change node suite
        shell: bash
        run: |
          : > post-failing.txt
          : > post-output.txt
          for file in tests/*.test.mjs; do
            echo "===== $file =====" | tee -a post-output.txt
            set +e
            node --test "$file" 2>&1 | tee -a post-output.txt
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -ne 0 ]; then
              echo "$file" >> post-failing.txt
            fi
          done
          sort -u post-failing.txt -o post-failing.txt
          echo 'Post-change node failures:'
          cat post-failing.txt || true

      - name: Reject newly introduced node-test failures
        shell: bash
        run: |
          sort -u baseline-failing.txt -o baseline-failing.txt
          sort -u post-failing.txt -o post-failing.txt
          comm -23 post-failing.txt baseline-failing.txt > new-failing.txt
          echo 'New node-test failures after responsive cleanup:'
          cat new-failing.txt || true
          if [ -s new-failing.txt ]; then
            exit 1
          fi

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: final-responsive-ui-node-diagnostics
          path: |
            baseline-failing.txt
            baseline-output.txt
            baseline-vitest-output.txt
            baseline-vitest-exit.txt
            baseline-vitest-failing.txt
            targeted-output.txt
            targeted-failing.txt
            vitest-output.txt
            vitest-exit.txt
            vitest-failing.txt
            new-vitest-failing.txt
            post-failing.txt
            post-output.txt
            new-failing.txt
          if-no-files-found: ignore

      - name: Commit verified cleanup to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-responsive-ui-cleanup.yml
          rm -f .github/workflows/finalize-responsive-ui-cleanup.yml
          rm -f .github/apply-responsive-ui-cleanup.py
          rm -f .github/update-fixed-position-vitest.py
          rm -f baseline-failing.txt baseline-output.txt baseline-vitest-output.txt baseline-vitest-exit.txt baseline-vitest-failing.txt targeted-output.txt targeted-failing.txt vitest-output.txt vitest-exit.txt vitest-failing.txt new-vitest-failing.txt post-failing.txt post-output.txt new-failing.txt
          git add -A
          git commit -m 'Fix responsive feature layouts and filters'
          git push origin main
