name: Apply responsive UI cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'bottom-nav-responsive-source-fix-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: RED - requested UI contract
        shell: bash
        run: |
          cat > tests/ui-responsive-cleanup-contract.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';

          const feature = fs.readFileSync('src/feature-pages.css', 'utf8');
          const responsive = fs.readFileSync('src/responsive-feature-pages.css', 'utf8');
          const tongxing = fs.readFileSync('src/tongxing-compact.css', 'utf8');
          const explore = fs.readFileSync('src/matrix-explore-spacing.css', 'utf8');
          const balls = fs.readFileSync('src/number-ball.css', 'utf8');
          const source = fs.readFileSync('src/FeaturePages.tsx', 'utf8');
          const main = fs.readFileSync('src/main.tsx', 'utf8');

          test('標題操作按鈕為 27.4px、直角矩形、文字箭頭零間距', () => {
            assert.match(responsive, /\.title-card-compact-action\s*\{[^}]*height:\s*27\.4px;[^}]*min-height:\s*27\.4px;[^}]*gap:\s*0;/s);
            assert.match(responsive, /\.title-card-compact-action::before\s*\{[^}]*height:\s*27\.4px;/s);
            assert.doesNotMatch(responsive.match(/\.title-card-compact-action::before\s*\{[^}]*\}/s)?.[0] ?? '', /clip-path/);
            assert.doesNotMatch(responsive.match(/\.title-card-compact-action::after\s*\{[^}]*\}/s)?.[0] ?? '', /clip-path/);
            assert.match(responsive, /\.number-reference-screen \.matrix-title-banner-actions\s*\{[^}]*width:\s*40%;/s);
            assert.match(responsive, /\.title-card-compact-action \.reference-refresh-icon\s*\{[^}]*width:\s*7px;[^}]*height:\s*7px;/s);
          });

          test('同星、對照單、歷史紀錄與計算機使用指定左右外距', () => {
            assert.match(tongxing, /\.tongxing-screen \.feature-body\s*\{[^}]*width:\s*calc\(100% - 40px\);[^}]*margin-inline:\s*20px;/s);
            assert.match(responsive, /\.draw-history-screen \.feature-body,[\s\S]*?\.number-reference-screen \.feature-body\s*\{[^}]*padding-inline:\s*20px;[^}]*gap:\s*12px;/s);
            assert.match(feature, /\.calculator-screen > \.feature-body\s*\{[^}]*padding:\s*0 20px var\(--layout-bottom-nav-clearance\);/s);
          });

          test('三個浮動設定卡固定於 viewport 並使用 20px 左右外距', () => {
            assert.match(tongxing, /\.tongxing-query\[data-floating="true"\]\s*\{[^}]*position:\s*fixed;[^}]*left:\s*20px;[^}]*right:\s*20px;/s);
            assert.match(feature, /\.history-filter-panel\[data-floating="true"\]\s*\{[^}]*position:\s*fixed;[^}]*left:\s*20px;[^}]*right:\s*20px;/s);
            assert.match(feature, /\.reference-query-panel\[data-floating="true"\]\s*\{[^}]*position:\s*fixed;[^}]*left:\s*20px;[^}]*right:\s*20px;/s);
            assert.match(source, /setSettingsPanelTop\(\(header\?\.getBoundingClientRect\(\)\.bottom \?\? 0\) \+ 8\)/);
            assert.match(source, /setQueryPanelTop\(\(header\?\.getBoundingClientRect\(\)\.bottom \?\? 0\) \+ 8\)/);
            assert.match(source, /setFilterPanelTop\(\(header\?\.getBoundingClientRect\(\)\.bottom \?\? 0\) \+ 8\)/);
          });

          test('設定區改為直角選項外框且文字自動適配', () => {
            assert.match(feature, /\.history-filter-panel \.select-box::before,[\s\S]*?\.history-filter-panel \.select-box::after\s*\{\s*display:\s*none;/s);
            assert.match(feature, /\.reference-query-panel \.select-box::before,[\s\S]*?\.reference-query-panel \.select-box::after\s*\{\s*display:\s*none;/s);
            assert.match(tongxing, /\.tongxing-panel-scope \.select-box::before,[\s\S]*?\.tongxing-panel-scope \.select-box::after\s*\{\s*display:\s*none;/s);
            assert.match(feature, /\.history-filter-panel select\s*\{[^}]*font-size:\s*clamp\(/s);
            assert.match(feature, /\.number-reference-screen \.reference-select select\s*\{[^}]*font-size:\s*clamp\(/s);
            assert.match(tongxing, /\.tongxing-panel-scope \.query-selects select,[\s\S]*?font-size:\s*clamp\(/s);
          });

          test('歷史日期只在使用者改動後套用', () => {
            assert.match(source, /const \[dateFilterTouched, setDateFilterTouched\] = useState\(false\);/);
            assert.match(source, /date:\s*dateFilterTouched\s*\?/);
            assert.match(source, /setDateFilterTouched\(true\)/);
          });

          test('Matrix 探索與底部導覽使用正式響應式避讓', () => {
            assert.doesNotMatch(explore, /--layout-bottom-nav-clearance:[^;]*--mobile-safe-area-height/);
            assert.match(explore, /\.matrix-explore-main-screen \.feature-body\s*\{[^}]*padding:\s*0 12px var\(--layout-bottom-nav-clearance\);/s);
            assert.match(explore, /\.matrix-explore-main-screen \.matrix-title-banner\s*\{[^}]*width:\s*calc\(100% - 24px\);/s);
            assert.doesNotMatch(feature, /\.calculator-screen > \.feature-body\s*\{[^}]*80px/s);
            assert.doesNotMatch(main, /bottom-nav-responsive-clearance\.css/);
            assert.equal(fs.existsSync('src/bottom-nav-responsive-clearance.css'), false);
          });

          test('歷史今彩539底線 0.2px 不再被 Matrix Explore 尺寸規則誤套', () => {
            assert.doesNotMatch(balls, /\.matrix-explore-main-screen \.history-panel/);
            assert.match(balls, /\.matrix-explore-main-screen \.matrix-explore-history-panel:is\(\[data-lottery="今彩539"\], \[data-lottery="天天樂"\]\)/);
            assert.match(balls, /\.draw-history-screen \.draw-history-panel\[data-lottery="今彩539"\][^}]*--underline-y:\s*\.2px;/s);
          });

          test('通知移除重複固定尺寸與 Logo 特例', () => {
            assert.match(feature, /\.notifications-screen \.feature-body\s*\{[^}]*var\(--layout-bottom-nav-clearance\)/s);
            assert.doesNotMatch(feature, /\.notifications-screen \.feature-body\s*\{[^}]*--mobile-safe-area-height/s);
            assert.doesNotMatch(responsive, /\.bottom-nav-brand-screen \.shared-brand-logo\s*\{[^}]*width:\s*75%/s);
            assert.doesNotMatch(responsive, /bottom-nav-brand-screen\.notifications-screen[^}]*margin-bottom:\s*4px/s);
            assert.doesNotMatch(responsive, /@media \(max-width:\s*360px\)[\s\S]*?notification-heading/);
            assert.match(responsive, /\.notification-heading\s*\{[^}]*grid-template-columns:\s*clamp\(/s);
          });

          test('同星結果列提高背景與群組分隔辨識度', () => {
            assert.match(tongxing, /--group-divider-width:\s*3px;/);
            assert.match(tongxing, /data-row-type="locked"[^}]*rgba\(126, 83, 15, \.24\)/s);
            assert.match(tongxing, /data-row-type="predicted"[^}]*rgba\(10, 61, 88, \.25\)/s);
          });
          EOF

          set +e
          node --test tests/ui-responsive-cleanup-contract.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'RED unexpectedly passed before source changes.'
            exit 1
          fi

      - name: GREEN - apply exact requested cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def rep(path, old, new, expected=1):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected}, got {count}: {old[:120]!r}')
              write(path, text.replace(old, new, expected))
          def sub1(path, pattern, replacement, flags=0):
              text = read(path)
              output, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: regex expected 1, got {count}: {pattern[:120]!r}')
              write(path, output)

          # Previous pending bottom-navigation cleanup + calculator 20px side margins.
          rep('src/feature-pages.css',
              '.calculator-screen > .feature-body { box-sizing: border-box; min-width: 0; min-height: 0; flex: 1 1 auto; padding-bottom: 80px; overflow-y: auto; overscroll-behavior-y: contain; }',
              '.calculator-screen > .feature-body { box-sizing: border-box; min-width: 0; min-height: 0; flex: 1 1 auto; padding: 0 20px var(--layout-bottom-nav-clearance); overflow-y: auto; overscroll-behavior-y: contain; }')
          rep('src/matrix-explore-spacing.css', '  --layout-bottom-nav-clearance: calc(var(--bottom-navigation-height) + var(--mobile-safe-area-height, 34px));\n', '')
          rep('src/matrix-explore-spacing.css', '  padding: 0 16px 1rem;', '  padding: 0 12px var(--layout-bottom-nav-clearance);')
          rep('src/matrix-explore-spacing.css', '  width: calc(100% - 32px);', '  width: calc(100% - 24px);')
          rep('src/main.tsx', 'import "./bottom-nav-responsive-clearance.css";\n', '')

          # 27.4px title actions, rectangular frame, no text/arrow gap.
          rep('src/responsive-feature-pages.css', '  height: 44px;\n  min-height: 44px;', '  height: 27.4px;\n  min-height: 27.4px;')
          rep('src/responsive-feature-pages.css', '  gap: 3px;\n  border: 0;', '  gap: 0;\n  border: 0;')
          rep('src/responsive-feature-pages.css', '  font-size: 8.1px;', '  font-size: clamp(8px, 2.3vw, 10px);')
          rep('src/responsive-feature-pages.css', '  height: 23.4px;', '  height: 27.4px;')
          rep('src/responsive-feature-pages.css', '  height: 21.4px;', '  height: 25.4px;')
          clip = '  clip-path: polygon(var(--select-tech-cut) 0, calc(100% - var(--select-tech-cut)) 0, 100% var(--select-tech-cut), 100% calc(100% - var(--select-tech-cut)), calc(100% - var(--select-tech-cut)) 100%, var(--select-tech-cut) 100%, 0 calc(100% - var(--select-tech-cut)), 0 var(--select-tech-cut));\n'
          rep('src/responsive-feature-pages.css', clip, '', expected=2)

          marker = '.draw-history-screen .history-filter-trigger {\n  min-width: 61.2px;\n}\n'
          addition = marker + '''\n.number-reference-screen .matrix-title-banner-actions {\n  width: 40%;\n}\n\n.title-card-compact-action .reference-refresh-icon {\n  width: 7px;\n  height: 7px;\n  flex: 0 0 7px;\n}\n'''
          rep('src/responsive-feature-pages.css', marker, addition)

          # History/reference page contents at 20px; card-to-results spacing 12px.
          old_group = '''.draw-history-screen .feature-body,\n.number-reference-screen .feature-body,\n.tongxing-screen .feature-body,\n.notifications-screen .feature-body,\n.profile-screen .feature-body {\n  box-sizing: border-box;\n  width: 100%;\n  margin-inline: 0;\n  padding-inline: var(--layout-page-inline);\n}\n'''
          new_group = '''.draw-history-screen .feature-body,\n.number-reference-screen .feature-body {\n  box-sizing: border-box;\n  width: 100%;\n  margin-inline: 0;\n  padding-inline: 20px;\n  gap: 12px;\n}\n\n.profile-screen .feature-body {\n  box-sizing: border-box;\n  width: 100%;\n  margin-inline: 0;\n  padding-inline: var(--layout-page-inline);\n}\n'''
          rep('src/responsive-feature-pages.css', old_group, new_group)

          # Quick/notification/profile logo geometry now inherits the homepage shared logo rules.
          sub1('src/responsive-feature-pages.css', r'\n\.bottom-nav-brand-screen > \.feature-brand-header \{.*?\}\n\n\.bottom-nav-brand-screen \.shared-brand-logo \{.*?\}\n\n\.bottom-nav-brand-screen > \.feature-brand-header\[data-compact="true"\] > \.shared-brand-logo > img \{.*?\}\n', '\n', re.S)
          sub1('src/responsive-feature-pages.css', r'\n\.bottom-nav-brand-screen\.notifications-screen > \.feature-brand-header:not\(\.integrated-title-header\) \{.*?\}\n', '\n', re.S)

          # Notification page: remove duplicate fixed sizing and keep one clamp-based responsive source.
          rep('src/responsive-feature-pages.css', '  grid-template-columns: 48px minmax(0, 1fr) 76px 42px;\n  column-gap: 6px;', '  grid-template-columns: clamp(40px, 12.3vw, 48px) minmax(0, 1fr) clamp(64px, 19.5vw, 76px) 42px;\n  column-gap: clamp(4px, 1.5vw, 6px);')
          rep('src/responsive-feature-pages.css', '  width: 44px;\n  height: 44px;', '  width: clamp(40px, 11.3vw, 44px);\n  height: clamp(40px, 11.3vw, 44px);', expected=2)
          rep('src/responsive-feature-pages.css', '  width: 72px;\n  height: 32px;\n  padding-inline: 8px;\n  font-size: 11px;', '  width: clamp(64px, 18.5vw, 72px);\n  height: 32px;\n  padding-inline: clamp(5px, 2vw, 8px);\n  font-size: clamp(10px, 2.8vw, 11px);')
          sub1('src/responsive-feature-pages.css', r'\n@media \(max-width: 360px\) \{.*?\n\}\s*$', '\n', re.S)

          rep('src/feature-pages.css', '.notification-row { display: grid; width: 100%; height: 80px; min-height: 0; padding: 8px; }', '.notification-row { display: grid; width: 100%; min-height: 0; }')
          rep('src/feature-pages.css', '.notification-heading { display: grid; grid-template-columns: 58px minmax(0, 1fr) 88px 46px; align-items: center; column-gap: 8px; }', '.notification-heading { display: grid; align-items: center; }')
          rep('src/feature-pages.css', '.notification-icon { display: grid; width: 58px; height: 58px; place-items: center; justify-self: start; }', '.notification-icon { display: grid; place-items: center; justify-self: start; }')
          rep('src/feature-pages.css', '.notification-icon img { display: block; width: 58px; height: 58px; object-fit: contain; }', '.notification-icon img { display: block; object-fit: contain; }')
          rep('src/feature-pages.css', '.notification-actions > button:first-child { width: 88px; height: 38px; padding: 0 12px; justify-self: end; border: 1px solid rgba(211, 166, 66, .62); border-radius: 19px; background: transparent; box-shadow: none; color: rgba(211, 166, 66, .88); font-size: 14px; font-weight: 600; line-height: 18px; white-space: nowrap; }', '.notification-actions > button:first-child { justify-self: end; border: 1px solid rgba(211, 166, 66, .62); border-radius: 19px; background: transparent; box-shadow: none; color: rgba(211, 166, 66, .88); font-weight: 600; line-height: 18px; white-space: nowrap; }')
          rep('src/feature-pages.css', '.notifications-screen .feature-body { padding: 0 20px calc(var(--bottom-navigation-height) + var(--mobile-safe-area-height, 34px) + 12px); }', '.notifications-screen .feature-body { padding: 0 20px calc(var(--layout-bottom-nav-clearance) + 12px); }')

          # Floating settings cards: fixed viewport positioning, 20px sides, same inner DOM geometry.
          sub1('src/feature-pages.css', r'(\.history-filter-panel\[data-floating="true"\]\s*\{\s*)position:\s*absolute;', r'\1position: fixed;')
          old_ref = '''.reference-query-panel[data-floating="true"] {\n  position: absolute;\n  z-index: 40;\n  left: 50%;\n  box-sizing: border-box;\n  width: calc(100% - (var(--layout-page-inline) * 2));\n  max-height: calc(100dvh - 24px);\n  padding: 8px;\n  overflow-y: auto;\n  border: 1px solid #6c4a20;\n  border-radius: 11px;\n  background: linear-gradient(145deg, rgba(8, 16, 22, .99), rgba(2, 8, 13, .99));\n  box-shadow: 0 12px 34px rgba(0, 0, 0, .72), inset 0 0 18px rgba(150, 102, 34, .04);\n  transform: translateX(-50%);\n}\n'''
          new_ref = '''.reference-query-panel[data-floating="true"] {\n  position: fixed;\n  z-index: 40;\n  left: 20px;\n  right: 20px;\n  box-sizing: border-box;\n  width: auto;\n  max-height: calc(100dvh - 24px);\n  padding: 8px;\n  overflow-y: auto;\n  border: 1px solid #6c4a20;\n  border-radius: 11px;\n  background: linear-gradient(145deg, rgba(8, 16, 22, .99), rgba(2, 8, 13, .99));\n  box-shadow: 0 12px 34px rgba(0, 0, 0, .72), inset 0 0 18px rgba(150, 102, 34, .04);\n}\n'''
          rep('src/feature-pages.css', old_ref, new_ref)
          sub1('src/tongxing-compact.css', r'(\.tongxing-query\[data-floating="true"\]\s*\{\s*)position:\s*absolute;', r'\1position: fixed;')

          # Straight rectangular setting controls and responsive text.
          rep('src/feature-pages.css', '.history-filter-panel select { min-width: 0; padding: 0 19px 0 4px; font-size: 10px; font-weight: 600; text-align: center; text-align-last: center; }', '.history-filter-panel select { min-width: 0; padding: 0 19px 0 4px; font-size: clamp(8.5px, 2.6vw, 11px); font-weight: 600; text-align: center; text-align-last: center; }')
          rep('src/feature-pages.css', '.history-order-select select { font-size: 11px; }', '.history-order-select select { font-size: clamp(8.5px, 2.8vw, 11px); }\n.history-filter-panel .select-box { border: 1px solid #b98723; border-radius: 0; background: #07131d; }\n.history-filter-panel .select-box::before,\n.history-filter-panel .select-box::after { display: none; }')
          rep('src/feature-pages.css', '.history-filter-start { height: 26px; padding: 0 4px; border: 1px solid #c99a2e; border-radius: 7px; background: linear-gradient(135deg, #efbf4f, #c9800c); color: #17120a; font-size: 11px; font-weight: 700; white-space: nowrap; }', '.history-filter-start { height: 26px; padding: 0 4px; border: 1px solid #c99a2e; border-radius: 7px; background: linear-gradient(135deg, #efbf4f, #c9800c); color: #17120a; font-size: clamp(9px, 2.8vw, 11px); font-weight: 700; white-space: nowrap; }')
          rep('src/feature-pages.css', '.reference-query-panel .reference-select { height: 26px; }', '.reference-query-panel .reference-select { height: 26px; border: 1px solid #b98723; border-radius: 0; background: #07131d; }\n.reference-query-panel .select-box::before,\n.reference-query-panel .select-box::after { display: none; }')
          rep('src/feature-pages.css', '.number-reference-screen .reference-select select { padding-left: 7px; padding-right: 25px; font-size: 13px; font-weight: 600; text-align: center; text-align-last: center; }', '.number-reference-screen .reference-select select { padding-left: 7px; padding-right: 25px; font-size: clamp(9px, 3vw, 13px); font-weight: 600; text-align: center; text-align-last: center; }')
          rep('src/feature-pages.css', '.number-reference-screen .reference-order-select select { padding-left: 5px; padding-right: 22px; font-size: 11.5px; }', '.number-reference-screen .reference-order-select select { padding-left: 5px; padding-right: 22px; font-size: clamp(8.5px, 2.8vw, 11.5px); }')
          rep('src/feature-pages.css', '.gold-button { height: 42px; padding-inline: 4px; gap: 4px; border: 0; background: linear-gradient(135deg, #f4c95e, #d99513); color: #17120a; font-size: 11px; font-weight: 600; white-space: nowrap; }', '.gold-button { height: 42px; padding-inline: 4px; gap: 4px; border: 0; background: linear-gradient(135deg, #f4c95e, #d99513); color: #17120a; font-size: clamp(9px, 2.8vw, 11px); font-weight: 600; white-space: nowrap; }')

          # Same-star page 20px body, same-size floating panel, responsive controls, stronger row distinction.
          rep('src/tongxing-compact.css', '  --group-divider-width: 2px;', '  --group-divider-width: 3px;')
          rep('src/tongxing-compact.css', '  width: calc(100% - (var(--layout-page-inline) * 2));\n  min-width: 0;\n  margin-inline: var(--layout-page-inline);', '  width: calc(100% - 40px);\n  min-width: 0;\n  margin-inline: 20px;')
          rep('src/tongxing-compact.css', '  width: calc(100% + (var(--layout-page-inline) * 2) - 40px);', '  width: 100%;')
          marker = '''.tongxing-panel-scope .query-selects .select-box,\n.tongxing-panel-scope .same-star-fields input,\n.tongxing-panel-scope .same-star-period-select {\n  height: var(--control-height);\n}\n'''
          addition = marker + '''\n.tongxing-panel-scope .query-selects .select-box,\n.tongxing-panel-scope .same-star-period-select {\n  border: 1px solid #b98723;\n  border-radius: 0;\n  background: #07131d;\n}\n\n.tongxing-panel-scope .select-box::before,\n.tongxing-panel-scope .select-box::after { display: none; }\n'''
          rep('src/tongxing-compact.css', marker, addition)
          rep('src/tongxing-compact.css', '''.tongxing-panel-scope .query-selects select,\n.tongxing-panel-scope .same-star-period-select select {\n  min-width: 0;\n  font-size: .75rem;\n  font-weight: 600;\n  text-align: center;\n  text-align-last: center;\n}\n''', '''.tongxing-panel-scope .query-selects select,\n.tongxing-panel-scope .same-star-period-select select {\n  min-width: 0;\n  font-size: clamp(9px, 3vw, 12px);\n  font-weight: 600;\n  text-align: center;\n  text-align-last: center;\n}\n''')
          rep('src/tongxing-compact.css', '  font-size: 18px;\n  font-weight: 600;\n}', '  font-size: clamp(14px, 4.6vw, 18px);\n  font-weight: 600;\n}', expected=2)
          rep('src/tongxing-compact.css', 'border-top: var(--group-divider-width) solid rgba(168, 119, 47, .7);', 'border-top: var(--group-divider-width) solid rgba(168, 119, 47, .9);')
          rep('src/tongxing-compact.css', 'background: rgba(126, 83, 15, .12);', 'background: rgba(126, 83, 15, .24);')
          rep('src/tongxing-compact.css', 'background: rgba(10, 61, 88, .13);', 'background: rgba(10, 61, 88, .25);')
          rep('src/tongxing-compact.css', 'rgba(105, 129, 140, .31)', 'rgba(105, 129, 140, .55)')

          # Matrix Explore-only ball sizing no longer leaks into draw-history; draw-history 539 keeps exact .2px underline distance.
          text = read('src/number-ball.css')
          count = text.count('.matrix-explore-main-screen .history-panel')
          if count != 4:
              raise SystemExit(f'number-ball explore selector count expected 4, got {count}')
          text = text.replace('.matrix-explore-main-screen .history-panel', '.matrix-explore-main-screen .matrix-explore-history-panel')
          anchor = '''.history-panel .number-ball-component.history-lottery-ball {\n  --number-ball-size: 28px;\n  --number-font-size: 12px;\n  --number-y: 0px;\n  --underline-width: 11px;\n  --underline-height: .5px;\n  --underline-y: .25px;\n}\n'''
          if text.count(anchor) != 1:
              raise SystemExit('history ball anchor mismatch')
          text = text.replace(anchor, anchor + '''\n.draw-history-screen .draw-history-panel[data-lottery="今彩539"] .number-ball-component.history-lottery-ball {\n  --underline-y: .2px;\n}\n''', 1)
          write('src/number-ball.css', text)

          # History default date is not applied until user changes a date field.
          rep('src/FeaturePages.tsx', '  const [day, setDay] = useTimedState("history-day", "31日");', '  const [day, setDay] = useTimedState("history-day", "31日");\n  const [dateFilterTouched, setDateFilterTouched] = useState(false);')
          rep('src/FeaturePages.tsx', '      date: `${year}/${month.replace("月", "")}/${day.replace("日", "")}`,', '      date: dateFilterTouched ? `${year}/${month.replace("月", "")}/${day.replace("日", "")}` : "",')
          rep('src/FeaturePages.tsx', 'value={year} onChange={(event) => setYear(event.target.value)}', 'value={year} onChange={(event) => { setYear(event.target.value); setDateFilterTouched(true); }}')
          rep('src/FeaturePages.tsx', 'value={month} onChange={(event) => setMonth(event.target.value)}', 'value={month} onChange={(event) => { setMonth(event.target.value); setDateFilterTouched(true); }}')
          rep('src/FeaturePages.tsx', 'value={day} onChange={(event) => setDay(event.target.value)}', 'value={day} onChange={(event) => { setDay(event.target.value); setDateFilterTouched(true); }}')

          # fixed-position cards require viewport top coordinates.
          for setter, screen in [
              ('setFilterPanelTop', '.draw-history-screen > .feature-brand-header'),
              ('setSettingsPanelTop', '.tongxing-screen > .feature-brand-header'),
              ('setQueryPanelTop', '.number-reference-screen > .feature-brand-header'),
          ]:
              pattern = rf'''    const header = document\.querySelector<HTMLElement>\("{re.escape(screen)}"\);\n    const mobilePage = document\.querySelector<HTMLElement>\("\.mobile-page"\);\n    const pageRect = mobilePage\?\.getBoundingClientRect\(\);\n    const pageTop = pageRect\?\.top \?\? 0;\n    const pageScale = pageRect && mobilePage\?\.offsetWidth \? pageRect\.width / mobilePage\.offsetWidth : 1;\n    {setter}\(\(\(header\?\.getBoundingClientRect\(\)\.bottom \?\? pageTop\) - pageTop\) / pageScale \+ 8\);'''
              replacement = f'''    const header = document.querySelector<HTMLElement>("{screen}");\n    {setter}((header?.getBoundingClientRect().bottom ?? 0) + 8);'''
              sub1('src/FeaturePages.tsx', pattern, replacement)

          rep('src/FeaturePages.tsx', '<ReloadIcon />刷新', '<ReloadIcon className="reference-refresh-icon" />刷新')

          # Update affected existing regression expectations to the new specification.
          calc = read('tests/calculator-responsive-layout.test.mjs')
          calc = calc.replace("assert.equal(style('.calculator-screen .feature-body').paddingInline, 'var(--layout-page-inline)');", "assert.equal(style('.calculator-screen .feature-body').paddingInline, '20px');")
          calc = calc.replace('  assert.match(body, /padding-bottom:\\s*80px/);', '  assert.match(body, /padding:\\s*0 20px var\\(--layout-bottom-nav-clearance\\)/);\n  assert.doesNotMatch(body, /80px/);')
          calc = calc.replace('    const bodyWidth = viewport - 24;', '    const bodyWidth = viewport - 40;')
          write('tests/calculator-responsive-layout.test.mjs', calc)

          option = read('tests/matrix-explore-option-layout.test.mjs')
          option = option.replace(r'padding:\s*0 16px 1rem;', r'padding:\s*0 12px var\(--layout-bottom-nav-clearance\);')
          option = option.replace(r'width:\s*calc\(100% - 32px\);', r'width:\s*calc\(100% - 24px\);')
          write('tests/matrix-explore-option-layout.test.mjs', option)

          Path('tests/bottom-navigation-height.test.mjs').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\ntest("底部導覽使用 82px 正式高度與瀏覽器 safe area 響應式避讓", () => {\n  const tokens = fs.readFileSync(new URL("../src/design-tokens.css", import.meta.url), "utf8");\n  const prototype = fs.readFileSync(new URL("../src/prototype.css", import.meta.url), "utf8");\n  assert.match(tokens, /--bottom-navigation-height:\\s*82px;/);\n  assert.match(tokens, /--layout-bottom-nav-clearance:\\s*calc\\(var\\(--bottom-navigation-height\\) \\+ env\\(safe-area-inset-bottom,\\s*0px\\)\\);/);\n  assert.doesNotMatch(tokens, /--layout-bottom-nav-clearance:[^;]*--mobile-safe-area-height/);\n  assert.match(prototype, /\\.bottom-nav-brand-screen:not\\(\\.notifications-screen\\) > \\.feature-body\\s*\\{[^}]*padding-bottom:\\s*var\\(--layout-bottom-nav-clearance\\);/s);\n});\n''')
          PY

          rm -f src/bottom-nav-responsive-clearance.css
          rm -f tests/bottom-navigation-responsive-clearance.test.mjs

      - name: Verify requested regression tests
        run: |
          node --test \
            tests/ui-responsive-cleanup-contract.test.mjs \
            tests/calculator-responsive-layout.test.mjs \
            tests/matrix-explore-option-layout.test.mjs \
            tests/matrix-explore-fluid-layout.test.mjs \
            tests/bottom-navigation-safe-area-position.test.mjs \
            tests/bottom-navigation-height.test.mjs \
            tests/tongxing-reference-responsive-layout.test.mjs \
            tests/draw-history-table-layout.test.mjs

      - name: Verify all node test files
        shell: bash
        run: |
          : > failing-tests.txt
          status=0
          for file in tests/*.test.mjs; do
            echo "===== $file ====="
            if ! node --test "$file"; then
              echo "$file" >> failing-tests.txt
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo 'Failing test files:'
            cat failing-tests.txt
            exit 1
          fi

      - name: Upload node-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-ui-failing-tests
          path: failing-tests.txt
          if-no-files-found: ignore

      - name: Verify Vitest unit suite
        run: npm run test:unit

      - name: Verify production build
        run: npm run build

      - name: Commit verified source cleanup to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-responsive-ui-cleanup.yml
          git rm -f .github/workflows/one-time-bottom-nav-source-fix.yml
          git rm -f .github/workflows/diagnose-responsive-ui-source.yml
          git add -A
          git commit -m 'Fix responsive feature layouts and filters'
          git push origin main
