name: Homepage card fit TDD

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/homepage/base.css'
      - 'src/homepage/lottery-switcher.css'
      - 'tests/homepage-card-fit.test.mjs'
      - '.github/workflows/homepage-card-fit-tdd.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Homepage card fit regression
        run: node --test tests/homepage-card-fit.test.mjs
