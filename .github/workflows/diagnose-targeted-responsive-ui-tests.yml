name: Diagnose targeted responsive UI tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'bottom-nav-responsive-source-fix-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Reproduce GREEN source changes from formal runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/apply-responsive-ui-cleanup.yml').read_text()
          start_marker = '      - name: GREEN - apply exact requested cleanup\n'
          end_marker = '      - name: Verify requested regression tests\n'
          block = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          run_marker = '        run: |\n'
          script = block.split(run_marker, 1)[1]
          lines = []
          for line in script.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-green.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-green.sh

      - name: Run targeted tests individually
        shell: bash
        run: |
          : > targeted-test-output.txt
          : > targeted-failing-tests.txt
          status=0
          for file in \
            tests/ui-responsive-cleanup-contract.test.mjs \
            tests/calculator-responsive-layout.test.mjs \
            tests/matrix-explore-option-layout.test.mjs \
            tests/matrix-explore-fluid-layout.test.mjs \
            tests/bottom-navigation-safe-area-position.test.mjs \
            tests/bottom-navigation-height.test.mjs \
            tests/tongxing-reference-responsive-layout.test.mjs \
            tests/draw-history-table-layout.test.mjs
          do
            echo "===== $file =====" | tee -a targeted-test-output.txt
            set +e
            node --test "$file" 2>&1 | tee -a targeted-test-output.txt
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -ne 0 ]; then
              echo "$file" | tee -a targeted-failing-tests.txt
              status=1
            fi
          done
          exit "$status"

      - name: Upload targeted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-responsive-ui-diagnostics
          path: |
            targeted-test-output.txt
            targeted-failing-tests.txt
          if-no-files-found: error
