name: Production Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMOKE_PWA_URL: ${{ vars.SMOKE_PWA_URL }}
      SMOKE_ADMIN_URL: ${{ vars.SMOKE_ADMIN_URL }}
      SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check deployed PWA, admin, and optional API
        run: npm run test:production-smoke

