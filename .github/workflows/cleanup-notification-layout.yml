name: Clean notification layout overrides

on:
  push:
    branches: ["通知"]
    paths:
      - .github/workflows/cleanup-notification-layout.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout notification branch
        uses: actions/checkout@v4
        with:
          ref: "通知"
          fetch-depth: 0

      - name: Guard branch scope
        run: |
          test "${GITHUB_REF_NAME}" = "通知"
          test "$(git branch --show-current)" = "通知"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Strengthen notification regression test first
        run: |
          cat > tests/notification-layout-docx.test.mjs <<'EOF'
          import fs from 'node:fs';
          import test from 'node:test';
          import assert from 'node:assert/strict';

          const featureCss = fs.readFileSync('src/feature-pages.css', 'utf8');
          const runtimeCss = fs.readFileSync('src/styles.css', 'utf8');
          const prototypeCss = fs.readFileSync('src/prototype.css', 'utf8');

          test('notification page follows the uploaded 390px layout specification', () => {
            assert.match(featureCss, /\.notifications-screen \.feature-body \{ padding: 8px 12px calc\(var\(--bottom-navigation-height\) \+ var\(--mobile-safe-area-height, 34px\) \+ 12px\); \}/);
            assert.match(featureCss, /\.notification-list \{ display: grid; gap: 8px; \}/);
            assert.match(featureCss, /\.notification-row \{[^}]*width: 100%;[^}]*height: 80px;[^}]*padding: 8px;/);
            assert.match(featureCss, /\.notification-heading \{[^}]*grid-template-columns: 58px minmax\(0, 1fr\) 88px 46px;[^}]*column-gap: 8px;/);
            assert.match(featureCss, /\.notification-icon \{[^}]*width: 58px;[^}]*height: 58px;/);
            assert.match(featureCss, /\.notification-icon img \{[^}]*width: 58px;[^}]*height: 58px;[^}]*object-fit: contain;/);
            assert.doesNotMatch(featureCss, /\.notification-icon \{[^}]*border:/);
            assert.doesNotMatch(featureCss, /\.notification-icon \{[^}]*box-shadow:/);
            assert.match(featureCss, /\.notification-actions \{ display: contents; \}/);
            assert.match(featureCss, /\.notification-actions > button:first-child \{[^}]*width: 88px;[^}]*height: 38px;[^}]*border-radius: 19px;[^}]*font-size: 14px;[^}]*font-weight: 600;/);
            assert.match(featureCss, /\.notification-row h2 \{[^}]*color: #F2F2F2;[^}]*font-size: 17px;[^}]*font-weight: 700;[^}]*line-height: 23px;[^}]*letter-spacing: 0;/);
            assert.match(featureCss, /\.notification-row h2 em \{[^}]*height: 22px;[^}]*padding: 0 8px;[^}]*border-radius: 7px;[^}]*font-size: 12px;[^}]*font-weight: 600;/);
            assert.match(featureCss, /\.notifications-screen \.notification-row \{[^}]*border-radius: 14px;[^}]*background: #020C12;/);
            assert.match(featureCss, /\.toggle \{[^}]*width: 46px;[^}]*height: 44px;/);
            assert.match(featureCss, /\.toggle::before \{[^}]*width: 46px;[^}]*height: 28px;[^}]*border: 1px solid #46505C;[^}]*border-radius: 14px;[^}]*background: #151B22;/);
            assert.match(featureCss, /\.toggle span \{[^}]*width: 24px;[^}]*height: 24px;/);
            assert.match(featureCss, /\.toggle\[data-checked="true"\]::before \{[^}]*background: #D99B00;/);
            assert.match(featureCss, /\.toggle\[data-checked="true"\] span \{[^}]*translateX\(18px\)/);
            assert.doesNotMatch(featureCss, /@media \(max-width: 370px\) \{\s*\.notification-heading/);
            assert.doesNotMatch(featureCss, /\.notifications-screen \.feature-body,\s*\.profile-screen \.feature-body/);
            assert.match(runtimeCss, /\.mobile-page:not\(:has\(\.notifications-screen\)\) \.mobile-scrollbar\[data-visible="true"\] \{\s*opacity: 1;\s*\}/);
          });

          test('notification layout has one authoritative sizing and spacing source', () => {
            assert.doesNotMatch(featureCss, /\.notifications-screen\s*\{[^}]*padding-top:/s);

            const notificationBlocks = [...featureCss.matchAll(/([^{}]*\.notification-row[^{}]*)\{([^{}]*)\}/g)];
            const sharedSizingOverrides = notificationBlocks.filter(([, selector, body]) =>
              selector.includes(',') && /(?:^|;)\s*(?:height|max-height)\s*:/.test(body),
            );
            assert.equal(
              sharedSizingOverrides.length,
              0,
              `notification-row must not be included in shared height/max-height rules: ${sharedSizingOverrides.map(([, selector]) => selector.trim()).join(' | ')}`,
            );

            assert.match(
              prototypeCss,
              /\.bottom-nav-brand-screen:not\(\.notifications-screen\) > \.feature-body \{\s*padding-bottom: var\(--layout-bottom-nav-clearance\);\s*\}/,
            );
            assert.doesNotMatch(
              prototypeCss,
              /\.bottom-nav-brand-screen > \.feature-body \{\s*padding-bottom: var\(--layout-bottom-nav-clearance\);\s*\}/,
            );
          });
          EOF

      - name: Confirm cleanup regression fails before implementation
        run: |
          if node --test tests/notification-layout-docx.test.mjs; then
            echo "Expected the strengthened cleanup regression to fail before implementation."
            exit 1
          fi

      - name: Remove conflicting notification layout sources
        run: |
          python - <<'PY'
          from pathlib import Path

          feature_path = Path('src/feature-pages.css')
          feature = feature_path.read_text()

          dead_top = '.notifications-screen { padding-top: 30px; }\n'
          if feature.count(dead_top) != 1:
              raise SystemExit(f'Expected one dead notification padding-top rule, found {feature.count(dead_top)}')
          feature = feature.replace(dead_top, '', 1)

          shared_notification_sequence = '.panel,\n.notification-row,\n.profile-card,'
          count = feature.count(shared_notification_sequence)
          if count != 3:
              raise SystemExit(f'Expected notification-row in exactly three shared sizing groups, found {count}')
          feature = feature.replace(shared_notification_sequence, '.panel,\n.profile-card,')
          feature_path.write_text(feature)

          prototype_path = Path('src/prototype.css')
          prototype = prototype_path.read_text()
          old = '''.bottom-nav-brand-screen > .feature-body {
            padding-bottom: var(--layout-bottom-nav-clearance);
          }'''
          new = '''.bottom-nav-brand-screen:not(.notifications-screen) > .feature-body {
            padding-bottom: var(--layout-bottom-nav-clearance);
          }'''
          if prototype.count(old) != 1:
              raise SystemExit(f'Expected one shared bottom-nav feature-body rule, found {prototype.count(old)}')
          prototype_path.write_text(prototype.replace(old, new, 1))
          PY

      - name: Update runtime lock
        run: npm run update:runtime-lock

      - name: Verify notification regression
        run: node --test tests/notification-layout-docx.test.mjs

      - name: Verify runtime lock
        run: npm run check:runtime

      - name: Verify production build
        run: npm run build

      - name: Verify diff scope
        run: |
          git diff --check
          git status --short
          git diff -- src/feature-pages.css src/prototype.css mobile-runtime.lock.json tests/notification-layout-docx.test.mjs .github/workflows/cleanup-notification-layout.yml

      - name: Commit notification cleanup
        run: |
          rm .github/workflows/cleanup-notification-layout.yml
          git config user.name "spy854540-cmd"
          git config user.email "spy854540@gmail.com"
          git add src/feature-pages.css src/prototype.css mobile-runtime.lock.json tests/notification-layout-docx.test.mjs .github/workflows/cleanup-notification-layout.yml
          git commit -m "refactor: remove notification layout overrides"
          git push origin HEAD:通知
