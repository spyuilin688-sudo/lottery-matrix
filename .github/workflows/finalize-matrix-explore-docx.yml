name: Finalize Matrix Explore DOCX spec

on:
  push:
    branches:
      - "探索"
    paths:
      - .github/workflows/finalize-matrix-explore-docx.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exploration branch
        uses: actions/checkout@v4
        with:
          ref: "探索"
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reuse reviewed patch from prior one-time workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          workflow = Path('.github/workflows/apply-matrix-explore-docx.yml').read_text()
          match = re.search(r'PATCH_B64:\s*>-\n(?P<body>(?:\s{12,}[^\n]*\n)+)\s{8}run:', workflow)
          if not match:
              raise SystemExit('Could not locate reviewed Matrix Explore patch payload')
          payload = ''.join(line.strip() for line in match.group('body').splitlines())
          exec(base64.b64decode(payload).decode())
          PY

      - name: Verify focused Matrix Explore regression test
        run: node --test tests/matrix-explore-option-layout.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Confirm only known protected-runtime baseline blocks npm build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/npm-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "npm build passed."
          elif grep -Fq "Mobile runtime integrity check failed:" /tmp/npm-build.log \
            && grep -Fq -- "- src/App.tsx was modified" /tmp/npm-build.log; then
            echo "Known pre-existing protected-runtime mismatch confirmed; continuing with direct Vite compile."
          else
            echo "Unexpected build failure."
            exit "$status"
          fi

      - name: Compile application directly
        run: npx vite build

      - name: Remove one-time workflows and verify diff
        shell: bash
        run: |
          rm .github/workflows/apply-matrix-explore-docx.yml
          rm .github/workflows/finalize-matrix-explore-docx.yml
          git diff --check
          git status --short
          git diff -- src/feature-pages.css

      - name: Commit and push only to exploration branch
        shell: bash
        run: |
          git config user.name "spy854540-cmd"
          git config user.email "spy854540@gmail.com"
          git add src/feature-pages.css \
            .github/workflows/apply-matrix-explore-docx.yml \
            .github/workflows/finalize-matrix-explore-docx.yml
          git commit -m "style: align Matrix Explore with document spec"
          git push origin HEAD:"探索"
