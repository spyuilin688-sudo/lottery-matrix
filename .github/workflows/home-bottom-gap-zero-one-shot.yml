name: home-bottom-gap-zero-one-shot

on:
  push:
    branches:
      - chore/home-bottom-gap-zero-20260820

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/home-bottom-gap-zero-20260820
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify RED
        shell: bash
        run: |
          set +e
          node --test tests/home-layout-contract.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the new regression test to fail before the CSS change."
            exit 1
          fi
      - name: Modify canonical CSS source
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/homepage-repair.css')
          text = path.read_text()
          old = '''  height: calc(var(--home-core-height) + var(--home-features-height) + var(--home-gap-core-features) + 8px);\n  min-height: calc(var(--home-core-height) + var(--home-features-height) + var(--home-gap-core-features) + 8px);\n  padding-bottom: 8px;'''
          new = '''  height: calc(var(--home-core-height) + var(--home-features-height) + var(--home-gap-core-features));\n  min-height: calc(var(--home-core-height) + var(--home-features-height) + var(--home-gap-core-features));\n  padding-bottom: 0;'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one canonical home-bottom-group block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
      - name: Verify GREEN
        run: node --test tests/home-layout-contract.test.mjs
      - name: Verify no lottery-card shape override added
        shell: bash
        run: |
          grep -F 'border-radius: 8px;' src/homepage-repair.css
          grep -F 'overflow: hidden;' src/homepage-repair.css
      - name: Commit CSS change
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/homepage-repair.css
          git commit -m 'style: remove home bottom navigation gap'
          git push origin HEAD:chore/home-bottom-gap-zero-20260820
