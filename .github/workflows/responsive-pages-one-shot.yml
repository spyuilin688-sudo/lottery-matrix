name: Responsive pages one-shot

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'responsive-fix-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify RED
        run: |
          python - <<'PY'
          from pathlib import Path
          feature = Path('src/feature-pages.css').read_text()
          tongxing = Path('src/tongxing-compact.css').read_text()
          header = Path('src/brand-header-unify.css').read_text()
          assert 'grid-template-columns: 88px 84px minmax(0, 1fr);' in feature
          assert 'grid-template-columns: repeat(3, 48px) minmax(0, 1fr);' in feature
          assert 'grid-template-columns: 72px minmax(0, 1fr);' in feature
          assert 'max-content minmax(72px, .95fr) max-content' in tongxing
          assert 'min-width: 72px;' in tongxing
          assert 'minmax(56px, 19%) minmax(60px, 20%) minmax(0, 1fr)' in tongxing
          assert 'inset: 0 4% 0 43%;' in header
          PY

      - name: Patch formal style sources
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:90]}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/feature-pages.css',
              '.number-reference-screen .query-selects.three-cols { grid-template-columns: 88px 84px minmax(0, 1fr); margin-bottom: 12px; }',
              '.number-reference-screen .query-selects.three-cols { display: grid; width: 100%; min-width: 0; grid-template-columns: minmax(0, .9fr) minmax(0, .9fr) minmax(0, 1.8fr); gap: 8px; margin-bottom: 12px; }'
          )
          replace_once(
              'src/feature-pages.css',
              '.reference-search > div { display: grid; grid-template-columns: repeat(3, 48px) minmax(0, 1fr); gap: 8px; }',
              '.reference-search > div { display: grid; width: 100%; min-width: 0; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.6fr); gap: 8px; }'
          )
          replace_once(
              'src/feature-pages.css',
              '.reference-row { display: grid; min-height: 40px; grid-template-columns: 72px minmax(0, 1fr); border-top: 1px solid #4f391d; color: #ccc4b8; font-size: 13px; text-align: center; }',
              '.reference-row { display: grid; width: 100%; min-width: 0; min-height: 40px; grid-template-columns: minmax(0, .24fr) minmax(0, .76fr); border-top: 1px solid #4f391d; color: #ccc4b8; font-size: 13px; text-align: center; }'
          )
          replace_once(
              'src/tongxing-compact.css',
              'grid-template-columns: repeat(3, minmax(0, 1fr)) max-content minmax(72px, .95fr) max-content;',
              'grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, .9fr) minmax(0, 1.3fr) minmax(0, .7fr);'
          )
          replace_once(
              'src/tongxing-compact.css',
              '  min-width: 72px;\n  min-height: var(--control-height);',
              '  min-width: 0;\n  min-height: var(--control-height);'
          )
          replace_once(
              'src/tongxing-compact.css',
              'grid-template-columns: minmax(56px, 19%) minmax(60px, 20%) minmax(0, 1fr);',
              'grid-template-columns: minmax(0, .95fr) minmax(0, 1fr) minmax(0, 3.05fr);'
          )
          replace_once(
              'src/brand-header-unify.css',
              '  inset: 0 4% 0 43%;\n  width: auto;',
              '  inset: 0 4% 0 auto;\n  width: clamp(176px, 52%, 220px);'
          )
          PY

      - name: Verify GREEN and build
        run: |
          python - <<'PY'
          from pathlib import Path
          feature = Path('src/feature-pages.css').read_text()
          tongxing = Path('src/tongxing-compact.css').read_text()
          header = Path('src/brand-header-unify.css').read_text()
          assert '.number-reference-screen .query-selects.three-cols { display: grid; width: 100%; min-width: 0;' in feature
          assert 'grid-template-columns: minmax(0, .9fr) minmax(0, .9fr) minmax(0, 1.8fr);' in feature
          assert 'grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.6fr);' in feature
          assert 'grid-template-columns: minmax(0, .24fr) minmax(0, .76fr);' in feature
          assert 'grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, .9fr) minmax(0, 1.3fr) minmax(0, .7fr);' in tongxing
          assert 'minmax(0, .95fr) minmax(0, 1fr) minmax(0, 3.05fr)' in tongxing
          assert 'inset: 0 4% 0 auto;' in header
          assert 'inset: 0 4% 0 43%;' not in header
          assert '88px 84px' not in feature
          assert 'repeat(3, 48px)' not in feature
          assert 'grid-template-columns: 72px minmax(0, 1fr)' not in feature
          PY
          npm ci
          npm run build
          git diff --check

      - name: Commit verified fix to main
        run: |
          rm -f .github/workflows/responsive-pages-one-shot.yml
          git config user.name 'spyuilin688-sudo'
          git config user.email 'spyuilin688@gmail.com'
          git add src/feature-pages.css src/tongxing-compact.css src/brand-header-unify.css .github/workflows/responsive-pages-one-shot.yml
          git commit -m 'style: fix responsive reference and tongxing layouts'
          git push origin main
