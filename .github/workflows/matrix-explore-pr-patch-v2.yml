name: Matrix Explore PR patch runner v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'matrix-explore-reference-trigger-v4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: RED then patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/matrix-explore-spacing.css')
          css=p.read_text()
          balls=Path('src/number-ball.css').read_text()
          assert 'min-height: 52px;' in css and 'min-height: 54px;' in css
          assert 'grid-template-columns: 2.1fr 2.5fr 7.4fr;' in css
          assert 'height: 58px;' in css
          assert '--number-ball-size: clamp(26px, 7.6vw, 30px);' in balls

          def sub(pattern,repl,count=1):
              global css
              css2,n=re.subn(pattern,repl,css,count=count,flags=re.S)
              if n!=count: raise SystemExit(f'expected {count} match, got {n}: {pattern[:80]}')
              css=css2

          sub(r'(\.matrix-explore-main-screen \.history-panel \.panel-heading \{.*?min-height:) 52px;(.*?margin-bottom:) \.5rem;(.*?padding:) \.5rem \.75rem;',r'\1 42px;\2 0;\3 .375rem .5rem;')
          sub(r'(\.matrix-explore-main-screen \.history-panel \.panel-heading \{.*?gap: \.5rem;)(\n\})',r'\1\n  border-bottom: 1px solid rgba(90, 87, 80, .72);\2')
          sub(r'(\.matrix-explore-main-screen \.history-panel-title \.section-title \{\s*font-size:) 1\.0625rem;',r'\1 clamp(.9375rem, 4.1vw, 1.0625rem);')
          sub(r'(\.matrix-explore-main-screen \.history-panel \.panel-heading > button:last-child \{\s*font-size:) \.8125rem;',r'\1 clamp(.6875rem, 3.1vw, .8125rem);')
          sub(r'(\.matrix-explore-main-screen \.history-row,.*?\.history-row:not\(\.history-head\) \{.*?min-height:) 54px;(.*?padding:) \.5rem 0;(.*?grid-template-columns:) 2\.1fr 2\.5fr 7\.4fr;(.*?gap:) \.25rem;(.*?border-bottom:) 1px solid rgba\(90, 87, 80, \.7\);',r'\1 40px;\2 .25rem 0;\3 minmax(0, 1.15fr) minmax(0, 2.2fr) minmax(0, 6.65fr);\4 0;\5 1px solid rgba(90, 87, 80, .72);')
          sub(r'(\.matrix-explore-main-screen \.history-row\.history-head \{\s*min-height:) 40px;(\s*padding-block:) \.25rem;(.*?font-size:) \.875rem;',r'\1 34px;\2 .1875rem;\3 clamp(.75rem, 3.4vw, .875rem);\n  font-weight: 700;')
          sub(r'(\.matrix-explore-main-screen \.history-row > :nth-child\(1\) \{.*?font-size:) \.875rem;',r'\1 clamp(.75rem, 3.3vw, .8125rem);')
          sub(r'(\.matrix-explore-main-screen \.history-row > :nth-child\(2\) \{\s*font-size:) \.8125rem;(\s*opacity:) \.9;',r'\1 clamp(.6875rem, 3vw, .75rem);\2 .92;')
          sub(r'(\.matrix-explore-main-screen \.history-row > span,.*?border-left: 0;\n\})',r'\1\n.matrix-explore-main-screen .history-row > :nth-child(1),\n.matrix-explore-main-screen .history-row > :nth-child(2) {\n  border-right: 1px solid rgba(90, 87, 80, .55);\n}')
          sub(r'(\.matrix-explore-main-screen \.history-date-stack strong \{\s*font-size:) \.8125rem;',r'\1 clamp(.6875rem, 3vw, .75rem);')
          sub(r'(\.matrix-explore-main-screen \.history-date-stack small \{\s*font-size:) \.75rem;',r'\1 clamp(.625rem, 2.8vw, .6875rem);')
          sub(r'(\.matrix-explore-main-screen \.history-main-numbers \{\s*gap:) \.3125rem;',r'\1 clamp(.125rem, .7vw, .25rem);')
          sub(r'(\.matrix-explore-main-screen \.repeat-stats-heading \{.*?min-height:) 1\.75rem;(\s*margin-bottom:) \.75rem;',r'\1 2rem;\2 .5rem;')
          sub(r'(\.matrix-explore-main-screen \.repeat-stats-heading > span \{.*?font-size:) \.75rem;',r'\1 clamp(.625rem, 2.8vw, .75rem);')
          sub(r'(\.matrix-explore-main-screen \.result-summary \{.*?column-gap:) \.375rem;(\s*row-gap:) \.5rem;',r'\1 clamp(.25rem, 1.2vw, .375rem);\2 clamp(.375rem, 1.6vw, .5rem);')
          sub(r'(\.matrix-explore-main-screen \.result-summary > div \{.*?min-height:) 58px;(\s*height:) 58px;(\s*padding:) \.5rem \.25rem;(.*?border:) 1px solid #1e293b;(\s*border-radius:) \.75rem;(\s*background:) #141A26;',r'\1 clamp(44px, 12vw, 48px);\2 auto;\3 .3125rem .125rem;\4 1px solid rgba(112, 108, 99, .72);\5 .5rem;\6 rgba(7, 16, 24, .72);')
          sub(r'(\.matrix-explore-main-screen \.result-summary b \{.*?font-size:) 1\.0625rem;(\s*font-weight:) 700;',r'\1 clamp(.875rem, 3.8vw, 1rem);\2 600;')
          sub(r'(\.matrix-explore-main-screen \.result-summary small \{\s*margin-top:) \.125rem;(\s*font-size:) \.75rem;(\s*opacity:) \.7;',r'\1 .0625rem;\2 clamp(.5625rem, 2.5vw, .6875rem);\3 .72;')
          p.write_text(css)

          bp=Path('src/number-ball.css')
          balls2,n=re.subn(r'(\.matrix-explore-main-screen \.history-panel \.number-ball-component\.history-lottery-ball \{\s*--number-ball-size:) clamp\(26px, 7\.6vw, 30px\);(\s*--number-font-size:) clamp\(11px, 3\.1vw, 13px\);',r'\1 clamp(22px, 6.2vw, 24px);\2 clamp(10px, 2.8vw, 11px);\n  --underline-width: clamp(9px, 2.8vw, 11px);',balls,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'ball rule matches: {n}')
          bp.write_text(balls2)
          PY

      - name: GREEN and build
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('src/matrix-explore-spacing.css').read_text(); balls=Path('src/number-ball.css').read_text()
          assert 'min-height: 42px;' in css
          assert 'minmax(0, 1.15fr) minmax(0, 2.2fr) minmax(0, 6.65fr)' in css
          assert 'min-height: clamp(44px, 12vw, 48px);' in css
          assert '--number-ball-size: clamp(22px, 6.2vw, 24px);' in balls
          assert 'grid-template-columns: repeat(6, minmax(0, 1fr));' in css
          assert 'grid-template-columns: 2.1fr 2.5fr 7.4fr;' not in css
          PY
          npm ci
          npm run build
          git diff --check

      - name: Restore workflow state and commit
        run: |
          git checkout 63c4f5c19839d250a49feb737cca76f8ed78f31d -- .github/workflows/matrix-explore-pr-patch.yml .github/workflows/matrix-explore-pr-patch-v2.yml .github/workflows/matrix-explore-reference-proportions-one-shot.yml
          rm -f .github/workflows/matrix-explore-reference-one-shot.yml .github/matrix-explore-reference-trigger-v2.txt .github/matrix-explore-reference-merge-trigger.txt
          git config user.name 'spyuilin688-sudo'
          git config user.email 'spyuilin688@gmail.com'
          git add -A
          git commit -m 'style: match Matrix Explore history and repeat stats reference'
          git push origin main
