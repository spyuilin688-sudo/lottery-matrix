name: Matrix Explore PR patch runner v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'matrix-explore-reference-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write responsive regression contract
        run: |
          cat > tests/matrix-explore-lower-density.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const layout = fs.readFileSync('src/matrix-explore-spacing.css', 'utf8');
          const balls = fs.readFileSync('src/number-ball.css', 'utf8');

          test('Matrix Explore lower sections use compact responsive proportions', () => {
            assert.match(layout, /\.matrix-explore-main-screen \.history-panel \.panel-heading\s*\{[^}]*min-height:\s*36px/s);
            assert.match(layout, /\.matrix-explore-main-screen \.history-row,[\s\S]*?min-height:\s*34px;[\s\S]*?grid-template-columns:\s*minmax\(0, 1fr\) minmax\(0, 2fr\) minmax\(0, 7fr\)/);
            assert.match(layout, /\.matrix-explore-main-screen \.result-summary\s*\{[^}]*grid-template-columns:\s*repeat\(6, minmax\(0, 1fr\)\)/s);
            assert.match(layout, /\.matrix-explore-main-screen \.result-summary > div\s*\{[^}]*min-height:\s*clamp\(36px, 10vw, 40px\)/s);
            assert.match(layout, /\.matrix-explore-main-screen \.road-results-head\s*\{[^}]*min-height:\s*32px/s);
            assert.match(layout, /\.matrix-explore-main-screen \.road-result-row\s*\{[^}]*min-height:\s*42px;[^}]*padding:\s*\.375rem 0/s);
            assert.match(layout, /\.matrix-explore-main-screen \.consecutive-filter-button,\s*\.matrix-explore-main-screen \.repeat-stats-heading button\s*\{[^}]*height:\s*26px;[^}]*background:\s*transparent/s);
            assert.match(balls, /\.matrix-explore-main-screen \.history-panel \.number-ball-component\.history-lottery-ball\s*\{[^}]*--number-ball-size:\s*clamp\(18px, 5\.2vw, 20px\)/s);
          });

          test('320 360 and 390 widths preserve 6+1 room', () => {
            for (const viewport of [320, 360, 390]) {
              const panelInner = viewport - 32 - 16;
              const drawColumn = panelInner * 0.7;
              const ball = Math.max(18, Math.min(viewport * 0.052, 20));
              const gap = Math.max(1, Math.min(viewport * 0.005, 2));
              const required = ball * 7 + gap * 8 + 8;
              assert.ok(required < drawColumn, `${viewport}px overflow risk`);
            }
          });

          test('formal lower-half CSS has no hard overwrite hacks', () => {
            assert.doesNotMatch(layout, /!important|zoom\s*:|scale\s*\(|transform\s*:|margin(?:-[a-z]+)?\s*:\s*-/);
          });
          EOF

      - name: Verify RED
        run: |
          set +e
          node --test tests/matrix-explore-lower-density.test.mjs
          status=$?
          set -e
          test "$status" -ne 0
          echo 'RED verified.'

      - name: Patch formal sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          lp = Path('src/matrix-explore-spacing.css')
          bp = Path('src/number-ball.css')
          css = lp.read_text()
          balls = bp.read_text()

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              return text.replace(old, new, 1)

          def set_props(text, selector, props):
              pattern = re.compile(re.escape(selector) + r'\s*\{([^}]*)\}', re.S)
              candidates = list(pattern.finditer(text))
              if not candidates:
                  raise SystemExit(f'selector not found: {selector}')
              for m in candidates:
                  body = m.group(1)
                  prop_patterns = {
                      prop: re.compile(r'(^\s*' + re.escape(prop) + r'\s*:\s*)[^;]+;', re.M)
                      for prop in props
                  }
                  if not all(p.search(body) for p in prop_patterns.values()):
                      continue
                  for prop, value in props.items():
                      body, n = prop_patterns[prop].subn(r'\g<1>' + value + ';', body, count=1)
                      if n != 1:
                          raise SystemExit(f'{selector}: property {prop} update failed')
                  return text[:m.start(1)] + body + text[m.end(1):]
              raise SystemExit(f'{selector}: no declaration block contains all requested properties')

          css = replace_once(css, '  padding: .625rem;\n  flex-direction: column;', '  padding: .5rem;\n  flex-direction: column;', 'lower card padding')
          css = set_props(css, '.matrix-explore-main-screen .history-panel .panel-heading', {'min-height':'36px','padding':'.25rem .375rem','gap':'.375rem'})
          css = set_props(css, '.matrix-explore-main-screen .history-panel-title .section-title', {'font-size':'clamp(.875rem, 3.6vw, 1rem)'})
          css = set_props(css, '.matrix-explore-main-screen .history-panel .panel-heading > button:last-child', {'font-size':'clamp(.625rem, 2.8vw, .75rem)'})
          history_group = '.matrix-explore-main-screen .history-row,\n.matrix-explore-main-screen .history-row.history-head,\n.matrix-explore-main-screen .history-row:not(.history-head)'
          css = set_props(css, history_group, {'min-height':'34px','padding':'.125rem 0','grid-template-columns':'minmax(0, 1fr) minmax(0, 2fr) minmax(0, 7fr)'})
          css = set_props(css, '.matrix-explore-main-screen .history-row.history-head', {'min-height':'30px','padding-block':'.125rem','font-size':'clamp(.6875rem, 3vw, .8125rem)'})
          css = set_props(css, '.matrix-explore-main-screen .history-row > :nth-child(1)', {'font-size':'clamp(.6875rem, 3vw, .75rem)'})
          css = set_props(css, '.matrix-explore-main-screen .history-row > :nth-child(2)', {'font-size':'clamp(.625rem, 2.7vw, .6875rem)'})
          css = set_props(css, '.matrix-explore-main-screen .history-date-stack strong', {'font-size':'clamp(.625rem, 2.7vw, .6875rem)'})
          css = set_props(css, '.matrix-explore-main-screen .history-date-stack small', {'font-size':'clamp(.5625rem, 2.4vw, .625rem)'})
          css = set_props(css, '.matrix-explore-main-screen .history-numbers', {'gap':'.125rem'})
          css = set_props(css, '.matrix-explore-main-screen .history-main-numbers', {'gap':'clamp(.0625rem, .5vw, .125rem)'})
          css = set_props(css, '.matrix-explore-main-screen .history-special-number', {'margin-left':'.0625rem','gap':'.0625rem'})

          css = set_props(css, '.matrix-explore-main-screen .repeat-stats-heading', {'min-height':'1.75rem','margin-bottom':'.375rem','gap':'.375rem'})
          css = set_props(css, '.matrix-explore-main-screen .repeat-stats-heading > span', {'font-size':'clamp(.5625rem, 2.5vw, .6875rem)'})
          css = set_props(css, '.matrix-explore-main-screen .result-summary', {'column-gap':'clamp(.125rem, .8vw, .25rem)','row-gap':'clamp(.25rem, 1.1vw, .375rem)'})
          css = set_props(css, '.matrix-explore-main-screen .result-summary > div', {'min-height':'clamp(36px, 10vw, 40px)','padding':'.1875rem .0625rem','border-radius':'.4375rem'})
          css = set_props(css, '.matrix-explore-main-screen .result-summary b', {'font-size':'clamp(.75rem, 3.2vw, .875rem)'})
          css = set_props(css, '.matrix-explore-main-screen .result-summary small', {'margin-top':'0','font-size':'clamp(.5rem, 2.2vw, .625rem)'})

          css = set_props(css, '.matrix-explore-main-screen .explore-result-disclaimer', {'padding':'.5rem .5rem','font-size':'.6875rem'})
          css = set_props(css, '.matrix-explore-main-screen .result-title', {'margin-bottom':'.375rem','gap':'.375rem'})
          css = set_props(css, '.matrix-explore-main-screen .result-title .section-title', {'font-size':'.9375rem'})
          css = set_props(css, '.matrix-explore-main-screen .result-title .result-count', {'font-size':'.6875rem'})
          css = set_props(css, '.matrix-explore-main-screen .result-title .result-count .numeric-text', {'font-size':'.875rem'})
          result_group = '.matrix-explore-main-screen .road-results-head,\n.matrix-explore-main-screen .road-result-row'
          css = set_props(css, result_group, {'grid-template-columns':'minmax(0, .82fr) minmax(0, .7fr) minmax(0, .86fr) minmax(0, 1.12fr) minmax(0, .98fr) minmax(0, 1.36fr)','gap':'.125rem','font-size':'.6875rem'})
          css = set_props(css, '.matrix-explore-main-screen .road-results-head', {'min-height':'32px','font-size':'.6875rem'})
          css = set_props(css, '.matrix-explore-main-screen .road-result-row', {'min-height':'42px','padding':'.375rem 0'})
          row_text_group = '.matrix-explore-main-screen .road-result-row > span,\n.matrix-explore-main-screen .road-result-row > button'
          css = set_props(css, row_text_group, {'font-size':'.6875rem'})
          css = set_props(css, '.matrix-explore-main-screen .road-result-row > strong', {'font-size':'.875rem'})
          css = set_props(css, '.matrix-explore-main-screen .road-results .tag', {'padding':'.125rem .25rem','font-size':'.5625rem'})
          css = set_props(css, '.matrix-explore-main-screen .road-results .result-number', {'font-size':'.8125rem'})
          css = set_props(css, '.matrix-explore-main-screen .road-results .result-period', {'font-size':'.625rem'})
          css = set_props(css, '.matrix-explore-main-screen .road-results .result-consecutive', {'font-size':'.625rem'})
          css = set_props(css, '.matrix-explore-main-screen .road-type-toggle', {'font-size':'.625rem'})
          filter_group = '.matrix-explore-main-screen .consecutive-filter-button,\n.matrix-explore-main-screen .repeat-stats-heading button'
          css = set_props(css, filter_group, {'min-height':'26px','height':'26px','padding':'.125rem .5rem','font-size':'.6875rem'})
          pos = css.find(filter_group)
          end = css.find('}', pos)
          block = css[pos:end]
          if 'background:' not in block:
              block = block.replace('  font-size: .6875rem;\n', '  border: 1px solid rgba(212, 165, 47, .72);\n  border-radius: .5rem;\n  background: transparent;\n  color: #d8a93e;\n  font-size: .6875rem;\n')
              css = css[:pos] + block + css[end:]

          css = replace_once(css, '    grid-template-columns: 2fr 2.35fr 7.65fr;\n    gap: .125rem;', '    grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 7fr);\n    gap: 0;', '320 history columns')
          css = replace_once(css, '    height: clamp(22px, 6.8vw, 28px);\n    flex: 0 0 6px;\n    font-size: 10px;', '    height: clamp(18px, 5.6vw, 20px);\n    flex: 0 0 6px;\n    font-size: 9px;', '320 plus')
          css = replace_once(css, '    width: clamp(22px, 6.8vw, 28px);\n    height: calc(clamp(22px, 6.8vw, 28px) + 7px);\n    grid-template-rows: 7px clamp(22px, 6.8vw, 28px);', '    width: clamp(18px, 5.6vw, 20px);\n    height: calc(clamp(18px, 5.6vw, 20px) + 6px);\n    grid-template-rows: 6px clamp(18px, 5.6vw, 20px);', '320 special wrapper')
          css = replace_once(css, '    font-size: 6px;\n    line-height: 7px;', '    font-size: 5.5px;\n    line-height: 6px;', '320 special label')

          balls = replace_once(balls, '  --number-ball-size: clamp(22px, 6.2vw, 24px);\n  --number-font-size: clamp(10px, 2.8vw, 11px);\n  --underline-width: clamp(9px, 2.8vw, 11px);', '  --number-ball-size: clamp(18px, 5.2vw, 20px);\n  --number-font-size: clamp(9px, 2.4vw, 10px);\n  --underline-width: clamp(8px, 2.4vw, 9px);', 'Matrix Explore ball sizing')

          lp.write_text(css)
          bp.write_text(balls)
          PY

      - name: Verify GREEN and build
        run: |
          node --test tests/matrix-explore-lower-density.test.mjs tests/matrix-explore-ui-refinement.test.mjs tests/matrix-explore-fluid-layout.test.mjs tests/matrix-explore-filter-hit-area.test.mjs
          npm ci
          npm run build
          git diff --check

      - name: Restore runner and commit verified source
        run: |
          git show d669239e48b0ea9f09ce7f6b85d834cee0e37810:.github/workflows/matrix-explore-pr-patch-v2.yml > .github/workflows/matrix-explore-pr-patch-v2.yml
          git config user.name 'spyuilin688-sudo'
          git config user.email 'spyuilin688@gmail.com'
          git add src/matrix-explore-spacing.css src/number-ball.css tests/matrix-explore-lower-density.test.mjs .github/workflows/matrix-explore-pr-patch-v2.yml
          git commit -m 'style: compact Matrix Explore lower sections'
          git push origin main
