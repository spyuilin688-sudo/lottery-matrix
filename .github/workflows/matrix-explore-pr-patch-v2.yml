name: Responsive tools PR patch runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'responsive-tools-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify RED
        run: |
          set +e
          node --test tests/tongxing-reference-responsive-layout.test.mjs
          status=$?
          set -e
          test "$status" -ne 0

      - name: Patch formal responsive style sources
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          p = Path('src/tongxing-compact.css')
          css = p.read_text()
          changes = [
              ('  --control-gap: 8px;', '  --control-gap: 6px;', 'tongxing control gap'),
              ('  --control-height: 40px;', '  --control-height: 36px;', 'tongxing control height'),
              ('  --primary-button-height: 48px;', '  --primary-button-height: 40px;', 'tongxing primary height'),
              ('  --table-header-height: 38px;', '  --table-header-height: 32px;', 'tongxing header height'),
              ('  --table-row-height: 52px;', '  --table-row-height: 44px;', 'tongxing table row height'),
              ('  --result-row-height: 50px;', '  --result-row-height: 44px;', 'tongxing result row height'),
              ('  grid-template-columns: minmax(0, 1fr) minmax(0, 1.55fr);', '  grid-template-columns: minmax(0, .85fr) minmax(0, 1.65fr);', 'tongxing first row columns'),
              ('  grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, .9fr) minmax(0, 1.3fr) minmax(0, .7fr);\n  gap: 6px;', '  grid-template-columns: repeat(3, minmax(0, 1fr)) max-content minmax(52px, .9fr) max-content;\n  gap: var(--control-gap);', 'tongxing second row columns'),
              ('  font-size: clamp(13px, 3.8vw, 16px);', '  font-size: clamp(12px, 3.5vw, 14px);', 'tongxing condition text size'),
              ('  font-size: 20px;\n  font-weight: 600;', '  font-size: 18px;\n  font-weight: 600;', 'tongxing primary text size'),
              ('.tongxing-screen .primary-action svg { width: 24px; height: 24px; }', '.tongxing-screen .primary-action svg { width: 20px; height: 20px; }', 'tongxing primary icon size'),
              ('  grid-template-columns: minmax(64px, 20%) repeat(5, minmax(0, 1fr));', '  grid-template-columns: minmax(72px, 1.8fr) repeat(5, minmax(0, 1fr));', 'tongxing five-column result grid'),
              ('  grid-template-columns: minmax(64px, 20%) repeat(7, minmax(0, 1fr));', '  grid-template-columns: minmax(76px, 2.2fr) repeat(7, minmax(0, 1fr));', 'tongxing seven-column result grid'),
              ('.tongxing-screen .tongxing-period-cell strong { color: #e4c44e; font-size: 16px; font-weight: 700; line-height: 18px; }', '.tongxing-screen .tongxing-period-cell strong { color: #e4c44e; font-size: 14px; font-weight: 700; line-height: 17px; white-space: nowrap; }', 'tongxing period issue'),
              ('.tongxing-screen .tongxing-period-cell time { color: #aaa49a; font-size: 12px; font-weight: 400; line-height: 14px; }', '.tongxing-screen .tongxing-period-cell time { color: #aaa49a; font-size: 10.5px; font-weight: 400; line-height: 13px; white-space: nowrap; }', 'tongxing period date'),
              ('.tongxing-screen .tongxing-table-row .locked-input-number { color: #ef5b58; font-size: 17px; font-weight: 700; }', '.tongxing-screen .tongxing-table-row .locked-input-number { color: #ef5b58; font-size: 15px; font-weight: 700; }', 'tongxing hit number size'),
              ('.tongxing-screen .tongxing-table[data-columns="7"] .tongxing-period-cell strong { font-size: 15px; }', '.tongxing-screen .tongxing-table[data-columns="7"] .tongxing-period-cell strong { font-size: 13px; }', 'tongxing 6+1 issue size'),
          ]
          for old, new, label in changes:
              css = replace_once(css, old, new, label)
          p.write_text(css)

          p = Path('src/feature-pages.css')
          css = p.read_text()
          css = replace_once(
              css,
              '.number-reference-screen .query-selects.three-cols { display: grid; width: 100%; min-width: 0; grid-template-columns: minmax(0, .9fr) minmax(0, .9fr) minmax(0, 1.8fr); gap: 8px; margin-bottom: 12px; }',
              '.number-reference-screen .query-selects.three-cols { display: grid; width: 100%; min-width: 0; grid-template-columns: minmax(0, .85fr) minmax(0, .8fr) minmax(0, 1.75fr); gap: 6px; margin-bottom: 8px; }',
              'reference responsive select grid',
          )
          css = replace_once(
              css,
              '.reference-search { margin: 0 0 12px; }\n.reference-search > div { display: grid; width: 100%; min-width: 0; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.6fr); gap: 8px; }',
              '.reference-search { margin: 0 0 8px; }\n.reference-search > div { display: grid; width: 100%; min-width: 0; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.7fr); gap: 6px; }',
              'reference search grid',
          )
          css = replace_once(
              css,
              '.number-reference-screen .query-selects.three-cols { grid-template-columns: 100px 92px minmax(0, 1fr); }\n',
              '',
              'reference fixed override',
          )
          p.write_text(css)
          PY

      - name: Verify GREEN, regressions and build
        run: |
          node --test tests/tongxing-reference-responsive-layout.test.mjs
          npm ci
          node --test tests/*.test.mjs
          npm run build
          git diff --check

      - name: Commit verified change to main
        run: |
          git config user.name "spyuilin688-sudo"
          git config user.email "spyuilin688@gmail.com"
          git add src/tongxing-compact.css src/feature-pages.css
          git commit -m "style: optimize TongXing and reference responsive layout"
          git push origin main
