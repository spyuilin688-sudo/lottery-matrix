name: Matrix Explore PR patch runner v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'matrix-explore-reference-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write responsive regression contract
        run: |
          cat > tests/matrix-explore-lower-density.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const layout = fs.readFileSync('src/matrix-explore-spacing.css', 'utf8');
          const balls = fs.readFileSync('src/number-ball.css', 'utf8');
          test('compact lower sections', () => {
            assert.match(layout, /\.history-panel \.panel-heading\s*\{[^}]*min-height:\s*36px/s);
            assert.match(layout, /\.history-row,[\s\S]*?min-height:\s*34px;[\s\S]*?grid-template-columns:\s*minmax\(0, 1fr\) minmax\(0, 2fr\) minmax\(0, 7fr\)/);
            assert.match(layout, /\.result-summary > div\s*\{[^}]*min-height:\s*clamp\(36px, 10vw, 40px\)/s);
            assert.match(layout, /\.road-results-head\s*\{[^}]*min-height:\s*32px/s);
            assert.match(layout, /\.road-result-row\s*\{[^}]*min-height:\s*42px;[^}]*padding:\s*\.375rem 0/s);
            assert.match(layout, /\.repeat-stats-heading button\s*\{[^}]*border:\s*1px solid rgba\(212, 165, 47, \.72\);[^}]*background:\s*transparent/s);
            assert.match(balls, /--number-ball-size:\s*clamp\(18px, 5\.2vw, 20px\)/);
          });
          test('320 360 390 preserve 6+1 room', () => {
            for (const viewport of [320,360,390]) {
              const inner=viewport-48, draw=inner*.7, ball=Math.max(18,Math.min(viewport*.052,20)), gap=Math.max(1,Math.min(viewport*.005,2));
              assert.ok(ball*7+gap*8+8 < draw, `${viewport}px overflow risk`);
            }
          });
          test('no hard overwrite hacks', () => {
            assert.doesNotMatch(layout, /!important|zoom\s*:|scale\s*\(|transform\s*:|margin(?:-[a-z]+)?\s*:\s*-/);
          });
          EOF

      - name: Verify RED
        run: |
          set +e
          node --test tests/matrix-explore-lower-density.test.mjs
          status=$?
          set -e
          test "$status" -ne 0
          echo 'RED verified.'

      - name: Patch formal sources
        run: python .github/matrix-explore-lower-density-patch.py

      - name: Verify GREEN and build
        run: |
          node --test tests/matrix-explore-lower-density.test.mjs tests/matrix-explore-fluid-layout.test.mjs tests/matrix-explore-filter-hit-area.test.mjs
          npm ci
          npm run build
          git diff --check

      - name: Restore temporary tooling and commit verified source
        run: |
          git show d669239e48b0ea9f09ce7f6b85d834cee0e37810:.github/workflows/matrix-explore-pr-patch-v2.yml > .github/workflows/matrix-explore-pr-patch-v2.yml
          rm -f .github/matrix-explore-lower-density-patch.py
          git config user.name 'spyuilin688-sudo'
          git config user.email 'spyuilin688@gmail.com'
          git add -A
          git commit -m 'style: compact Matrix Explore lower sections'
          git push origin main
