name: One-off explore validation layout patch

on:
  push:
    paths:
      - '.github/workflows/one-off-explore-validation-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify requested state is not already applied
        id: red
        continue-on-error: true
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const tsx = fs.readFileSync('src/FeaturePages.tsx', 'utf8');
          const css = fs.readFileSync('src/feature-pages.css', 'utf8');
          const alreadyApplied =
            !tsx.includes('<strong>條件摘要</strong>') &&
            css.includes('.validation-summary-card em { position: absolute; top: 6px; right: 8px; width: 66px; transform: none;') &&
            tsx.includes('ROAD_VALIDATION_SAMPLE_HISTORY.slice(0, 3), ROAD_VALIDATION_SAMPLE_HISTORY.slice(3, 6)');
          if (alreadyApplied) process.exit(0);
          console.error('Expected RED: requested layout is not yet applied.');
          process.exit(1);
          NODE

      - name: Confirm RED state
        shell: bash
        run: |
          test '${{ steps.red.outcome }}' = 'failure'

      - name: Apply only the requested explore validation changes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const tsxPath = 'src/FeaturePages.tsx';
          let tsx = fs.readFileSync(tsxPath, 'utf8');
          const oldSummary = '<span><strong>條件摘要</strong>開 {number} 第 {position} 顆｜上 2 期｜第 3 顆｜+14.24｜下 {predictionPeriod} 期開</span>';
          const newSummary = '<span>開 {number} 第 {position} 顆｜上 2 期｜第 3 顆｜+14.24｜下 {predictionPeriod} 期開</span>';
          if ((tsx.match(new RegExp(oldSummary.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')) || []).length !== 1) {
            throw new Error('FeaturePages.tsx summary source does not match exactly once.');
          }
          tsx = tsx.replace(oldSummary, newSummary);
          if (!tsx.includes('const sourceGroups = [ROAD_VALIDATION_SAMPLE_HISTORY.slice(0, 3), ROAD_VALIDATION_SAMPLE_HISTORY.slice(3, 6)];')) {
            throw new Error('Three-row validation grouping source is missing.');
          }
          fs.writeFileSync(tsxPath, tsx);

          const cssPath = 'src/feature-pages.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          const oldStrong = '.validation-summary-card strong { flex: 0 0 auto; color: #f6c95f; font-size: 12.5px; }\n';
          const oldEm = '.validation-summary-card em { position: absolute; top: 50%; right: 8px; width: 66px; transform: translateY(-50%); color: #f6c95f; font-style: normal; font-weight: 800; text-align: right; white-space: nowrap; }';
          const newEm = '.validation-summary-card em { position: absolute; top: 6px; right: 8px; width: 66px; transform: none; color: #f6c95f; font-style: normal; font-weight: 800; text-align: right; white-space: nowrap; }';
          if (!css.includes(oldStrong)) throw new Error('Unused summary-label CSS source not found.');
          if ((css.match(new RegExp(oldEm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')) || []).length !== 1) {
            throw new Error('Summary consecutive-position CSS does not match exactly once.');
          }
          css = css.replace(oldStrong, '').replace(oldEm, newEm);
          fs.writeFileSync(cssPath, css);
          NODE

      - name: Verify requested source state
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const tsx = fs.readFileSync('src/FeaturePages.tsx', 'utf8');
          const css = fs.readFileSync('src/feature-pages.css', 'utf8');
          if (tsx.includes('<strong>條件摘要</strong>')) throw new Error('條件摘要 label still exists.');
          if (!css.includes('.validation-summary-card em { position: absolute; top: 6px; right: 8px; width: 66px; transform: none;')) throw new Error('連準次數 is not positioned at the top-right.');
          if (!tsx.includes('const sourceGroups = [ROAD_VALIDATION_SAMPLE_HISTORY.slice(0, 3), ROAD_VALIDATION_SAMPLE_HISTORY.slice(3, 6)];')) throw new Error('Validation groups are not fixed to three rows.');
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm run test:unit

      - name: Type-check
        run: npx tsc --noEmit

      - name: Remove one-off workflow and commit requested files
        shell: bash
        run: |
          rm -f .github/workflows/one-off-explore-validation-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/FeaturePages.tsx src/feature-pages.css .github/workflows/one-off-explore-validation-layout.yml
          git commit -m 'fix: adjust explore validation summary layout'
          git push origin HEAD:main
