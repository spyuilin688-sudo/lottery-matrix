name: Profile auth button artwork fix once

on:
  push:
    branches:
      - fix/profile-auth-button-artwork-20260916

permissions:
  contents: write

jobs:
  fix-profile-auth-buttons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/profile-auth-button-artwork-20260916
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add regression assertions first
        run: python3 scripts/profile-auth-button-artwork-test-once.py

      - name: RED - confirm screenshot regression fails before production fix
        shell: bash
        run: |
          set +e
          npx vitest run src/__tests__/MemberProfilePage.test.tsx -t '未登入時 LINE 與 Google 登入按鈕垂直排列' --reporter=verbose > /tmp/profile-auth-red.log 2>&1
          status=$?
          set -e
          cat /tmp/profile-auth-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected profile auth visual regression test to fail before production change.' >&2
            exit 1
          fi
          grep -F '未登入時 LINE 與 Google 登入按鈕垂直排列' /tmp/profile-auth-red.log
          grep -E 'solid|profile-auth-pill-mask|AssertionError' /tmp/profile-auth-red.log

      - name: GREEN - fix canonical profile auth artwork and buttons
        run: python3 scripts/profile-auth-button-artwork-fix-once.py

      - name: Verify focused profile tests
        run: npx vitest run src/__tests__/MemberProfilePage.test.tsx

      - name: Verify protected runtime integrity
        run: npm run check:runtime

      - name: Verify Cloudflare Pages build
        run: npm run build:pages

      - name: Verify only intended source files changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only -- src | sort > /tmp/changed-source.txt
          cat > /tmp/allowed-source.txt <<'EOF'
          src/__tests__/MemberProfilePage.test.tsx
          src/feature-pages.css
          src/features/MemberPages.tsx
          EOF
          sort -o /tmp/allowed-source.txt /tmp/allowed-source.txt
          diff -u /tmp/allowed-source.txt /tmp/changed-source.txt

      - name: Remove one-off files and commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/profile-auth-button-artwork-fix-once.yml scripts/profile-auth-button-artwork-test-once.py scripts/profile-auth-button-artwork-fix-once.py
          git add src/__tests__/MemberProfilePage.test.tsx src/feature-pages.css src/features/MemberPages.tsx
          git commit -m 'Fix profile auth button artwork alignment'
          git push origin HEAD:fix/profile-auth-button-artwork-20260916
