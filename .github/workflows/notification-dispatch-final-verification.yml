name: Notification Dispatch Final Verification

on:
  push:
    branches:
      - work/notification-dispatch-20260904-v2

permissions:
  contents: read

jobs:
  root-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full Vitest suite
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Full Node tests
        run: node --test tests/*.test.mjs

  admin-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - name: Admin tests
        run: npm test
      - name: Admin build
        run: APPDEPLOY_CI_EXTERNALS=true npm run build

  matrix-api-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/matrix-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/matrix-api/uv.lock
      - run: uv sync --frozen
      - name: Full Matrix API tests
        run: uv run pytest -q

  edge-full:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/send-test-push/handler.test.ts
      - run: deno test supabase/functions/_shared/web-push-delivery.test.ts
      - run: deno test supabase/functions/notification-ingest/handler.test.ts
      - run: deno check --config supabase/functions/notification-ingest/deno.json supabase/functions/notification-ingest/index.ts
      - run: deno test supabase/functions/notification-dispatch/handler.test.ts
      - run: deno check --config supabase/functions/notification-dispatch/deno.json supabase/functions/notification-dispatch/index.ts
