name: Audit notification regression failure

on:
  push:
    branches: ["通知"]
    paths:
      - .github/workflows/notification-test-audit.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "通知"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Recreate strengthened test and proposed changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/notification-spec-finalize.yml').read_text()
          start = workflow.index("          cat > tests/notification-layout-docx.test.mjs <<'EOF'\n") + len("          cat > tests/notification-layout-docx.test.mjs <<'EOF'\n")
          end = workflow.index("          EOF\n", start)
          Path('tests/notification-layout-docx.test.mjs').write_text(textwrap.dedent(workflow[start:end]))
          cssp=Path('src/feature-pages.css'); css=cssp.read_text()
          css=css.replace('.notifications-screen .feature-body { padding: 8px 12px calc(var(--bottom-navigation-height) + var(--mobile-safe-area-height, 34px) + 12px); }','.notifications-screen .feature-body { padding: 0 12px calc(var(--bottom-navigation-height) + var(--mobile-safe-area-height, 34px) + 12px); }',1)
          css=css.replace('.notification-note { margin: 14px auto 4px; padding: 0 12px; color: #aaa49a; font-size: 11.5px; font-weight: 400; line-height: 1.5; letter-spacing: .25px; text-align: center; }\n','',1)
          cssp.write_text(css)
          p=Path('src/FeaturePages.tsx'); s=p.read_text()
          s=s.replace('<article className="panel notification-row" key={key}>','<article className="notification-row" key={key}>',1)
          s=s.replace('<div className={`notification-icon${key === "card" || key === "collision" || key === "system" ? " notification-icon--expanded" : ""}`}><img src={icon} alt="" /></div>','<div className="notification-icon"><img src={icon} alt="" /></div>',1)
          s=s.replace('      <p className="notification-note">所有通知設定將立即生效</p>\n','',1)
          p.write_text(s)
          PY
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          paths=[Path('public/resources/'+n) for n in ['notify-bet.png','notify-result.png','notify-win.png','notify-status.png','notify-card.png','notify-collision.png','notify-expiry.png','notify-system.png']]
          before=[]
          for p in paths:
              im=Image.open(p).convert('RGBA'); box=im.getchannel('A').getbbox(); before.append((p,im,box))
          sizes={im.size for _,im,_ in before}; square=all(w==h for w,h in sizes); same=len(sizes)==1
          centered=all(abs(((b[0]+b[2]-1)/2)-((im.width-1)/2))<=1.5 and abs(((b[1]+b[3]-1)/2)-((im.height-1)/2))<=1.5 for _,im,b in before)
          dom=[max(b[2]-b[0],b[3]-b[1]) for _,_,b in before]; same_scale=max(dom)-min(dom)<=2
          if not (square and same and centered and same_scale):
              canvas=max(max(im.size) for _,im,_ in before); target=round(canvas*.875); target-=target%2
              for p,im,b in before:
                  crop=im.crop(b); scale=min(target/crop.width,target/crop.height); size=(max(1,round(crop.width*scale)),max(1,round(crop.height*scale)))
                  crop=crop.resize(size,Image.Resampling.LANCZOS); out=Image.new('RGBA',(canvas,canvas),(0,0,0,0)); out.alpha_composite(crop,((canvas-crop.width)//2,(canvas-crop.height)//2)); out.save(p,optimize=True)
          PY
      - name: Capture regression output
        run: |
          set +e
          node --test tests/notification-layout-docx.test.mjs > notification-regression.txt 2>&1
          status=$?
          echo "EXIT=$status" >> notification-regression.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: notification-regression-audit
          path: notification-regression.txt
