name: Member API integration runner once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/member-api-integration-runner-once.yml'

permissions:
  contents: write

jobs:
  integrate-member-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: RED - confirm API integration contract fails before wiring
        shell: bash
        run: |
          set +e
          node --test tests/member-api-integration.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'RED test unexpectedly passed before production wiring.'
            exit 1
          fi
          echo 'RED confirmed.'

      - name: GREEN - wire existing backend and pages
        run: python scripts/member-api-integration-once.py

      - name: Verify member API unit tests
        run: npx vitest run backend/member-profile-routes.test.ts backend/member-notification-routes.test.ts src/member-api.test.ts

      - name: Verify integration, full Node suite and build
        run: |
          node --test tests/member-api-integration.test.mjs
          node --test tests/*.test.mjs
          npm run build

      - name: Commit verified integration to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/member-api-integration-runner-once.yml scripts/member-api-integration-once.py
          git add -- backend/index.ts src/FeaturePages.tsx
          git commit -m 'Connect member profile and notification APIs'
          git push origin HEAD:main
