name: Apply Tianyan parity implementation

on:
  push:
    branches:
      - work/tianyan-results-parity-20260905

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tianyan-results-parity-20260905
          fetch-depth: 0
      - run: python .github/scripts/tianyan_parity_apply.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align Tianyan results with Matrix Explore"
          git push origin HEAD:work/tianyan-results-parity-20260905
