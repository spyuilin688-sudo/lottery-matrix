name: Fix floating panel gap once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix-floating-panel-gap-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Write regression test
        run: |
          cat > tests/floating-panel-anchor.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";

          const source = readFileSync(new URL("../src/FeaturePages.tsx", import.meta.url), "utf8");

          test("三個浮動設定卡以可見標題區底緣加 8px 定位", () => {
            assert.match(source, /const FLOATING_PANEL_GAP = 8;/);
            assert.match(source, /function getFloatingPanelTop\(screenSelector: string, actionSelector: string\)/);
            assert.match(source, /const visibleBottom = Math\.max\([\s\S]*?titleBanner\?\.getBoundingClientRect\(\)\.bottom \?\? header\?\.getBoundingClientRect\(\)\.bottom \?\? 0,[\s\S]*?actions\?\.getBoundingClientRect\(\)\.bottom \?\? 0,[\s\S]*?\);/);
            assert.match(source, /setFilterPanelTop\(getFloatingPanelTop\("\.draw-history-screen", "\.history-title-actions"\)\);/);
            assert.match(source, /setQueryPanelTop\(getFloatingPanelTop\("\.number-reference-screen", "\.reference-title-actions"\)\);/);
            assert.match(source, /setSettingsPanelTop\(getFloatingPanelTop\("\.tongxing-screen", "\.tongxing-title-actions"\)\);/);
            assert.doesNotMatch(source, /set(?:Filter|Query|Settings)PanelTop\(\(header\?\.getBoundingClientRect\(\)\.bottom \?\? 0\) \+ 8\)/);
          });
          EOF

      - name: Verify RED
        run: |
          set +e
          node --test tests/floating-panel-anchor.test.mjs
          status=$?
          set -e
          test "$status" -ne 0

      - name: Patch formal source only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/FeaturePages.tsx')
          source = path.read_text()

          helper_anchor = '''function MobilePagePortal({ active, children }: { active: boolean; children: React.ReactNode }) {
            if (!active || typeof document === "undefined") return children;
            const host = document.querySelector<HTMLElement>(".mobile-page");
            return host ? createPortal(children, host) : children;
          }

          function FeatureShell({'''

          helper_replacement = '''function MobilePagePortal({ active, children }: { active: boolean; children: React.ReactNode }) {
            if (!active || typeof document === "undefined") return children;
            const host = document.querySelector<HTMLElement>(".mobile-page");
            return host ? createPortal(children, host) : children;
          }

          const FLOATING_PANEL_GAP = 8;

          function getFloatingPanelTop(screenSelector: string, actionSelector: string) {
            const screen = document.querySelector<HTMLElement>(screenSelector);
            const header = screen?.querySelector<HTMLElement>(".feature-brand-header");
            const titleBanner = header?.querySelector<HTMLElement>(".matrix-title-banner");
            const actions = header?.querySelector<HTMLElement>(actionSelector);
            const visibleBottom = Math.max(
              titleBanner?.getBoundingClientRect().bottom ?? header?.getBoundingClientRect().bottom ?? 0,
              actions?.getBoundingClientRect().bottom ?? 0,
            );
            return visibleBottom + FLOATING_PANEL_GAP;
          }

          function FeatureShell({'''

          if source.count(helper_anchor) != 1:
            raise SystemExit(f'Expected one MobilePagePortal anchor, found {source.count(helper_anchor)}')
          source = source.replace(helper_anchor, helper_replacement, 1)

          replacements = {
            '''    const header = document.querySelector<HTMLElement>(".draw-history-screen > .feature-brand-header");
              setFilterPanelTop((header?.getBoundingClientRect().bottom ?? 0) + 8);''':
            '''    setFilterPanelTop(getFloatingPanelTop(".draw-history-screen", ".history-title-actions"));''',
            '''    const header = document.querySelector<HTMLElement>(".number-reference-screen > .feature-brand-header");
              setQueryPanelTop((header?.getBoundingClientRect().bottom ?? 0) + 8);''':
            '''    setQueryPanelTop(getFloatingPanelTop(".number-reference-screen", ".reference-title-actions"));''',
            '''    const header = document.querySelector<HTMLElement>(".tongxing-screen > .feature-brand-header");
              setSettingsPanelTop((header?.getBoundingClientRect().bottom ?? 0) + 8);''':
            '''    setSettingsPanelTop(getFloatingPanelTop(".tongxing-screen", ".tongxing-title-actions"));''',
          }

          for old, new in replacements.items():
            if source.count(old) != 1:
              raise SystemExit(f'Expected one target block, found {source.count(old)}: {old.splitlines()[0]}')
            source = source.replace(old, new, 1)

          path.write_text(source)
          Path('.github/workflows/fix-floating-panel-gap-once.yml').unlink(missing_ok=True)
          PY

      - name: Verify GREEN full tests and build
        run: |
          npm ci
          node --test tests/floating-panel-anchor.test.mjs
          node --test tests/*.test.mjs
          npm run build
          git diff --check

      - name: Commit verified change to main
        run: |
          git config user.name "spyuilin688-sudo"
          git config user.email "spyuilin688@gmail.com"
          git add src/FeaturePages.tsx tests/floating-panel-anchor.test.mjs .github/workflows/fix-floating-panel-gap-once.yml
          git commit -m "Fix floating settings panel spacing"
          git push origin main
