name: One-time responsive UI cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'bottom-nav-responsive-source-fix-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: RED - define requested responsive UI contract
        shell: bash
        run: |
          cat > tests/ui-responsive-cleanup-contract.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';

          const feature = fs.readFileSync('src/feature-pages.css', 'utf8');
          const responsive = fs.readFileSync('src/responsive-feature-pages.css', 'utf8');
          const tongxing = fs.readFileSync('src/tongxing-compact.css', 'utf8');
          const explore = fs.readFileSync('src/matrix-explore-spacing.css', 'utf8');
          const balls = fs.readFileSync('src/number-ball.css', 'utf8');
          const source = fs.readFileSync('src/FeaturePages.tsx', 'utf8');
          const main = fs.readFileSync('src/main.tsx', 'utf8');

          test('三頁標題操作按鈕使用 27.4px 直角外框與零文字箭頭間距', () => {
            assert.match(responsive, /\.title-card-compact-action\s*\{[^}]*height:\s*27\.4px;[^}]*min-height:\s*27\.4px;[^}]*gap:\s*0;/s);
            assert.match(responsive, /\.title-card-compact-action::before\s*\{[^}]*height:\s*27\.4px;/s);
            assert.doesNotMatch(responsive.match(/\.title-card-compact-action::before\s*\{[^}]*\}/s)?.[0] ?? '', /clip-path/);
            assert.doesNotMatch(responsive.match(/\.title-card-compact-action::after\s*\{[^}]*\}/s)?.[0] ?? '', /clip-path/);
            assert.match(responsive, /\.number-reference-screen \.matrix-title-banner-actions\s*\{[^}]*width:\s*40%;/s);
            assert.match(responsive, /\.reference-refresh-icon\s*\{[^}]*width:\s*7px;[^}]*height:\s*7px;/s);
          });

          test('同星、對照單、歷史紀錄內容使用 20px 外距且浮動設定卡固定定位', () => {
            assert.match(tongxing, /\.tongxing-screen \.feature-body\s*\{[^}]*width:\s*calc\(100% - 40px\);[^}]*margin-inline:\s*20px;/s);
            assert.match(responsive, /\.draw-history-screen \.feature-body,[\s\S]*?\.number-reference-screen \.feature-body\s*\{[^}]*padding-inline:\s*20px;[^}]*gap:\s*12px;/s);
            assert.match(tongxing, /\.tongxing-query\[data-floating="true"\]\s*\{[^}]*position:\s*fixed;[^}]*left:\s*20px;[^}]*right:\s*20px;/s);
            assert.match(feature, /\.history-filter-panel\[data-floating="true"\]\s*\{[^}]*position:\s*fixed;[^}]*left:\s*20px;[^}]*right:\s*20px;/s);
            assert.match(feature, /\.reference-query-panel\[data-floating="true"\]\s*\{[^}]*position:\s*fixed;[^}]*left:\s*20px;[^}]*right:\s*20px;/s);
          });

          test('設定選項改用直角矩形且文字可響應式縮放', () => {
            assert.match(feature, /\.history-filter-panel \.select-box::before,[\s\S]*?\.history-filter-panel \.select-box::after\s*\{\s*display:\s*none;/s);
            assert.match(feature, /\.reference-query-panel \.select-box::before,[\s\S]*?\.reference-query-panel \.select-box::after\s*\{\s*display:\s*none;/s);
            assert.match(tongxing, /\.tongxing-panel-scope \.select-box::before,[\s\S]*?\.tongxing-panel-scope \.select-box::after\s*\{\s*display:\s*none;/s);
            assert.match(feature, /\.history-filter-panel select\s*\{[^}]*font-size:\s*clamp\(/s);
            assert.match(feature, /\.number-reference-screen \.reference-select select\s*\{[^}]*font-size:\s*clamp\(/s);
            assert.match(tongxing, /\.tongxing-panel-scope \.query-selects select\s*\{[^}]*font-size:\s*clamp\(/s);
          });

          test('歷史日期只有使用者改動日期後才套用且刷新圖示有獨立 7px class', () => {
            assert.match(source, /const \[dateFilterTouched, setDateFilterTouched\] = useState\(false\);/);
            assert.match(source, /date:\s*dateFilterTouched\s*\?/);
            assert.match(source, /setDateFilterTouched\(true\)/);
            assert.match(source, /<ReloadIcon className="reference-refresh-icon" \/>/);
          });

          test('Matrix 探索與計算機使用正式響應式安全區及新外距', () => {
            assert.doesNotMatch(explore, /--layout-bottom-nav-clearance:[^;]*--mobile-safe-area-height/);
            assert.match(explore, /\.matrix-explore-main-screen \.feature-body\s*\{[^}]*padding:\s*0 12px var\(--layout-bottom-nav-clearance\);/s);
            assert.match(explore, /\.matrix-explore-main-screen \.matrix-title-banner\s*\{[^}]*width:\s*calc\(100% - 24px\);/s);
            assert.match(feature, /\.calculator-screen > \.feature-body\s*\{[^}]*padding:\s*0 20px var\(--layout-bottom-nav-clearance\);/s);
            assert.doesNotMatch(feature, /\.calculator-screen > \.feature-body\s*\{[^}]*80px/s);
            assert.doesNotMatch(main, /bottom-nav-responsive-clearance\.css/);
            assert.equal(fs.existsSync('src/bottom-nav-responsive-clearance.css'), false);
          });

          test('歷史今彩539不再被 Matrix 探索 .2px 底線規則誤套', () => {
            assert.doesNotMatch(balls, /\.matrix-explore-main-screen \.history-panel:is\(\[data-lottery="今彩539"\]/);
            assert.match(balls, /\.matrix-explore-main-screen \.matrix-explore-history-panel:is\(\[data-lottery="今彩539"\], \[data-lottery="天天樂"\]\)/);
            assert.match(balls, /\.history-panel \.number-ball-component\.history-lottery-ball\s*\{[^}]*--underline-y:\s*\.25px;/s);
          });

          test('通知清理衝突規則並讓快捷通知我的 Logo 回到首頁共用幾何', () => {
            assert.match(feature, /\.notifications-screen \.feature-body\s*\{[^}]*var\(--layout-bottom-nav-clearance\)/s);
            assert.doesNotMatch(feature, /\.notifications-screen \.feature-body\s*\{[^}]*--mobile-safe-area-height/s);
            assert.doesNotMatch(responsive, /\.bottom-nav-brand-screen \.shared-brand-logo\s*\{[^}]*width:\s*75%/s);
            assert.doesNotMatch(responsive, /bottom-nav-brand-screen\.notifications-screen[^}]*margin-bottom:\s*4px/s);
            assert.doesNotMatch(responsive, /@media \(max-width:\s*360px\)[\s\S]*?notification-heading/);
            assert.match(responsive, /\.notification-heading\s*\{[^}]*grid-template-columns:\s*clamp\(/s);
          });

          test('同星結果列背景與群組分隔更清楚', () => {
            assert.match(tongxing, /--group-divider-width:\s*3px;/);
            assert.match(tongxing, /data-row-type="locked"[^}]*rgba\(126, 83, 15, \.24\)/s);
            assert.match(tongxing, /data-row-type="predicted"[^}]*rgba\(10, 61, 88, \.25\)/s);
          });
          EOF

          set +e
          node --test tests/ui-responsive-cleanup-contract.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'RED test unexpectedly passed before source changes.'
            exit 1
          fi
          echo 'RED confirmed.'

      - name: GREEN - apply formal responsive source cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 occurrence, got {count}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))
          def sub_once(path, pattern, replacement, flags=0):
              text = read(path)
              new, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: regex expected 1 occurrence, got {count}: {pattern[:100]!r}')
              write(path, new)

          # Finish the previously pending bottom-navigation formal-source cleanup.
          replace_once(
              'src/feature-pages.css',
              '.calculator-screen > .feature-body { box-sizing: border-box; min-width: 0; min-height: 0; flex: 1 1 auto; padding-bottom: 80px; overflow-y: auto; overscroll-behavior-y: contain; }',
              '.calculator-screen > .feature-body { box-sizing: border-box; min-width: 0; min-height: 0; flex: 1 1 auto; padding: 0 20px var(--layout-bottom-nav-clearance); overflow-y: auto; overscroll-behavior-y: contain; }',
          )
          replace_once('src/matrix-explore-spacing.css', '  --layout-bottom-nav-clearance: calc(var(--bottom-navigation-height) + var(--mobile-safe-area-height, 34px));\n', '')
          replace_once('src/matrix-explore-spacing.css', '  padding: 0 16px 1rem;', '  padding: 0 12px var(--layout-bottom-nav-clearance);')
          replace_once('src/matrix-explore-spacing.css', '  width: calc(100% - 32px);', '  width: calc(100% - 24px);')
          replace_once('src/main.tsx', 'import "./bottom-nav-responsive-clearance.css";\n', '')

          # Compact title-card actions: 27.4px hit target, rectangular border, zero text/arrow gap.
          replace_once('src/responsive-feature-pages.css', '  height: 44px;\n  min-height: 44px;', '  height: 27.4px;\n  min-height: 27.4px;')
          replace_once('src/responsive-feature-pages.css', '  gap: 3px;\n  border: 0;', '  gap: 0;\n  border: 0;')
          replace_once('src/responsive-feature-pages.css', '  font-size: 8.1px;', '  font-size: clamp(8px, 2.3vw, 10px);')
          replace_once('src/responsive-feature-pages.css', '  height: 23.4px;', '  height: 27.4px;')
          replace_once('src/responsive-feature-pages.css', '  height: 21.4px;', '  height: 25.4px;')
          text = read('src/responsive-feature-pages.css')
          text = text.replace('  clip-path: polygon(var(--select-tech-cut) 0, calc(100% - var(--select-tech-cut)) 0, 100% var(--select-tech-cut), 100% calc(100% - var(--select-tech-cut)), calc(100% - var(--select-tech-cut)) 100%, var(--select-tech-cut) 100%, 0 calc(100% - var(--select-tech-cut)), 0 var(--select-tech-cut));\n', '', 2)
          write('src/responsive-feature-pages.css', text)

          # Only 號碼對照單 action region shrinks to 40%.
          marker = '''.draw-history-screen .history-filter-trigger {\n  min-width: 61.2px;\n}\n'''
          replacement = marker + '''\n.number-reference-screen .matrix-title-banner-actions {\n  width: 40%;\n}\n\n.reference-refresh-icon {\n  width: 7px;\n  height: 7px;\n  flex: 0 0 7px;\n}\n'''
          replace_once('src/responsive-feature-pages.css', marker, replacement)

          # History/reference content is 20px from the viewport and the inline settings-to-results gap is 12px.
          old_group = '''.draw-history-screen .feature-body,\n.number-reference-screen .feature-body,\n.tongxing-screen .feature-body,\n.notifications-screen .feature-body,\n.profile-screen .feature-body {\n  box-sizing: border-box;\n  width: 100%;\n  margin-inline: 0;\n  padding-inline: var(--layout-page-inline);\n}\n'''
          new_group = '''.draw-history-screen .feature-body,\n.number-reference-screen .feature-body {\n  box-sizing: border-box;\n  width: 100%;\n  margin-inline: 0;\n  padding-inline: 20px;\n  gap: 12px;\n}\n\n.profile-screen .feature-body {\n  box-sizing: border-box;\n  width: 100%;\n  margin-inline: 0;\n  padding-inline: var(--layout-page-inline);\n}\n'''
          replace_once('src/responsive-feature-pages.css', old_group, new_group)

          # Let 快捷/通知/我的 inherit the same shared homepage logo geometry.
          sub_once('src/responsive-feature-pages.css', r'\n\.bottom-nav-brand-screen > \.feature-brand-header \{.*?\}\n\n\.bottom-nav-brand-screen \.shared-brand-logo \{.*?\}\n\n\.bottom-nav-brand-screen > \.feature-brand-header\[data-compact="true"\] > \.shared-brand-logo > img \{.*?\}\n', '\n', re.S)
          sub_once('src/responsive-feature-pages.css', r'\n\.bottom-nav-brand-screen\.notifications-screen > \.feature-brand-header:not\(\.integrated-title-header\) \{.*?\}\n', '\n', re.S)

          # Notification layout: one responsive sizing source, no 360px compensation branch.
          replace_once('src/responsive-feature-pages.css', '  grid-template-columns: 48px minmax(0, 1fr) 76px 42px;\n  column-gap: 6px;', '  grid-template-columns: clamp(40px, 12.3vw, 48px) minmax(0, 1fr) clamp(64px, 19.5vw, 76px) 42px;\n  column-gap: clamp(4px, 1.5vw, 6px);')
          replace_once('src/responsive-feature-pages.css', '  width: 44px;\n  height: 44px;', '  width: clamp(40px, 11.3vw, 44px);\n  height: clamp(40px, 11.3vw, 44px);')
          replace_once('src/responsive-feature-pages.css', '  width: 44px;\n  height: 44px;', '  width: clamp(40px, 11.3vw, 44px);\n  height: clamp(40px, 11.3vw, 44px);')
          replace_once('src/responsive-feature-pages.css', '  width: 72px;\n  height: 32px;\n  padding-inline: 8px;\n  font-size: 11px;', '  width: clamp(64px, 18.5vw, 72px);\n  height: 32px;\n  padding-inline: clamp(5px, 2vw, 8px);\n  font-size: clamp(10px, 2.8vw, 11px);')
          sub_once('src/responsive-feature-pages.css', r'\n@media \(max-width: 360px\) \{.*?\n\}\s*$', '\n', re.S)

          # Remove base notification dimensions that were being overwritten later.
          replace_once('src/feature-pages.css', '.notification-row { display: grid; width: 100%; height: 80px; min-height: 0; padding: 8px; }', '.notification-row { display: grid; width: 100%; min-height: 0; }')
          replace_once('src/feature-pages.css', '.notification-heading { display: grid; grid-template-columns: 58px minmax(0, 1fr) 88px 46px; align-items: center; column-gap: 8px; }', '.notification-heading { display: grid; align-items: center; }')
          replace_once('src/feature-pages.css', '.notification-icon { display: grid; width: 58px; height: 58px; place-items: center; justify-self: start; }', '.notification-icon { display: grid; place-items: center; justify-self: start; }')
          replace_once('src/feature-pages.css', '.notification-icon img { display: block; width: 58px; height: 58px; object-fit: contain; }', '.notification-icon img { display: block; object-fit: contain; }')
          replace_once('src/feature-pages.css', '.notification-actions > button:first-child { width: 88px; height: 38px; padding: 0 12px; justify-self: end; border: 1px solid rgba(211, 166, 66, .62); border-radius: 19px; background: transparent; box-shadow: none; color: rgba(211, 166, 66, .88); font-size: 14px; font-weight: 600; line-height: 18px; white-space: nowrap; }', '.notification-actions > button:first-child { justify-self: end; border: 1px solid rgba(211, 166, 66, .62); border-radius: 19px; background: transparent; box-shadow: none; color: rgba(211, 166, 66, .88); font-weight: 600; line-height: 18px; white-space: nowrap; }')
          replace_once('src/feature-pages.css', '.notifications-screen .feature-body { padding: 0 20px calc(var(--bottom-navigation-height) + var(--mobile-safe-area-height, 34px) + 12px); }', '.notifications-screen .feature-body { padding: 0 20px calc(var(--layout-bottom-nav-clearance) + 12px); }')

          # Floating panels use viewport-fixed positioning with 20px side clearance.
          sub_once('src/feature-pages.css', r'(\.history-filter-panel\[data-floating="true"\]\s*\{\s*)position:\s*absolute;', r'\1position: fixed;')
          old_ref_float = '''.reference-query-panel[data-floating="true"] {\n  position: absolute;\n  z-index: 40;\n  left: 50%;\n  box-sizing: border-box;\n  width: calc(100% - (var(--layout-page-inline) * 2));\n  max-height: calc(100dvh - 24px);\n  padding: 8px;\n  overflow-y: auto;\n  border: 1px solid #6c4a20;\n  border-radius: 11px;\n  background: linear-gradient(145deg, rgba(8, 16, 22, .99), rgba(2, 8, 13, .99));\n  box-shadow: 0 12px 34px rgba(0, 0, 0, .72), inset 0 0 18px rgba(150, 102, 34, .04);\n  transform: translateX(-50%);\n}\n'''
          new_ref_float = '''.reference-query-panel[data-floating="true"] {\n  position: fixed;\n  z-index: 40;\n  left: 20px;\n  right: 20px;\n  box-sizing: border-box;\n  width: auto;\n  max-height: calc(100dvh - 24px);\n  padding: 8px;\n  overflow-y: auto;\n  border: 1px solid #6c4a20;\n  border-radius: 11px;\n  background: linear-gradient(145deg, rgba(8, 16, 22, .99), rgba(2, 8, 13, .99));\n  box-shadow: 0 12px 34px rgba(0, 0, 0, .72), inset 0 0 18px rgba(150, 102, 34, .04);\n}\n'''
          replace_once('src/feature-pages.css', old_ref_float, new_ref_float)
          replace_once('src/feature-pages.css', '''.number-reference-screen .matrix-title-banner-actions {\n  inset: 0 0 0 50%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n''', '''.number-reference-screen .matrix-title-banner-actions {\n  display: flex;\n  align-items: flex-end;\n  justify-content: flex-end;\n}\n''')

          # Rectangular select frames and responsive control text for history/reference.
          marker = '.history-order-select select { font-size: 11px; }\n'
          replacement = '''.history-order-select select { font-size: clamp(8.5px, 2.8vw, 11px); }\n.history-filter-panel .select-box { border: 1px solid #b98723; border-radius: 0; background: #07131d; }\n.history-filter-panel .select-box::before,\n.history-filter-panel .select-box::after { display: none; }\n'''
          replace_once('src/feature-pages.css', marker, replacement)
          replace_once('src/feature-pages.css', '  font-size: 10px;\n  font-weight: 600;\n  text-align: center;\n  text-align-last: center;\n}\n.history-filter-panel option', '  font-size: clamp(8.5px, 2.6vw, 11px);\n  font-weight: 600;\n  text-align: center;\n  text-align-last: center;\n}\n.history-filter-panel option')
          replace_once('src/feature-pages.css', '.history-filter-start { height: 26px; padding: 0 4px; border: 1px solid #c99a2e; border-radius: 7px; background: linear-gradient(135deg, #efbf4f, #c9800c); color: #17120a; font-size: 11px; font-weight: 700; white-space: nowrap; }', '.history-filter-start { height: 26px; padding: 0 4px; border: 1px solid #c99a2e; border-radius: 7px; background: linear-gradient(135deg, #efbf4f, #c9800c); color: #17120a; font-size: clamp(9px, 2.8vw, 11px); font-weight: 700; white-space: nowrap; }')
          replace_once('src/feature-pages.css', '.reference-query-panel .reference-select { height: 26px; }', '.reference-query-panel .reference-select { height: 26px; border: 1px solid #b98723; border-radius: 0; background: #07131d; }\n.reference-query-panel .select-box::before,\n.reference-query-panel .select-box::after { display: none; }')
          replace_once('src/feature-pages.css', '  font-size: 13px;\n  font-weight: 600;\n  text-align: center;\n  text-align-last: center;\n}\n.number-reference-screen .reference-select svg', '  font-size: clamp(9px, 3vw, 13px);\n  font-weight: 600;\n  text-align: center;\n  text-align-last: center;\n}\n.number-reference-screen .reference-select svg')
          replace_once('src/feature-pages.css', '.number-reference-screen .reference-order-select select { padding-left: 5px; padding-right: 22px; font-size: 11.5px; }', '.number-reference-screen .reference-order-select select { padding-left: 5px; padding-right: 22px; font-size: clamp(8.5px, 2.8vw, 11.5px); }')
          replace_once('src/feature-pages.css', '.gold-button { height: 42px; padding-inline: 4px; gap: 4px; border: 0; background: linear-gradient(135deg, #f4c95e, #d99513); color: #17120a; font-size: 11px; font-weight: 600; white-space: nowrap; }', '.gold-button { height: 42px; padding-inline: 4px; gap: 4px; border: 0; background: linear-gradient(135deg, #f4c95e, #d99513); color: #17120a; font-size: clamp(9px, 2.8vw, 11px); font-weight: 600; white-space: nowrap; }')

          # Same-star: 20px page clearance, fixed floating panel, same internal geometry, responsive text, stronger row separation.
          replace_once('src/tongxing-compact.css', '  --group-divider-width: 2px;', '  --group-divider-width: 3px;')
          replace_once('src/tongxing-compact.css', '  width: calc(100% - (var(--layout-page-inline) * 2));\n  min-width: 0;\n  margin-inline: var(--layout-page-inline);', '  width: calc(100% - 40px);\n  min-width: 0;\n  margin-inline: 20px;')
          replace_once('src/tongxing-compact.css', '  width: calc(100% + (var(--layout-page-inline) * 2) - 40px);', '  width: 100%;')
          sub_once('src/tongxing-compact.css', r'(\.tongxing-query\[data-floating="true"\]\s*\{\s*)position:\s*absolute;', r'\1position: fixed;')
          text = read('src/tongxing-compact.css').replace('font-size: .75rem;', 'font-size: clamp(9px, 3vw, 12px);')
          text = text.replace('  font-size: 18px;\n  font-weight: 600;\n}', '  font-size: clamp(14px, 4.6vw, 18px);\n  font-weight: 600;\n}', 2)
          text = text.replace('border-top: var(--group-divider-width) solid rgba(168, 119, 47, .7);', 'border-top: var(--group-divider-width) solid rgba(168, 119, 47, .9);')
          text = text.replace('background: rgba(126, 83, 15, .12);', 'background: rgba(126, 83, 15, .24);')
          text = text.replace('background: rgba(10, 61, 88, .13);', 'background: rgba(10, 61, 88, .25);')
          text = text.replace('rgba(105, 129, 140, .31)', 'rgba(105, 129, 140, .55)')
          marker = '''.tongxing-panel-scope .query-selects .select-box,\n.tongxing-panel-scope .same-star-fields input,\n.tongxing-panel-scope .same-star-period-select {\n  height: var(--control-height);\n}\n'''
          addition = marker + '''\n.tongxing-panel-scope .query-selects .select-box,\n.tongxing-panel-scope .same-star-period-select {\n  border: 1px solid #b98723;\n  border-radius: 0;\n  background: #07131d;\n}\n\n.tongxing-panel-scope .select-box::before,\n.tongxing-panel-scope .select-box::after { display: none; }\n'''
          if text.count(marker) != 1:
              raise SystemExit('tongxing control marker mismatch')
          text = text.replace(marker, addition, 1)
          write('src/tongxing-compact.css', text)

          # Prevent Matrix Explore-specific ball geometry from leaking into draw-history reuse scope.
          text = read('src/number-ball.css')
          if '.matrix-explore-main-screen .history-panel' not in text:
              raise SystemExit('number-ball Matrix Explore selector missing')
          text = text.replace('.matrix-explore-main-screen .history-panel', '.matrix-explore-main-screen .matrix-explore-history-panel')
          write('src/number-ball.css', text)

          # History date is opt-in: default date state no longer filters another lottery automatically.
          replace_once('src/FeaturePages.tsx', '  const [day, setDay] = useTimedState("history-day", "31日");', '  const [day, setDay] = useTimedState("history-day", "31日");\n  const [dateFilterTouched, setDateFilterTouched] = useState(false);')
          replace_once('src/FeaturePages.tsx', '      date: `${year}/${month.replace("月", "")}/${day.replace("日", "")}`,', '      date: dateFilterTouched ? `${year}/${month.replace("月", "")}/${day.replace("日", "")}` : "",')
          replace_once('src/FeaturePages.tsx', 'value={year} onChange={(event) => setYear(event.target.value)}', 'value={year} onChange={(event) => { setYear(event.target.value); setDateFilterTouched(true); }}')
          replace_once('src/FeaturePages.tsx', 'value={month} onChange={(event) => setMonth(event.target.value)}', 'value={month} onChange={(event) => { setMonth(event.target.value); setDateFilterTouched(true); }}')
          replace_once('src/FeaturePages.tsx', 'value={day} onChange={(event) => setDay(event.target.value)}', 'value={day} onChange={(event) => { setDay(event.target.value); setDateFilterTouched(true); }}')
          replace_once('src/FeaturePages.tsx', '<ReloadIcon />刷新', '<ReloadIcon className="reference-refresh-icon" />刷新')

          # Update obviously stale contracts to the current formal implementation.
          calc = read('tests/calculator-responsive-layout.test.mjs')
          calc = calc.replace("assert.equal(style('.calculator-screen .feature-body').paddingInline, 'var(--layout-page-inline)');", "assert.equal(style('.calculator-screen .feature-body').paddingInline, '20px');")
          calc = calc.replace('  assert.match(body, /padding-bottom:\\s*80px/);', '  assert.match(body, /padding:\\s*0 20px var\\(--layout-bottom-nav-clearance\\)/);\n  assert.doesNotMatch(body, /80px/);')
          calc = calc.replace('    const bodyWidth = viewport - 24;', '    const bodyWidth = viewport - 40;')
          write('tests/calculator-responsive-layout.test.mjs', calc)

          option = read('tests/matrix-explore-option-layout.test.mjs')
          option = option.replace(r'padding:\s*0 16px 1rem;', r'padding:\s*0 12px var\(--layout-bottom-nav-clearance\);')
          option = option.replace(r'width:\s*calc\(100% - 32px\);', r'width:\s*calc\(100% - 24px\);')
          write('tests/matrix-explore-option-layout.test.mjs', option)

          Path('tests/bottom-navigation-height.test.mjs').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\ntest("底部導覽使用 82px 正式高度與瀏覽器 safe area 響應式避讓", () => {\n  const tokens = fs.readFileSync(new URL("../src/design-tokens.css", import.meta.url), "utf8");\n  const prototype = fs.readFileSync(new URL("../src/prototype.css", import.meta.url), "utf8");\n  assert.match(tokens, /--bottom-navigation-height:\\s*82px;/);\n  assert.match(tokens, /--layout-bottom-nav-clearance:\\s*calc\\(var\\(--bottom-navigation-height\\) \\+ env\\(safe-area-inset-bottom,\\s*0px\\)\\);/);\n  assert.doesNotMatch(tokens, /--layout-bottom-nav-clearance:[^;]*--mobile-safe-area-height/);\n  assert.match(prototype, /\\.bottom-nav-brand-screen:not\\(\\.notifications-screen\\) > \\.feature-body\\s*\\{[^}]*padding-bottom:\\s*var\\(--layout-bottom-nav-clearance\\);/s);\n});\n''')
          PY

          rm -f src/bottom-nav-responsive-clearance.css
          rm -f tests/bottom-navigation-responsive-clearance.test.mjs

      - name: Verify requested contract
        run: node --test tests/ui-responsive-cleanup-contract.test.mjs tests/calculator-responsive-layout.test.mjs tests/matrix-explore-option-layout.test.mjs tests/matrix-explore-fluid-layout.test.mjs tests/bottom-navigation-safe-area-position.test.mjs tests/bottom-navigation-height.test.mjs

      - name: Verify all node tests individually
        shell: bash
        run: |
          : > failing-tests.txt
          status=0
          for file in tests/*.test.mjs; do
            echo "===== $file ====="
            if ! node --test "$file"; then
              echo "$file" >> failing-tests.txt
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo 'Failing test files:'
            cat failing-tests.txt
            exit 1
          fi

      - name: Upload failing-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-ui-failing-tests
          path: failing-tests.txt
          if-no-files-found: ignore

      - name: Verify production build
        run: npm run build

      - name: Commit verified cleanup to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-bottom-nav-source-fix.yml
          git add -A
          git commit -m 'Fix responsive feature layouts and filters'
          git push origin main
