name: Clean history layout rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-history-record-layout-spec.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update formal history style sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/feature-pages.css')
          s = p.read_text()

          def sub_once(pattern, replacement, label, flags=0):
              global s
              s, count = re.subn(pattern, replacement, s, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')

          sub_once(
              r'(\.matrix-explore-main-screen > \.feature-body,\n\.matrix-tianyan-screen > \.feature-body,\n\.matrix-tiangong-screen > \.feature-body,\n)\.draw-history-screen > \.feature-body,\n(\.number-reference-screen > \.feature-body \{ padding-inline: 4px; \})',
              r'\1\2\n.draw-history-screen > .feature-body { padding-inline: 12px; }',
              'history page side padding',
          )
          sub_once(r'^\.matrix-title-banner-actions \.history-title-lottery \{[^\n]*\}\n', '', 'duplicate history title lottery sizing', re.M)
          sub_once(r'^\.history-title-lottery \{[^\n]*\}$', '.history-title-lottery { display: grid; width: 84px; height: 26px; flex: 0 0 84px; grid-template-columns: minmax(0, 1fr) 18px; }', 'formal history title lottery sizing', re.M)
          sub_once(r'^\.history-title-lottery select \{[^\n]*\}$', '.history-title-lottery select { position: relative; z-index: 1; width: 100%; height: 100%; grid-row: 1; grid-column: 1 / -1; appearance: none; border: 0; outline: 0; background: transparent; color: var(--select-tech-text); }', 'history title lottery structural select rule', re.M)
          sub_once(r'^\.history-title-actions \.history-filter-trigger \{[^\n]*\}$', '.history-title-actions .history-filter-trigger { white-space: nowrap; }', 'history filter trigger base rule', re.M)
          sub_once(r'^\.draw-history-screen \.draw-history-head \{\n\s*min-height:\s*28px;\n\s*font-size:\s*13px;\n\s*font-weight:\s*700;\n\}\n\n', '', 'duplicate draw history head rule', re.M)
          p.write_text(s)

          t = Path('tests/draw-history-table-layout.test.mjs')
          ts = t.read_text()
          anchor = 'test("歷史開獎三欄使用單一正式比例並將前兩欄內容幾何置中", () => {\n'
          side_assertion = '  assert.match(css, /\\.draw-history-screen\\s*>\\s*\\.feature-body\\s*\\{[^}]*padding-inline:\\s*12px/s);\n'
          if side_assertion not in ts:
              if anchor not in ts:
                  raise SystemExit('history test anchor not found')
              ts = ts.replace(anchor, anchor + side_assertion, 1)
          width_pattern = re.compile(r'\s*assert\.match\(css, /\\\.history-title-lottery\\s\*\\\{\[\^}\]\*width:\\s\*92px\[\^}\]\*height:\\s\*26px\[\^}\]\*flex:\\s\*0 0 92px/s\);')
          width_replacement = '  assert.match(css, /\\.history-title-lottery\\s*\\{[^}]*width:\\s*84px[^}]*height:\\s*26px[^}]*flex:\\s*0 0 84px/s);'
          ts, count = width_pattern.subn(lambda _: '\n' + width_replacement, ts, count=1)
          if count == 0 and 'width:\\s*84px' not in ts:
              raise SystemExit('history title width test not found')
          t.write_text(ts)

          required = [
              '.draw-history-screen > .feature-body { padding-inline: 12px; }',
              '.history-title-lottery { display: grid; width: 84px; height: 26px; flex: 0 0 84px;',
              '.history-title-actions .history-filter-trigger { white-space: nowrap; }',
              '.draw-history-screen .history-title-lottery.native-select select {',
              '.draw-history-screen .history-title-actions .history-filter-trigger { min-width: 68px;',
          ]
          for item in required:
              if item not in s:
                  raise SystemExit(f'missing final rule: {item}')
          if '.matrix-title-banner-actions .history-title-lottery {' in s:
              raise SystemExit('duplicate title lottery sizing remains')
          if '.draw-history-screen .draw-history-head {' in s:
              raise SystemExit('duplicate draw history head remains')
          PY
      - name: Verify history cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/feature-pages.css').read_text()
          assert '.draw-history-screen > .feature-body { padding-inline: 12px; }' in s
          assert '.matrix-title-banner-actions .history-title-lottery {' not in s
          assert '.history-title-lottery { display: grid; width: 84px; height: 26px; flex: 0 0 84px;' in s
          assert '.draw-history-screen .draw-history-head {' not in s
          print('history cleanup verification passed')
          PY
          node --test tests/page-title-card.test.mjs
      - name: Verify TypeScript and bundle
        run: npx tsc && npx vite build && node scripts/prepare-sites-build.mjs
      - name: Commit source cleanup
        shell: bash
        run: |
          git config user.name 'spy854540-cmd'
          git config user.email 'spy854540@gmail.com'
          git rm .github/workflows/apply-history-record-layout-spec.yml
          git add src/feature-pages.css tests/draw-history-table-layout.test.mjs
          git diff --cached --check
          git commit -m 'style: clean history layout sources and set 12px margins'
          git push origin main
