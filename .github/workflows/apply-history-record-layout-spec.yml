name: Clean history layout rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-history-record-layout-spec.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update formal history style sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/feature-pages.css')
          s = p.read_text()

          replacements = [
              (
                  '.matrix-explore-main-screen > .feature-body,\n.matrix-tianyan-screen > .feature-body,\n.matrix-tiangong-screen > .feature-body,\n.draw-history-screen > .feature-body,\n.number-reference-screen > .feature-body { padding-inline: 4px; }',
                  '.matrix-explore-main-screen > .feature-body,\n.matrix-tianyan-screen > .feature-body,\n.matrix-tiangong-screen > .feature-body,\n.number-reference-screen > .feature-body { padding-inline: 4px; }\n.draw-history-screen > .feature-body { padding-inline: 12px; }',
              ),
              (
                  '.matrix-title-banner-actions .history-title-lottery { width: 84px; height: 26px; flex-basis: 84px; }\n',
                  '',
              ),
              (
                  '.history-title-lottery { display: grid; width: 92px; height: 26px; flex: 0 0 92px; grid-template-columns: minmax(0, 1fr) 18px; }',
                  '.history-title-lottery { display: grid; width: 84px; height: 26px; flex: 0 0 84px; grid-template-columns: minmax(0, 1fr) 18px; }',
              ),
              (
                  '.history-title-lottery select { position: relative; z-index: 1; width: 100%; height: 100%; padding: 0 20px 0 5px; grid-row: 1; grid-column: 1 / -1; appearance: none; border: 0; outline: 0; background: transparent; color: var(--select-tech-text); font-size: 8px; }',
                  '.history-title-lottery select { position: relative; z-index: 1; width: 100%; height: 100%; grid-row: 1; grid-column: 1 / -1; appearance: none; border: 0; outline: 0; background: transparent; color: var(--select-tech-text); }',
              ),
              (
                  '.history-title-actions .history-filter-trigger { min-height: 30px; height: 30px; padding-inline: 6px; font-size: 10px; white-space: nowrap; }',
                  '.history-title-actions .history-filter-trigger { white-space: nowrap; }',
              ),
              (
                  '.draw-history-screen .draw-history-head {\n  min-height: 28px;\n  font-size: 13px;\n  font-weight: 700;\n}\n\n',
                  '',
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:80]}')
              s = s.replace(old, new, 1)

          p.write_text(s)

          t = Path('tests/draw-history-table-layout.test.mjs')
          ts = t.read_text()
          anchor = 'test("歷史開獎三欄使用單一正式比例並將前兩欄內容幾何置中", () => {\n'
          assertion = '  assert.match(css, /\\.draw-history-screen\\s*>\\s*\\.feature-body\\s*\\{[^}]*padding-inline:\\s*12px/s);\n'
          if assertion not in ts:
              if anchor not in ts:
                  raise SystemExit('history layout test anchor not found')
              ts = ts.replace(anchor, anchor + assertion, 1)
          t.write_text(ts)

          checks = [
              '.draw-history-screen > .feature-body { padding-inline: 12px; }',
              '.history-title-lottery { display: grid; width: 84px; height: 26px; flex: 0 0 84px;',
              '.history-title-actions .history-filter-trigger { white-space: nowrap; }',
          ]
          for check in checks:
              if check not in s:
                  raise SystemExit(f'missing final rule: {check}')
          if '.matrix-title-banner-actions .history-title-lottery { width: 84px;' in s:
              raise SystemExit('duplicate title-lottery sizing rule still exists')
          if s.count('.draw-history-screen .draw-history-head {') != 0:
              raise SystemExit('duplicate draw-history-head block still exists')
          PY
      - name: Verify focused tests
        run: node --test tests/draw-history-table-layout.test.mjs tests/page-title-card.test.mjs
      - name: Verify build
        run: npm run build
      - name: Commit source cleanup
        shell: bash
        run: |
          git config user.name 'spy854540-cmd'
          git config user.email 'spy854540@gmail.com'
          git rm .github/workflows/apply-history-record-layout-spec.yml
          git add src/feature-pages.css tests/draw-history-table-layout.test.mjs
          git diff --cached --check
          git commit -m 'style: clean history layout sources and set 12px margins'
          git push origin main
