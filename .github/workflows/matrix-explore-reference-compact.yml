      - name: Run full tests
        run: node --test tests/*.test.mjs
      - name: Build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/matrix-explore-reference-compact.yml
          git add src/feature-pages.css tests/matrix-explore-reference-density.test.mjs
          git commit -m 'refactor(explore): match compact reference proportions'
          git push origin main
