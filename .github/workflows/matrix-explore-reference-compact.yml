name: Matrix Explore reference compact

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: ${{ github.event.issue.title == '[run] Matrix Explore compact reference v3' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply compact sizing
        run: python scripts/tmp-explore-compact.py
      - name: Check prohibited hacks
        shell: bash
        run: |
          git diff -- src/feature-pages.css
          if git diff -- src/feature-pages.css | grep -E '^\+.*(scale\(|zoom:|translate\(|!important|margin[^:]*:[[:space:]]*-)' ; then
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/feature-pages.css
          git diff --cached --quiet && exit 1
          git commit -m "style: compact Matrix Explore to reference proportions"
          git push origin HEAD:main
