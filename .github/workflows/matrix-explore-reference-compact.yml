      - name: Add reference-density contract test
        shell: bash
        run: |
          cat > tests/matrix-explore-reference-density.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const css = readFileSync('src/feature-pages.css','utf8');
          const start = css.indexOf('/* Matrix Explore formal layout rules */');
          const end = css.indexOf('/* v55 scoped density and hierarchy refinements */');
          assert.notEqual(start,-1); assert.notEqual(end,-1);
          const formal = css.slice(start,end);
          test('Explore main compact reference dimensions are canonical',()=>{
            assert.match(formal,/explore-settings \.setting-grid label \{\nmin-width: 0; width: 100%; min-height: 34px/);
            assert.match(formal,/explore-settings \.setting-grid label > span \.setting-label-icon \{\nwidth: 30px; height: 30px/);
            assert.match(formal,/explore-settings \.setting-grid \.select-box \{\nwidth: 100%; max-width: none; min-width: 0; height: 34px/);
            assert.match(formal,/hit-options button \{\nheight: 38px; min-height: 38px/);
            assert.match(formal,/\.matrix-explore-main-screen \.primary-action \{\nwidth: 100%; height: 42px/);
            assert.match(formal,/history-panel \.panel-heading \{\nmin-height: 44px; padding: 6px 10px/);
            assert.match(formal,/result-summary > div \{\ndisplay: flex; min-width: 0; height: 42px/);
          });
          test('unchanged reference constraints stay intact',()=>{
            assert.match(formal,/\.matrix-explore-screen \.matrix-title-banner \{\nmargin-bottom: 8px;/);
            assert.doesNotMatch(formal,/scale\(|zoom\s*:|!important|margin-(?:top|right|bottom|left):\s*-/);
          });
          EOF

      - name: Install dependencies
