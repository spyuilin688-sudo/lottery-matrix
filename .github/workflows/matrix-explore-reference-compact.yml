name: Matrix Explore reference compact

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.event.issue.title == '[run] Matrix Explore compact reference v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply approved Explore compact sizing
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p = Path('src/feature-pages.css')
          s = p.read_text()

          def swap(pattern, replacement, label):
              global s
              s2, n = re.subn(pattern, replacement, s, count=1, flags=re.M | re.S)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              s = s2

          swap(
              r'^\.matrix-explore-screen \.explore-settings,\n\.matrix-explore-screen \.hit-advanced-panel,\n\.matrix-explore-screen \.history-panel,\n\.matrix-explore-screen \.repeat-stats-panel,\n\.matrix-explore-screen \.result-panel \{.*?^\}',
              '''.matrix-explore-screen:not(.matrix-explore-main-screen) .explore-settings,
.matrix-explore-screen:not(.matrix-explore-main-screen) .hit-advanced-panel,
.matrix-explore-screen:not(.matrix-explore-main-screen) .history-panel,
.matrix-explore-screen:not(.matrix-explore-main-screen) .repeat-stats-panel,
.matrix-explore-screen:not(.matrix-explore-main-screen) .result-panel {
box-sizing: border-box;
  width: 100%;
  min-width: 0;
  height: auto;
  padding: 12px;
  border-radius: 12px;
  box-shadow: none;
}

.matrix-explore-main-screen .explore-settings,
.matrix-explore-main-screen .hit-advanced-panel,
.matrix-explore-main-screen .history-panel,
.matrix-explore-main-screen .repeat-stats-panel,
.matrix-explore-main-screen .result-panel {
box-sizing: border-box;
  width: 100%;
  min-width: 0;
  height: auto;
  padding: 10px;
  border-radius: 10px;
  box-shadow: none;
}''',
              'panel sizing')

          swap(
              r'^\.matrix-explore-screen:not\(\.matrix-explore-main-screen\) \.section-title,\n\.matrix-explore-main-screen \.panel:not\(\.explore-settings\) \.section-title \{.*?^\}',
              '''.matrix-explore-screen:not(.matrix-explore-main-screen) .section-title {
min-height: 28px; gap: 10px; font-size: 19px; font-weight: 700; line-height: 26px; letter-spacing: 0;
}

.matrix-explore-main-screen .panel:not(.explore-settings) .section-title {
min-height: 24px; gap: 8px; font-size: 16px; font-weight: 700; line-height: 22px; letter-spacing: 0;
}''',
              'section titles')

          swap(
              r'^\.matrix-explore-screen:not\(\.matrix-explore-main-screen\) \.section-title > span,\n\.matrix-explore-main-screen \.panel:not\(\.explore-settings\) \.section-title > span \{.*?^\}',
              '''.matrix-explore-screen:not(.matrix-explore-main-screen) .section-title > span {
width: 4px; height: 24px; border-radius: 2px; box-shadow: 0 0 4px rgba(255, 194, 42, .18);
}

.matrix-explore-main-screen .panel:not(.explore-settings) .section-title > span {
width: 4px; height: 20px; border-radius: 2px; box-shadow: 0 0 4px rgba(255, 194, 42, .18);
}''',
              'section title markers')

          swap(r'^\.matrix-explore-main-screen \.explore-settings \.setting-grid label \{.*?^\}',
               '''.matrix-explore-main-screen .explore-settings .setting-grid label {
min-width: 0; width: 100%; min-height: 34px; grid-template-columns: minmax(94px, 102px) minmax(0, 1fr); align-items: center; gap: 8px;
}''', 'settings row')

          swap(r'^\.matrix-explore-main-screen \.explore-settings \.setting-grid label > span \{.*?^\}',
               '''.matrix-explore-main-screen .explore-settings .setting-grid label > span {
display: grid; width: 100%; min-width: 0; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 8px; color: #bdb8b0; font-size: 14px; font-weight: 600; line-height: 20px; text-align: left; white-space: nowrap;
}''', 'settings label')

          swap(r'^\.matrix-explore-main-screen \.explore-settings \.setting-grid label > span \.setting-label-icon \{.*?^\}',
               '''.matrix-explore-main-screen .explore-settings .setting-grid label > span .setting-label-icon {
width: 30px; height: 30px; flex: 0 0 30px; border-radius: 5px; transform: none;
}''', 'settings icon')

          swap(r'^\.matrix-explore-main-screen \.explore-settings \.setting-grid \.select-box \{.*?^\}',
               '''.matrix-explore-main-screen .explore-settings .setting-grid .select-box {
width: 100%; max-width: none; min-width: 0; height: 34px; min-height: 34px; padding: 0; font-size: 13px; font-weight: 700;
}''', 'settings select')

          swap(r'^\.matrix-explore-main-screen \.explore-settings \.segmented\.three \{.*?^\}',
               '''.matrix-explore-main-screen .explore-settings .segmented.three {
gap: 5px;
}''', 'settings segmented gap')

          swap(r'^\.matrix-explore-main-screen \.explore-settings \.segmented\.three button \{.*?^\}',
               '''.matrix-explore-main-screen .explore-settings .segmented.three button {
min-width: 0; height: 34px; min-height: 34px; padding: 0 3px; border-radius: 8px; font-size: 11.5px; font-weight: 600; line-height: 1.15; white-space: normal; overflow: visible;
}''', 'settings buttons')

          swap(
              r'^\.matrix-explore-main-screen \.explore-settings \.setting-grid \.select-box,\n\.matrix-explore-main-screen \.explore-settings \.setting-grid \.segmented,\n\.matrix-explore-main-screen \.explore-settings \.setting-grid \.segmented button \{.*?^\}',
              '''.matrix-explore-main-screen .explore-settings .setting-grid .select-box,
.matrix-explore-main-screen .explore-settings .setting-grid .segmented,
.matrix-explore-main-screen .explore-settings .setting-grid .segmented button {
height: 34px;
  min-height: 34px;
}''',
              'settings height source')

          swap(
              r'^\.matrix-explore-screen:not\(\.matrix-explore-main-screen\) \.setting-grid \.select-box,\n\.matrix-explore-screen:not\(\.matrix-explore-main-screen\) \.setting-grid \.segmented,\n\.matrix-explore-screen:not\(\.matrix-explore-main-screen\) \.setting-grid \.segmented button,\n\.matrix-explore-main-screen \.advanced-panel \.select-box,\n\.matrix-explore-main-screen \.advanced-panel \.segmented,\n\.matrix-explore-main-screen \.advanced-panel \.segmented button,\n\.matrix-explore-screen \.hit-options,\n\.matrix-explore-screen \.hit-options button \{.*?^\}',
              '''.matrix-explore-screen:not(.matrix-explore-main-screen) .setting-grid .select-box,
.matrix-explore-screen:not(.matrix-explore-main-screen) .setting-grid .segmented,
.matrix-explore-screen:not(.matrix-explore-main-screen) .setting-grid .segmented button,
.matrix-explore-screen:not(.matrix-explore-main-screen) .hit-options,
.matrix-explore-screen:not(.matrix-explore-main-screen) .hit-options button {
height: 44px;
  min-height: 44px;
}

.matrix-explore-main-screen .advanced-panel .select-box,
.matrix-explore-main-screen .advanced-panel .segmented,
.matrix-explore-main-screen .advanced-panel .segmented button {
height: 36px;
  min-height: 36px;
}

.matrix-explore-main-screen .hit-options,
.matrix-explore-main-screen .hit-options button {
height: 38px;
  min-height: 38px;
}''',
              'advanced and hit heights')

          swap(
              r'^\.matrix-explore-screen \.segmented\.two button,\n\.matrix-explore-screen \.hit-options button \{.*?^\}',
              '''.matrix-explore-screen:not(.matrix-explore-main-screen) .segmented.two button,
.matrix-explore-screen:not(.matrix-explore-main-screen) .hit-options button {
height: 44px; min-height: 44px; padding: 0 4px; border-radius: 10px; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: visible;
}

.matrix-explore-main-screen .advanced-panel .segmented.two button {
height: 36px; min-height: 36px; padding: 0 3px; border-radius: 8px; font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: visible;
}

.matrix-explore-main-screen .hit-options button {
height: 38px; min-height: 38px; padding: 0 4px; border-radius: 9px; font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: visible;
}''',
              'main hit buttons')

          swap(r'^\.matrix-explore-screen \.hit-options \{\nmargin-top: 12px; padding-bottom: 12px; border-bottom: 1px solid rgba\(212, 165, 47, \.28\);\n\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .hit-options {
margin-top: 12px; padding-bottom: 12px; border-bottom: 1px solid rgba(212, 165, 47, .28);
}

.matrix-explore-main-screen .hit-options {
margin-top: 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(212, 165, 47, .28);
}''', 'hit spacing')

          swap(r'^\.matrix-explore-screen \.advanced-row \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .advanced-row {
height: 44px; min-height: 44px; margin: 12px 0 0; padding: 0; grid-template-columns: 32px minmax(0, 1fr) 14px; align-items: center; font-size: 17px; font-weight: 700;
}

.matrix-explore-main-screen .advanced-row {
height: 38px; min-height: 38px; margin: 8px 0 0; padding: 0; grid-template-columns: 28px minmax(0, 1fr) 12px; align-items: center; font-size: 15px; font-weight: 700;
}''', 'advanced row')

          swap(r'^\.matrix-explore-screen \.advanced-row > img:first-child \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .advanced-row > img:first-child {
width: 32px; height: 32px; border-radius: 5px; object-fit: contain;
}

.matrix-explore-main-screen .advanced-row > img:first-child {
width: 28px; height: 28px; border-radius: 5px; object-fit: contain;
}''', 'advanced icon')

          swap(r'^\.matrix-explore-screen \.advanced-row svg:last-child \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .advanced-row svg:last-child {
width: 14px; height: 14px;
}

.matrix-explore-main-screen .advanced-row svg:last-child {
width: 12px; height: 12px;
}''', 'advanced arrow')

          swap(r'^\.matrix-explore-screen \.primary-action \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .primary-action {
width: 100%; height: 50px; margin: 12px 0; border: 1px solid #d4a52f; border-radius: 12px; background: #071018; color: #f6d472; font-size: 21px; font-weight: 700; letter-spacing: 0; box-shadow: 0 0 4px rgba(212, 165, 47, .18);
}

.matrix-explore-main-screen .primary-action {
width: 100%; height: 42px; margin: 8px 0 12px; border: 1px solid #d4a52f; border-radius: 10px; background: #071018; color: #f6d472; font-size: 18px; font-weight: 700; letter-spacing: 0; box-shadow: 0 0 4px rgba(212, 165, 47, .18);
}''', 'primary action')

          swap(r'^\.matrix-explore-screen \.primary-action svg \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .primary-action svg {
width: 24px; height: 24px;
}

.matrix-explore-main-screen .primary-action svg {
width: 20px; height: 20px;
}''', 'primary icon')

          swap(r'^\.matrix-explore-main-screen \.history-panel \.panel-heading \{.*?^\}',
               '''.matrix-explore-main-screen .history-panel .panel-heading {
min-height: 44px; padding: 6px 10px; align-items: center;
}''', 'history heading')

          swap(r'^\.matrix-explore-main-screen \.history-panel \.panel-heading \.section-title \{.*?^\}',
               '''.matrix-explore-main-screen .history-panel .panel-heading .section-title {
min-width: 0; font-size: 14px; line-height: 18px; white-space: normal;
}''', 'history title')

          swap(r'^\.matrix-explore-screen \.road-result-row > strong \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .road-result-row > strong {
font-size: 15px;
  font-weight: 700;
}

.matrix-explore-main-screen .road-result-row > strong {
font-size: 14px;
  font-weight: 700;
}''', 'result number')

          swap(r'^\.matrix-explore-screen \.repeat-stats-heading \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .repeat-stats-heading {
display: grid; min-height: 28px; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 12px;
}

.matrix-explore-main-screen .repeat-stats-heading {
display: grid; min-height: 24px; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 8px;
}''', 'repeat heading')

          swap(r'^\.matrix-explore-screen \.repeat-stats-heading \.section-title,\n\.matrix-explore-screen \.result-title \.section-title \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .repeat-stats-heading .section-title,
.matrix-explore-screen:not(.matrix-explore-main-screen) .result-title .section-title {
font-size: 19px; font-weight: 700;
}

.matrix-explore-main-screen .repeat-stats-heading .section-title,
.matrix-explore-main-screen .result-title .section-title {
font-size: 16px; font-weight: 700;
}''', 'result titles')

          swap(r'^\.matrix-explore-screen \.repeat-stats-heading button \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .repeat-stats-heading button {
height: 26px; min-height: 26px; padding: 0 8px; border: 1px solid rgba(170, 123, 28, .55); border-radius: 8px; background: rgba(128, 87, 13, .10); color: #ead295; font-size: 13px; font-weight: 600;
}

.matrix-explore-main-screen .repeat-stats-heading button {
height: 24px; min-height: 24px; padding: 0 7px; border: 1px solid rgba(170, 123, 28, .55); border-radius: 7px; background: rgba(128, 87, 13, .10); color: #ead295; font-size: 12px; font-weight: 600;
}''', 'repeat button')

          swap(r'^\.matrix-explore-screen \.repeat-stats-heading > span \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .repeat-stats-heading > span {
color: #9e9a93; font-size: 12px; font-weight: 400; text-align: right; white-space: nowrap;
}

.matrix-explore-main-screen .repeat-stats-heading > span {
color: #9e9a93; font-size: 11px; font-weight: 400; text-align: right; white-space: nowrap;
}''', 'repeat meta')

          swap(r'^\.matrix-explore-screen \.result-summary \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .result-summary {
display: grid; margin-top: 12px; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px;
}

.matrix-explore-main-screen .result-summary {
display: grid; margin-top: 8px; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px;
}''', 'result summary')

          swap(r'^\.matrix-explore-screen \.result-summary > div \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .result-summary > div {
display: flex; min-width: 0; height: 48px; min-height: 48px; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(79, 75, 69, .72); border-radius: 8px; box-shadow: none;
}

.matrix-explore-main-screen .result-summary > div {
display: flex; min-width: 0; height: 42px; min-height: 42px; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(79, 75, 69, .72); border-radius: 7px; box-shadow: none;
}''', 'result cells')

          swap(r'^\.matrix-explore-screen \.result-summary b \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .result-summary b {
font-size: 20px; font-weight: 500; line-height: 22px;
}

.matrix-explore-main-screen .result-summary b {
font-size: 18px; font-weight: 500; line-height: 20px;
}''', 'result cell number')

          swap(r'^\.matrix-explore-screen \.result-summary small \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .result-summary small {
margin-top: 1px; color: #aaa39a; font-size: 11px; font-weight: 400; line-height: 13px;
}

.matrix-explore-main-screen .result-summary small {
margin-top: 1px; color: #aaa39a; font-size: 10px; font-weight: 400; line-height: 12px;
}''', 'result cell label')

          swap(r'^\.matrix-explore-screen \.explore-result-disclaimer \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .explore-result-disclaimer {
box-sizing: border-box; width: 100%; margin: 0; padding: 14px 12px; color: #aaa49a; font-size: 13px; font-weight: 400; line-height: 1.55; text-align: center;
}

.matrix-explore-main-screen .explore-result-disclaimer {
box-sizing: border-box; width: 100%; margin: 0; padding: 10px; color: #aaa49a; font-size: 11px; font-weight: 400; line-height: 1.45; text-align: center;
}''', 'disclaimer')

          swap(r'^\.matrix-explore-screen \.result-panel \{\npadding-top: 12px;\n\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .result-panel {
padding-top: 12px;
}

.matrix-explore-main-screen .result-panel {
padding-top: 10px;
}''', 'result panel padding')

          swap(r'^\.matrix-explore-screen \.consecutive-filter-button \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .consecutive-filter-button {
position: relative; min-height: 28px; height: 28px; padding: 0 10px; border: 1px solid #aa7b1c; border-radius: 8px; background: rgba(128, 87, 13, .18); color: #ead295; font-size: 13px; font-weight: 600; white-space: nowrap;
}

.matrix-explore-main-screen .consecutive-filter-button {
position: relative; min-height: 24px; height: 24px; padding: 0 8px; border: 1px solid #aa7b1c; border-radius: 7px; background: rgba(128, 87, 13, .18); color: #ead295; font-size: 12px; font-weight: 600; white-space: nowrap;
}''', 'filter button')

          swap(r'^\.matrix-explore-screen \.result-count \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .result-count {
display: block; margin-left: 0; grid-column: 1 / -1; justify-self: end; color: #c6c0b8; font-size: 13px; font-weight: 400; line-height: 20px; text-align: right; white-space: nowrap;
}

.matrix-explore-main-screen .result-count {
display: block; margin-left: 0; grid-column: 1 / -1; justify-self: end; color: #c6c0b8; font-size: 11px; font-weight: 400; line-height: 16px; text-align: right; white-space: nowrap;
}''', 'result count')

          swap(r'^\.matrix-explore-screen \.result-count > span \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .result-count > span,
.matrix-explore-main-screen .result-count > span {
color: inherit; font-size: inherit; font-weight: inherit;
}''', 'result count span')

          swap(r'^\.matrix-explore-screen \.result-count \.numeric-text \{.*?^\}',
               '''.matrix-explore-screen:not(.matrix-explore-main-screen) .result-count .numeric-text {
color: #35bff0; font-size: 17px; font-weight: 700;
}

.matrix-explore-main-screen .result-count .numeric-text {
color: #35bff0; font-size: 15px; font-weight: 700;
}''', 'result count number')

          p.write_text(s)
          PY

      - name: Verify no prohibited sizing hacks were introduced
        shell: bash
        run: |
          git diff -- src/feature-pages.css
          if git diff -- src/feature-pages.css | grep -E '^\+.*(scale\(|zoom:|translate\(|!important|margin[^:]*:[[:space:]]*-)' ; then
            echo 'Prohibited sizing override detected'
            exit 1
          fi

      - name: Install and verify
        run: |
          npm ci
          npm run test:unit
          npm run build

      - name: Commit Explore sizing
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/feature-pages.css
          git diff --cached --quiet && { echo 'No CSS change generated'; exit 1; }
          git commit -m "style: compact Matrix Explore to reference proportions"
          git push origin HEAD:main
