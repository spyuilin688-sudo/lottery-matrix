name: Custom status mobile layout

on:
  push:
    branches: ['work/custom-status-compact-*']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/custom-status-layout.yml'
      - 'src/features/CustomConditionSection.tsx'
      - 'src/features/MatrixStatusPages.tsx'
      - 'src/feature-pages.css'
      - 'tests/custom-status-layout*'

permissions:
  contents: read

jobs:
  custom-status-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused custom status behavior
        run: npx vitest run src/__tests__/MatrixCustomStatusPage.test.tsx src/__tests__/LineProtectedPages.test.tsx src/__tests__/MatrixStatusPage.test.tsx
      - name: Focused custom status style ownership
        run: node --test --test-name-pattern="自訂觸發|custom status tabs" tests/home-switcher-status-frame-final.test.mjs tests/confirmed-ui-refinements.test.mjs tests/status-reference-notification-quick-regression.test.mjs
      - run: PLAYWRIGHT_BROWSERS_PATH=.sites-runtime/playwright npx playwright install --with-deps chromium
      - name: Verify custom status mobile layout and editing
        run: PLAYWRIGHT_BROWSERS_PATH=.sites-runtime/playwright npx playwright test tests/custom-status-layout.spec.ts --reporter=line
      - name: Keep mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-status-mobile-screenshots
          path: test-results/
          retention-days: 7
