name: Refine Matrix header actions once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-matrix-header-actions-once.yml'

permissions:
  contents: write

jobs:
  refine-header-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write visual contract test first
        shell: bash
        run: |
          cat > tests/matrix-header-actions-style.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const css = readFileSync('src/feature-pages.css', 'utf8');

          test('Matrix page switcher keeps touch target while visually reducing artwork weight', () => {
            assert.match(css, /\.matrix-title-banner-actions \.matrix-page-switcher button \{[\s\S]*?width: 100%;[\s\S]*?height: 100%;/);
            assert.match(css, /\.matrix-title-banner-actions \.matrix-page-switcher img \{ display: block; width: 88%; height: 88%; object-fit: contain; opacity: \.84; \}/);
          });

          test('Matrix status trigger remains full touch target but has smaller quieter artwork', () => {
            assert.match(css, /\.matrix-status-screen \.status-title-trigger \{[\s\S]*?width: 2\.34rem;[\s\S]*?height: 2\.34rem;/);
            assert.match(css, /\.matrix-status-screen \.status-title-trigger img \{ display: block; width: 82%; height: 82%; object-fit: contain; opacity: \.72; \}/);
          });
          EOF

      - name: RED - confirm new visual contract fails before CSS change
        shell: bash
        run: |
          set +e
          node --test tests/matrix-header-actions-style.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected the new visual contract to fail before implementation.'
            exit 1
          fi

      - name: GREEN - refine only Matrix header action artwork
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/feature-pages.css')
          css = path.read_text()

          old_switcher = '''.matrix-title-banner-actions .matrix-page-switcher button {
            width: 100%;
            height: 100%;
            border: 0;
            background: transparent;
            box-shadow: none;
          }
          .matrix-explore-screen .matrix-title-banner-actions {'''
          new_switcher = '''.matrix-title-banner-actions .matrix-page-switcher button {
            width: 100%;
            height: 100%;
            border: 0;
            background: transparent;
            box-shadow: none;
          }
          .matrix-title-banner-actions .matrix-page-switcher img { display: block; width: 88%; height: 88%; object-fit: contain; opacity: .84; }
          .matrix-explore-screen .matrix-title-banner-actions {'''
          if css.count(old_switcher) != 1:
              raise SystemExit(f'switcher anchor count={css.count(old_switcher)}')
          css = css.replace(old_switcher, new_switcher, 1)

          old_status = '.matrix-status-screen .status-title-trigger img { display: block; width: 100%; height: 100%; object-fit: contain; opacity: .8; }'
          new_status = '.matrix-status-screen .status-title-trigger img { display: block; width: 82%; height: 82%; object-fit: contain; opacity: .72; }'
          if css.count(old_status) != 1:
              raise SystemExit(f'status trigger image source count={css.count(old_status)}')
          css = css.replace(old_status, new_status, 1)

          path.write_text(css)
          PY

      - name: GREEN - visual contract
        run: node --test tests/matrix-header-actions-style.test.mjs

      - name: Existing unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Commit verified header refinement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refine-matrix-header-actions-once.yml
          git add -- src/feature-pages.css tests/matrix-header-actions-style.test.mjs
          git commit -m 'Refine Matrix header action hierarchy'
          git push origin HEAD:main
