name: Refresh Tian Gong sorted artifacts
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tiangong-sorted-refresh.yml
      - scripts/refresh-tiangong-sorted.py
      - services/matrix-api/app/domain/tiangong_algorithm.py
      - services/matrix-api/app/domain/tiangong_artifact.py
  pull_request:
    branches: [main]
    paths:
      - src/features/MatrixTiangongPage.tsx
      - src/matrix-tiangong-results.css
      - tests/tiangong-layout-browser.mjs
permissions:
  contents: read
concurrency:
  group: tiangong-sorted-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          python-version: "3.12"
      - run: uv sync --frozen --no-dev
        working-directory: services/matrix-api
      - run: services/matrix-api/.venv/bin/python scripts/refresh-tiangong-sorted.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/tiangong-layout-browser.mjs
