name: Fix Explore cross-cell longest rules once

on:
  push:
    branches:
      - fix/explore-cross-cell-longest-v11

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/matrix-api/uv.lock

      - name: Install Matrix API dependencies
        working-directory: services/matrix-api
        run: uv sync --frozen

      - name: Write regression tests
        run: python .github/scripts/one_off_fix_explore_cross_cell.py write-tests

      - name: Verify RED before the fix
        working-directory: services/matrix-api
        shell: bash
        run: |
          set +e
          uv run pytest -q tests/test_explore_v2_runner.py -k 'cross_reference or standard_and_full_decide_final_results_independently'
          status=$?
          set -e
          test "$status" -ne 0

      - name: Apply minimal aggregation fix and bump v11
        run: python .github/scripts/one_off_fix_explore_cross_cell.py apply-fix

      - name: Verify GREEN and full Matrix API suite
        id: verify
        continue-on-error: true
        working-directory: services/matrix-api
        shell: bash
        run: |
          set -o pipefail
          {
            uv run pytest -q tests/test_explore_v2_runner.py -k 'cross_reference or standard_and_full_decide_final_results_independently or two_rules_predicting_one_number'
            uv run pytest -q
            uv run python -m compileall -q app
            git diff --check
          } 2>&1 | tee "$GITHUB_WORKSPACE/explore-fix-test.log"

      - name: Store failure log
        if: steps.verify.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv explore-fix-test.log .github/explore-fix-test.log
          git add .github/explore-fix-test.log
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture Explore fix test failure"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          exit 1

      - name: Stage verified production and test changes
        run: |
          rm -f .github/explore-fix-test.log
          git add \
            .github/workflows/matrix-analysis.yml \
            .github/explore-fix-test.log \
            services/matrix-api/app/domain/explore_v2.py \
            services/matrix-api/app/worker.py \
            services/matrix-api/tests/test_analysis_version_progress.py \
            services/matrix-api/tests/test_explore_v2_runner.py \
            services/matrix-api/tests/test_scheduled_worker_resume.py \
            services/matrix-api/tests/test_worker.py

      - name: Commit verified fix to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: reject cross-cell over-two longest rules"
          git push origin "HEAD:${{ github.ref_name }}"
