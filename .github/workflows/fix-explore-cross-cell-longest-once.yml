name: Fix Explore cross-cell longest values once

on:
  push:
    branches:
      - fix/explore-v10-cross-cell-longest-20260902

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[explore-cross-cell-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/matrix-api
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/explore-v10-cross-cell-longest-20260902
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/matrix-api/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Write failing cross-cell regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_explore_v2_runner.py")
          source = path.read_text()
          marker = "def test_cross_cell_equal_longest_values_are_grouped_per_scope"
          if marker in source:
              raise SystemExit("regression test already exists")

          source += r'''


def test_cross_cell_equal_longest_values_are_grouped_per_scope(
    monkeypatch: object,
) -> None:
    unit = explore_v2.SourceUnit(
        locked_source_index=0,
        prediction_distance=1,
        lock_key=explore_v2.LockKey("今彩539", explore_v2.SORTED_ORDER, 1, 10),
        occurrence=explore_v2.LockOccurrence(0, "A", 1, 10),
    )
    source_cells = (
        explore_v2.VerificationCell(
            occurrence_index=1,
            period="R1",
            relative_offset=-1,
            position=1,
            number=20,
            scope_class=explore_v2.ScopeClass.STANDARD_AND_FULL,
        ),
        explore_v2.VerificationCell(
            occurrence_index=2,
            period="R2",
            relative_offset=-2,
            position=2,
            number=21,
            scope_class=explore_v2.ScopeClass.STANDARD_AND_FULL,
        ),
        explore_v2.VerificationCell(
            occurrence_index=3,
            period="R3",
            relative_offset=-8,
            position=3,
            number=22,
            scope_class=explore_v2.ScopeClass.FULL_ONLY,
        ),
    )

    class FakeContext:
        lottery = "今彩539"

        def range_cells(
            self,
            _occurrence: object,
            _prediction_distance: int,
        ) -> tuple[explore_v2.VerificationCell, ...]:
            return source_cells

    rule_by_coordinate = {
        (-1, 1): 10,
        (-2, 2): 15,
        (-8, 3): 20,
    }

    def fake_groups_for_cell(
        _bundles: object,
        cell: explore_v2.VerificationCell,
        _road: RoadType,
    ) -> tuple[explore_v2.RoadGroup, ...]:
        rule = rule_by_coordinate[(cell.relative_offset, cell.position)]
        return tuple(
            explore_v2.RoadGroup(
                occurrence=explore_v2.LockOccurrence(
                    draw_index=20 + index,
                    period=f"H{index}",
                    position=1,
                    number=10,
                ),
                reference_cell=cell,
                result_draw_index=19 + index,
                candidate_targets=((rule, (rule,)),),
            )
            for index in range(5)
        )

    appended: list[tuple[str, int, int, tuple[int, ...]]] = []

    def fake_append_final_results(
        _artifact: dict[str, object],
        _context: object,
        _unit: object,
        reference_cell: explore_v2.VerificationCell,
        _road: RoadType,
        _rule_count: int,
        decision: explore_v2.StreakDecision,
        _groups: tuple[explore_v2.RoadGroup, ...],
        explore_range: str,
    ) -> None:
        appended.append(
            (
                explore_range,
                reference_cell.relative_offset,
                reference_cell.position,
                decision.rules,
            )
        )

    monkeypatch.setattr(explore_v2, "_range_bundles", lambda *_args, **_kwargs: ())  # type: ignore[attr-defined]
    monkeypatch.setattr(explore_v2, "_groups_for_cell", fake_groups_for_cell)  # type: ignore[attr-defined]
    monkeypatch.setattr(explore_v2, "_append_final_results", fake_append_final_results)  # type: ignore[attr-defined]

    artifact: dict[str, object] = {"items": [], "validationById": {}}
    metrics = {"scopeDecisions": 0}
    explore_v2._run_explore_v2_unit(
        artifact,
        FakeContext(),  # type: ignore[arg-type]
        unit,
        frozenset({RoadType.ADD}),
        metrics,
        include_tianyan=False,
    )

    assert [entry for entry in appended if entry[0] == "標準範圍"] == [
        ("標準範圍", -1, 1, (10,)),
        ("標準範圍", -2, 2, (15,)),
    ]
    assert [entry for entry in appended if entry[0] == "完整範圍"] == []
'''
          path.write_text(source)
          PY

      - name: Verify regression test is red before production change
        run: |
          set +e
          output="$(uv run pytest -q tests/test_explore_v2_runner.py -k cross_cell_equal_longest_values_are_grouped_per_scope 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Regression test unexpectedly passed before the fix."
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -q "1 failed"; then
            echo "Regression test did not fail in the expected assertion path."
            exit 1
          fi

      - name: Apply minimal production fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/domain/explore_v2.py")
          source = path.read_text()

          evaluate_start = source.index("def _evaluate_groups(")
          range_start = source.index("def _range_bundles(", evaluate_start)
          replacement = '''PendingFinalResult = tuple[
              VerificationCell,
              RoadType,
              int,
              StreakDecision,
              tuple[RoadGroup, ...],
              str,
          ]


          def _evaluate_groups(
              context: ExploreV2Context,
              unit: SourceUnit,
              reference_cell: VerificationCell,
              road: RoadType,
              groups: tuple[RoadGroup, ...],
              explore_range: str,
              metrics: dict[str, int],
              pending_results: list[PendingFinalResult],
          ) -> None:
              candidate_sets = tuple(group.candidates for group in groups)
              for rule_count, evaluator in ((1, evaluate_one_code), (2, evaluate_two_code)):
                  metrics["scopeDecisions"] += 1
                  decision = evaluator(candidate_sets)
                  if not decision.valid:
                      continue
                  pending_results.append(
                      (
                          reference_cell,
                          road,
                          rule_count,
                          decision,
                          groups,
                          explore_range,
                      )
                  )


          def _append_grouped_final_results(
              artifact: dict[str, Any],
              context: ExploreV2Context,
              unit: SourceUnit,
              pending_results: Iterable[PendingFinalResult],
          ) -> None:
              grouped: dict[
                  tuple[str, RoadType, int, int],
                  list[PendingFinalResult],
              ] = {}
              for result in pending_results:
                  _reference_cell, road, rule_count, decision, _groups, explore_range = result
                  key = (
                      explore_range,
                      road,
                      rule_count,
                      decision.highest_streak,
                  )
                  grouped.setdefault(key, []).append(result)

              for results in grouped.values():
                  distinct_longest_values = {
                      rule
                      for _reference_cell, _road, _rule_count, decision, _groups, _range in results
                      for rule in decision.rules
                  }
                  if len(distinct_longest_values) > 2:
                      continue

                  for (
                      reference_cell,
                      road,
                      rule_count,
                      decision,
                      groups,
                      explore_range,
                  ) in results:
                      _append_final_results(
                          artifact,
                          context,
                          unit,
                          reference_cell,
                          road,
                          rule_count,
                          decision,
                          groups,
                          explore_range,
                      )


          '''
          source = source[:evaluate_start] + replacement + source[range_start:]

          run_start = source.index("def _run_explore_v2_unit(")
          metrics_start = source.index("def _context_metrics(", run_start)
          run_replacement = '''def _run_explore_v2_unit(
              artifact: dict[str, Any],
              context: ExploreV2Context,
              unit: SourceUnit,
              road_types: frozenset[RoadType],
              metrics: dict[str, int],
              include_tianyan: bool,
          ) -> None:
              pending_results: list[PendingFinalResult] = []
              range_roads = tuple(road for road in (RoadType.ADD, RoadType.SUM) if road in road_types)
              if range_roads:
                  source_cells = context.range_cells(unit.occurrence, unit.prediction_distance)
                  bundles = _range_bundles(context, unit)
                  for explore_range in EXPLORE_RANGES:
                      for source_cell in source_cells:
                          if (
                              explore_range == "標準範圍"
                              and source_cell.scope_class is ScopeClass.FULL_ONLY
                          ):
                              continue
                          for road in range_roads:
                              groups = _groups_for_cell(bundles, source_cell, road)
                              _evaluate_groups(
                                  context,
                                  unit,
                                  source_cell,
                                  road,
                                  groups,
                                  explore_range,
                                  metrics,
                                  pending_results,
                              )

              if RoadType.DRAG in road_types:
                  source_cell = context.drag_cell(unit.occurrence)
                  groups = _drag_groups(context, unit)
                  for explore_range in EXPLORE_RANGES:
                      _evaluate_groups(
                          context,
                          unit,
                          source_cell,
                          RoadType.DRAG,
                          groups,
                          explore_range,
                          metrics,
                          pending_results,
                      )

              _append_grouped_final_results(
                  artifact,
                  context,
                  unit,
                  pending_results,
              )
              if include_tianyan:
                  _append_tianyan_results(artifact, context, unit)


          '''
          source = source[:run_start] + run_replacement + source[metrics_start:]
          path.write_text(source)
          PY

      - name: Verify targeted regression and Matrix API suite
        run: |
          uv run pytest -q tests/test_explore_v2_runner.py -k cross_cell_equal_longest_values_are_grouped_per_scope
          uv run pytest -q
          git diff --check

      - name: Commit verified fix to branch
        working-directory: .
        run: |
          rm -f .github/workflows/fix-explore-cross-cell-longest-once.yml
          git add services/matrix-api/app/domain/explore_v2.py services/matrix-api/tests/test_explore_v2_runner.py .github/workflows/fix-explore-cross-cell-longest-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[explore-cross-cell-complete] fix(matrix-api): reject cross-cell over-two longest values"
          git push origin HEAD:fix/explore-v10-cross-cell-longest-20260902
