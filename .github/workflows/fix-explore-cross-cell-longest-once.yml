name: Fix Explore cross-cell longest rules once

on:
  push:
    branches:
      - fix/explore-cross-cell-longest-v11

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/matrix-api/uv.lock

      - name: Install Matrix API dependencies
        working-directory: services/matrix-api
        run: uv sync --frozen

      - name: Write regression tests
        run: python .github/scripts/one_off_fix_explore_cross_cell.py write-tests

      - name: Verify RED before the fix
        working-directory: services/matrix-api
        shell: bash
        run: |
          set +e
          uv run pytest -q tests/test_explore_v2_runner.py -k cross_reference
          status=$?
          set -e
          test "$status" -ne 0

      - name: Apply minimal aggregation fix and bump v11
        run: python .github/scripts/one_off_fix_explore_cross_cell.py apply-fix

      - name: Verify GREEN and full Matrix API suite
        working-directory: services/matrix-api
        shell: bash
        run: |
          uv run pytest -q tests/test_explore_v2_runner.py -k cross_reference
          uv run pytest -q
          uv run python -m compileall -q app
          git diff --check

      - name: Remove one-off automation
        run: |
          rm .github/scripts/one_off_fix_explore_cross_cell.py
          rm .github/workflows/fix-explore-cross-cell-longest-once.yml

      - name: Commit verified fix to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reject cross-cell over-two longest rules"
          git push origin "HEAD:${{ github.ref_name }}"
