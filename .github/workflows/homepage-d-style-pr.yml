name: Homepage D black-gold PR runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-homepage-d:
    if: github.head_ref == 'homepage-d-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: RED - define D black-gold homepage contract
        shell: bash
        run: |
          cat > tests/homepage-visual-hierarchy.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const css = readFileSync(new URL('../src/homepage-repair.css', import.meta.url), 'utf8');
          const prototype = readFileSync(new URL('../src/Prototype.tsx', import.meta.url), 'utf8');

          test('lottery switcher uses official logos inside one black-gold card language', () => {
            assert.match(prototype, /className="lottery-card-logo"\s+src=\{lottery\.logo\}/);
            assert.match(css, /\.home-screen \.lottery-switcher > \.lottery-switcher-hit-grid > \.lottery-card\s*\{[\s\S]*?background:\s*linear-gradient/);
            assert.doesNotMatch(css, /\.home-screen \.lottery-switcher > \.lottery-switcher-hit-grid > \.lottery-card\s*\{[\s\S]*?Matrixbba\.png/);
            assert.match(css, /\.home-screen \.lottery-card-logo\s*\{[\s\S]*?object-fit:\s*contain/);
          });

          test('Matrix status keeps color while the outer card skeleton is black-gold', () => {
            assert.match(css, /\.home-screen \.matrix-status-section\s*\{[\s\S]*?border:\s*1px solid rgba\(118, 84, 43, \.92\)/);
            assert.match(css, /\.home-screen \.matrix-status-section > \.home-asset-image[\s\S]*?filter:\s*brightness\(\.9\) saturate\(1\.04\)/);
            assert.match(css, /\.home-screen \.matrix-status-hit-grid > button\s*\{[\s\S]*?border:\s*1px solid rgba\(118, 84, 43, \.72\)/);
          });

          test('draw card, five functions and bottom navigation share the black-gold skeleton', () => {
            assert.match(css, /\.home-screen \.latest-draw-card\s*\{[\s\S]*?border:\s*1px solid rgba\(118, 84, 43, \.92\)/);
            assert.match(css, /\.home-screen \.home-shortcut\s*\{[\s\S]*?border:\s*1px solid rgba\(118, 84, 43, \.9\)/);
            assert.match(css, /\.home-screen \.bottom-navigation\s*\{[\s\S]*?background:\s*#02070c/);
            assert.match(css, /\.home-screen \.bottom-navigation-item\[data-selected="true"\][\s\S]*?radial-gradient/);
          });

          test('Matrix Core stays the strongest existing gold focal point without forced overrides', () => {
            assert.match(css, /\.home-screen \.matrix-core-banner[\s\S]*?animation:\s*matrix-core-pulse 8s ease-in-out infinite/);
            assert.doesNotMatch(css, /!important/);
          });
          EOF

          set +e
          node --test tests/homepage-visual-hierarchy.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'RED test unexpectedly passed before D style implementation.'
            exit 1
          fi
          echo 'RED confirmed.'

      - name: GREEN - apply D style through formal sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-homepage-d.py')
          source = path.read_text()
          old = """    (\n        '''  min-width: 0;\\n  padding: 0;\\n  border: 0;\\n  background: transparent;''',\n        '''  min-width: 0;\\n  margin: 2px 1px;\\n  padding: 0;\\n  border: 1px solid rgba(118, 84, 43, .72);\\n  border-radius: 8px;\\n  background: rgba(2, 7, 12, .08);\\n  box-shadow: inset 0 0 8px rgba(196, 145, 69, .035);''',\n    ),"""
          new = """    (\n        '''.home-screen .matrix-status-hit-grid > button {\\n  appearance: none;\\n  min-width: 0;\\n  padding: 0;\\n  border: 0;\\n  background: transparent;\\n}''',\n        '''.home-screen .matrix-status-hit-grid > button {\\n  appearance: none;\\n  min-width: 0;\\n  margin: 2px 1px;\\n  padding: 0;\\n  border: 1px solid rgba(118, 84, 43, .72);\\n  border-radius: 8px;\\n  background: rgba(2, 7, 12, .08);\\n  box-shadow: inset 0 0 8px rgba(196, 145, 69, .035);\\n}''',\n    ),"""
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected one temporary patch source, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY
          python scripts/apply-homepage-d.py

      - name: Verify targeted, full tests and build
        run: |
          node --test tests/homepage-visual-hierarchy.test.mjs
          node --test tests/*.test.mjs
          npm run build

      - name: Commit verified D style to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/homepage-d-style-pr.yml scripts/apply-homepage-d.py
          git add -- src/Prototype.tsx src/homepage-repair.css tests/homepage-visual-hierarchy.test.mjs
          git commit -m 'Apply homepage D black-gold visual language'
          git push origin main
