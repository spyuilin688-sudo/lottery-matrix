name: Matrix Explore recent history layout one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/matrix-explore-history-layout-one-shot.yml'

permissions:
  contents: write

jobs:
  update-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write updated recent-history regression test
        shell: bash
        run: |
          cat > tests/recent-history-layout.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";

          const css = readFileSync(new URL("../src/feature-pages.css", import.meta.url), "utf8");
          const exploreCss = readFileSync(new URL("../src/matrix-explore-spacing.css", import.meta.url), "utf8");
          const ballCss = readFileSync(new URL("../src/number-ball.css", import.meta.url), "utf8");
          const source = readFileSync(new URL("../src/FeaturePages.tsx", import.meta.url), "utf8");

          test("Matrix Explore 近10期標題列單列顯示排序文字並取消舊固定高度", () => {
            assert.match(exploreCss, /\.matrix-explore-main-screen \.history-panel-title\s*\{[^}]*display:\s*flex;[^}]*align-items:\s*center;/s);
            assert.match(exploreCss, /\.matrix-explore-main-screen \.history-panel-order\s*\{[^}]*display:\s*inline;[^}]*white-space:\s*nowrap;/s);
            assert.match(exploreCss, /\.matrix-explore-main-screen \.history-panel \.panel-heading\s*\{[^}]*height:\s*auto;[^}]*min-height:\s*32px;[^}]*align-items:\s*center;/s);
            assert.match(source, /<SectionTitle>近10期開獎號碼<\/SectionTitle>[\s\S]*?<span className="history-panel-order">（\{numberOrder\}）<\/span>/);
          });

          test("Matrix Explore 近10期三欄採期數窄日期中等號碼最大寬度", () => {
            assert.match(exploreCss, /grid-template-columns:\s*minmax\(54px, \.9fr\) minmax\(62px, 1\.05fr\) minmax\(0, 3\.25fr\);/);
            assert.match(exploreCss, /\.matrix-explore-main-screen \.history-row,[\s\S]*?min-height:\s*34px;[\s\S]*?padding:\s*\.0625rem 0;/);
            assert.match(exploreCss, /\.matrix-explore-main-screen \.history-row > :nth-child\(1\)\s*\{[^}]*white-space:\s*nowrap;/s);
          });

          test("Matrix Explore 近10期六加一使用主號彈性區與特別號內容寬度且移除 320px 補償規則", () => {
            assert.match(exploreCss, /\.matrix-explore-main-screen \.history-main-numbers\s*\{[^}]*flex:\s*1 1 auto;[^}]*flex-wrap:\s*nowrap;/s);
            assert.match(exploreCss, /\.matrix-explore-main-screen \.history-special-number\s*\{[^}]*flex:\s*0 0 auto;[^}]*white-space:\s*nowrap;/s);
            assert.doesNotMatch(exploreCss, /@media \(max-width:\s*359\.98px\)[\s\S]*?history-special-(?:number|ball|label)/);
            assert.match(source, /className="history-special-number"[\s\S]*?<span aria-hidden="true">\+<\/span>[\s\S]*?className="history-special-label">特別號<\/small>/);
          });

          test("Matrix Explore 近10期彩球使用 20 至 22px 流體尺寸", () => {
            assert.match(ballCss, /\.matrix-explore-main-screen \.history-panel \.number-ball-component\.history-lottery-ball\s*\{[^}]*--number-ball-size:\s*clamp\(20px, 6vw, 22px\);[^}]*--number-font-size:\s*clamp\(10px, 2\.8vw, 11px\);/s);
          });

          test("Matrix Explore 近10期正式樣式來源不使用禁止的補償方式", () => {
            const start = exploreCss.indexOf(".matrix-explore-main-screen .history-panel-title");
            const end = exploreCss.indexOf(".matrix-explore-main-screen .repeat-stats-heading");
            const historyLayout = exploreCss.slice(start, end);
            assert.ok(start >= 0 && end > start);
            assert.doesNotMatch(historyLayout, /!important|zoom\s*:|scale\(|margin(?:-[a-z]+)?\s*:\s*-|position\s*:\s*absolute/);
          });

          test("近10期資料列依彩種日期標記跨週分隔線", () => {
            assert.match(source, /data-week-boundary=\{isNearHistoryWeekBoundary\(lottery, previousDate, date\)\}/);
            assert.match(css, /\.history-panel \.history-row\[data-week-boundary="true"\]\s*\{[^}]*border-top:\s*2px solid rgba\(166, 124, 54, \.68\)/s);
          });
          EOF

      - name: RED - verify the new contract fails before implementation
        shell: bash
        run: |
          set +e
          node --test tests/recent-history-layout.test.mjs > /tmp/recent-history-red.log 2>&1
          status=$?
          set -e
          cat /tmp/recent-history-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the new layout contract to fail before implementation.'
            exit 1
          fi
          echo 'RED confirmed: current layout does not satisfy the new contract.'

      - name: Update the single active Matrix Explore history layout source
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/matrix-explore-spacing.css')
          text = path.read_text()

          old_group = '''.matrix-explore-main-screen .explore-settings,
          .matrix-explore-main-screen .hit-advanced-panel,
          .matrix-explore-main-screen .history-panel,
          .matrix-explore-main-screen .repeat-stats-panel,
          .matrix-explore-main-screen .result-panel {
            box-sizing: border-box;
            display: flex;
            width: 100%;
            min-width: 0;
            height: auto;
            margin: 0;
            padding: .5rem;
            flex-direction: column;
            gap: 0;
            border-radius: .75rem;
          }
          '''
          new_group = '''.matrix-explore-main-screen .explore-settings,
          .matrix-explore-main-screen .hit-advanced-panel,
          .matrix-explore-main-screen .repeat-stats-panel,
          .matrix-explore-main-screen .result-panel {
            box-sizing: border-box;
            display: flex;
            width: 100%;
            min-width: 0;
            height: auto;
            margin: 0;
            padding: .5rem;
            flex-direction: column;
            gap: 0;
            border-radius: .75rem;
          }

          .matrix-explore-main-screen .history-panel {
            box-sizing: border-box;
            display: flex;
            width: 100%;
            min-width: 0;
            height: auto;
            margin: 0;
            padding: 0;
            flex-direction: column;
            gap: 0;
            border-radius: .75rem;
          }
          '''
          if text.count(old_group) != 1:
              raise SystemExit('Expected exactly one shared panel layout block.')
          text = text.replace(old_group, new_group)

          start_marker = '.matrix-explore-main-screen .history-panel-order {'
          end_marker = '.matrix-explore-main-screen .repeat-stats-heading {'
          start = text.index(start_marker)
          end = text.index(end_marker)
          history_block = '''.matrix-explore-main-screen .history-panel-title {
            display: flex;
            min-width: 0;
            flex: 1 1 auto;
            align-items: center;
            gap: 0;
            white-space: nowrap;
          }

          .matrix-explore-main-screen .history-panel-title .section-title {
            min-width: 0;
            flex: 0 0 auto;
            gap: .25rem;
            font-size: clamp(.625rem, 3vw, .75rem);
            line-height: 1;
            white-space: nowrap;
          }

          .matrix-explore-main-screen .history-panel-title .section-title > span {
            width: .25rem;
            height: 1rem;
            flex: 0 0 .25rem;
          }

          .matrix-explore-main-screen .history-panel-order {
            display: inline;
            min-width: 0;
            margin-left: 0;
            overflow: visible;
            color: #c6c0b8;
            font-size: clamp(.5rem, 2.4vw, .625rem);
            font-weight: 500;
            line-height: 1;
            white-space: nowrap;
          }

          .matrix-explore-main-screen .history-panel .panel-heading {
            display: flex;
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
            height: auto;
            min-height: 32px;
            margin: 0;
            padding: .1875rem .375rem;
            align-items: center;
            justify-content: space-between;
            gap: .25rem;
            border-bottom: 1px solid rgba(195, 145, 54, .58);
          }

          .matrix-explore-main-screen .history-panel .panel-heading > button:last-child {
            min-width: 0;
            flex: 0 0 auto;
            gap: .125rem;
            font-size: clamp(.5625rem, 2.6vw, .6875rem);
            line-height: 1;
            white-space: nowrap;
          }

          .matrix-explore-main-screen .history-panel .panel-heading > button:last-child svg {
            width: .625rem;
            height: .625rem;
            flex: 0 0 .625rem;
          }

          .matrix-explore-main-screen .history-table {
            width: 100%;
            min-width: 0;
            margin: 0;
            padding: 0;
            overflow: hidden;
          }

          .matrix-explore-main-screen .history-row,
          .matrix-explore-main-screen .history-row.history-head,
          .matrix-explore-main-screen .history-row:not(.history-head) {
            display: grid;
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
            height: auto;
            min-height: 34px;
            padding: .0625rem 0;
            grid-template-columns: minmax(54px, .9fr) minmax(62px, 1.05fr) minmax(0, 3.25fr);
            align-items: center;
            gap: 0;
            border-top: 0;
            border-bottom: 1px solid rgba(90, 87, 80, .72);
          }

          .matrix-explore-main-screen .history-row.history-head {
            min-height: 26px;
            padding: 0;
            color: #d2a52a;
            font-size: clamp(.625rem, 2.8vw, .75rem);
            font-weight: 700;
          }

          .matrix-explore-main-screen .history-row > :nth-child(1),
          .matrix-explore-main-screen .history-row > :nth-child(2),
          .matrix-explore-main-screen .history-row > :nth-child(3) {
            grid-column: auto;
            min-width: 0;
          }

          .matrix-explore-main-screen .history-row > span,
          .matrix-explore-main-screen .history-row > span + span,
          .matrix-explore-main-screen .history-row:not(.history-head) > span:first-child,
          .matrix-explore-main-screen .history-row:not(.history-head) > span:nth-child(2) {
            min-width: 0;
            padding: 0;
            border-left: 0;
          }

          .matrix-explore-main-screen .history-row > :nth-child(1),
          .matrix-explore-main-screen .history-row > :nth-child(2) {
            border-right: 1px solid rgba(90, 87, 80, .55);
          }

          .matrix-explore-main-screen .history-row > :nth-child(1) {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: clamp(.625rem, 2.8vw, .75rem);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            white-space: nowrap;
          }

          .matrix-explore-main-screen .history-row > :nth-child(2) {
            overflow: hidden;
            font-size: clamp(.5625rem, 2.5vw, .6875rem);
          }

          .matrix-explore-main-screen .history-date-stack {
            display: flex;
            width: 100%;
            min-width: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            white-space: nowrap;
          }

          .matrix-explore-main-screen .history-date-stack strong {
            font-size: clamp(.625rem, 2.7vw, .6875rem);
            line-height: 1.05;
          }

          .matrix-explore-main-screen .history-date-stack small {
            margin-top: 0;
            font-size: clamp(.5625rem, 2.4vw, .625rem);
            line-height: 1.05;
            white-space: nowrap;
          }

          .matrix-explore-main-screen .history-numbers,
          .matrix-explore-main-screen .history-main-numbers,
          .matrix-explore-main-screen .history-special-number {
            display: flex;
            min-width: 0;
            flex-wrap: nowrap;
            align-items: center;
          }

          .matrix-explore-main-screen .history-numbers {
            width: 100%;
            gap: .125rem;
            justify-content: center;
            overflow: hidden;
          }

          .matrix-explore-main-screen .history-main-numbers {
            min-width: 0;
            flex: 1 1 auto;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: center;
            gap: clamp(.0625rem, .45vw, .125rem);
          }

          .matrix-explore-main-screen .history-special-number {
            height: auto;
            margin-left: .125rem;
            flex: 0 0 auto;
            gap: .125rem;
            justify-content: center;
            color: #d4a63b;
            white-space: nowrap;
          }

          .matrix-explore-main-screen .history-special-number > span:first-child {
            width: .5rem;
            height: 22px;
            flex: 0 0 .5rem;
            font-size: .6875rem;
          }

          .matrix-explore-main-screen .history-special-ball {
            display: grid;
            height: auto;
            flex: 0 0 auto;
            grid-template-rows: auto auto;
            row-gap: 0;
            place-items: center;
          }

          .matrix-explore-main-screen .history-special-label {
            margin: 0;
            font-size: clamp(.40625rem, 1.8vw, .5rem);
            line-height: 1;
            white-space: nowrap;
          }

          .matrix-explore-main-screen .history-panel .history-numbers[data-has-special="true"] .history-main-numbers {
            padding-top: 0;
          }

          '''
          text = text[:start] + history_block + text[end:]

          media_start = text.index('@media (max-width: 359.98px) {')
          media_end = text.index('@media (min-width: 40rem) {')
          compact_media = '''@media (max-width: 359.98px) {
            .matrix-explore-main-screen .result-title {
              gap: .25rem;
            }

            .matrix-explore-main-screen .result-title .section-title {
              font-size: .9375rem;
            }

            .matrix-explore-main-screen .result-title .result-count {
              font-size: .6875rem;
            }
          }

          '''
          text = text[:media_start] + compact_media + text[media_end:]

          old_wide = '''@media (min-width: 40rem) {
            .matrix-explore-main-screen .hit-advanced-panel,
            .matrix-explore-main-screen .history-panel,
            .matrix-explore-main-screen .repeat-stats-panel,
            .matrix-explore-main-screen .result-panel {
              padding: 1rem;
            }
          '''
          new_wide = '''@media (min-width: 40rem) {
            .matrix-explore-main-screen .hit-advanced-panel,
            .matrix-explore-main-screen .repeat-stats-panel,
            .matrix-explore-main-screen .result-panel {
              padding: 1rem;
            }
          '''
          if text.count(old_wide) != 1:
              raise SystemExit('Expected exactly one wide panel padding block.')
          text = text.replace(old_wide, new_wide)

          path.write_text(text)

          ball_path = Path('src/number-ball.css')
          ball_text = ball_path.read_text()
          old_ball = '''.matrix-explore-main-screen .history-panel .number-ball-component.history-lottery-ball {
            --number-ball-size: clamp(18px, 5.2vw, 20px);
            --number-font-size: clamp(9px, 2.4vw, 10px);
            --underline-width: clamp(8px, 2.4vw, 9px);
          }
          '''
          new_ball = '''.matrix-explore-main-screen .history-panel .number-ball-component.history-lottery-ball {
            --number-ball-size: clamp(20px, 6vw, 22px);
            --number-font-size: clamp(10px, 2.8vw, 11px);
            --underline-width: clamp(9px, 2.6vw, 10px);
          }
          '''
          if ball_text.count(old_ball) != 1:
              raise SystemExit('Expected exactly one Matrix Explore history ball size block.')
          ball_path.write_text(ball_text.replace(old_ball, new_ball))
          PY

      - name: GREEN - targeted recent-history test
        run: node --test tests/recent-history-layout.test.mjs

      - name: Full tests
        run: node --test tests/*.test.mjs

      - name: Build
        run: npm run build

      - name: Install Chromium for responsive layout verification
        run: npx playwright install --with-deps chromium

      - name: Verify 320px 360px 390px table layout in Chromium
        shell: bash
        run: |
          cat > history-layout-fixture.html <<'EOF'
          <!doctype html>
          <html lang="zh-Hant">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <link rel="stylesheet" href="/src/feature-pages.css" />
            <link rel="stylesheet" href="/src/number-ball.css" />
            <link rel="stylesheet" href="/src/matrix-explore-spacing.css" />
            <style>html,body{margin:0;background:#02070c}.matrix-explore-main-screen{width:100%;min-height:100vh}.matrix-explore-main-screen .feature-body{padding-top:8px}.fixture-list{display:grid;gap:8px}</style>
          </head>
          <body>
            <main class="matrix-explore-main-screen">
              <div class="feature-body"><div id="fixtures" class="fixture-list"></div></div>
            </main>
            <script>
              const configs = [
                ['今彩539', 5, false], ['天天樂', 5, false], ['六合彩', 6, true], ['大樂透', 6, true]
              ];
              const ball = (lottery, n, special = false) => `<span class="number-ball-component number-ball history-lottery-ball" data-lottery="${lottery}" data-special="${special}"><span class="number-ball-value">${String(n).padStart(2,'0')}</span></span>`;
              document.querySelector('#fixtures').innerHTML = configs.map(([lottery, count, special]) => {
                const main = Array.from({length: count}, (_, i) => ball(lottery, i + 1)).join('');
                const specialHtml = special ? `<span class="history-special-number"><span aria-hidden="true">+</span><span class="history-special-ball"><small class="history-special-label">特別號</small>${ball(lottery, 7, true)}</span></span>` : '';
                return `<section class="panel history-panel" data-test-lottery="${lottery}" data-lottery="${lottery}"><header class="panel-heading"><div class="history-panel-title"><h2 class="section-title"><span></span>近10期開獎號碼</h2><span class="history-panel-order">（依號碼由小到大排序）</span></div><button type="button">查看更多紀錄 <svg viewBox="0 0 12 12"></svg></button></header><div class="history-table"><div class="history-row history-head"><span>期數</span><span>日期</span><span>開獎號碼</span></div><div class="history-row"><span>114201</span><span><span class="history-date-stack"><strong>2026</strong><small>08/20 (四)</small></span></span><span class="history-numbers" data-has-special="${special}"><span class="history-main-numbers">${main}</span>${specialHtml}</span></div></div></section>`;
              }).join('');
            </script>
          </body>
          </html>
          EOF

          cat > /tmp/verify-history-layout.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          for (const width of [320, 360, 390]) {
            await page.setViewportSize({width, height:1200});
            await page.goto('http://127.0.0.1:4173/history-layout-fixture.html');
            const metrics = await page.evaluate(() => [...document.querySelectorAll('.history-panel')].map(panel => {
              const row = panel.querySelector('.history-row:not(.history-head)');
              const cells = [...row.children].map(el => el.getBoundingClientRect());
              const headerLeft = panel.querySelector('.history-panel-title').getBoundingClientRect();
              const headerRight = panel.querySelector('.panel-heading > button:last-child').getBoundingClientRect();
              const balls = [...row.querySelectorAll('.history-main-numbers .number-ball-component')].map(el => el.getBoundingClientRect());
              const special = row.querySelector('.history-special-number')?.getBoundingClientRect() ?? null;
              const numbers = row.querySelector('.history-numbers').getBoundingClientRect();
              const issueStyle = getComputedStyle(row.children[0]);
              return {
                lottery: panel.dataset.testLottery,
                cells: cells.map(r => ({left:r.left,right:r.right,width:r.width,top:r.top,bottom:r.bottom,height:r.height})),
                headerLeft: {left:headerLeft.left,right:headerLeft.right,top:headerLeft.top,bottom:headerLeft.bottom},
                headerRight: {left:headerRight.left,right:headerRight.right,top:headerRight.top,bottom:headerRight.bottom},
                balls: balls.map(r => ({left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height})),
                special: special && {left:special.left,right:special.right,top:special.top,bottom:special.bottom},
                numbers: {left:numbers.left,right:numbers.right,top:numbers.top,bottom:numbers.bottom},
                rowHeight: row.getBoundingClientRect().height,
                issueWhiteSpace: issueStyle.whiteSpace,
                scrollWidth: document.documentElement.scrollWidth,
                viewportWidth: innerWidth
              };
            }));
            for (const item of metrics) {
              assert.ok(item.cells[0].width < item.cells[1].width, `${width}px ${item.lottery}: issue column must be narrower than date`);
              assert.ok(item.cells[1].width < item.cells[2].width, `${width}px ${item.lottery}: number column must be widest`);
              assert.equal(item.issueWhiteSpace, 'nowrap', `${width}px ${item.lottery}: issue must not wrap`);
              assert.ok(item.headerLeft.right <= item.headerRight.left + 0.5, `${width}px ${item.lottery}: title and action collide`);
              assert.ok(item.rowHeight <= 36, `${width}px ${item.lottery}: row too tall (${item.rowHeight})`);
              assert.ok(item.scrollWidth <= item.viewportWidth, `${width}px ${item.lottery}: horizontal overflow`);
              const tops = item.balls.map(ball => Math.round(ball.top * 10) / 10);
              assert.ok(Math.max(...tops) - Math.min(...tops) <= 0.5, `${width}px ${item.lottery}: main balls wrapped`);
              assert.ok(item.balls.every(ball => ball.left >= item.numbers.left - 0.5 && ball.right <= item.numbers.right + 0.5), `${width}px ${item.lottery}: main balls overflow number cell`);
              if (item.special) {
                assert.ok(item.special.left >= item.numbers.left - 0.5 && item.special.right <= item.numbers.right + 0.5, `${width}px ${item.lottery}: special number overflow`);
                assert.ok(item.special.top < item.numbers.bottom && item.special.bottom > item.numbers.top, `${width}px ${item.lottery}: special number dropped out of row`);
              }
            }
            console.log(`${width}px verified for 今彩539、天天樂、六合彩、大樂透`);
          }
          await browser.close();
          EOF

          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/matrix-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill $vite_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/history-layout-fixture.html >/dev/null; then break; fi
            sleep 1
          done
          node /tmp/verify-history-layout.mjs
          kill $vite_pid 2>/dev/null || true
          trap - EXIT
          rm -f history-layout-fixture.html /tmp/verify-history-layout.mjs

      - name: Verify diff and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/matrix-explore-history-layout-one-shot.yml
          git diff --check
          git status --short
          git diff -- src/matrix-explore-spacing.css src/number-ball.css tests/recent-history-layout.test.mjs

      - name: Commit verified layout update to main
        shell: bash
