name: Apply integrated title specification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-integrated-title-spec.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply confirmed specification
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply.py
          python /tmp/apply.py
      - name: Verify source diff
        run: |
          git diff --check
          git diff -- src/FeaturePages.tsx src/homepage-repair.css
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FeaturePages.tsx src/homepage-repair.css
          git diff --cached --check
          git commit -m "style: apply latest switcher specification"
          git push origin HEAD:main
