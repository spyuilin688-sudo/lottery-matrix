name: Apply integrated title specification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-integrated-title-spec.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply confirmed specification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label):
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return new_text

          feature_path = Path("src/FeaturePages.tsx")
          feature = feature_path.read_text()
          feature = replace_once(
              feature,
              '<LotterySwitcher selected={lottery} onChange={setLottery} className="matrix-status-lottery-switcher" independentCards />',
              '<LotterySwitcher selected={lottery} onChange={setLottery} className="matrix-status-lottery-switcher" />',
              "Matrix status switcher",
          )
          feature_path.write_text(feature)

          css_path = Path("src/homepage-repair.css")
          css = css_path.read_text()
          css = replace_once(
              css,
              '''.home-screen .lottery-switcher {
  --lottery-switcher-height: calc(((min(100vw, 390px) - 18px) / 4) * .74);
  position: relative;
  display: block;
  flex: 0 0 var(--lottery-switcher-height);
  width: 100%;
  height: var(--lottery-switcher-height);
  padding: 0;
  overflow: visible;
}''',
              '''.home-screen .lottery-switcher {
  --lottery-switcher-height: calc(((min(100vw, 390px) - 18px) / 4) * .74);
  position: relative;
  display: block;
  flex: 0 0 var(--lottery-switcher-height);
  width: calc(100% - 24px);
  height: var(--lottery-switcher-height);
  margin: 0 12px 8px;
  padding: 0;
  overflow: visible;
}''',
              "lottery switcher layout",
          )
          css = regex_once(
              css,
              r'\.home-screen \.lottery-switcher\[data-independent-cards="true"\] > \.home-asset-image \{.*?\}\n\n',
              '',
              "obsolete independent artwork rule",
          )
          css = regex_once(
              css,
              r'(\.home-screen \.lottery-switcher > \.lottery-switcher-hit-grid > \.lottery-card \{.*?border-radius: 8px;)\n  background:.*?\n  color: transparent;\n  box-shadow:.*?;\n(  overflow: hidden;)',
              r'\1\n  background: transparent;\n  color: transparent;\n  box-shadow: none;\n\2',
              "switcher hit area visuals",
          )
          css = regex_once(
              css,
              r'\.home-screen \.lottery-switcher > \.lottery-switcher-hit-grid > \.lottery-card::before \{.*?(?=\n\n\.home-screen \.lottery-switcher > \.lottery-switcher-hit-grid > \.lottery-card::after)',
              '',
              "obsolete reconstructed switcher cards",
          )
          css = regex_once(
              css,
              r'\.home-screen \.lottery-switcher > \.lottery-switcher-hit-grid > \.lottery-card\[data-selected="true"\] \{.*?\n\}',
              '''.home-screen .lottery-switcher > .lottery-switcher-hit-grid > .lottery-card[data-selected="true"] {
  background:
    linear-gradient(transparent, transparent) padding-box,
    var(--lottery-selected-gradient) border-box;
  box-shadow: 0 0 7px rgba(255, 206, 105, .28);
}''',
              "selected outline",
          )
          gradients = {
              "今彩539": "linear-gradient(135deg, #34c759, #ffd640, #3484ff, #ff3b30)",
              "天天樂": "linear-gradient(135deg, #1e76ff, #ffffff, #1e76ff)",
              "六合彩": "linear-gradient(135deg, #ff3b30, #1e76ff, #34c759)",
              "大樂透": "linear-gradient(135deg, #ffd640, #1e76ff, #ffd640)",
          }
          for lottery, gradient in gradients.items():
              css = regex_once(
                  css,
                  rf'\.home-screen \.lottery-card\[data-selected="true"\]\[data-lottery="{lottery}"\] \{{.*?\n\}}',
                  f'.home-screen .lottery-card[data-selected="true"][data-lottery="{lottery}"] {{\n  --lottery-selected-gradient: {gradient};\n}}',
                  f"selected {lottery}",
              )
          css_path.write_text(css)

          test_path = Path("tests/page-title-card.test.mjs")
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              'const styles = readFileSync(new URL("../src/feature-pages.css", import.meta.url), "utf8");',
              'const styles = readFileSync(new URL("../src/feature-pages.css", import.meta.url), "utf8");\nconst brandHeaderStyles = readFileSync(new URL("../src/brand-header-unify.css", import.meta.url), "utf8");\nconst homepageStyles = readFileSync(new URL("../src/homepage-repair.css", import.meta.url), "utf8");',
              "test style sources",
          )
          tests = regex_once(
              tests,
              r'test\("the nine named feature pages use the uploaded title artwork", \(\) => \{.*?\n\}\);',
              '''test("the confirmed feature pages use the latest integrated title artwork", () => {
  const expectedArtwork = [
    ["Matrix 探索", "探索標題K.png"],
    ["Matrix 天衍", "天衍標題K.png"],
    ["Matrix 天工", "天工標題K.png"],
    ["Matrix 指南", "指南標題K.png"],
    ["Matrix 同星", "同星標題K.png"],
    ["Matrix 牌單", "牌單標題K.png"],
    ["Matrix 狀態", "狀態標題K.png"],
    ["Matrix 筆記本", "筆記本標題K.png"],
    ["號碼對照單", "對照單標題K.png"],
    ["歷史開獎號碼", "歷史開獎標題K.png"],
    ["連碰計算機", "連碰標題K.png"],
    ["立柱計算機", "立柱標題K.png"],
    ["Matrix Pro 方案與收費標準", "會員方案標題K.png"],
    ["Matrix 自訂觸發狀態", "自訂觸發標題K.png"],
  ];

  for (const [title, file] of expectedArtwork) {
    assert.match(featurePages, new RegExp(`"${title}": "/assets/lottery/functions/${file.replace(".", "\\\\.")}"`));
  }
});''',
              "latest artwork test",
          )
          tests = regex_once(
              tests,
              r'test\("uploaded title artwork sits eight pixels below the logo with four-pixel side margins and no cropping", \(\) => \{.*?\n\}\);',
              '''test("integrated title artwork uses twelve-pixel side margins and eight-pixel vertical spacing", () => {
  assert.match(styles, /\\.matrix-title-banner\\s*\\{[^}]*width:\\s*calc\\(100% - 24px\\)[^}]*margin:\\s*0 auto/s);
  assert.match(styles, /\\.matrix-title-banner\\s*>\\s*img\\s*\\{[^}]*width:\\s*100%[^}]*height:\\s*auto[^}]*object-fit:\\s*contain/s);
  assert.match(styles, /\\.integrated-title-back\\s*\\{[^}]*width:\\s*44px[^}]*height:\\s*44px[^}]*background:\\s*transparent/s);
  assert.match(brandHeaderStyles, /\\.feature-brand-header\\.integrated-title-header\\s*\\{[^}]*margin-bottom:\\s*8px[^}]*padding-top:\\s*8px/s);
});''',
              "integrated layout test",
          )
          tests = regex_once(
              tests,
              r'test\("Matrix pages use the three uploaded PNG icons in one page switcher", \(\) => \{.*?\n\}\);',
              '''test("Matrix explore title owns Tianyan and Tiangong controls", () => {
  const start = featurePages.indexOf("function MatrixPageSwitcher");
  const end = featurePages.indexOf("const ROAD_VALIDATION_SAMPLE_HISTORY", start);
  const switcher = featurePages.slice(start, end);
  assert.match(switcher, /Matrix天衍\\.png/);
  assert.match(switcher, /Matrix天工\\.png/);
  assert.doesNotMatch(switcher, /Matrix探索\\.png/);
  assert.match(featurePages, /headerAction=\\{title === "Matrix 探索" \\? <MatrixPageSwitcher/);
});''',
              "explore header controls test",
          )
          marker = 'test("history filter keeps issue date order range reset and submit controls", () => {'
          switcher_test = '''test("home and Matrix status use the shared Matrixbba switcher with selected outline only", () => {
  assert.match(featurePages, /className="matrix-status-lottery-switcher" \\/>/);
  assert.doesNotMatch(featurePages, /className="matrix-status-lottery-switcher" independentCards/);
  assert.match(homepageStyles, /\\.home-screen \\.lottery-switcher\\s*\\{[^}]*width:\\s*calc\\(100% - 24px\\)[^}]*margin:\\s*0 12px 8px/s);
  assert.doesNotMatch(homepageStyles, /lottery-switcher\\[data-independent-cards="true"\\][^{]*home-asset-image[^}]*display:\\s*none/s);
});

'''
          if switcher_test.strip() not in tests:
              tests = replace_once(tests, marker, switcher_test + marker, "switcher test insertion")
          test_path.write_text(tests)
          PY
      - name: Verify focused tests
        run: node --test tests/page-title-card.test.mjs tests/number-reference-title-actions.test.mjs
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FeaturePages.tsx src/homepage-repair.css tests/page-title-card.test.mjs
          git diff --cached --check
          git commit -m "style: apply latest integrated title and switcher spec"
          git push origin HEAD:main
