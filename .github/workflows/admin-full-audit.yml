name: Admin Full Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - '.github/workflows/admin-full-audit.yml'

permissions:
  contents: read

jobs:
  admin-full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/admin/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install admin dependencies
        working-directory: apps/admin
        run: npm ci

      - name: Run all admin backend tests
        run: npx vitest run --config vitest.config.ts apps/admin/backend

      - name: Run all admin frontend tests
        working-directory: apps/admin
        run: npm test

      - name: Build admin AppDeploy target
        working-directory: apps/admin
        run: APPDEPLOY_CI_EXTERNALS=true npm run build

      - name: Build admin Cloudflare Pages target
        working-directory: apps/admin
        run: npm run build:pages
