name: One-time calculator CSS cleanup

on:
  push:
    branches:
      - "連碰立柱計算機"
    paths:
      - ".github/workflows/calculator-css-cleanup-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "連碰立柱計算機"

      - name: Update calculator CSS formal rules
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/feature-pages.css")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '.segmented button, .mode-tabs button { position: relative; min-height: 42px; padding: 4px 6px; border: 1px solid #5b472b; border-radius: 8px; background: #071018; color: #b9b5ae; font-size: 12px; }',
                  '.segmented button { position: relative; min-height: 42px; padding: 4px 6px; border: 1px solid #5b472b; border-radius: 8px; background: #071018; color: #b9b5ae; font-size: 12px; }',
              ),
              (
                  '.segmented button[data-selected="true"], .mode-tabs button[data-selected="true"] { border-color: #c89622; background: linear-gradient(145deg, rgba(124, 85, 12, .25), rgba(31, 25, 13, .74)); color: #f2cf67; box-shadow: inset 0 0 16px rgba(225, 170, 39, .08); }',
                  '.segmented button[data-selected="true"] { border-color: #c89622; background: linear-gradient(145deg, rgba(124, 85, 12, .25), rgba(31, 25, 13, .74)); color: #f2cf67; box-shadow: inset 0 0 16px rgba(225, 170, 39, .08); }',
              ),
              (
                  '.calculator-panel > header { display: grid; min-width: 0; min-height: 40px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }',
                  '.calculator-panel:not(.column-panel) > header { display: grid; min-width: 0; min-height: 40px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }\n.column-panel > header { display: grid; min-width: 0; min-height: 30px; grid-template-columns: minmax(0, 1fr); align-items: center; gap: 0; }',
              ),
              (
                  '.calculator-panel header .mode-select-button { border-color: rgba(200, 150, 34, .55); color: #d6b45a; }',
                  '.calculator-panel header .mode-select-button { border-color: #9a6b1e; color: #e2b64f; }',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:90]}")
              text = text.replace(old, new, 1)

          obsolete = '''.calculator-panel header .mode-select-button { border-color: #9a6b1e; color: #e2b64f; }
.column-panel > header > span {
  margin-left: 12px;
  padding: 3px 9px;
  border: 1px solid #9a6b1e;
  border-radius: 999px;
  color: #bcb6ad;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.column-panel > header > span strong {
  color: #e5a829;
  font-size: 15px;
}
'''
          count = text.count(obsolete)
          if count != 1:
              raise SystemExit(f"Expected one obsolete calculator override block, found {count}")
          text = text.replace(obsolete, '', 1)

          path.write_text(text, encoding="utf-8")

      - name: Verify calculator CSS constraints
        shell: python
        run: |
          from pathlib import Path
          text = Path("src/feature-pages.css").read_text(encoding="utf-8")
          checks = {
              "page uses formal 12px token": '.feature-body { padding: 0 var(--layout-page-inline) 24px; }' in text,
              "calculator stays overflow-safe": '.calculator-screen > .feature-body { box-sizing: border-box; min-width: 0; overflow-x: hidden; }' in text,
              "mode tabs have one dedicated base rule": text.count('.mode-tabs button { min-width: 0; height: 40px; min-height: 40px;') == 1,
              "shared segmented rule no longer controls mode tabs": '.segmented button, .mode-tabs button {' not in text,
              "shared selected rule no longer controls mode tabs": '.segmented button[data-selected="true"], .mode-tabs button[data-selected="true"] {' not in text,
              "mode select style has one source": text.count('.calculator-panel header .mode-select-button {') == 1,
              "pillar header uses 30px": '.column-panel > header { display: grid; min-width: 0; min-height: 30px;' in text,
              "combination header retains 40px": '.calculator-panel:not(.column-panel) > header { display: grid; min-width: 0; min-height: 40px;' in text,
              "obsolete pillar direct-span rule removed": '.column-panel > header > span {' not in text,
              "366px card rule preserved": '.calculator-panel { box-sizing: border-box; width: 366px; max-width: 100%;' in text,
              "340px pillar table preserved": '.column-grid { display: grid; box-sizing: border-box; width: 340px;' in text,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL") + ": " + name)
          if failed:
              raise SystemExit("Verification failed: " + ", ".join(failed))

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/calculator-css-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/feature-pages.css .github/workflows/calculator-css-cleanup-once.yml
          git diff --cached --check
          git commit -m "fix: clean calculator layout constraints"
          git push origin HEAD:"連碰立柱計算機"
