name: One-shot explore advanced settings UI fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-explore-advanced-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch shared explore settings CSS
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/matrix-explore-spacing.css')
          source = path.read_text()

          old_select = '''.matrix-explore-main-screen .explore-settings .setting-grid .select-box,
          .matrix-explore-main-screen .advanced-panel .select-box {
            box-sizing: border-box;
            max-width: none;
            height: 24px;
            min-height: 24px;
            padding: 0;
            font-size: .75rem;
            font-weight: 700;
          }
          '''.replace('          ', '')
          new_select = '''.matrix-explore-main-screen .explore-settings .setting-grid .select-box,
          .matrix-explore-main-screen .advanced-panel .select-box {
            box-sizing: border-box;
            max-width: none;
            height: 24px;
            min-height: 24px;
            padding: 0;
            border: 1px solid #7d6a4c;
            border-radius: .625rem;
            background: rgba(3, 11, 17, .35);
            box-shadow: none;
            font-size: .75rem;
            font-weight: 700;
          }
          '''.replace('          ', '')

          old_advanced = '''.matrix-explore-main-screen .advanced-row {
            display: grid;
            width: 100%;
            min-width: 0;
            min-height: 32px;
            height: auto;
            margin: 0;
            padding: 0;
            padding-inline-end: .375rem;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            column-gap: .375rem;
            font-size: 14px;
            font-weight: 600;
          }
          '''.replace('          ', '')
          new_advanced = '''.matrix-explore-main-screen .advanced-row {
            display: grid;
            width: 100%;
            min-width: 0;
            min-height: 32px;
            height: auto;
            margin: 8px 0 0;
            padding: 8px 0 0;
            padding-inline-end: .375rem;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            column-gap: .375rem;
            border-top: 1px solid rgba(195, 145, 54, .58);
            font-size: 14px;
            font-weight: 600;
          }
          '''.replace('          ', '')

          if source.count(old_select) != 1:
              raise SystemExit(f'Expected shared select-box owner once, found {source.count(old_select)}; refusing to modify.')
          if source.count(old_advanced) != 1:
              raise SystemExit(f'Expected advanced-row owner once, found {source.count(old_advanced)}; refusing to modify.')

          updated = source.replace(old_select, new_select, 1).replace(old_advanced, new_advanced, 1)

          if updated.count('.matrix-explore-main-screen .advanced-row {') != 1:
              raise SystemExit('advanced-row owner count changed; refusing to commit.')
          if 'margin: 8px 0 0;' not in updated or 'padding: 8px 0 0;' not in updated:
              raise SystemExit('Divider spacing contract missing.')
          if 'border-top: 1px solid rgba(195, 145, 54, .58);' not in updated:
              raise SystemExit('Divider missing.')
          for declaration in (
              'border: 1px solid #7d6a4c;',
              'border-radius: .625rem;',
              'background: rgba(3, 11, 17, .35);',
              'box-shadow: none;',
          ):
              if declaration not in updated:
                  raise SystemExit(f'Number-order frame declaration missing: {declaration}')
          if '!important' in new_select or '!important' in new_advanced:
              raise SystemExit('Forbidden !important detected.')

          path.write_text(updated)
          PY

      - name: Verify targeted diff only
        run: |
          git diff --check
          git diff -- src/matrix-explore-spacing.css
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "src/matrix-explore-spacing.css"
          changed="$(git diff --numstat -- src/matrix-explore-spacing.css | awk '{print $1+$2}')"
          test -n "$changed"
          test "$changed" -le 16
          ! git diff -- src/matrix-explore-spacing.css | grep -q '!important'

      - name: Commit precise UI fix
        run: |
          git config user.name "spy854540-cmd"
          git config user.email "spy854540@gmail.com"
          git add src/matrix-explore-spacing.css
          git commit -m "fix(ui): align explore advanced settings styling [skip actions]"
          git push origin HEAD:main