name: Cleanup history floating spacing

on:
  push:
    branches: [main]
    paths:
      - .github/history-spacing-trigger

permissions:
  contents: write

concurrency:
  group: cleanup-history-floating-spacing
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm legacy conflict exists
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const legacy = fs.readFileSync('src/feature-pages.css', 'utf8');
          const block = legacy.match(/\.history-filter-panel\[data-floating="true"\]\s*\{([\s\S]*?)\}/)?.[1] ?? '';
          if (!/\bleft:\s*20px\s*;/.test(block) || !/\bright:\s*20px\s*;/.test(block)) {
            throw new Error('Expected legacy 20px history floating offsets before cleanup');
          }
          console.log('RED confirmed: legacy history floating block still owns 20px offsets.');
          NODE

      - name: Remove legacy horizontal offsets and strengthen regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('src/feature-pages.css')
          css = css_path.read_text()
          old = '''.history-filter-panel[data-floating="true"] {
            position: fixed;
            z-index: 45;
            left: 20px;
            right: 20px;
            width: auto;'''
          new = '''.history-filter-panel[data-floating="true"] {
            position: fixed;
            z-index: 45;
            width: auto;'''
          if old not in css:
            raise SystemExit('Legacy history floating block not found')
          css_path.write_text(css.replace(old, new, 1))

          test_path = Path('tests/history-floating-spacing.test.mjs')
          test_path.write_text('''import assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\nimport test from 'node:test';\n\nconst legacy = readFileSync('src/feature-pages.css', 'utf8');\nconst responsive = readFileSync('src/responsive-feature-pages.css', 'utf8');\n\ntest('history floating settings card keeps one portal-safe 16px inline source', () => {\n  const canonicalBlock = responsive.match(/\\.history-filter-panel\\[data-floating="true"\\]\\s*\\{([\\s\\S]*?)\\}/)?.[1] ?? '';\n  assert.match(canonicalBlock, /\\bleft:\\s*16px\\s*;/);\n  assert.match(canonicalBlock, /\\bright:\\s*16px\\s*;/);\n\n  const legacyBlock = legacy.match(/\\.history-filter-panel\\[data-floating="true"\\]\\s*\\{([\\s\\S]*?)\\}/)?.[1] ?? '';\n  assert.doesNotMatch(legacyBlock, /\\bleft:\\s*20px\\s*;/);\n  assert.doesNotMatch(legacyBlock, /\\bright:\\s*20px\\s*;/);\n});\n''')
          PY

      - name: Verify regression and build
        run: |
          node --test tests/history-floating-spacing.test.mjs
          npm ci
          npm run build
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          rm -f .github/history-spacing-trigger .github/workflows/cleanup-history-floating-spacing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/feature-pages.css tests/history-floating-spacing.test.mjs .github/history-spacing-trigger .github/workflows/cleanup-history-floating-spacing.yml
          git commit -m 'Remove legacy history floating spacing conflict'
          git push origin HEAD:main
