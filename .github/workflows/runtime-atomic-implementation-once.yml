name: Runtime atomic implementation once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'runtime-atomic-commit-rule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: runtime-atomic-commit-rule
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Write final policy sources
        env:
          CHECKER_B64: 
          UPDATER_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          for env_name, target in [
              ('CHECKER_B64', 'scripts/check-runtime-commit-integrity.mjs'),
              ('UPDATER_B64', 'scripts/update-mobile-runtime-lock.mjs'),
          ]:
              Path(target).parent.mkdir(parents=True, exist_ok=True)
              Path(target).write_bytes(base64.b64decode(os.environ[env_name]))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Regenerate Runtime lock
        run: npm run update:runtime-lock

      - name: Verify Runtime scope
        run: |
          node --test tests/runtime-integrity-atomic-commit.test.mjs
          npm run check:runtime
          npm run build

      - name: Commit one atomic Runtime change
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile-runtime.lock.json scripts/check-runtime-commit-integrity.mjs scripts/update-mobile-runtime-lock.mjs
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            'mobile-runtime.lock.json'
            'scripts/check-runtime-commit-integrity.mjs'
            'scripts/update-mobile-runtime-lock.mjs'
          )
          test "${changed[*]}" = "${expected[*]}"
          git commit -m 'ci: enforce atomic runtime lock commits'
          node scripts/check-runtime-commit-integrity.mjs HEAD^ HEAD
          git push origin HEAD:runtime-atomic-commit-rule
