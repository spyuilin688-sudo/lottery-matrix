name: Number reference reading refinement once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/number-reference-reading-once.yml'

permissions:
  contents: write

jobs:
  refine-number-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: RED - confirm requested reading contract is not yet applied
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          feature = Path('src/feature-pages.css').read_text()
          responsive = Path('src/responsive-feature-pages.css').read_text()
          checks = [
              'border-left: 1px solid rgba(112, 76, 30, .75);',
              'border-right: 1px solid rgba(73, 53, 28, .75);',
              '.reference-row:not(.head) .reference-issue { color: #eee8df; font-weight: 700; }',
              'border: 1px solid rgba(198, 83, 83, .72);',
              '.number-reference-screen .reference-title-actions { gap: 8px; }',
              'height: 18px;\n  min-height: 18px;',
          ]
          if all(item in feature + responsive for item in checks):
              raise SystemExit(0)
          raise SystemExit(1)
          PY
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'RED test unexpectedly passed before production change.'
            exit 1
          fi
          echo 'RED confirmed.'

      - name: GREEN - modify the existing formal style sources only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1))

          feature = 'src/feature-pages.css'
          responsive = 'src/responsive-feature-pages.css'

          replace_once(
              feature,
              '''.reference-title-actions {\n  display: flex;\n  height: 100%;\n  align-items: center;\n  gap: 6px;\n}''',
              '''.reference-title-actions {\n  display: flex;\n  height: 100%;\n  align-items: center;\n}''',
          )
          replace_once(
              feature,
              '''.reference-row > span + span,\n.reference-row > .reference-issue + span { border-left: 1px solid #704c1e; }''',
              '''.reference-row > span + span,\n.reference-row > .reference-issue + span { border-left: 1px solid rgba(112, 76, 30, .75); }''',
          )
          replace_once(
              feature,
              '''.reference-row button { height: 100%; flex: 1; border: 0; border-right: 1px solid #49351c; background: transparent; color: #d6cec2; }''',
              '''.reference-row button { height: 100%; flex: 1; border: 0; border-right: 1px solid rgba(73, 53, 28, .75); background: transparent; color: #d6cec2; }''',
          )
          replace_once(
              feature,
              '''.reference-row[data-has-special="true"] > span > button:nth-last-child(2) {\n  border-right-color: rgba(167, 117, 32, .72);\n}''',
              '''.reference-row[data-has-special="true"] > span > button:nth-last-child(2) {\n  border-right-color: rgba(167, 117, 32, .54);\n}''',
          )
          replace_once(
              feature,
              '''.reference-row:not(.head) .reference-issue { font-weight: 700; }''',
              '''.reference-row:not(.head) .reference-issue { color: #eee8df; font-weight: 700; }''',
          )
          replace_once(
              feature,
              '''  border: 1px solid #C65353;''',
              '''  border: 1px solid rgba(198, 83, 83, .72);''',
          )

          replace_once(
              responsive,
              '''.draw-history-screen .history-title-actions,\n.tongxing-screen .tongxing-title-actions,\n.number-reference-screen .reference-title-actions {\n  width: auto;\n  min-width: 0;\n  height: auto;\n  align-items: center;\n  justify-content: flex-end;\n  gap: 5px;\n}\n\n.draw-history-screen .history-title-actions { gap: 6px; }''',
              '''.draw-history-screen .history-title-actions,\n.tongxing-screen .tongxing-title-actions,\n.number-reference-screen .reference-title-actions {\n  width: auto;\n  min-width: 0;\n  height: auto;\n  align-items: center;\n  justify-content: flex-end;\n}\n\n.draw-history-screen .history-title-actions { gap: 6px; }\n.tongxing-screen .tongxing-title-actions { gap: 5px; }\n.number-reference-screen .reference-title-actions { gap: 8px; }''',
          )
          replace_once(
              responsive,
              '''.tongxing-screen .tongxing-title-actions .title-card-compact-action,\n.number-reference-screen .reference-title-actions .title-card-compact-action {\n  height: 22px;\n  min-height: 22px;\n}\n\n.tongxing-screen .tongxing-title-actions .title-card-compact-action::before,\n.number-reference-screen .reference-title-actions .title-card-compact-action::before { height: 22px; }\n\n.tongxing-screen .tongxing-title-actions .title-card-compact-action::after,\n.number-reference-screen .reference-title-actions .title-card-compact-action::after { height: 20px; }''',
              '''.tongxing-screen .tongxing-title-actions .title-card-compact-action {\n  height: 22px;\n  min-height: 22px;\n}\n\n.number-reference-screen .reference-title-actions .title-card-compact-action {\n  height: 18px;\n  min-height: 18px;\n}\n\n.tongxing-screen .tongxing-title-actions .title-card-compact-action::before { height: 22px; }\n.number-reference-screen .reference-title-actions .title-card-compact-action::before { height: 18px; }\n\n.tongxing-screen .tongxing-title-actions .title-card-compact-action::after { height: 20px; }\n.number-reference-screen .reference-title-actions .title-card-compact-action::after { height: 16px; }''',
          )
          PY

      - name: Verify targeted contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          feature = Path('src/feature-pages.css').read_text()
          responsive = Path('src/responsive-feature-pages.css').read_text()
          tokens = Path('src/design-tokens.css').read_text()

          required_feature = [
              'border-top: 1px solid rgba(161, 112, 40, .78);',
              'border-left: 1px solid rgba(112, 76, 30, .75);',
              'border-right: 1px solid rgba(73, 53, 28, .75);',
              'border-right-color: rgba(167, 117, 32, .54);',
              '.reference-row:not(.head) .reference-issue { color: #eee8df; font-weight: 700; }',
              'border: 1px solid rgba(198, 83, 83, .72);',
          ]
          required_responsive = [
              '.number-reference-screen .reference-title-actions { gap: 8px; }',
              '.number-reference-screen .reference-title-actions .title-card-compact-action {\n  height: 18px;\n  min-height: 18px;\n}',
              '.number-reference-screen .reference-title-actions .title-card-compact-action::before { height: 18px; }',
              '.number-reference-screen .reference-title-actions .title-card-compact-action::after { height: 16px; }',
              '.number-reference-screen .reference-row {\n  min-width: 0;\n  grid-template-columns: minmax(52px, .22fr) minmax(0, .78fr);\n}',
              '.number-reference-screen .reference-row:not(.head) > span > button { min-width: 0; font-size: clamp(12px, 3.7vw, 14px); }',
              '--tool-section-gap: var(--layout-section-gap, 8px);',
          ]
          for item in required_feature:
              if item not in feature:
                  raise SystemExit(f'missing feature contract: {item}')
          for item in required_responsive:
              if item not in responsive:
                  raise SystemExit(f'missing responsive contract: {item}')
          if '--layout-section-gap: 8px;' not in tokens:
              raise SystemExit('title-card-to-content spacing token is no longer 8px')
          if '#704c1e' in feature or 'border-right: 1px solid #49351c' in feature or 'border: 1px solid #C65353' in feature:
              raise SystemExit('obsolete direct reference-table line/frame sources remain')
          PY

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Commit verified refinement and remove one-off runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/number-reference-reading-once.yml
          git add -- src/feature-pages.css src/responsive-feature-pages.css
          git commit -m 'Refine number reference readability'
          git push origin HEAD:main
