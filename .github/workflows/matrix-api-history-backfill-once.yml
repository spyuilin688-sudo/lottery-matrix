name: Matrix API history backfill verifier

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-backfill-tests:
    if: github.head_ref == 'matrix-api-history-backfill-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Install locked dependencies
        working-directory: services/matrix-api
        run: uv sync --frozen

      - name: Run history backfill contract tests
        working-directory: services/matrix-api
        run: uv run pytest tests/test_scraping_history.py tests/test_history_backfill.py tests/test_worker.py -q

      - name: Run complete Matrix API test suite
        working-directory: services/matrix-api
        run: uv run pytest -q

      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD
