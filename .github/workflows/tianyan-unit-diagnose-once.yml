name: Diagnose Tianyan unit failures once

on:
  push:
    branches: ['fix/tianyan-result-ui-rules-20260903']
    paths:
      - '.github/workflows/tianyan-unit-diagnose-once.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tianyan-result-ui-rules-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/tmp_apply_tianyan_result_ui.py
      - run: python scripts/tmp_patch_tianyan_legacy_test.py
      - name: Run full unit suite and capture output
        shell: bash
        run: |
          set +e
          npm run test:unit -- --reporter=verbose > /tmp/tianyan-unit.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            printf 'ALL_UNIT_TESTS_PASSED\n' > tianyan-unit-diagnostic.txt
          else
            tail -n 500 /tmp/tianyan-unit.log > tianyan-unit-diagnostic.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tianyan-unit-diagnostic.txt
          git commit -m 'chore: capture Tianyan unit diagnostic'
          git push origin HEAD:fix/tianyan-result-ui-rules-20260903
          exit "$status"
