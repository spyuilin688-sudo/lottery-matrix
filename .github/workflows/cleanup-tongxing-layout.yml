name: One-time Matrix TongXing CSS cleanup

on:
  push:
    branches: ["同星"]
    paths:
      - ".github/workflows/cleanup-tongxing-layout.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout 同星
        uses: actions/checkout@v4
        with:
          ref: 同星
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean Matrix TongXing layout sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          feature_path = Path('src/feature-pages.css')
          tongxing_path = Path('src/tongxing-compact.css')
          feature = feature_path.read_text()

          mixed_select = '''.matrix-explore-screen .native-select select,
          .tongxing-screen .native-select select {
            text-align: center;
            text-align-last: center;
          }'''
          mixed_select_replacement = '''.matrix-explore-screen .native-select select {
            text-align: center;
            text-align-last: center;
          }'''
          mixed_option = '''.matrix-explore-screen .native-select option,
          .tongxing-screen .native-select option {
            text-align: center;
          }'''
          mixed_option_replacement = '''.matrix-explore-screen .native-select option {
            text-align: center;
          }'''

          if mixed_select not in feature or mixed_option not in feature:
              raise SystemExit('Expected shared TongXing/native-select selectors were not found; aborting without guessing.')
          feature = feature.replace(mixed_select, mixed_select_replacement, 1)
          feature = feature.replace(mixed_option, mixed_option_replacement, 1)

          start_marker = '\n.tongxing-screen {'
          end_marker = '\n.reference-search {'
          start = feature.find(start_marker)
          end = feature.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Expected Matrix TongXing CSS segment not found; aborting without guessing.')

          segment = feature[start:end]
          out = []
          pos = 0
          removed = []
          while pos < len(segment):
              open_brace = segment.find('{', pos)
              if open_brace < 0:
                  out.append(segment[pos:])
                  break
              close_brace = segment.find('}', open_brace)
              if close_brace < 0:
                  raise SystemExit('Malformed CSS while scanning Matrix TongXing segment.')
              selector_chunk = segment[pos:open_brace]
              selector = selector_chunk.strip()
              rule = segment[pos:close_brace + 1]
              normalized = selector.lower()
              if 'tongxing' in normalized or 'same-star' in normalized:
                  removed.append(selector)
                  leading_len = len(selector_chunk) - len(selector_chunk.lstrip())
                  out.append(selector_chunk[:leading_len])
              else:
                  out.append(rule)
              pos = close_brace + 1

          if len(removed) < 25:
              raise SystemExit(f'Only removed {len(removed)} Matrix TongXing rules; expected at least 25. Aborting.')

          feature = feature[:start] + ''.join(out) + feature[end:]
          feature_path.write_text(feature)

          tongxing = '''/* Matrix 同星：唯一頁面專屬版面來源。共用元件基礎樣式仍由 feature-pages.css 管理。 */

.tongxing-screen {
  --header-gap-bottom: 8px;
  --section-gap: 12px;
  --large-section-gap: 16px;
  --card-padding: 10px;
  --card-radius: 12px;
  --control-gap: 8px;
  --control-height: 44px;
  --number-input-size: 44px;
  --primary-button-height: 48px;
  --table-header-height: 38px;
  --table-row-height: 52px;
  --result-row-height: 50px;
  --border-width: 1px;
  --group-divider-width: 2px;
  --bottom-nav-height: var(--bottom-navigation-height);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}

.tongxing-screen .tongxing-query {
  box-sizing: border-box;
  width: 366px;
  max-width: 100%;
  min-width: 0;
  height: auto;
  margin-top: var(--header-gap-bottom);
  padding: var(--card-padding);
  border-width: var(--border-width);
  border-radius: var(--card-radius);
  box-shadow: none;
}
.tongxing-screen .query-selects {
  display: grid;
  width: 344px;
  max-width: 100%;
  grid-template-columns: 116px 220px;
  gap: var(--control-gap);
}
.tongxing-screen .query-selects .select-box { height: var(--control-height); }
.tongxing-screen .query-selects select { padding-inline: 12px 28px; font-size: 16px; font-weight: 600; text-align: center; text-align-last: center; }
.tongxing-screen .tongxing-order-select select { font-size: 16px; }
.tongxing-screen .tongxing-query .lottery-tabs { display: none; }
.tongxing-screen .same-star-fields {
  display: grid;
  width: 344px;
  max-width: 100%;
  margin: var(--control-gap) 0;
  grid-template-columns: repeat(3, var(--number-input-size)) minmax(0, 1fr) 64px auto;
  column-gap: var(--control-gap);
  align-items: center;
}
.tongxing-screen .same-star-fields input,
.tongxing-screen .same-star-period-select { height: var(--control-height); }
.tongxing-screen .same-star-fields input {
  box-sizing: border-box;
  width: var(--number-input-size);
  min-width: var(--number-input-size);
  padding: 0;
  border: var(--border-width) solid #6e4a1e;
  border-radius: 9px;
  outline: none;
  background: #030a10;
  color: #efe8dc;
  font-size: 18px;
  font-weight: 600;
  line-height: var(--control-height);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
  text-align: center;
}
.tongxing-screen .same-star-fields input:focus-visible { border-color: #d4a238; outline: 1px solid rgba(212, 162, 56, .45); outline-offset: 1px; }
.tongxing-screen .same-star-fields > span { align-self: center; color: #d5cec2; font-size: 16px; font-weight: 600; line-height: 22px; white-space: nowrap; }
.tongxing-screen .same-star-period-select { width: 64px; min-width: 64px; min-height: var(--control-height); }
.tongxing-screen .same-star-period-select select { padding-inline: 7px 21px; font-size: 16px; font-weight: 600; text-align: center; text-align-last: center; }
.tongxing-screen .same-star-period-select svg { right: 6px; width: 16px; height: 16px; }
.tongxing-screen .primary-action { height: var(--primary-button-height); font-size: 20px; font-weight: 600; }
.tongxing-screen .primary-action svg { width: 24px; height: 24px; }
.tongxing-screen .history-panel { margin-top: var(--section-gap); padding: 8px; }
.tongxing-screen .panel-heading { align-items: center; }
.tongxing-screen .panel-heading .history-panel-toggle { display: flex; min-width: 0; padding: 0; align-items: center; gap: 5px; color: inherit; text-align: left; }
.tongxing-screen .history-panel-toggle .section-title { min-width: 0; font-size: 12px; }
.tongxing-screen .history-panel-toggle .section-title > span { height: 17px; }
.tongxing-screen .history-panel-toggle > svg { width: 13px; height: 13px; flex: 0 0 13px; color: #d8a93e; transition: transform .2s ease; }
.tongxing-screen .history-panel-toggle > svg[data-open="true"] { transform: rotate(180deg); }
.tongxing-screen .panel-heading > button:last-child { padding: 0; font-size: 10.5px; }
.tongxing-screen .history-table[hidden] { display: none; }
.tongxing-screen .ornament-title { margin: var(--large-section-gap) 0 10px; font-size: 20px; font-weight: 600; line-height: 26px; }
.tongxing-screen .tongxing-results {
  box-sizing: border-box;
  width: 356px;
  max-width: 100%;
  margin-inline: auto;
  overflow: hidden;
  border: var(--border-width) solid #6c4a20;
  border-radius: var(--card-radius);
  box-shadow: none;
}
.tongxing-screen .tongxing-table { width: 100%; font-variant-numeric: tabular-nums; }
.tongxing-screen .tongxing-table-row {
  display: grid;
  grid-template-columns: 62px repeat(5, minmax(0, 1fr));
  align-items: stretch;
  text-align: center;
}
.tongxing-screen .tongxing-table[data-columns="7"] .tongxing-table-row { grid-template-columns: 62px repeat(7, minmax(0, 1fr)); }
.tongxing-screen .tongxing-table-row > span {
  display: flex;
  min-width: 0;
  min-height: var(--table-row-height);
  align-items: center;
  justify-content: center;
  border-left: var(--border-width) solid rgba(111, 78, 31, .28);
  color: #f2eee7;
  font-size: 17px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.tongxing-screen .tongxing-table-row > span:first-child { border-left: 0; }
.tongxing-screen .tongxing-table-head { min-height: var(--table-header-height); border-bottom: var(--border-width) solid rgba(118, 80, 31, .65); background: rgba(104, 73, 23, .08); }
.tongxing-screen .tongxing-table-head > span { min-height: var(--table-header-height); color: #d8aa39; font-size: 15px; font-weight: 700; }
.tongxing-screen .tongxing-result-group { display: block; border-top: var(--group-divider-width) solid rgba(168, 119, 47, .7); box-shadow: none; }
.tongxing-screen .tongxing-result-group:first-of-type { border-top: 0; }
.tongxing-screen .tongxing-result-group + .tongxing-result-group { margin-top: 0; }
.tongxing-screen .tongxing-table-row[data-row-type="locked"] { background: rgba(126, 83, 15, .12); }
.tongxing-screen .tongxing-table-row[data-row-type="predicted"] { background: rgba(10, 61, 88, .13); }
.tongxing-screen .tongxing-table-row[data-row-type="predicted"] > span { border-top: var(--border-width) solid rgba(105, 129, 140, .31); }
.tongxing-screen .tongxing-period-cell { display: grid; min-height: var(--result-row-height); padding: 2px 3px; align-content: center; gap: 1px; }
.tongxing-screen .tongxing-period-cell strong { color: #e4c44e; font-size: 16px; font-weight: 700; line-height: 18px; }
.tongxing-screen .tongxing-period-cell time { color: #aaa49a; font-size: 12px; font-weight: 400; line-height: 14px; }
.tongxing-screen .tongxing-table-row[data-row-type="predicted"] .tongxing-period-cell strong { color: #78bfe3; }
.tongxing-screen .tongxing-table-row .locked-input-number { color: #ef5b58; font-size: 17px; font-weight: 700; }
.tongxing-screen .tongxing-table[data-columns="7"] .tongxing-table-row > span { font-size: 17px; }
.tongxing-screen .tongxing-table[data-columns="7"] .tongxing-table-head > span { font-size: 15px; }
.tongxing-screen .tongxing-table[data-columns="7"] .tongxing-period-cell { padding-inline: 2px; }
.tongxing-screen .tongxing-table[data-columns="7"] .tongxing-period-cell strong { font-size: 16px; }
.tongxing-screen .tongxing-results-end { height: 12px; }

@media (max-width: 360px) {
  .tongxing-screen .tongxing-query { width: 100%; }
  .tongxing-screen .query-selects { width: 100%; grid-template-columns: minmax(0, 34fr) minmax(0, 66fr); }
  .tongxing-screen .same-star-fields {
    width: 100%;
    grid-template-columns: repeat(3, minmax(34px, var(--number-input-size))) minmax(38px, 1fr) minmax(56px, 64px) auto;
    column-gap: clamp(6px, 2vw, var(--control-gap));
  }
  .tongxing-screen .same-star-fields input,
  .tongxing-screen .same-star-period-select { width: 100%; min-width: 0; }
}
'''
          tongxing_path.write_text(tongxing)

          design = Path('src/design-tokens.css').read_text()
          if '--layout-page-inline: 12px;' not in design:
              raise SystemExit('Formal shared page inline token is not 12px; aborting.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Legacy structure tests
        run: node --test tests/*.test.mjs

      - name: Build
        run: npm run build

      - name: Verify Matrix TongXing cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          feature = Path('src/feature-pages.css').read_text()
          tongxing = Path('src/tongxing-compact.css').read_text()
          design = Path('src/design-tokens.css').read_text()

          failures = []
          def check(name, condition):
              if not condition:
                  failures.append(name)

          check('formal 12px shared page token', '--layout-page-inline: 12px;' in design)
          check('no second page padding token', '--page-padding-x' not in tongxing)
          check('no scoped feature-body padding override', '.tongxing-screen .feature-body' not in tongxing)
          check('no TongXing !important', '!important' not in tongxing)
          check('390px query card width 366', 'width: 366px;' in tongxing)
          check('390px first-row widths 116/220', 'grid-template-columns: 116px 220px;' in tongxing)
          check('number input size 44', '--number-input-size: 44px;' in tongxing)
          check('result table width 356', 'width: 356px;' in tongxing)
          check('ordinary row height 52', '--table-row-height: 52px;' in tongxing)
          check('result row height 50', '--result-row-height: 50px;' in tongxing)
          check('result cell uses formal 50px token', 'min-height: var(--result-row-height)' in tongxing)
          check('small-screen first row is flexible', 'minmax(0, 34fr) minmax(0, 66fr)' in tongxing)
          check('small-screen number row can shrink', 'repeat(3, minmax(34px, var(--number-input-size)))' in tongxing)
          check('shared TongXing 52px important lock removed', 'min-height: 52px !important' not in feature)
          check('shared TongXing display important lock removed', 'tongxing-period-cell { display: grid !important' not in feature)
          check('shared mixed TongXing native select removed', '.tongxing-screen .native-select select' not in feature)

          if failures:
              raise SystemExit('VERIFY FAIL: ' + '; '.join(failures))
          print('VERIFY PASS: Matrix 同星 layout cleanup checks passed')
          PY
          git diff --check

      - name: Commit cleanup to 同星 only
        shell: bash
        run: |
          git rm .github/workflows/cleanup-tongxing-layout.yml
          git add src/feature-pages.css src/tongxing-compact.css
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: clean Matrix 同星 layout rules"
          git push origin HEAD:同星
