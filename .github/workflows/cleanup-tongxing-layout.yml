name: One-time Matrix TongXing CSS cleanup

on:
  push:
    branches: ["同星"]
    paths:
      - ".github/workflows/cleanup-tongxing-layout.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout 同星
        uses: actions/checkout@v4
        with:
          ref: 同星
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean shared Matrix TongXing rules
        run: echo '' | base64 -d | python

      - name: Write formal Matrix TongXing layout source
        run: echo '' | base64 -d > src/tongxing-compact.css

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Legacy structure tests
        run: node --test tests/*.test.mjs

      - name: Build
        run: npm run build

      - name: Verify Matrix TongXing cleanup
        run: echo '' | base64 -d | python

      - name: Diff check
        run: git diff --check

      - name: Commit cleanup to 同星 only
        run: |
          git rm .github/workflows/cleanup-tongxing-layout.yml
          git add src/feature-pages.css src/tongxing-compact.css
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: clean Matrix 同星 layout rules"
          git push origin HEAD:同星
