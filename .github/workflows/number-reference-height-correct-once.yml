name: Number reference height correction once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  correct-number-reference-height:
    if: github.head_ref == 'number-reference-height-correction'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'number-reference-height-correction'
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: RED - confirm visible-baseline target is not yet represented
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          css = Path('src/responsive-feature-pages.css').read_text()
          target = '.number-reference-screen .reference-title-actions .title-card-compact-action {\n  height: 22px;\n  min-height: 22px;\n}'
          raise SystemExit(0 if target in css else 1)
          PY
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'RED unexpectedly passed.'
            exit 1
          fi
          echo 'RED confirmed.'
      - name: GREEN - restore the requested 2px-per-side reduction target
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/responsive-feature-pages.css')
          s = p.read_text()
          changes = [
            ('height: 18px;\n  min-height: 18px;', 'height: 22px;\n  min-height: 22px;'),
            ('.number-reference-screen .reference-title-actions .title-card-compact-action::before { height: 18px; }', '.number-reference-screen .reference-title-actions .title-card-compact-action::before { height: 22px; }'),
            ('.number-reference-screen .reference-title-actions .title-card-compact-action::after { height: 16px; }', '.number-reference-screen .reference-title-actions .title-card-compact-action::after { height: 20px; }'),
          ]
          for old, new in changes:
            if s.count(old) != 1:
              raise SystemExit(f'expected one match for {old!r}, found {s.count(old)}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify target and compile bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('src/responsive-feature-pages.css').read_text()
          feature = Path('src/feature-pages.css').read_text()
          assert '.number-reference-screen .reference-title-actions { gap: 8px; }' in css
          assert '.number-reference-screen .reference-title-actions .title-card-compact-action {\n  height: 22px;\n  min-height: 22px;\n}' in css
          assert '.number-reference-screen .reference-title-actions .title-card-compact-action::before { height: 22px; }' in css
          assert '.number-reference-screen .reference-title-actions .title-card-compact-action::after { height: 20px; }' in css
          assert 'border-left: 1px solid rgba(112, 76, 30, .75);' in feature
          assert 'border-right: 1px solid rgba(73, 53, 28, .75);' in feature
          assert 'border: 1px solid rgba(198, 83, 83, .72);' in feature
          PY
          npm ci
          npx tsc
          npx vite build
          node scripts/prepare-sites-build.mjs
      - name: Commit correction and remove temporary files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/number-reference-height-correct-once.yml .github/number-reference-height-trigger
          git add src/responsive-feature-pages.css
          git commit -m 'Align Number Reference action height'
          git push origin HEAD:number-reference-height-correction
