name: Verify history integration build only

on:
  push:
    branches:
      - "sync/history-to-main-20260817"
    paths:
      - ".github/workflows/verify-history-build-only.yml"

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "sync/history-to-main-20260817"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply history-only integration patch
        run: python scripts/integrate-history-to-main.py

      - name: Check patch cleanliness
        run: git diff --check

      - name: Run focused history regressions
        run: |
          node --test \
            tests/draw-history-table-layout.test.mjs \
            tests/history-filter-select-layering.test.mjs \
            tests/number-ball-style-source.test.mjs \
            tests/number-ball-visible-size.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build
