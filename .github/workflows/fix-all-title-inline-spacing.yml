name: Fix all title inline spacing
on:
  push:
    paths:
      - '.github/workflows/fix-all-title-inline-spacing.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: RED - verify all title cards are not yet 16px inline
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const css=fs.readFileSync('src/feature-pages.css','utf8');
          const shared=/\.matrix-title-banner\s*\{[^}]*width:\s*calc\(100% - 32px\);/s.test(css);
          const generic=/\.feature-title-card\s*\{[^}]*width:\s*calc\(100% - 32px\);/s.test(css);
          const reference=/\.number-reference-screen \.matrix-title-banner\s*\{[^}]*width:\s*calc\(100% - 32px\);/s.test(css);
          if(shared&&generic&&reference) process.exit(1);
          console.log('RED confirmed: not all title cards use 16px left/right spacing');
          EOF
      - name: Apply canonical 16px inline spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/feature-pages.css')
          s=p.read_text()
          old='.feature-title-card { box-sizing: border-box; display: grid; width: calc(100% - (var(--layout-page-inline) * 2));'
          new='.feature-title-card { box-sizing: border-box; display: grid; width: calc(100% - 32px);'
          if old not in s: raise SystemExit('generic title card width source not found')
          s=s.replace(old,new,1)
          old2='''.matrix-title-banner {\n  position: relative;\n  width: min(100%, 390px);\n  margin: 0 auto;'''
          new2='''.matrix-title-banner {\n  position: relative;\n  width: calc(100% - 32px);\n  margin: 0 auto;'''
          if old2 not in s: raise SystemExit('shared integrated title width source not found')
          s=s.replace(old2,new2,1)
          old3='''.number-reference-screen .matrix-title-banner {\n  width: calc(100% - 8px);\n  margin-top: 0;\n}'''
          new3='''.number-reference-screen .matrix-title-banner {\n  width: calc(100% - 32px);\n  margin-top: 0;\n}'''
          if old3 not in s: raise SystemExit('reference title special width source not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
      - name: GREEN - verify exact spacing and build
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const css=fs.readFileSync('src/feature-pages.css','utf8');
          assert.match(css,/\.matrix-title-banner\s*\{[^}]*width:\s*calc\(100% - 32px\);/s);
          assert.match(css,/\.feature-title-card\s*\{[^}]*width:\s*calc\(100% - 32px\);/s);
          assert.match(css,/\.number-reference-screen \.matrix-title-banner\s*\{[^}]*width:\s*calc\(100% - 32px\);/s);
          assert.doesNotMatch(css,/\.number-reference-screen \.matrix-title-banner\s*\{[^}]*width:\s*calc\(100% - 8px\);/s);
          EOF
          npm ci
          node --test tests/*.test.mjs
          npm run build
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-all-title-inline-spacing.yml
          git add src/feature-pages.css
          git commit -m 'fix: unify title card inline spacing'
          git push origin main
