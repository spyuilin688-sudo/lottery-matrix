name: Backend Google login perks red once
on:
  push:
    branches:
      - fix/backend-google-login-perks-20260916
permissions:
  contents: write
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused RED test
        run: npx vitest run backend/google-member-login-perks.test.ts --reporter=verbose
      - name: Remove one-off workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/backend-google-login-perks-red-once.yml
          git commit -m 'chore: remove backend login perks red workflow'
          git push origin HEAD:fix/backend-google-login-perks-20260916
