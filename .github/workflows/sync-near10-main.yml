name: Sync near10 confirmed spec to main

on:
  push:
    branches: [main]
    paths: [.github/workflows/sync-near10-main.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch near10 source branch
        run: git fetch origin '近10期開獎號碼:refs/remotes/origin/近10期開獎號碼'

      - name: Resolve conflicts by scoped transplant
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def branch_text(path):
              return subprocess.check_output([
                  'git', 'show', f'origin/近10期開獎號碼:{path}'
              ], text=True)

          def replace_slice(path, start_marker, end_marker):
              target_path = Path(path)
              target = target_path.read_text()
              source = branch_text(path)
              ts = target.index(start_marker)
              te = target.index(end_marker, ts)
              ss = source.index(start_marker)
              se = source.index(end_marker, ss)
              target_path.write_text(target[:ts] + source[ss:se] + target[te:])

          replace_slice(
              'src/FeaturePages.tsx',
              'function HistoryList({',
              'export function DrawHistoryPage({',
          )
          replace_slice(
              'src/feature-pages.css',
              '.history-panel {',
              '.draw-history-screen .draw-history-row .history-numbers,',
          )
          replace_slice(
              'src/number-ball.css',
              '.history-panel .number-ball-component.history-lottery-ball {',
              '.draw-history-screen .draw-history-row .number-ball-component.history-lottery-ball {',
          )
          PY

      - name: Verify scoped result
        run: |
          grep -n -- '--layout-page-inline: 12px' src/design-tokens.css
          grep -n 'history-panel-title\|history-panel-order' src/FeaturePages.tsx src/feature-pages.css
          grep -n -- '--number-ball-size: 28px' src/number-ball.css
          if grep -n 'history-panel {.*width: 366px' src/feature-pages.css; then exit 1; fi
          git diff --check

      - name: Install dependencies
        run: npm run install:ci

      - name: Typecheck and build
        run: |
          npx tsc
          npx vite build
          node scripts/prepare-sites-build.mjs

      - name: Commit resolved main
        run: |
          rm -f .github/workflows/sync-near10-main.yml
          git config user.name 'spy854540-cmd'
          git config user.email 'spy854540@gmail.com'
          git add src/FeaturePages.tsx src/feature-pages.css src/number-ball.css .github/workflows/sync-near10-main.yml
          git commit -m 'fix: sync confirmed near10 spec to main'
          git push origin HEAD:main
