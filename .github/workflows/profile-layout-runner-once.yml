name: Profile layout runner once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refine-profile-layout:
    if: github.head_ref == '我的'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '我的'
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: RED - confirm profile layout contract fails before change
        shell: bash
        run: |
          set +e
          node --test tests/profile-layout.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'RED test unexpectedly passed before production change.'
            exit 1
          fi
          echo 'RED confirmed.'

      - name: GREEN - refine existing profile style source
        run: python scripts/profile-layout-once.py

      - name: Verify targeted profile test and full project
        run: |
          node --test tests/profile-layout.test.mjs
          node --test tests/*.test.mjs
          npm run build

      - name: Commit verified profile refinement to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/profile-layout-runner-once.yml scripts/profile-layout-once.py
          git add -- src/feature-pages.css tests/profile-layout.test.mjs
          git commit -m 'Refine profile responsive layout'
          git push origin HEAD:'我的'
