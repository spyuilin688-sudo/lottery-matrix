name: Profile layout runner once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refine-profile-layout:
    if: github.head_ref == '我的'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '我的'
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: RED - confirm profile layout contract fails before change
        shell: bash
        run: |
          set +e
          node --test tests/profile-layout.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'RED test unexpectedly passed before production change.'
            exit 1
          fi
          echo 'RED confirmed.'

      - name: GREEN - refine existing profile style source
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/feature-pages.css')
          css = path.read_text()

          legacy_start = '.profile-card { display: grid; min-height: 92px; padding: 14px; grid-template-columns: 58px minmax(0, 1fr) auto; align-items: center; gap: 14px; }\n'
          legacy_end = '.profile-menu-rows button svg { width: 18px; height: 18px; justify-self: end; color: #b98a31; }\n'
          if css.count(legacy_start) != 1:
              raise SystemExit(f'legacy profile start count={css.count(legacy_start)}')
          start = css.index(legacy_start)
          end = css.index(legacy_end, start) + len(legacy_end)
          css = css[:start] + css[end:]

          for old, label in [
              ('  .profile-card { grid-template-columns: 50px minmax(0, 1fr) auto; padding: 12px; gap: 10px; }\n', 'obsolete 50px profile rule'),
              ('  .profile-mark { width: 50px; height: 50px; }\n', 'unused profile mark rule'),
              ('  .profile-card { grid-template-columns: 58px minmax(0, 1fr) auto; }\n', 'duplicate 58px profile rule'),
              ('  .profile-avatar { width: 58px; height: 58px; }\n', 'obsolete avatar media rule'),
              ('  .subscription-status-content { grid-template-columns: 46px minmax(0, 1fr) minmax(0, 1fr); gap: 7px; }\n', 'obsolete subscription media rule'),
              ('  .line-login-button { min-width: 70px; padding-inline: 8px; }\n', 'unused line login rule'),
          ]:
              count = css.count(old)
              if count != 1:
                  raise SystemExit(f'{label} count={count}')
              css = css.replace(old, '', 1)

          canonical_start = '.profile-screen .feature-body,\n.profile-detail-screen .feature-body {\n'
          canonical_end = '.profile-menu-rows button svg {\n  width: 18px;\n  height: 18px;\n  align-self: center;\n  justify-self: end;\n  color: #b98a31;\n}\n'
          if css.count(canonical_start) != 1 or css.count(canonical_end) != 1:
              raise SystemExit('canonical profile block anchors are not unique')
          start = css.index(canonical_start)
          end = css.index(canonical_end, start) + len(canonical_end)

          canonical = '''.profile-screen .feature-body,
.profile-detail-screen .feature-body {
  display: grid;
  gap: 8px;
}
.profile-screen .panel {
  border-color: rgba(177, 129, 43, .72);
  border-radius: 10px;
}
.profile-card {
  position: relative;
  display: grid;
  width: 100%;
  min-width: 0;
  min-height: 0;
  height: auto;
  padding: 12px 14px;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: clamp(8px, 3vw, 12px);
  overflow: hidden;
}
.profile-avatar {
  z-index: 1;
  display: grid;
  width: clamp(58px, 16.9vw, 66px);
  height: clamp(58px, 16.9vw, 66px);
  place-items: center;
  border: 1px solid #b8872f;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0 34%, #16ad2d 35% 68%, #087d19 69% 100%);
  box-shadow: 0 0 15px rgba(213, 157, 39, .18);
}
.profile-avatar span {
  color: #0a921f;
  font-size: 13px;
  font-weight: 850;
}
.profile-watermark {
  position: absolute;
  top: -12px;
  right: 14px;
  color: rgba(199, 145, 42, .055);
  font-size: clamp(92px, 30vw, 118px);
  font-weight: 800;
  line-height: 1;
  pointer-events: none;
}
.profile-copy {
  z-index: 1;
  display: grid;
  min-width: 0;
  align-self: center;
  gap: 4px;
}
.profile-card .profile-copy h2 {
  margin: 0;
  color: #f1ede6;
  font-size: 15px;
  font-weight: 700;
  line-height: 20px;
}
.profile-card .profile-copy p {
  display: inline-flex;
  max-width: 100%;
  margin: 0;
  padding: 4px 8px;
  justify-self: start;
  overflow: hidden;
  border: 1px solid #453d33;
  border-radius: 999px;
  background: rgba(9, 12, 14, .68);
  color: #aaa49a;
  font-size: 11px;
  font-weight: 400;
  line-height: 16px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.profile-logout {
  z-index: 1;
  min-width: 66px;
  height: 34px;
  margin: 0;
  align-self: center;
  border: 1px solid #9c722d;
  border-radius: 999px;
  background: rgba(9, 12, 14, .76);
  color: #e3bd60;
  font-size: 12px;
  cursor: pointer;
}
.subscription-status-card {
  padding: 12px 14px;
}
.subscription-status-card > .section-title {
  margin-bottom: 8px;
  color: #e7d5ac;
  font-size: 16px;
  font-weight: 700;
}
.subscription-status-content {
  display: grid;
  margin: 0;
  grid-template-columns: clamp(44px, 12.3vw, 48px) minmax(0, 1.15fr) minmax(0, .85fr);
  align-items: start;
  gap: clamp(8px, 2.6vw, 12px);
}
.subscription-crown {
  display: grid;
  width: clamp(44px, 12.3vw, 48px);
  height: clamp(44px, 12.3vw, 48px);
  place-items: center;
  border: 1px solid #9c722d;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212, 155, 40, .18), transparent 70%);
  color: #f0bf4c;
  font-size: clamp(22px, 6.4vw, 25px);
}
.subscription-status-content > div:not(:first-child) {
  display: grid;
  min-width: 0;
  align-content: start;
}
.subscription-status-content > div:last-child {
  padding-left: 10px;
  border-left: 1px solid rgba(95, 80, 60, .5);
}
.subscription-status-content span {
  display: block;
  color: #9e978d;
  font-size: 11px;
  font-weight: 400;
  line-height: 16px;
}
.subscription-status-content strong {
  display: block;
  margin-top: 2px;
  color: #e8bd59;
  font-size: 14px;
  font-weight: 700;
  line-height: 20px;
}
.subscription-status-content p {
  margin: 2px 0 0;
  color: #aaa49a;
  font-size: 11px;
  font-weight: 400;
  line-height: 16px;
}
.subscription-entry {
  display: grid;
  width: 100%;
  min-height: 40px;
  height: 40px;
  margin-top: 8px;
  padding: 0 12px 0 14px;
  grid-template-columns: minmax(0, 1fr) 18px;
  align-items: center;
  border: 1px solid #9c722d;
  border-radius: 8px;
  background: rgba(10, 13, 15, .78);
  color: #eee9df;
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
}
.subscription-entry svg {
  width: 18px;
  height: 18px;
  justify-self: end;
  color: #eab738;
}
.profile-menu {
  padding: 0 14px;
  overflow: hidden;
}
.profile-menu .section-title {
  height: 34px;
  margin: 0;
  gap: 8px;
  color: #e7d5ac;
  font-size: 16px;
  font-weight: 700;
}
.profile-menu .section-title > span {
  flex: 0 0 4px;
}
.profile-menu-rows {
  border-top: 1px solid rgba(48, 39, 28, .72);
}
.profile-menu-rows button {
  position: relative;
  display: grid;
  width: 100%;
  min-height: 44px;
  height: 44px;
  padding: 0 4px 0 0;
  grid-template-columns: minmax(0, 1fr) 18px;
  align-items: center;
  border: 0;
  background: transparent;
  color: #d8d1c6;
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
}
.profile-menu-rows button:not(:last-child)::after {
  position: absolute;
  right: 30px;
  bottom: 0;
  left: 0;
  height: 1px;
  background: rgba(48, 39, 28, .72);
  content: "";
}
.profile-menu-rows button svg {
  width: 18px;
  height: 18px;
  align-self: center;
  justify-self: end;
  color: #b98a31;
}
'''
          css = css[:start] + canonical + css[end:]
          path.write_text(css)

      - name: Verify targeted profile test and full project
        run: |
          node --test tests/profile-layout.test.mjs
          node --test tests/*.test.mjs
          npm run build

      - name: Commit verified profile refinement to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/profile-layout-runner-once.yml
          git add -- src/feature-pages.css tests/profile-layout.test.mjs
          git commit -m 'Refine profile responsive layout'
          git push origin HEAD:'我的'
