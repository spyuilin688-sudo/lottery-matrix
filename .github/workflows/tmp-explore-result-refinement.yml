name: Temporary Explore Result Refinement

on:
  push:
    branches:
      - fix/explore-result-refinement-20260904

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply approved changes
        run: python scripts/tmp_apply_explore_result_refinement.py

      - name: Run new regressions
        run: node --test tests/matrix-explore-result-refinement-20260904.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run Matrix Explore unit tests
        run: npx vitest run src/__tests__/MatrixExplorePage.test.tsx

      - name: Run Explore layout regressions
        run: node --test tests/matrix-explore-validation-preview-merge.test.mjs tests/matrix-explore-fluid-layout.test.mjs

      - name: Build production Pages bundle
        run: npm run build:pages

      - name: Normalize generated file endings
        run: python -c "from pathlib import Path; files=[Path('src/explore-result-preview.css'),Path('src/matrix-explore-spacing.css'),Path('supabase/migrations/20260904040000_matrix_explore_prediction_number_group_order.sql')]; [p.write_text(p.read_text().rstrip()+'\\n') for p in files]"

      - name: Check diff whitespace
        run: git diff --check

      - name: Commit verified implementation
        run: |
          rm .github/workflows/tmp-explore-result-refinement.yml
          rm scripts/tmp_apply_explore_result_refinement.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(explore): refine result filters and validation spacing"
          git push origin HEAD:fix/explore-result-refinement-20260904
