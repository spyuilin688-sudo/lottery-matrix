name: Temporary Explore Result Refinement

on:
  push:
    branches: [fix/explore-result-refinement-20260904]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: RED regression proof
        id: red
        continue-on-error: true
        run: node --test tests/matrix-explore-result-refinement-20260904.test.mjs

      - name: Confirm RED failure
        if: always()
        run: |
          if [ "${{ steps.red.outcome }}" != "failure" ]; then
            echo "Expected the new regression test to fail before implementation."
            exit 1
          fi
          echo "RED confirmed."

      - name: Patch Explore feature logic
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1, got {n}")
              return text.replace(old, new, 1)

          path = Path("src/FeaturePages.tsx")
          text = path.read_text()
          text = once(text, '''  const defaultFilters: Record<string, ConsecutiveOption[]> = {
            "準4+（鎖定1碼）": ["準5進6", "準6進7", "準7進8"],
            "準5+（鎖定2碼）": title === "Matrix 天衍"
              ? ["準11進12", "準14進15", "準15進16", "準16進17", "準17進18"]
              : ["準7進8", "準9進10", "準11進12"],
          };
          ''', '''  const defaultFiltersFor = (hitValue: string, roadValue: string): ConsecutiveOption[] => {
            if (title === "Matrix 天衍") {
              return ["準11進12", "準14進15", "準15進16", "準16進17", "準17進18"];
            }
            const isTrailer = roadValue === "拖牌版路";
            if (hitValue === "準4+（鎖定1碼）") {
              return isTrailer
                ? ["準5進6", "準6進7", "準7進8"]
                : ["準6進7", "準7進8"];
            }
            return isTrailer
              ? ["準6進7", "準7進8", "準9進10", "準11進12"]
              : ["準9進10", "準11進12"];
          };
          ''', "default filters")
          text = once(text, '''  const [selectedFilters, setSelectedFilters] = useState<ConsecutiveOption[]>(
            defaultFilters[title === "Matrix 天衍" ? "準5+（鎖定2碼）" : "準4+（鎖定1碼）"],
          );
          ''', '''  const [selectedFilters, setSelectedFilters] = useState<ConsecutiveOption[]>(
            defaultFiltersFor(
              title === "Matrix 天衍" ? "準5+（鎖定2碼）" : "準4+（鎖定1碼）",
              roadTypes[0],
            ),
          );
          ''', "selected filter init")
          text = once(text, '''  const changeHit = (value: string) => {
            setHit(value);
            setSelectedFilters(defaultFilters[value]);
            setExpandedRoad(null);
          };

          const changeLottery = (value: LotteryId) => {
          ''', '''  const changeHit = (value: string) => {
            setHit(value);
            setSelectedFilters(defaultFiltersFor(value, road));
            setExpandedRoad(null);
            setResultPage(1);
          };

          const changeRoad = (value: string) => {
            setRoad(value);
            setSelectedFilters(defaultFiltersFor(hit, value));
            setExpandedRoad(null);
            setResultPage(1);
          };

          const changeLottery = (value: LotteryId) => {
          ''', "change handlers")
          text = once(text, '''  const startExplore = () => {
            const nextFilters = defaultFilters[hit];
          ''', '''  const startExplore = () => {
            const nextFilters = defaultFiltersFor(hit, road);
          ''', "start defaults")
          text = once(text,
              '<button type="button" key={v} data-selected={road === v} onClick={() => setRoad(v)}>',
              '<button type="button" key={v} data-selected={road === v} onClick={() => changeRoad(v)}>',
              "road click")
          text = once(text, '''  ) => (
            <span className="explore-validation-formula-expression">
              <span>{`第${position}顆`}</span>{" "}
              <span>{displayNumber(baseNumber)}</span>{" "}
              <span>{formula}</span>{" "}
              <span>=</span>{" "}
              <span>{resultNumbers}</span>
            </span>
          );
          ''', '''  ) => (
            <span className="explore-validation-formula-expression">
              <span className="explore-validation-formula-position">
                <span>第</span><span>{position}</span><span>顆</span>
              </span>{" "}
              <span>{displayNumber(baseNumber)}</span>{" "}
              <span>{formula}</span>{" "}
              <span>=</span>{" "}
              <span>{resultNumbers}</span>
            </span>
          );
          ''', "formula position")
          text = once(text, '''              {paginatedResults.map((item) => (
                <article key={item.id}>
          ''', '''              {paginatedResults.map((item, index) => (
                <article
                  data-number-group-start={sameCode && index > 0 && paginatedResults[index - 1]?.prediction !== item.prediction ? "true" : undefined}
                  key={item.id}
                >
          ''', "group boundary")
          path.write_text(text)
          PY

      - name: Patch Explore unit tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def first(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label}: no match")
              return text.replace(old, new, 1)

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1, got {n}")
              return text.replace(old, new, 1)

          path = Path("src/__tests__/MatrixExplorePage.test.tsx")
          text = path.read_text()
          text = first(text, "selectedStreaks: ['準5進6', '準6進7', '準7進8'],", "selectedStreaks: ['準6進7', '準7進8'],", "initial 準4")
          text = once(text, "expect(options.map((button) => button.getAttribute('aria-pressed'))).toEqual(['false', 'true', 'true', 'true']);", "expect(options.map((button) => button.getAttribute('aria-pressed'))).toEqual(['false', 'false', 'true', 'true']);", "pressed defaults")
          text = first(text, "selectedStreaks: ['準7進8', '準9進10', '準11進12'],", "selectedStreaks: ['準9進10', '準11進12'],", "initial 準5")
          text = once(text, '''  fireEvent.click(screen.getByRole('button', { name: '準5進6' }));
          await waitFor(() => expect(matrixApi.fetchExploreList).toHaveBeenLastCalledWith(
            expect.objectContaining({ selectedStreaks: ['準6進7', '準7進8'] }),
          ));
          ''', '''  fireEvent.click(screen.getByRole('button', { name: '準6進7' }));
          await waitFor(() => expect(matrixApi.fetchExploreList).toHaveBeenLastCalledWith(
            expect.objectContaining({ selectedStreaks: ['準7進8'] }),
          ));
          ''', "temporary 準4")
          text = first(text, "selectedStreaks: ['準5進6', '準6進7', '準7進8'],", "selectedStreaks: ['準6進7', '準7進8'],", "restored 準4")
          text = once(text, "expect(screen.getByRole('button', { name: '準5進6' }).getAttribute('aria-pressed')).toBe('true');", "expect(screen.getByRole('button', { name: '準6進7' }).getAttribute('aria-pressed')).toBe('true');", "restored 準4 aria")
          text = once(text, '''  fireEvent.click(screen.getByRole('button', { name: '準7進8' }));

          await waitFor(() => expect(matrixApi.fetchExploreList).toHaveBeenLastCalledWith(
            expect.objectContaining({ selectedStreaks: ['準9進10', '準11進12'] }),
          ));
          ''', '''  fireEvent.click(screen.getByRole('button', { name: '準9進10' }));

          await waitFor(() => expect(matrixApi.fetchExploreList).toHaveBeenLastCalledWith(
            expect.objectContaining({ selectedStreaks: ['準11進12'] }),
          ));
          ''', "temporary 準5")
          text = first(text, "selectedStreaks: ['準7進8', '準9進10', '準11進12'],", "selectedStreaks: ['準9進10', '準11進12'],", "restored 準5")
          text = once(text, "expect(screen.getByRole('button', { name: '準7進8' }).getAttribute('aria-pressed')).toBe('true');", "expect(screen.getByRole('button', { name: '準9進10' }).getAttribute('aria-pressed')).toBe('true');", "restored 準5 aria")

          anchor = "test('再次開始探索會清除同碼與號碼篩選並恢復準4+預設連準', async () => {"
          trailer = '''test('拖牌版路依命中條件使用例外預設連準', async () => {
            render(<MatrixExplorePage onNavigate={vi.fn()} />);
            fireEvent.click(screen.getByRole('button', { name: '拖牌版路推薦' }));
            fireEvent.click(screen.getByRole('button', { name: '開始探索' }));
            await waitFor(() => expect(matrixApi.fetchExploreList).toHaveBeenLastCalledWith(expect.objectContaining({
              roadTypes: ['拖牌'],
              selectedStreaks: ['準5進6', '準6進7', '準7進8'],
            })));

            fireEvent.click(screen.getByRole('button', { name: '準5+（鎖定2碼）' }));
            fireEvent.click(screen.getByRole('button', { name: '開始探索' }));
            await waitFor(() => expect(matrixApi.fetchExploreList).toHaveBeenLastCalledWith(expect.objectContaining({
              roadTypes: ['拖牌'],
              selectedStreaks: ['準6進7', '準7進8', '準9進10', '準11進12'],
            })));
          });

          '''
          text = once(text, anchor, trailer + anchor, "trailer test")
          path.write_text(text)
          PY

      - name: Patch Explore result CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          preview_path = Path("src/explore-result-preview.css")
          preview = preview_path.read_text()
          if "Matrix Explore result refinements: keep Tianyan isolated" in preview:
              raise SystemExit("preview block already exists")
          preview += '''

          /* Matrix Explore result refinements: keep Tianyan isolated from Explore-only spacing. */
          .matrix-explore-main-screen:not(.matrix-tianyan-screen) .explore-validation-card {
            padding-block: 12px;
          }

          .matrix-explore-main-screen:not(.matrix-tianyan-screen) .explore-validation-formula-position {
            display: inline-flex;
            align-items: baseline;
            gap: 1px;
          }

          .matrix-explore-main-screen:not(.matrix-tianyan-screen)
            .explore-validation-group:is([data-lottery="今彩539"], [data-lottery="天天樂"])[data-wide-numbers="false"]
            .explore-validation-numbers {
            gap: calc(clamp(4px, 1.5vw, 6px) + 1px);
            padding-inline: 4px;
          }

          .matrix-explore-main-screen:not(.matrix-tianyan-screen) .explore-validation-result-number {
            font-size: calc(.8em - 2px);
            margin-inline: 2px;
          }
          '''
          preview_path.write_text(preview)

          spacing_path = Path("src/matrix-explore-spacing.css")
          spacing = spacing_path.read_text()
          if "Matrix Explore result table alignment and same-code grouping" in spacing:
              raise SystemExit("spacing block already exists")
          spacing += '''

          /* Matrix Explore result table alignment and same-code grouping. */
          .matrix-explore-main-screen:not(.matrix-tianyan-screen) .road-results-head {
            align-items: end;
            padding-bottom: 5px;
          }

          .matrix-explore-main-screen:not(.matrix-tianyan-screen) .road-results article[data-number-group-start="true"] {
            border-top: 1px solid rgba(230, 183, 106, .72);
          }
          '''
          spacing_path.write_text(spacing)
          PY

      - name: Add prediction-number grouping migration
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("supabase/migrations/20260902040000_matrix_explore_v12_rpc.sql").read_text()
          start = source.index("create or replace function public.matrix_explore_list")
          end = source.index("create or replace function public.matrix_explore_validation")
          function = source[start:end].rstrip()
          old = "case when v_same then filtered.prediction_numbers::text else '' end,"
          new = "case when v_same or v_prediction_number is not null then filtered.prediction_numbers::text else '' end,"
          if function.count(old) != 1:
              raise SystemExit(f"RPC order match count: {function.count(old)}")
          function = function.replace(old, new, 1)
          output = Path("supabase/migrations/20260904040000_matrix_explore_prediction_number_group_order.sql")
          if output.exists():
              raise SystemExit("migration already exists")
          output.write_text(f'''-- Keep prediction-number card filtering grouped in the same order as 同碼 mode.
          begin;

          {function}

          revoke all on function public.matrix_explore_list(jsonb) from public;
          grant execute on function public.matrix_explore_list(jsonb) to anon, authenticated;

          commit;
          ''')
          PY

      - name: GREEN regression proof
        run: node --test tests/matrix-explore-result-refinement-20260904.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Matrix Explore unit regression
        run: npx vitest run src/__tests__/MatrixExplorePage.test.tsx

      - name: Explore layout regressions
        run: node --test tests/matrix-explore-validation-preview-merge.test.mjs tests/matrix-explore-fluid-layout.test.mjs

      - name: Production Pages build
        run: npm run build:pages

      - name: Diff safety check
        run: git diff --check

      - name: Commit approved implementation
        run: |
          rm .github/workflows/tmp-explore-result-refinement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(explore): refine result filters and validation spacing"
          git push origin HEAD:fix/explore-result-refinement-20260904
