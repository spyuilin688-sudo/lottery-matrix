name: One-off fix history floating spacing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-off-fix-history-floating-spacing.yml

permissions:
  contents: write

concurrency:
  group: one-off-fix-history-floating-spacing
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Write regression test and confirm RED
        shell: bash
        run: |
          cat > /tmp/history-floating-spacing.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import test from 'node:test';

          const legacy = readFileSync('src/feature-pages.css', 'utf8');
          const responsive = readFileSync('src/responsive-feature-pages.css', 'utf8');

          test('history floating settings card owns a 16px inline offset after portal', () => {
            const legacyBlock = legacy.match(/\.history-filter-panel\[data-floating="true"\]\s*\{([\s\S]*?)\}/)?.[1] ?? '';
            assert.doesNotMatch(legacyBlock, /\bleft:\s*20px\s*;/);
            assert.doesNotMatch(legacyBlock, /\bright:\s*20px\s*;/);
            const canonicalBlock = responsive.match(/\.history-filter-panel\[data-floating="true"\]\s*\{([\s\S]*?)\}/)?.[1] ?? '';
            assert.match(canonicalBlock, /\bleft:\s*16px\s*;/);
            assert.match(canonicalBlock, /\bright:\s*16px\s*;/);
          });
          EOF
          if node --test /tmp/history-floating-spacing.test.mjs; then
            echo 'Expected the pre-fix regression test to fail.' >&2
            exit 1
          else
            echo 'RED confirmed: current main does not satisfy the history floating 16px contract.'
          fi

      - name: Apply minimal source fix and persist regression test
        shell: bash
        run: |
          cp /tmp/history-floating-spacing.test.mjs tests/history-floating-spacing.test.mjs
          python - <<'PY'
          from pathlib import Path

          legacy_path = Path('src/feature-pages.css')
          legacy = legacy_path.read_text()
          old_legacy = '''.history-filter-panel[data-floating="true"] {
            position: fixed;
            z-index: 45;
            left: 20px;
            right: 20px;
            width: auto;'''
          new_legacy = '''.history-filter-panel[data-floating="true"] {
            position: fixed;
            z-index: 45;
            width: auto;'''
          if old_legacy not in legacy:
            raise SystemExit('Legacy history floating spacing source not found')
          legacy_path.write_text(legacy.replace(old_legacy, new_legacy, 1))

          responsive_path = Path('src/responsive-feature-pages.css')
          responsive = responsive_path.read_text()
          old_position = '''  position: fixed;
            z-index: 45;
            left: var(--tool-page-inline);
            right: var(--tool-page-inline);
            width: auto;'''
          new_position = '''  position: fixed;
            z-index: 45;
            width: auto;'''
          if old_position not in responsive:
            raise SystemExit('Canonical shared floating position source not found')
          responsive = responsive.replace(old_position, new_position, 1)
          anchor = '''  box-shadow: 0 12px 34px rgba(0, 0, 0, .72), inset 0 0 18px rgba(150, 102, 34, .04);
          }

          .history-filter-panel[hidden],'''
          replacement = '''  box-shadow: 0 12px 34px rgba(0, 0, 0, .72), inset 0 0 18px rgba(150, 102, 34, .04);
          }

          .history-filter-panel[data-floating="true"] {
            left: 16px;
            right: 16px;
          }

          .reference-query-panel[data-floating="true"],
          .tongxing-query[data-floating="true"] {
            left: var(--tool-page-inline);
            right: var(--tool-page-inline);
          }

          .history-filter-panel[hidden],'''
          if anchor not in responsive:
            raise SystemExit('Canonical floating block anchor not found')
          responsive_path.write_text(responsive.replace(anchor, replacement, 1))
          PY

      - name: Confirm GREEN
        run: node --test tests/history-floating-spacing.test.mjs

      - name: Install and build
        run: |
          npm ci
          npm run build
          git diff --check

      - name: Commit fix and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/one-off-fix-history-floating-spacing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/feature-pages.css src/responsive-feature-pages.css tests/history-floating-spacing.test.mjs .github/workflows/one-off-fix-history-floating-spacing.yml
          git commit -m 'Fix history floating settings inline spacing'
          git push origin HEAD:main
