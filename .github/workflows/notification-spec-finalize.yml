name: Finalize notification spec compliance

on:
  push:
    branches: ["通知"]
    paths:
      - .github/workflows/notification-spec-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout notification branch
        uses: actions/checkout@v4
        with:
          ref: "通知"
          fetch-depth: 0

      - name: Guard branch and expected base
        run: |
          test "${GITHUB_REF_NAME}" = "通知"
          test "$(git branch --show-current)" = "通知"
          git merge-base --is-ancestor 741f848247c9d198dedd935b94937b8beb22fdd7 HEAD

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Strengthen notification regression first
        run: |
          cat > tests/notification-layout-docx.test.mjs <<'EOF'
          import fs from 'node:fs';
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import zlib from 'node:zlib';

          const featureCss = fs.readFileSync('src/feature-pages.css', 'utf8');
          const runtimeCss = fs.readFileSync('src/styles.css', 'utf8');
          const prototypeCss = fs.readFileSync('src/prototype.css', 'utf8');
          const featureTsx = fs.readFileSync('src/FeaturePages.tsx', 'utf8');

          const iconPaths = [
            'public/resources/notify-bet.png',
            'public/resources/notify-result.png',
            'public/resources/notify-win.png',
            'public/resources/notify-status.png',
            'public/resources/notify-card.png',
            'public/resources/notify-collision.png',
            'public/resources/notify-expiry.png',
            'public/resources/notify-system.png',
          ];

          function paeth(a, b, c) {
            const p = a + b - c;
            const pa = Math.abs(p - a);
            const pb = Math.abs(p - b);
            const pc = Math.abs(p - c);
            return pa <= pb && pa <= pc ? a : pb <= pc ? b : c;
          }

          function readPngAlphaBounds(path) {
            const png = fs.readFileSync(path);
            assert.deepEqual([...png.subarray(0, 8)], [137, 80, 78, 71, 13, 10, 26, 10], `${path} must be a PNG`);
            let offset = 8;
            let width = 0;
            let height = 0;
            let bitDepth = 0;
            let colorType = 0;
            const idat = [];
            while (offset < png.length) {
              const length = png.readUInt32BE(offset);
              const type = png.toString('ascii', offset + 4, offset + 8);
              const dataStart = offset + 8;
              const dataEnd = dataStart + length;
              if (type === 'IHDR') {
                width = png.readUInt32BE(dataStart);
                height = png.readUInt32BE(dataStart + 4);
                bitDepth = png[dataStart + 8];
                colorType = png[dataStart + 9];
              } else if (type === 'IDAT') {
                idat.push(png.subarray(dataStart, dataEnd));
              } else if (type === 'IEND') {
                break;
              }
              offset = dataEnd + 4;
            }
            assert.equal(bitDepth, 8, `${path} must use 8-bit PNG channels`);
            assert.ok(colorType === 6 || colorType === 4, `${path} must retain alpha transparency`);
            const bpp = colorType === 6 ? 4 : 2;
            const alphaOffset = colorType === 6 ? 3 : 1;
            const stride = width * bpp;
            const raw = zlib.inflateSync(Buffer.concat(idat));
            let rawOffset = 0;
            let previous = Buffer.alloc(stride);
            let minX = width;
            let minY = height;
            let maxX = -1;
            let maxY = -1;
            for (let y = 0; y < height; y += 1) {
              const filter = raw[rawOffset];
              rawOffset += 1;
              const scan = Buffer.from(raw.subarray(rawOffset, rawOffset + stride));
              rawOffset += stride;
              for (let i = 0; i < stride; i += 1) {
                const left = i >= bpp ? scan[i - bpp] : 0;
                const up = previous[i];
                const upLeft = i >= bpp ? previous[i - bpp] : 0;
                if (filter === 1) scan[i] = (scan[i] + left) & 255;
                else if (filter === 2) scan[i] = (scan[i] + up) & 255;
                else if (filter === 3) scan[i] = (scan[i] + Math.floor((left + up) / 2)) & 255;
                else if (filter === 4) scan[i] = (scan[i] + paeth(left, up, upLeft)) & 255;
                else assert.equal(filter, 0, `${path} uses an unsupported PNG filter`);
              }
              for (let x = 0; x < width; x += 1) {
                if (scan[(x * bpp) + alphaOffset] > 0) {
                  minX = Math.min(minX, x);
                  minY = Math.min(minY, y);
                  maxX = Math.max(maxX, x);
                  maxY = Math.max(maxY, y);
                }
              }
              previous = scan;
            }
            assert.ok(maxX >= minX && maxY >= minY, `${path} must contain visible pixels`);
            return {
              path,
              width,
              height,
              minX,
              minY,
              maxX,
              maxY,
              visibleWidth: maxX - minX + 1,
              visibleHeight: maxY - minY + 1,
              centerX: (minX + maxX) / 2,
              centerY: (minY + maxY) / 2,
            };
          }

          test('notification page follows the uploaded 390px layout specification', () => {
            assert.match(featureCss, /\.notifications-screen \.feature-body \{ padding: 0 12px calc\(var\(--bottom-navigation-height\) \+ var\(--mobile-safe-area-height, 34px\) \+ 12px\); \}/);
            assert.match(featureCss, /\.notification-list \{ display: grid; gap: 8px; \}/);
            assert.match(featureCss, /\.notification-row \{[^}]*width: 100%;[^}]*height: 80px;[^}]*padding: 8px;/);
            assert.match(featureCss, /\.notification-heading \{[^}]*grid-template-columns: 58px minmax\(0, 1fr\) 88px 46px;[^}]*column-gap: 8px;/);
            assert.match(featureCss, /\.notification-icon \{[^}]*width: 58px;[^}]*height: 58px;/);
            assert.match(featureCss, /\.notification-icon img \{[^}]*width: 58px;[^}]*height: 58px;[^}]*object-fit: contain;/);
            assert.doesNotMatch(featureCss, /\.notification-icon \{[^}]*border:/);
            assert.doesNotMatch(featureCss, /\.notification-icon \{[^}]*box-shadow:/);
            assert.match(featureCss, /\.notification-actions \{ display: contents; \}/);
            assert.match(featureCss, /\.notification-actions > button:first-child \{[^}]*width: 88px;[^}]*height: 38px;[^}]*border-radius: 19px;[^}]*font-size: 14px;[^}]*font-weight: 600;/);
            assert.match(featureCss, /\.notification-row h2 \{[^}]*color: #F2F2F2;[^}]*font-size: 17px;[^}]*font-weight: 700;[^}]*line-height: 23px;[^}]*letter-spacing: 0;/);
            assert.match(featureCss, /\.notification-row h2 em \{[^}]*height: 22px;[^}]*padding: 0 8px;[^}]*border-radius: 7px;[^}]*font-size: 12px;[^}]*font-weight: 600;/);
            assert.match(featureCss, /\.notifications-screen \.notification-row \{[^}]*border-radius: 14px;[^}]*background: #020C12;/);
            assert.match(featureCss, /\.toggle \{[^}]*width: 46px;[^}]*height: 44px;/);
            assert.match(featureCss, /\.toggle::before \{[^}]*width: 46px;[^}]*height: 28px;[^}]*border: 1px solid #46505C;[^}]*border-radius: 14px;[^}]*background: #151B22;/);
            assert.match(featureCss, /\.toggle span \{[^}]*width: 24px;[^}]*height: 24px;/);
            assert.match(featureCss, /\.toggle\[data-checked="true"\]::before \{[^}]*background: #D99B00;/);
            assert.match(featureCss, /\.toggle\[data-checked="true"\] span \{[^}]*translateX\(18px\)/);
            assert.doesNotMatch(featureCss, /@media \(max-width: 370px\) \{\s*\.notification-heading/);
            assert.doesNotMatch(featureCss, /\.notifications-screen \.feature-body,\s*\.profile-screen \.feature-body/);
            assert.match(runtimeCss, /\.mobile-page:not\(:has\(\.notifications-screen\)\) \.mobile-scrollbar\[data-visible="true"\] \{\s*opacity: 1;\s*\}/);
          });

          test('notification page has no stale notification-only layout sources', () => {
            assert.doesNotMatch(featureCss, /\.notification-note\s*\{/);
            assert.doesNotMatch(featureTsx, /className="panel notification-row"/);
            assert.doesNotMatch(featureTsx, /notification-icon--expanded/);
            assert.doesNotMatch(featureTsx, /className="notification-note"/);
            assert.doesNotMatch(featureTsx, /所有通知設定將立即生效/);
            assert.match(featureTsx, /<article className="notification-row" key=\{key\}>/);
            assert.match(featureTsx, /<div className="notification-icon"><img src=\{icon\} alt="" \/><\/div>/);
          });

          test('notification layout has one authoritative sizing and spacing source', () => {
            assert.doesNotMatch(featureCss, /\.notifications-screen\s*\{[^}]*padding-top:/s);
            const notificationBlocks = [...featureCss.matchAll(/([^{}]*\.notification-row[^{}]*)\{([^{}]*)\}/g)];
            const sharedSizingOverrides = notificationBlocks.filter(([, selector, body]) =>
              selector.includes(',') && /(?:^|;)\s*(?:height|max-height)\s*:/.test(body),
            );
            assert.equal(
              sharedSizingOverrides.length,
              0,
              `notification-row must not be included in shared height/max-height rules: ${sharedSizingOverrides.map(([, selector]) => selector.trim()).join(' | ')}`,
            );
            assert.match(
              prototypeCss,
              /\.bottom-nav-brand-screen:not\(\.notifications-screen\) > \.feature-body \{\s*padding-bottom: var\(--layout-bottom-nav-clearance\);\s*\}/,
            );
            assert.doesNotMatch(
              prototypeCss,
              /\.bottom-nav-brand-screen > \.feature-body \{\s*padding-bottom: var\(--layout-bottom-nav-clearance\);\s*\}/,
            );
          });

          test('notification icon source files use one square canvas and centered visible artwork scale', () => {
            const metrics = iconPaths.map(readPngAlphaBounds);
            const first = metrics[0];
            for (const metric of metrics) {
              assert.equal(metric.width, metric.height, `${metric.path} canvas must be square`);
              assert.equal(metric.width, first.width, `${metric.path} canvas width must match all notification icons`);
              assert.equal(metric.height, first.height, `${metric.path} canvas height must match all notification icons`);
              assert.ok(Math.abs(metric.centerX - ((metric.width - 1) / 2)) <= 1.5, `${metric.path} visible artwork must be horizontally centered`);
              assert.ok(Math.abs(metric.centerY - ((metric.height - 1) / 2)) <= 1.5, `${metric.path} visible artwork must be vertically centered`);
            }
            const dominantSizes = metrics.map((metric) => Math.max(metric.visibleWidth, metric.visibleHeight));
            assert.ok(Math.max(...dominantSizes) - Math.min(...dominantSizes) <= 2, `notification icons must use the same visible artwork scale: ${JSON.stringify(metrics)}`);
          });
          EOF

      - name: Confirm regression fails before implementation
        run: |
          if node --test tests/notification-layout-docx.test.mjs; then
            echo "Expected strengthened notification regression to fail before implementation."
            exit 1
          fi

      - name: Remove stale notification sources and correct spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('src/feature-pages.css')
          css = css_path.read_text()
          old_padding = '.notifications-screen .feature-body { padding: 8px 12px calc(var(--bottom-navigation-height) + var(--mobile-safe-area-height, 34px) + 12px); }'
          new_padding = '.notifications-screen .feature-body { padding: 0 12px calc(var(--bottom-navigation-height) + var(--mobile-safe-area-height, 34px) + 12px); }'
          if css.count(old_padding) != 1:
              raise SystemExit(f'Expected exactly one old notification body padding rule, found {css.count(old_padding)}')
          css = css.replace(old_padding, new_padding, 1)
          note_rule = '.notification-note { margin: 14px auto 4px; padding: 0 12px; color: #aaa49a; font-size: 11.5px; font-weight: 400; line-height: 1.5; letter-spacing: .25px; text-align: center; }\n'
          if css.count(note_rule) != 1:
              raise SystemExit(f'Expected exactly one notification-note CSS rule, found {css.count(note_rule)}')
          css = css.replace(note_rule, '', 1)
          css_path.write_text(css)

          tsx_path = Path('src/FeaturePages.tsx')
          tsx = tsx_path.read_text()
          old_article = '<article className="panel notification-row" key={key}>'
          if tsx.count(old_article) != 1:
              raise SystemExit(f'Expected one notification panel row, found {tsx.count(old_article)}')
          tsx = tsx.replace(old_article, '<article className="notification-row" key={key}>', 1)
          old_icon = '<div className={`notification-icon${key === "card" || key === "collision" || key === "system" ? " notification-icon--expanded" : ""}`}><img src={icon} alt="" /></div>'
          if tsx.count(old_icon) != 1:
              raise SystemExit(f'Expected one expanded notification icon expression, found {tsx.count(old_icon)}')
          tsx = tsx.replace(old_icon, '<div className="notification-icon"><img src={icon} alt="" /></div>', 1)
          note = '      <p className="notification-note">所有通知設定將立即生效</p>\n'
          if tsx.count(note) != 1:
              raise SystemExit(f'Expected one notification note paragraph, found {tsx.count(note)}')
          tsx = tsx.replace(note, '', 1)
          tsx_path.write_text(tsx)
          PY

      - name: Audit and normalize notification PNG canvases only when needed
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          paths = [
              Path('public/resources/notify-bet.png'),
              Path('public/resources/notify-result.png'),
              Path('public/resources/notify-win.png'),
              Path('public/resources/notify-status.png'),
              Path('public/resources/notify-card.png'),
              Path('public/resources/notify-collision.png'),
              Path('public/resources/notify-expiry.png'),
              Path('public/resources/notify-system.png'),
          ]

          def metrics(path):
              image = Image.open(path).convert('RGBA')
              alpha = image.getchannel('A')
              bbox = alpha.getbbox()
              if not bbox:
                  raise SystemExit(f'{path} has no visible pixels')
              left, top, right, bottom = bbox
              return {
                  'path': str(path),
                  'size': image.size,
                  'bbox': bbox,
                  'visible': (right-left, bottom-top),
                  'center': ((left + right - 1) / 2, (top + bottom - 1) / 2),
              }

          before = [metrics(path) for path in paths]
          print('NOTIFICATION_ICON_METRICS_BEFORE')
          for item in before:
              print(item)

          canvas_sizes = {item['size'] for item in before}
          square_canvas = all(w == h for w, h in canvas_sizes)
          same_canvas = len(canvas_sizes) == 1
          centered = all(abs(item['center'][0] - ((item['size'][0] - 1) / 2)) <= 1.5 and abs(item['center'][1] - ((item['size'][1] - 1) / 2)) <= 1.5 for item in before)
          dominant = [max(item['visible']) for item in before]
          same_scale = max(dominant) - min(dominant) <= 2

          if square_canvas and same_canvas and centered and same_scale:
              print('Notification PNG canvases already comply; no binary asset changes required.')
          else:
              canvas = max(max(item['size']) for item in before)
              target_span = round(canvas * 0.875)
              if target_span % 2:
                  target_span -= 1
              for path in paths:
                  image = Image.open(path).convert('RGBA')
                  bbox = image.getchannel('A').getbbox()
                  crop = image.crop(bbox)
                  scale = min(target_span / crop.width, target_span / crop.height)
                  new_size = (max(1, round(crop.width * scale)), max(1, round(crop.height * scale)))
                  crop = crop.resize(new_size, Image.Resampling.LANCZOS)
                  normalized = Image.new('RGBA', (canvas, canvas), (0, 0, 0, 0))
                  x = (canvas - crop.width) // 2
                  y = (canvas - crop.height) // 2
                  normalized.alpha_composite(crop, (x, y))
                  normalized.save(path, optimize=True)
              print(f'Normalized notification PNG canvases to {canvas}x{canvas}, centered with dominant visible span {target_span}px.')

          after = [metrics(path) for path in paths]
          print('NOTIFICATION_ICON_METRICS_AFTER')
          for item in after:
              print(item)
          PY

      - name: Update runtime lock
        run: npm run update:runtime-lock

      - name: Verify notification regression
        run: node --test tests/notification-layout-docx.test.mjs

      - name: Verify runtime lock
        run: npm run check:runtime

      - name: Verify production build
        run: npm run build

      - name: Verify diff scope and shared/global guards
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          disallowed="$(printf '%s\n' "$changed" | grep -Ev '^(src/FeaturePages\.tsx|src/feature-pages\.css|mobile-runtime\.lock\.json|tests/notification-layout-docx\.test\.mjs|public/resources/notify-(bet|result|win|status|card|collision|expiry|system)\.png|\.github/workflows/notification-spec-finalize\.yml)$' || true)"
          test -z "$disallowed" || { echo "Unexpected files changed:"; echo "$disallowed"; exit 1; }
          test -z "$(git diff --name-only -- src/design-tokens.css src/styles.css src/prototype.css src/brand-header-unify.css src/BottomNavigation.tsx src/BrandLogo.tsx)"
          git diff -- src/FeaturePages.tsx src/feature-pages.css tests/notification-layout-docx.test.mjs

      - name: Commit notification-only finalization
        run: |
          rm .github/workflows/notification-spec-finalize.yml
          git config user.name "spy854540-cmd"
          git config user.email "spy854540@gmail.com"
          git add src/FeaturePages.tsx src/feature-pages.css mobile-runtime.lock.json tests/notification-layout-docx.test.mjs public/resources/notify-bet.png public/resources/notify-result.png public/resources/notify-win.png public/resources/notify-status.png public/resources/notify-card.png public/resources/notify-collision.png public/resources/notify-expiry.png public/resources/notify-system.png .github/workflows/notification-spec-finalize.yml
          git commit -m "fix: finalize notification page spec compliance"
          git push origin HEAD:通知
