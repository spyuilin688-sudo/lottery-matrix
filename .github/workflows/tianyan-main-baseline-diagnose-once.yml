name: Diagnose main unit baseline once

on:
  push:
    branches: ['fix/tianyan-result-ui-rules-20260903']
    paths:
      - '.github/workflows/tianyan-main-baseline-diagnose-once.yml'

permissions:
  contents: write

jobs:
  diagnose-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run main full unit suite and capture output
        shell: bash
        run: |
          set +e
          npm run test:unit -- --reporter=verbose > /tmp/main-unit.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            printf 'ALL_MAIN_UNIT_TESTS_PASSED\n' > /tmp/main-unit-diagnostic.txt
          else
            tail -n 500 /tmp/main-unit.log > /tmp/main-unit-diagnostic.txt
          fi
          git fetch origin fix/tianyan-result-ui-rules-20260903
          git checkout fix/tianyan-result-ui-rules-20260903
          cp /tmp/main-unit-diagnostic.txt main-unit-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main-unit-diagnostic.txt
          git commit -m 'chore: capture main unit baseline'
          git push origin HEAD:fix/tianyan-result-ui-rules-20260903
          exit "$status"
