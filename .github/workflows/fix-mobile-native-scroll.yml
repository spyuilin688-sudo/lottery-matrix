name: Refresh mobile runtime lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-mobile-native-scroll.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh protected runtime hashes
        run: npm run update:runtime-lock
      - name: Verify protected runtime and build
        run: |
          npm run check:runtime
          node --test tests/mobile-native-scroll.test.mjs
          npm run build
          git diff --check
      - name: Remove temporary workflow and commit lock
        run: |
          rm .github/workflows/fix-mobile-native-scroll.yml
          git config user.name "spy854540-cmd"
          git config user.email "spy854540@gmail.com"
          git add mobile-runtime.lock.json .github/workflows/fix-mobile-native-scroll.yml
          git commit -m "chore: refresh mobile runtime lock"
          git push origin main
