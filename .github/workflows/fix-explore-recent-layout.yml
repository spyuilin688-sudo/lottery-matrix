name: Fix Explore recent layout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-explore-recent-layout.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply corrected styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/matrix-explore-spacing.css')
          s = p.read_text()
          s = s.replace('  margin-bottom: 4px;\n  text-align: left;', '  padding-bottom: 4px;\n  text-align: left;', 1)
          s = s.replace('.matrix-explore-main-screen .history-row > :nth-child(1) {\n  font-family:', '.matrix-explore-main-screen .history-row:not(.history-head) > :nth-child(1) {\n  font-family:', 1)
          s = s.replace('  gap: clamp(.125rem, .8vw, .25rem);\n}\n\n.matrix-explore-main-screen .history-special-number {', '  gap: clamp(.25rem, 1.2vw, .375rem);\n}\n\n.matrix-explore-main-screen .history-special-number {', 1)
          s = s.replace('  margin-left: .25rem;\n  flex: 0 0 auto;\n  gap: .1875rem;', '  margin-left: .375rem;\n  flex: 0 0 auto;\n  gap: .25rem;', 1)
          s = s.replace('  display: grid;\n  height: auto;\n  flex: 0 0 auto;\n  grid-template-rows: 0 auto;\n  row-gap: 0;\n  place-items: center;', '  display: flex;\n  height: auto;\n  flex: 0 0 auto;\n  align-items: center;\n  justify-content: center;', 1)
          s = s.replace('.matrix-explore-main-screen .history-special-label {\n  margin: 0;', '.matrix-explore-main-screen .history-special-label {\n  display: none;\n  margin: 0;', 1)
          p.write_text(s)
          Path('.github/workflows/fix-explore-recent-layout.yml').unlink()
          PY
      - name: Commit corrected Explore layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: correct Explore labels and recent draw layout'
          git push origin main
