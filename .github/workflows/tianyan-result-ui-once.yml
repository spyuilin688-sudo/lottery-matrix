name: Apply Matrix Tianyan result UI once

on:
  push:
    branches: ['fix/tianyan-result-ui-rules-20260903']
    paths:
      - '.github/workflows/tianyan-result-ui-once.yml'

permissions:
  contents: write

jobs:
  apply-tianyan-result-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tianyan-result-ui-rules-20260903
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write Tianyan behavior tests first
        shell: bash
        run: |
          cat > src/__tests__/MatrixTianyanPage.test.tsx <<'EOF'
          // @vitest-environment jsdom

          import { fireEvent, render, screen } from '@testing-library/react';
          import { beforeEach, expect, test, vi } from 'vitest';
          import { MatrixExplorePage } from '../FeaturePages';

          const matrixApi = vi.hoisted(() => ({
            fetchExploreList: vi.fn(),
            fetchExploreValidation: vi.fn(),
            fetchTianyanList: vi.fn(),
            fetchTianyanValidation: vi.fn(),
          }));

          vi.mock('../matrix-algorithm-api', () => matrixApi);

          const envelope = {
            kind: 'tianyan',
            lottery: '今彩539',
            drawPeriod: '114000123',
            analysisVersion: '114000123:v1',
            status: 'complete',
            total: 1,
            items: [{
              id: 'tianyan-api-1',
              number: '07',
              lockedPosition: 1,
              predictionDistance: 1,
              consecutive: '準11進12',
              highestStreak: 11,
              predictionNumbers: ['14', '27'],
              roadType: '複合',
              roadTypeLabel: '加減合值',
              hitCondition: '準5+（鎖定2碼）',
              ruleIds: ['r1', 'r2'],
            }],
          } as const;

          const validation = {
            itemId: 'tianyan-api-1',
            sourceA: {
              sourcePeriod: '114000130',
              sourceNumbers: [7, 11, 15, 22, 30],
              lockedPosition: 1,
              lockedNumber: 7,
              predictionDistance: 1,
            },
            rules: [
              {
                id: 'r1', validationPeriodOffset: -1, validationPeriod: '114000129', validationPosition: 2,
                referenceOffset: -1, referencePosition: 2, algorithmType: '加減', value: 3, ruleValue: 3,
                currentBaseNumber: 11, currentPredictionNumber: 14,
              },
              {
                id: 'r2', validationPeriodOffset: -2, validationPeriod: '114000128', validationPosition: 4,
                referenceOffset: -2, referencePosition: 4, algorithmType: '合值', value: 5, ruleValue: 5,
                currentBaseNumber: 22, currentPredictionNumber: 27,
              },
            ],
            groupCount: 11,
            minimumIndependentHits: 4,
            rule1Only: 4,
            rule2Only: 4,
            bothHit: 3,
            mergedSearchPredictionNumbers: ['14', '27'],
            historicalValidation: [{
              group: '1',
              sourcePeriod: '114000120',
              sourceNumbers: [7, 11, 15, 22, 30],
              lockedPosition: 1,
              lockedNumber: 7,
              predictionPeriod: '114000123',
              predictionNumbers: [14, 18, 27, 31, 35],
              rule1: {
                validationPeriodOffset: -1, validationPeriod: '114000119', validationPosition: 2,
                baseNumber: 11, algorithmType: '加減', candidateValues: [3], ruleValue: 3,
                calculationResult: 14, hit: true,
              },
              rule2: {
                validationPeriodOffset: -2, validationPeriod: '114000118', validationPosition: 4,
                baseNumber: 22, algorithmType: '合值', candidateValues: [5], ruleValue: 5,
                calculationResult: 27, hit: true,
              },
              hitType: 'bothHit',
              hitNumbers: [14, 27],
              success: true,
            }],
          } as const;

          beforeEach(() => {
            document.body.innerHTML = '';
            matrixApi.fetchTianyanList.mockReset().mockResolvedValue(envelope);
            matrixApi.fetchTianyanValidation.mockReset().mockResolvedValue({
              ...envelope,
              itemId: 'tianyan-api-1',
              validation,
            });
            globalThis.fetch = vi.fn().mockResolvedValue({ ok: true, json: async () => ({ records: [] }) }) as typeof fetch;
          });

          test('天衍移除近10期且命中條件維持準5+鎖定2碼', () => {
            render(<MatrixExplorePage onNavigate={vi.fn()} title="Matrix 天衍" roadTypes={['複合版路']} />);
            expect(screen.queryByText('近10期開獎號碼')).toBeNull();
            expect(screen.getByRole('button', { name: '準5+（鎖定2碼）' })).toBeTruthy();
            expect(screen.queryByRole('button', { name: '準4+（鎖定1碼）' })).toBeNull();
          });

          test('天衍連準篩選固定為指定五項並以五項作為探索條件', async () => {
            render(<MatrixExplorePage onNavigate={vi.fn()} title="Matrix 天衍" roadTypes={['複合版路']} />);
            fireEvent.click(screen.getByRole('button', { name: '開始探索' }));
            expect(await screen.findByText('14.27')).toBeTruthy();
            expect(matrixApi.fetchTianyanList).toHaveBeenCalledWith({
              lottery: '今彩539',
              exploreDateOffset: 0,
              selectedStreaks: ['準11進12', '準14進15', '準15進16', '準16進17', '準17進18'],
            });

            fireEvent.click(screen.getByRole('button', { name: /連準篩選/ }));
            for (const label of ['準11進12', '準14進15', '準15進16', '準16進17', '準17進18']) {
              expect(screen.getByRole('button', { name: label })).toBeTruthy();
            }
            expect(screen.queryByRole('button', { name: '準5進6' })).toBeNull();
          });

          test('天衍結果列依兩條規則顯示複合版路分類', async () => {
            render(<MatrixExplorePage onNavigate={vi.fn()} title="Matrix 天衍" roadTypes={['複合版路']} />);
            fireEvent.click(screen.getByRole('button', { name: '開始探索' }));
            expect(await screen.findByText('加減合值')).toBeTruthy();
          });

          test('天衍驗證比照 Matrix 探索三欄，兩條公式位於右欄第一列與第二列', async () => {
            render(<MatrixExplorePage onNavigate={vi.fn()} title="Matrix 天衍" roadTypes={['複合版路']} />);
            fireEvent.click(screen.getByRole('button', { name: '開始探索' }));
            fireEvent.click(await screen.findByRole('button', { name: /展開版路/ }));

            const region = await screen.findByRole('region', { name: '天衍驗證過程' });
            const historicalGroup = region.querySelector('.explore-validation-group');
            expect(historicalGroup).toBeTruthy();
            const formulas = historicalGroup?.querySelectorAll('.explore-validation-formula-row') ?? [];
            expect(formulas.length).toBe(3);
            expect(formulas[0]?.textContent?.replace(/\s/g, '')).toContain('第2顆11+3=14');
            expect(formulas[1]?.textContent?.replace(/\s/g, '')).toContain('第4顆22合值5=27');
            expect(formulas[2]?.textContent?.replace(/\s/g, '')).toContain('14、27');
            expect(historicalGroup?.querySelector('.explore-validation-issue')?.textContent).toBe('114120');
          });

          test('天衍只有展開結果時才讀取驗證資料', async () => {
            render(<MatrixExplorePage onNavigate={vi.fn()} title="Matrix 天衍" roadTypes={['複合版路']} />);
            fireEvent.click(screen.getByRole('button', { name: '開始探索' }));
            expect(await screen.findByText('14.27')).toBeTruthy();
            expect(matrixApi.fetchTianyanValidation).not.toHaveBeenCalled();
            fireEvent.click(screen.getByRole('button', { name: /展開版路/ }));
            expect(matrixApi.fetchTianyanValidation).toHaveBeenCalledWith(
              expect.objectContaining({ analysisVersion: '114000123:v1', drawPeriod: '114000123' }),
              'tianyan-api-1',
            );
          });

          test('未登入時顯示登入要求，而非泛用 API 錯誤', async () => {
            matrixApi.fetchTianyanList.mockRejectedValue({ code: 'AUTH_REQUIRED' });
            render(<MatrixExplorePage onNavigate={vi.fn()} title="Matrix 天衍" roadTypes={['複合版路']} />);
            fireEvent.click(screen.getByRole('button', { name: '開始探索' }));
            expect((await screen.findByRole('alert')).textContent).toBe('請先登入後再使用 Matrix 天衍');
          });
          EOF

      - name: RED - confirm approved Tianyan behavior is absent before implementation
        shell: bash
        run: |
          set +e
          npm run test:unit -- src/__tests__/MatrixTianyanPage.test.tsx
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected Tianyan behavior tests to fail before implementation.'
            exit 1
          fi

      - name: GREEN - update Tianyan UI and API contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          feature_path = Path('src/FeaturePages.tsx')
          source = feature_path.read_text()

          old_union = '''  type ConsecutiveOption =
            | "準4進5"
            | "準5進6"
            | "準6進7"
            | "準7進8"
            | "準9進10"
            | "準11進12";'''
          new_union = '''  type ConsecutiveOption =
            | "準4進5"
            | "準5進6"
            | "準6進7"
            | "準7進8"
            | "準9進10"
            | "準11進12"
            | "準14進15"
            | "準15進16"
            | "準16進17"
            | "準17進18";'''
          if source.count(old_union) != 1:
              raise SystemExit(f'consecutive union anchor count={source.count(old_union)}')
          source = source.replace(old_union, new_union, 1)

          old_filters = '''    "準5+（鎖定2碼）": title === "Matrix 天衍"
              ? ["準5進6", "準6進7", "準7進8"]
              : ["準5進6", "準6進7", "準7進8", "準9進10", "準11進12"],
          };
          const defaultFilters: Record<string, ConsecutiveOption[]> = {
            "準4+（鎖定1碼）": ["準5進6", "準6進7", "準7進8"],
            "準5+（鎖定2碼）": title === "Matrix 天衍"
              ? ["準5進6", "準6進7", "準7進8"]
              : ["準7進8", "準9進10", "準11進12"],'''
          new_filters = '''    "準5+（鎖定2碼）": title === "Matrix 天衍"
              ? ["準11進12", "準14進15", "準15進16", "準16進17", "準17進18"]
              : ["準5進6", "準6進7", "準7進8", "準9進10", "準11進12"],
          };
          const defaultFilters: Record<string, ConsecutiveOption[]> = {
            "準4+（鎖定1碼）": ["準5進6", "準6進7", "準7進8"],
            "準5+（鎖定2碼）": title === "Matrix 天衍"
              ? ["準11進12", "準14進15", "準15進16", "準16進17", "準17進18"]
              : ["準7進8", "準9進10", "準11進12"],'''
          if source.count(old_filters) != 1:
              raise SystemExit(f'filter anchor count={source.count(old_filters)}')
          source = source.replace(old_filters, new_filters, 1)

          old_mapping = '      algorithmType: "複合版路",\n'
          if source.count(old_mapping) != 1:
              raise SystemExit(f'Tianyan algorithm mapping count={source.count(old_mapping)}')
          source = source.replace(old_mapping, '      algorithmType: item.roadTypeLabel,\n', 1)

          old_history = '''      <HistoryList
                lottery={lottery}
                numberOrder={numberOrder}
                onOpenHistory={() => onNavigate("history")}
                collapsible
                collapseControl="title"
                showOrderText={false}
                expanded={historyExpanded}
                onExpandedChange={setHistoryExpanded}
              />'''
          new_history = '''      {title === "Matrix 探索" ? (
                <HistoryList
                  lottery={lottery}
                  numberOrder={numberOrder}
                  onOpenHistory={() => onNavigate("history")}
                  collapsible
                  collapseControl="title"
                  showOrderText={false}
                  expanded={historyExpanded}
                  onExpandedChange={setHistoryExpanded}
                />
              ) : null}'''
          if source.count(old_history) != 1:
              raise SystemExit(f'HistoryList anchor count={source.count(old_history)}')
          source = source.replace(old_history, new_history, 1)

          old_label = '<span>{item.algorithmType.endsWith("版路") ? item.algorithmType : `${item.algorithmType}版路`}</span>'
          new_label = '<span>{title === "Matrix 天衍" ? item.algorithmType : item.algorithmType.endsWith("版路") ? item.algorithmType : `${item.algorithmType}版路`}</span>'
          if source.count(old_label) != 1:
              raise SystemExit(f'road label anchor count={source.count(old_label)}')
          source = source.replace(old_label, new_label, 1)

          tianyan_function = r'''function TianyanValidationProcess\(\{[\s\S]*?\n\}\n\nexport function MatrixExplorePage'''
          replacement = r'''function TianyanValidationProcess({
            lottery,
            validation,
            loading,
          }: {
            lottery: LotteryId;
            validation?: TianyanValidation;
            loading: boolean;
          }) {
            const contentProtected = useExploreValidationProtection();
            if (loading) return <p className="empty-result">驗證資料載入中</p>;
            if (!validation) return <p className="empty-result">無驗證資料</p>;

            type TianyanDisplayRow = {
              key: string;
              period: string;
              numbers: Array<string | number>;
              sourceNumber?: number;
              hitNumbers?: number[];
            };

            const displayNumber = (value: string | number) => normalizeBallNumber(String(value));
            const values = (numbers: Array<string | number>) => numbers.map(displayNumber);
            const validationFormula = (
              position: number,
              baseNumber: number,
              algorithmType: string,
              ruleValue: number,
              calculationResult: number,
            ) => (
              <span className="explore-validation-formula-expression">
                <span>第</span>
                <span>{position}</span>
                <span>顆</span>
                <span>{displayNumber(baseNumber)}</span>
                {algorithmType.startsWith("合值") ? (
                  <>
                    <span>合值</span>
                    <span>{ruleValue}</span>
                  </>
                ) : <span>{`+${ruleValue}`}</span>}
                <span>=</span>
                <span>{displayNumber(calculationResult)}</span>
              </span>
            );
            const resultFormula = (resultNumbers: Array<string | number>) => (
              <>［{" "}<strong className="explore-validation-result-number">{values(resultNumbers).join("、")}</strong>{" "}］</>
            );
            const renderGroup = (key: string, rows: TianyanDisplayRow[], formulas: ReactNode[]) => (
              <div
                className="explore-validation-group"
                data-lottery={lottery}
                data-road-type="複合版路"
                data-row-count={rows.length}
                data-wide-numbers={rows.some((row) => row.numbers.length >= 6) ? "true" : "false"}
                key={key}
              >
                <div className="explore-validation-issues explore-validation-numeric-text">
                  {rows.map((row) => <span className="explore-validation-issue" key={`${row.key}-period`}>{displayValidationPeriod(lottery, row.period)}</span>)}
                </div>
                <div className="explore-validation-numbers-card">
                  {rows.map((row) => (
                    <div className="explore-validation-draw-row explore-validation-number-row" key={`${row.key}-numbers`}>
                      <span className="explore-validation-numbers explore-validation-numeric-text">
                        {values(row.numbers).map((value, index) => {
                          const state = row.sourceNumber !== undefined && value === displayNumber(row.sourceNumber)
                            ? "hit"
                            : (row.hitNumbers ?? []).some((hit) => value === displayNumber(hit))
                              ? "step"
                              : "";
                          const number = <i className={state ? `explore-validation-number explore-validation-number--${state}` : "explore-validation-number"}>{value}</i>;
                          return index === 6 && (lottery === "六合彩" || lottery === "大樂透") ? (
                            <span className="explore-validation-special-number" key={`${value}-${index}`}>
                              <i className="explore-validation-special-separator" aria-hidden="true">+</i>
                              {number}
                            </span>
                          ) : <Fragment key={`${value}-${index}`}>{number}</Fragment>;
                        })}
                      </span>
                    </div>
                  ))}
                </div>
                <div className="explore-validation-formulas">
                  {rows.map((row, index) => <span className="explore-validation-formula-row" key={`${row.key}-formula`}>{formulas[index] ?? ""}</span>)}
                </div>
              </div>
            );
            const summarySeparator = <i className="explore-validation-summary-separator" aria-hidden="true">｜</i>;
            const currentFormulas = validation.rules.slice(0, 2).map((rule) => validationFormula(
              rule.validationPosition,
              rule.currentBaseNumber,
              rule.algorithmType,
              rule.ruleValue,
              rule.currentPredictionNumber,
            ));

            return (
              <section
                className="road-validation-process explore-validation-card"
                aria-label="天衍驗證過程"
                data-content-protected={contentProtected ? "true" : "false"}
                onCopy={(event) => event.preventDefault()}
                onCut={(event) => event.preventDefault()}
                onDragStart={(event) => event.preventDefault()}
              >
                <div className="validation-rule-set explore-validation-rule-set">
                  <header className="explore-validation-summary-card">
                    <ExploreValidationSummary>
                      {validation.rules.slice(0, 2).map((rule, index) => (
                        <Fragment key={rule.id}>
                          {index > 0 ? <> {summarySeparator} </> : null}
                          規則{index === 0 ? "一" : "二"}：第 <i className="validation-summary-position">{rule.validationPosition}</i> 顆 {rule.algorithmType} <i className="validation-summary-formula">{rule.ruleValue}</i>
                        </Fragment>
                      ))}
                    </ExploreValidationSummary>
                    <strong className="explore-validation-consecutive-tag">準{validation.groupCount}進{validation.groupCount + 1}</strong>
                  </header>
                  <div className="explore-validation-groups">
                    {validation.historicalValidation.map((row) => renderGroup(
                      `${validation.itemId}-${row.group}-${row.predictionPeriod}`,
                      [
                        {
                          key: `source-${row.group}`,
                          period: row.sourcePeriod,
                          numbers: row.sourceNumbers,
                          sourceNumber: row.lockedNumber,
                        },
                        {
                          key: `formula-${row.group}-2`,
                          period: "",
                          numbers: [],
                        },
                        {
                          key: `prediction-${row.group}`,
                          period: row.predictionPeriod,
                          numbers: row.predictionNumbers,
                          hitNumbers: row.hitNumbers,
                        },
                      ],
                      [
                        validationFormula(row.rule1.validationPosition, row.rule1.baseNumber, row.rule1.algorithmType, row.rule1.ruleValue, row.rule1.calculationResult),
                        validationFormula(row.rule2.validationPosition, row.rule2.baseNumber, row.rule2.algorithmType, row.rule2.ruleValue, row.rule2.calculationResult),
                        resultFormula(row.hitNumbers),
                      ],
                    ))}
                    {validation.sourceA && currentFormulas.length === 2 ? renderGroup(
                      `${validation.itemId}-current`,
                      [
                        {
                          key: "current-source",
                          period: validation.sourceA.sourcePeriod,
                          numbers: validation.sourceA.sourceNumbers,
                          sourceNumber: validation.sourceA.lockedNumber,
                        },
                        {
                          key: "current-formula-2",
                          period: "",
                          numbers: [],
                        },
                      ],
                      currentFormulas,
                    ) : null}
                  </div>
                  <footer className="explore-validation-prediction">
                    <DoubleArrowLeftIcon className="explore-validation-prediction-arrow explore-validation-prediction-arrow--left" aria-hidden="true" />
                    <span className="explore-validation-prediction-content">
                      <strong>本期預測</strong>
                      <b className="explore-validation-numeric-text">{values(validation.mergedSearchPredictionNumbers).join("、")}</b>
                    </span>
                    <DoubleArrowRightIcon className="explore-validation-prediction-arrow explore-validation-prediction-arrow--right" aria-hidden="true" />
                  </footer>
                </div>
              </section>
            );
          }

          export function MatrixExplorePage'''
          source, count = re.subn(tianyan_function, replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'TianyanValidationProcess replacement count={count}')

          feature_path.write_text(source)

          api_path = Path('src/matrix-algorithm-api.ts')
          api = api_path.read_text()
          api_pattern = r'''export type TianyanApiRow = \{[\s\S]*?\n\};\n\nexport type TianyanListResponse = \{[\s\S]*?\n\};\n\nexport type TianyanValidation = \{[\s\S]*?\n\};'''
          api_replacement = '''export type TianyanRoadTypeLabel =
            | '加減版路'
            | '合值版路'
            | '拖牌版路'
            | '加減合值'
            | '加減拖牌'
            | '合值拖牌';

          export type TianyanApiRow = {
            id: string;
            number: string;
            lockedPosition: number;
            predictionDistance: number;
            consecutive: string;
            highestStreak: number;
            predictionNumbers: string[];
            roadType: '複合';
            roadTypeLabel: TianyanRoadTypeLabel;
            hitCondition: '準5+（鎖定2碼）';
            ruleIds: [string, string];
          };

          export type TianyanListResponse = {
            kind: 'tianyan';
            lottery: NumberBallLottery;
            drawPeriod: string;
            analysisVersion: string;
            status: 'complete';
            items: TianyanApiRow[];
            total: number;
          };

          export type TianyanRuleValidation = {
            validationPeriodOffset: number;
            validationPeriod: string;
            validationPosition: number;
            baseNumber: number;
            algorithmType: '加減' | '合值' | '拖牌';
            candidateValues: number[];
            ruleValue: number;
            calculationResult: number;
            hit: boolean;
          };

          export type TianyanValidation = {
            itemId: string;
            sourceA?: {
              sourcePeriod: string;
              sourceNumbers: Array<string | number>;
              lockedPosition: number;
              lockedNumber: number;
              predictionDistance: number;
            };
            rules: Array<{
              id: string;
              validationPeriodOffset: number;
              validationPeriod: string;
              validationPosition: number;
              referenceOffset: number;
              referencePosition: number;
              algorithmType: '加減' | '合值' | '拖牌';
              value: number;
              ruleValue: number;
              currentBaseNumber: number;
              currentPredictionNumber: number;
            }>;
            groupCount: number;
            minimumIndependentHits: number;
            rule1Only: number;
            rule2Only: number;
            bothHit: number;
            mergedSearchPredictionNumbers: string[];
            historicalValidation: Array<{
              group: string;
              sourcePeriod: string;
              sourceNumbers: Array<string | number>;
              lockedPosition: number;
              lockedNumber: number;
              predictionPeriod: string;
              predictionNumbers: Array<string | number>;
              rule1: TianyanRuleValidation;
              rule2: TianyanRuleValidation;
              hitType: 'rule1Only' | 'rule2Only' | 'bothHit';
              hitNumbers: number[];
              success: boolean;
            }>;
          };'''
          api, count = re.subn(api_pattern, api_replacement, api, count=1)
          if count != 1:
              raise SystemExit(f'Tianyan API type replacement count={count}')
          api_path.write_text(api)
          PY

          cat > supabase/migrations/20260903073500_matrix_tianyan_result_road_types.sql <<'EOF'
          -- Preserve distinct draw-period offset selection while enriching Tianyan list items
          -- with the user-facing classification derived from the two stored rule algorithms.
          begin;

          create or replace function public.matrix_tianyan_list(p_request jsonb)
          returns jsonb
          language plpgsql
          stable
          security definer
          set search_path = ''
          as $$
          declare
            v_lottery text := nullif(pg_catalog.btrim(p_request->>'lottery'), '');
            v_period text := nullif(pg_catalog.btrim(p_request->>'drawPeriod'), '');
            v_offset integer := coalesce((p_request->>'exploreDateOffset')::integer, 0);
            v_streaks jsonb := coalesce(p_request->'selectedStreaks', '[]'::jsonb);
            v_version text;
            v_draw text;
            v_payload jsonb;
            v_items jsonb;
            v_entitlements jsonb := private.matrix_result_entitlements();
          begin
            if v_lottery not in ('今彩539', '天天樂', '六合彩', '大樂透')
              or pg_catalog.jsonb_typeof(v_streaks) <> 'array'
              or v_offset not in (0, 1, 2) then
              raise exception using errcode = '22023', message = 'INVALID_REQUEST';
            end if;

            if (v_entitlements->>'canUseTianyan')::boolean is not true then
              raise exception using errcode = '42501', message = 'FORBIDDEN';
            end if;

            with latest_versions as (
              select distinct on (run.draw_period)
                run.analysis_version,
                run.draw_period,
                draw.draw_date,
                run.completed_at
              from public.matrix_analysis_runs as run
              left join public.lottery_draws as draw
                on draw.lottery = run.lottery
               and draw.period = run.draw_period
              where run.lottery = v_lottery
                and run.status = 'complete'
                and (v_period is null or run.draw_period = v_period)
              order by run.draw_period, run.completed_at desc nulls last
            )
            select analysis_version, draw_period into v_version, v_draw
            from latest_versions
            order by
              (draw_date is not null) desc,
              draw_date desc nulls last,
              draw_period desc,
              completed_at desc nulls last
            offset v_offset
            limit 1;

            if v_version is null then
              raise exception using errcode = 'P0001', message = 'ANALYSIS_NOT_READY';
            end if;

            v_payload := private.matrix_artifact_payload('tianyan', v_lottery, v_draw, v_version);
            if v_payload is null then
              raise exception using errcode = 'P0001', message = 'ANALYSIS_NOT_READY';
            end if;

            select coalesce(
              pg_catalog.jsonb_agg(
                item || pg_catalog.jsonb_build_object(
                  'roadTypeLabel',
                  case
                    when v_payload->'validationById'->(item->>'id')->'rules'->0->>'algorithmType' = '加減'
                     and v_payload->'validationById'->(item->>'id')->'rules'->1->>'algorithmType' = '加減' then '加減版路'
                    when v_payload->'validationById'->(item->>'id')->'rules'->0->>'algorithmType' = '合值'
                     and v_payload->'validationById'->(item->>'id')->'rules'->1->>'algorithmType' = '合值' then '合值版路'
                    when v_payload->'validationById'->(item->>'id')->'rules'->0->>'algorithmType' = '拖牌'
                     and v_payload->'validationById'->(item->>'id')->'rules'->1->>'algorithmType' = '拖牌' then '拖牌版路'
                    when (v_payload->'validationById'->(item->>'id')->'rules'->0->>'algorithmType' = '加減'
                      and v_payload->'validationById'->(item->>'id')->'rules'->1->>'algorithmType' = '合值')
                      or (v_payload->'validationById'->(item->>'id')->'rules'->0->>'algorithmType' = '合值'
                      and v_payload->'validationById'->(item->>'id')->'rules'->1->>'algorithmType' = '加減') then '加減合值'
                    when (v_payload->'validationById'->(item->>'id')->'rules'->0->>'algorithmType' = '加減'
                      and v_payload->'validationById'->(item->>'id')->'rules'->1->>'algorithmType' = '拖牌')
                      or (v_payload->'validationById'->(item->>'id')->'rules'->0->>'algorithmType' = '拖牌'
                      and v_payload->'validationById'->(item->>'id')->'rules'->1->>'algorithmType' = '加減') then '加減拖牌'
                    when (v_payload->'validationById'->(item->>'id')->'rules'->0->>'algorithmType' = '合值'
                      and v_payload->'validationById'->(item->>'id')->'rules'->1->>'algorithmType' = '拖牌')
                      or (v_payload->'validationById'->(item->>'id')->'rules'->0->>'algorithmType' = '拖牌'
                      and v_payload->'validationById'->(item->>'id')->'rules'->1->>'algorithmType' = '合值') then '合值拖牌'
                  end
                )
                order by (item->>'highestStreak')::integer desc, item->>'id'
              ),
              '[]'::jsonb
            ) into v_items
            from pg_catalog.jsonb_array_elements(coalesce(v_payload->'items', '[]'::jsonb)) as item
            where v_streaks ? (item->>'consecutive');

            return pg_catalog.jsonb_build_object(
              'kind', 'tianyan',
              'lottery', v_lottery,
              'drawPeriod', v_draw,
              'analysisVersion', v_version,
              'exploreDateOffset', v_offset,
              'status', 'complete',
              'items', v_items,
              'total', pg_catalog.jsonb_array_length(v_items)
            );
          end;
          $$;

          commit;
          EOF

          cat > tests/matrix-tianyan-result-ui-contract.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const source = readFileSync('src/FeaturePages.tsx', 'utf8');
          const api = readFileSync('src/matrix-algorithm-api.ts', 'utf8');
          const migration = readFileSync('supabase/migrations/20260903073500_matrix_tianyan_result_road_types.sql', 'utf8');

          test('Matrix Tianyan omits recent history and owns exactly the approved five streak filters', () => {
            assert.match(source, /title === "Matrix 探索" \? \([\s\S]*?<HistoryList/);
            assert.match(source, /\? \["準11進12", "準14進15", "準15進16", "準16進17", "準17進18"\]/);
          });

          test('Matrix Tianyan list contract exposes the six approved composite road labels', () => {
            for (const label of ['加減版路', '合值版路', '拖牌版路', '加減合值', '加減拖牌', '合值拖牌']) {
              assert.match(api, new RegExp(label));
              assert.match(migration, new RegExp(label));
            }
            assert.match(source, /algorithmType: item\.roadTypeLabel/);
            assert.match(source, /title === "Matrix 天衍" \? item\.algorithmType/);
          });

          test('Tianyan validation reuses Matrix Explore three-column validation structure', () => {
            assert.match(source, /aria-label="天衍驗證過程"[\s\S]*?className="road-validation-process explore-validation-card"/);
            assert.match(source, /className="explore-validation-group"/);
            assert.match(source, /className="explore-validation-formulas"/);
            assert.match(source, /validationFormula\(row\.rule1[\s\S]*?validationFormula\(row\.rule2/);
          });

          test('Tianyan RPC keeps distinct draw-period offset behavior from the pending fix', () => {
            assert.match(migration, /distinct on \(run\.draw_period\)/);
            assert.match(migration, /draw_date desc nulls last/);
            assert.match(migration, /offset v_offset/);
          });
          EOF

      - name: Update mobile runtime lock
        run: npm run update:runtime-lock

      - name: GREEN - targeted Tianyan tests
        run: npm run test:unit -- src/__tests__/MatrixTianyanPage.test.tsx

      - name: GREEN - source and migration contract
        run: node --test tests/matrix-tianyan-result-ui-contract.test.mjs

      - name: Full unit tests
        run: npm run test:unit

      - name: Full Node contract tests
        run: node --test tests/*.test.mjs

      - name: Production build
        run: npm run build

      - name: Commit verified Tianyan result UI
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tianyan-result-ui-once.yml
          git add -- src/FeaturePages.tsx src/matrix-algorithm-api.ts src/__tests__/MatrixTianyanPage.test.tsx tests/matrix-tianyan-result-ui-contract.test.mjs supabase/migrations/20260903073500_matrix_tianyan_result_road_types.sql mobile-runtime.lock.json
          git commit -m 'fix(tianyan): align result UI with Matrix Explore'
          git push origin HEAD:fix/tianyan-result-ui-rules-20260903
