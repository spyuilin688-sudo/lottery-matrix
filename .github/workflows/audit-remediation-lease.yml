name: Audit remediation lease

on:
  push:
    branches:
      - fix/remaining-audit-issues-20260904
    paths:
      - .github/workflows/audit-remediation-lease.yml
      - scripts/audit_remediation_lease.py

permissions:
  contents: write

jobs:
  lease-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remaining-audit-issues-20260904
          fetch-depth: 0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/matrix-api/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate lease patch script
        run: python -m py_compile scripts/audit_remediation_lease.py
      - name: Apply lease implementation
        run: python scripts/audit_remediation_lease.py
      - name: Install matrix API dependencies
        working-directory: services/matrix-api
        run: uv sync --frozen
      - name: Run lease repository/pipeline contract
        working-directory: services/matrix-api
        run: uv run pytest -q tests/test_analysis_run_lease.py
      - name: Run full Matrix API suite
        working-directory: services/matrix-api
        run: uv run pytest -q
      - name: Run migration lease contract
        run: node --test tests/matrix-analysis-run-lease-migration.test.mjs
      - name: Commit verified lease implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/matrix-api/app/repositories/analysis_repository.py services/matrix-api/app/services/analysis_pipeline.py services/matrix-api/app/worker.py services/matrix-api/tests/test_analysis_pipeline.py
          if git diff --cached --quiet; then
            echo "No verified lease changes to commit"
            exit 0
          fi
          git commit -m "fix: serialize matrix analysis runs with leases"
          git push origin HEAD:fix/remaining-audit-issues-20260904
