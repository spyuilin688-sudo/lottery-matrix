name: Apply history DOCX spec

on:
  push:
    branches:
      - "歷史開獎紀錄"
    paths:
      - ".github/workflows/apply-history-docx-spec.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "歷史開獎紀錄"
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare focused regression test and stale-test cleanup
        run: python scripts/apply-history-docx-spec.py --tests

      - name: Verify the new requirement fails before implementation
        shell: bash
        run: |
          set +e
          node --test tests/draw-history-table-layout.test.mjs tests/history-filter-select-layering.test.mjs > /tmp/history-red.log 2>&1
          status=$?
          cat /tmp/history-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected the focused history test to fail before implementation."
            exit 1
          fi
          exit 0

      - name: Apply only the uploaded DOCX requirement
        run: python scripts/apply-history-docx-spec.py --apply

      - name: Run executable focused history tests
        run: node --test tests/draw-history-table-layout.test.mjs tests/history-filter-select-layering.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type check and production bundle
        shell: bash
        run: |
          ./node_modules/.bin/tsc
          ./node_modules/.bin/vite build
          node scripts/prepare-sites-build.mjs

      - name: Run history pagination unit test
        run: npx vitest run src/history-pagination.test.ts

      - name: Commit verified history-only changes and cleanup
        shell: bash
        run: |
          git config user.name "openai-history-bot"
          git config user.email "openai-history-bot@users.noreply.github.com"
          git rm .github/workflows/apply-history-docx-spec.yml scripts/apply-history-docx-spec.py
          git rm --ignore-unmatch history-build-failure.log history-focused-failure.log history-unit-failure.log
          git add src/FeaturePages.tsx src/feature-pages.css tests/draw-history-table-layout.test.mjs tests/history-filter-select-layering.test.mjs
          git diff --cached --check
          git commit -m "fix(history): move lottery selector into filters"
          git push origin HEAD:"歷史開獎紀錄"
