name: Apply history DOCX spec

on:
  push:
    branches:
      - "歷史開獎紀錄"
    paths:
      - ".github/workflows/apply-history-docx-spec.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "歷史開獎紀錄"
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Write regression tests
        run: python scripts/apply-history-docx-spec.py --tests

      - name: Verify regression tests are red before implementation
        shell: bash
        run: |
          set +e
          node --test tests/draw-history-table-layout.test.mjs tests/history-filter-select-layering.test.mjs > /tmp/history-red.log 2>&1
          status=$?
          cat /tmp/history-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected new history regression tests to fail before implementation."
            exit 1
          fi
          exit 0

      - name: Apply canonical history page rules
        run: python scripts/apply-history-docx-spec.py --apply

      - name: Verify focused history regression tests after apply
        run: node --test tests/draw-history-table-layout.test.mjs tests/history-filter-select-layering.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Compile and bundle without prebuild runtime guard
        shell: bash
        run: |
          ./node_modules/.bin/tsc
          ./node_modules/.bin/vite build
          node scripts/prepare-sites-build.mjs

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          npm run test:unit > history-unit-failure.log 2>&1
          status=$?
          cat history-unit-failure.log
          if [ "$status" -ne 0 ]; then
            git config user.name "openai-history-bot"
            git config user.email "openai-history-bot@users.noreply.github.com"
            git add history-unit-failure.log
            git commit -m "chore(history): capture unit test output"
            git push origin HEAD:"歷史開獎紀錄"
            exit "$status"
          fi
          rm history-unit-failure.log

      - name: Confirm existing runtime guard remains the only npm build blocker
        shell: bash
        run: |
          set +e
          npm run build > /tmp/history-known-runtime.log 2>&1
          status=$?
          cat /tmp/history-known-runtime.log
          test "$status" -ne 0
          grep -Fq -- "src/App.tsx was modified" /tmp/history-known-runtime.log
          grep -Fq -- "Restore the protected runtime" /tmp/history-known-runtime.log

      - name: Commit and push history branch only
        shell: bash
        run: |
          git config user.name "openai-history-bot"
          git config user.email "openai-history-bot@users.noreply.github.com"
          git rm .github/workflows/apply-history-docx-spec.yml scripts/apply-history-docx-spec.py
          git rm --ignore-unmatch history-focused-failure.log history-build-failure.log history-unit-failure.log
          git add src/FeaturePages.tsx src/feature-pages.css src/number-ball.css tests/draw-history-table-layout.test.mjs tests/history-filter-select-layering.test.mjs
          git diff --cached --check
          git commit -m "fix(history): align page with uploaded DOCX spec"
          git push origin HEAD:"歷史開獎紀錄"
