name: temp-apply-layout-12px

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-apply-layout-12px.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply tested 12px layout normalization
        run: python3 .github/temp_apply_layout_12px.py
      - name: Install and verify project
        run: |
          npm ci
          npm test
          npm run build
          git diff --check
          grep -RInE --include='*.css' '\.feature-body[^\{]*\{[^}]*padding-(inline|left|right):[[:space:]]*(4|10|14|16)px' src || true
      - name: Commit verified production changes
        run: |
          git config user.name 'spyuilin688-sudo'
          git config user.email 'spyuilin688@gmail.com'
          git add src/design-tokens.css src/feature-pages.css src/tongxing-compact.css src/homepage-repair.css tests/layout-inline-12px.test.mjs
          git commit -m 'fix: normalize mobile page inline spacing to 12px'
          git push origin HEAD:main
