name: Fix invite runtime contract

on:
  push:
    branches:
      - fix/remaining-audit-issues-20260904
    paths:
      - .github/workflows/fix-runtime-referral-contract.yml

permissions:
  contents: write

jobs:
  update-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remaining-audit-issues-20260904
          fetch-depth: 0
      - name: Update stale invite runtime assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/mobile-runtime.spec.ts')
          text = path.read_text(encoding='utf-8')
          old = '    await expect(page.getByText("推薦碼/邀請碼尚未提供。", { exact: true })).toBeVisible();\n'
          new = '    await expect(page.getByText("推薦碼/邀請碼尚未提供。", { exact: true })).toHaveCount(0);\n    await expect(page.locator(".referral-share-card").or(page.getByRole("alert"))).toBeVisible();\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale invite assertion, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit test update and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-runtime-referral-contract.yml
          git add tests/mobile-runtime.spec.ts
          git commit -m "test: align invite runtime contract with referral API"
          git push origin HEAD:fix/remaining-audit-issues-20260904
