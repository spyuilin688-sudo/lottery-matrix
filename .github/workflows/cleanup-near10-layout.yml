name: Cleanup near 10 layout constraints

on:
  push:
    branches:
      - 近10期開獎號碼
    paths:
      - .github/workflows/cleanup-near10-layout.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 近10期開獎號碼

      - name: Clean redundant near 10 constraints
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/feature-pages.css')
          text = path.read_text()

          replacements = [
              (
                  '''.history-panel {\n  box-sizing: border-box;\n  width: 366px;\n  max-width: 100%;\n  min-width: 0;''',
                  '''.history-panel {\n  box-sizing: border-box;\n  width: 100%;\n  min-width: 0;''',
                  'history panel width source',
              ),
              (
                  '''  width: 100%;\n  height: 52px;\n  min-height: 52px;\n  padding: 7px 12px;''',
                  '''  width: 100%;\n  height: 52px;\n  padding: 7px 12px;''',
                  'history heading duplicate height',
              ),
              (
                  '''.history-panel-title .section-title {\n  min-width: 0;\n  min-height: 24px;\n  gap: 8px;''',
                  '''.history-panel-title .section-title {\n  min-width: 0;\n  gap: 8px;''',
                  'history title duplicate height',
              ),
              (
                  '''  width: 100%;\n  height: 46px;\n  min-height: 46px;\n  grid-template-columns: 66px 68px minmax(0, 1fr);''',
                  '''  width: 100%;\n  height: 46px;\n  grid-template-columns: 66px 68px minmax(0, 1fr);''',
                  'history row duplicate height',
              ),
              (
                  '''.history-head { height: 36px; min-height: 36px; color: #b58e3e; font-size: 14px; font-weight: 700; line-height: 18px; }''',
                  '''.history-head { height: 36px; color: #b58e3e; font-size: 14px; font-weight: 700; line-height: 18px; }''',
                  'history head duplicate height',
              ),
              (
                  '''.history-panel .history-numbers[data-has-special="true"] .history-main-numbers { gap: 2px; padding-top: 0; }''',
                  '''.history-panel .history-numbers[data-has-special="true"] .history-main-numbers { padding-top: 0; }''',
                  'history special main duplicate gap',
              ),
              (
                  '''.history-panel .history-numbers[data-has-special="true"] .history-special-number { height: 38px; margin-left: 4px; gap: 4px; align-items: center; }\n.history-panel .history-numbers[data-has-special="true"] .history-special-ball { height: 38px; grid-template-rows: 9px 28px; row-gap: 1px; }\n.history-panel .history-numbers[data-has-special="true"] .history-special-label { margin: 0; line-height: 9px; }\n''',
                  '''''',
                  'history special duplicate scoped rules',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify formal rules
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/feature-pages.css').read_text()
          checks = {
              'page token remains 12px': '--layout-page-inline' not in text,
              'history panel no fixed 366px': 'width: 366px;' not in text[text.index('.history-panel {'):text.index('.panel-heading', text.index('.history-panel {'))],
              'history panel uses parent width': '.history-panel {\n  box-sizing: border-box;\n  width: 100%;\n  min-width: 0;' in text,
              'heading duplicate min-height removed': 'height: 52px;\n  min-height: 52px;' not in text,
              'row duplicate min-height removed': 'height: 46px;\n  min-height: 46px;' not in text,
              'head duplicate min-height removed': '.history-head { height: 36px; min-height: 36px;' not in text,
              'confirmed columns preserved': 'grid-template-columns: 66px 68px minmax(0, 1fr);' in text,
              'card clipping preserved': '.history-panel {\n  box-sizing: border-box;\n  width: 100%;\n  min-width: 0;\n  margin-top: 12px;\n  padding: 0;\n  overflow: hidden;' in text,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('verification failed: ' + ', '.join(failed))
          print('near10 CSS constraint verification passed')
          PY
          grep -n -- '--layout-page-inline: 12px' src/design-tokens.css
          git diff --check

      - name: Install dependencies
        run: npm run install:ci

      - name: Typecheck and build UI
        run: |
          npx tsc
          npx vite build
          node scripts/prepare-sites-build.mjs

      - name: Commit and push
        run: |
          rm -f .github/workflows/cleanup-near10-layout.yml
          git config user.name "spy854540-cmd"
          git config user.email "spy854540@gmail.com"
          git add src/feature-pages.css .github/workflows/cleanup-near10-layout.yml
          git commit -m "fix: simplify near 10 layout constraints"
          git push origin HEAD:近10期開獎號碼
