name: Remove obsolete formula spacing test once

on:
  push:
    branches:
      - fix/subscription-pricing-title-assets-20260904-v2

permissions:
  contents: write

jobs:
  remove-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/subscription-pricing-title-assets-20260904-v2
          fetch-depth: 0
      - name: Remove only the obsolete formula spacing test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/__tests__/app-production-shell.test.tsx')
          text = path.read_text(encoding='utf-8')
          start_marker = '  it("inserts the requested half-width spaces in validation formulas", () => {'
          end_marker = '  it("keeps the scoped tag selector and lets the period column fit its content", () => {'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('Target test boundaries are not unique')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          path.write_text(text[:start] + text[end:], encoding='utf-8')
          Path('.github/workflows/remove-half-width-formula-test-once.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/__tests__/app-production-shell.test.tsx .github/workflows/remove-half-width-formula-test-once.yml
          git commit -m "test: remove obsolete formula spacing assertion"
          git push origin HEAD:fix/subscription-pricing-title-assets-20260904-v2
