name: Admin Activation Code CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  admin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install admin dependencies
        run: npm install --no-audit --no-fund
      - name: Activation code rule tests
        run: npm test -- --run backend/activation-code-rules.test.ts backend/activation-code-generation-migration.test.ts src/activation-code-form.test.ts
