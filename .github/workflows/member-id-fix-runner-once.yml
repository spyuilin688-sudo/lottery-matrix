name: Member ID fix runner once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-member-identity:
    if: github.head_ref == 'fix/member-id-admin-google-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'fix/member-id-admin-google-20260916'
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: RED - prove member ID contract fails before implementation
        shell: bash
        run: |
          set +e
          npx vitest run src/__tests__/MemberIdentityContract.test.ts apps/admin/src/member-id-contract.test.ts
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'RED tests unexpectedly passed before production change.'
            exit 1
          fi
          echo 'RED confirmed.'

      - name: Apply minimal member ID repair
        run: python scripts/member-id-fix-runner.py

      - name: GREEN - verify only directly related tests
        run: |
          npx vitest run \
            src/__tests__/MemberIdentityContract.test.ts \
            src/__tests__/MemberProfilePage.test.tsx \
            apps/admin/src/member-id-contract.test.ts \
            apps/admin/src/UserInfoDialog.test.tsx \
            apps/admin/src/admin-member-page.test.tsx \
            apps/admin/backend/admin-data.test.ts

      - name: Remove temporary contract tests before build
        run: rm src/__tests__/MemberIdentityContract.test.ts apps/admin/src/member-id-contract.test.ts

      - name: Verify production builds
        run: npm run build

      - name: Commit verified repair to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/member-id-fix-runner-once.yml \
            scripts/member-id-fix-once.py \
            scripts/member-id-fix-runner.py \
            src/__tests__/MemberIdentityContract.test.ts \
            apps/admin/src/member-id-contract.test.ts
          git add -- \
            src/member-api.ts \
            src/features/MemberPages.tsx \
            src/__tests__/MemberProfilePage.test.tsx \
            apps/admin/backend/admin-data.ts \
            apps/admin/backend/admin-data.test.ts \
            apps/admin/src/AdminApp.tsx \
            apps/admin/src/UserInfoDialog.tsx \
            apps/admin/src/UserInfoDialog.test.tsx \
            supabase/migrations/20260916103000_member_profile_member_id.sql
          git commit -m 'Use member ID across member and admin views'
          git push origin HEAD:'fix/member-id-admin-google-20260916'
