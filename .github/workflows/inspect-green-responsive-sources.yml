name: Inspect post-GREEN responsive sources

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'bottom-nav-responsive-source-fix-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reproduce GREEN
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/apply-responsive-ui-cleanup.yml').read_text()
          block = text.split('      - name: GREEN - apply exact requested cleanup\n',1)[1].split('      - name: Verify requested regression tests\n',1)[0]
          script = block.split('        run: |\n',1)[1]
          Path('/tmp/green.sh').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())+'\n')
          PY
          bash /tmp/green.sh
      - name: Capture relevant selectors
        shell: bash
        run: |
          {
            echo '=== calculator feature selectors ==='
            grep -n -C 3 -E 'calculator-screen.*feature-body|feature-body.*calculator' src/feature-pages.css || true
            echo '=== calculator selectors all css ==='
            grep -n -C 2 -E 'calculator-screen.*feature-body|feature-body.*calculator' src/*.css || true
            echo '=== same-star/reference body selectors ==='
            grep -n -C 2 -E 'tongxing-screen .*feature-body|number-reference-screen .*feature-body|reference-query-panel\[data-floating' src/*.css || true
            echo '=== draw history selectors ==='
            grep -n -C 2 -E 'draw-history-screen .*feature-body|history-filter-panel\[data-floating' src/*.css || true
          } > green-source-snippets.txt
          cat green-source-snippets.txt
      - name: Upload source snippets
        uses: actions/upload-artifact@v4
        with:
          name: green-responsive-source-snippets
          path: green-source-snippets.txt
