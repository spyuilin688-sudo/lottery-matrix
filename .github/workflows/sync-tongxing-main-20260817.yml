name: One-time Matrix TongXing main sync

on:
  push:
    branches:
      - "同星"
    paths:
      - ".github/workflows/sync-tongxing-main-20260817.yml"

permissions:
  contents: write

concurrency:
  group: sync-tongxing-main-20260817
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout 同星
        uses: actions/checkout@v4
        with:
          ref: "同星"
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest main and save 同星 formal sources
        run: |
          set -euo pipefail
          git fetch origin main
          cp src/design-tokens.css /tmp/tongxing-design-tokens.css
          cp src/tongxing-compact.css /tmp/tongxing-compact.css

      - name: Merge latest main without losing current pages
        run: |
          set -euo pipefail
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            echo "Merge reported conflicts; resolving only the known shared files."
          fi

          # Keep the newest runtime lock from main. It protects the current production shell.
          git checkout origin/main -- mobile-runtime.lock.json

          # Keep the confirmed 同星 formal sources.
          cp /tmp/tongxing-design-tokens.css src/design-tokens.css
          cp /tmp/tongxing-compact.css src/tongxing-compact.css

      - name: Rebuild feature-pages.css from latest main and remove only stale 同星 rules
        run: |
          set -euo pipefail
          git show origin/main:src/feature-pages.css > /tmp/main-feature-pages.css
          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path('/tmp/main-feature-pages.css').read_text(encoding='utf-8')

          TARGET = re.compile(r'\.(?:tongxing(?:-[A-Za-z0-9_-]+)?|same-star(?:-[A-Za-z0-9_-]+)?)')

          def find_open(text, start, end):
              i = start
              quote = None
              in_comment = False
              while i < end:
                  if in_comment:
                      j = text.find('*/', i)
                      if j == -1:
                          return -1
                      i = j + 2
                      in_comment = False
                      continue
                  if quote:
                      if text[i] == '\\':
                          i += 2
                          continue
                      if text[i] == quote:
                          quote = None
                      i += 1
                      continue
                  if text.startswith('/*', i):
                      in_comment = True
                      i += 2
                      continue
                  if text[i] in ('"', "'"):
                      quote = text[i]
                      i += 1
                      continue
                  if text[i] == '{':
                      return i
                  i += 1
              return -1

          def find_close(text, open_i, end):
              depth = 1
              i = open_i + 1
              quote = None
              in_comment = False
              while i < end:
                  if in_comment:
                      j = text.find('*/', i)
                      if j == -1:
                          raise RuntimeError('unterminated CSS comment')
                      i = j + 2
                      in_comment = False
                      continue
                  if quote:
                      if text[i] == '\\':
                          i += 2
                          continue
                      if text[i] == quote:
                          quote = None
                      i += 1
                      continue
                  if text.startswith('/*', i):
                      in_comment = True
                      i += 2
                      continue
                  if text[i] in ('"', "'"):
                      quote = text[i]
                      i += 1
                      continue
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise RuntimeError('unbalanced CSS braces')

          def split_selectors(header):
              parts = []
              start = 0
              paren = bracket = 0
              quote = None
              for i, ch in enumerate(header):
                  if quote:
                      if ch == quote and (i == 0 or header[i-1] != '\\'):
                          quote = None
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                  elif ch == '(':
                      paren += 1
                  elif ch == ')':
                      paren = max(0, paren - 1)
                  elif ch == '[':
                      bracket += 1
                  elif ch == ']':
                      bracket = max(0, bracket - 1)
                  elif ch == ',' and paren == 0 and bracket == 0:
                      parts.append(header[start:i])
                      start = i + 1
              parts.append(header[start:])
              return parts

          removed = []

          def clean_region(text, start=0, end=None):
              if end is None:
                  end = len(text)
              out = []
              pos = start
              while pos < end:
                  open_i = find_open(text, pos, end)
                  if open_i == -1:
                      out.append(text[pos:end])
                      break
                  close_i = find_close(text, open_i, end)
                  raw_header = text[pos:open_i]

                  # Preserve leading whitespace/comments separately from the selector/at-rule header.
                  m = re.match(r'(?s)((?:\s|/\*.*?\*/)*)', raw_header)
                  prefix = m.group(1) if m else ''
                  header = raw_header[len(prefix):]
                  stripped = header.strip()

                  if stripped.startswith('@'):
                      body = clean_region(text, open_i + 1, close_i)
                      out.append(prefix + header + '{' + body + '}')
                  else:
                      selectors = split_selectors(header)
                      kept = []
                      targeted = []
                      for sel in selectors:
                          if TARGET.search(sel):
                              targeted.append(sel.strip())
                          else:
                              kept.append(sel.strip())
                      if targeted:
                          removed.extend(targeted)
                      if kept:
                          rebuilt = ',\n'.join(kept)
                          out.append(prefix + rebuilt + ' {' + text[open_i + 1:close_i] + '}')
                      else:
                          # Keep surrounding whitespace but remove the stale rule itself.
                          out.append(prefix)
                  pos = close_i + 1
              return ''.join(out)

          cleaned = clean_region(src)

          leftovers = sorted(set(re.findall(r'\.[A-Za-z0-9_-]*(?:tongxing|same-star)[A-Za-z0-9_-]*', cleaned)))
          if leftovers:
              raise SystemExit(f'Unexpected 同星 selectors remain in feature-pages.css: {leftovers}')
          if len(removed) < 20:
              raise SystemExit(f'Expected stale 同星 rules were not found; removed only {len(removed)} selectors')

          Path('src/feature-pages.css').write_text(cleaned, encoding='utf-8')
          print(f'Removed {len(removed)} stale 同星 selector entries from latest main feature-pages.css')
          for selector in removed:
              print('  -', selector)
          PY

      - name: Check unresolved conflicts and exact PR scope
        run: |
          set -euo pipefail
          git add src/design-tokens.css src/feature-pages.css src/tongxing-compact.css mobile-runtime.lock.json

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unexpected unresolved conflicts:"
            echo "$unresolved"
            exit 1
          fi

          # No old 同星 selector may remain in the shared stylesheet.
          if grep -En '\.(tongxing|same-star)' src/feature-pages.css; then
            echo "Stale 同星 selector remains in shared feature-pages.css"
            exit 1
          fi

          # The runtime lock must be byte-identical to main.
          git show origin/main:mobile-runtime.lock.json > /tmp/main-runtime-lock.json
          cmp -s mobile-runtime.lock.json /tmp/main-runtime-lock.json || {
            echo "mobile-runtime.lock.json differs from main"
            exit 1
          }

          # Compare the resulting tree with latest main: only these three files are allowed to differ.
          git add -A
          actual="$(git diff --name-only origin/main | grep -v '^\.github/workflows/sync-tongxing-main-20260817.yml$' | sort)"
          expected="$(printf '%s\n' src/design-tokens.css src/feature-pages.css src/tongxing-compact.css | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected files would differ from main:"
            echo "$actual"
            exit 1
          fi

          git diff --check origin/main

      - name: Install dependencies
        run: npm ci

      - name: Run focused 同星 tests
        run: |
          set -euo pipefail
          if [ -f src/__tests__/tongxing-input-integration.test.tsx ]; then
            npx vitest run src/__tests__/tongxing-input-integration.test.tsx
          fi
          if [ -f src/__tests__/tongxing-layout.test.ts ]; then
            npx vitest run src/__tests__/tongxing-layout.test.ts
          fi

      - name: Build
        run: npm run build

      - name: Commit conflict resolution and remove one-time workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-tongxing-main-20260817.yml
          git add -A

          actual="$(git diff --name-only origin/main | sort)"
          expected="$(printf '%s\n' src/design-tokens.css src/feature-pages.css src/tongxing-compact.css | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Final branch scope differs from expected:"
            echo "$actual"
            exit 1
          fi

          git diff --check origin/main
          git commit -m "merge: sync 同星 with main and resolve CSS conflicts"
          git push origin HEAD:同星
