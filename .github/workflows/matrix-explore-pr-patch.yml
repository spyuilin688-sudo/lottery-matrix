name: Matrix Explore PR patch runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'matrix-explore-reference-trigger-v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify RED
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('src/matrix-explore-spacing.css').read_text()
          balls = Path('src/number-ball.css').read_text()
          assert 'min-height: 52px;' in css
          assert 'min-height: 54px;' in css
          assert 'grid-template-columns: 2.1fr 2.5fr 7.4fr;' in css
          assert 'min-height: 58px;' in css
          assert 'height: 58px;' in css
          assert '--number-ball-size: clamp(26px, 7.6vw, 30px);' in balls
          PY

      - name: Patch formal Matrix Explore style sources only
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]}')
              p.write_text(text.replace(old, new, 1))

          replace_once('src/matrix-explore-spacing.css', '''.matrix-explore-main-screen .history-panel .panel-heading {
  display: flex;
  width: 100%;
  min-width: 0;
  min-height: 52px;
  margin-bottom: .5rem;
  padding: .5rem .75rem;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
}''', '''.matrix-explore-main-screen .history-panel .panel-heading {
  display: flex;
  width: 100%;
  min-width: 0;
  min-height: 42px;
  margin-bottom: 0;
  padding: .375rem .5rem;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
  border-bottom: 1px solid rgba(90, 87, 80, .72);
}''')
          replace_once('src/matrix-explore-spacing.css', '.matrix-explore-main-screen .history-panel-title .section-title {\n  font-size: 1.0625rem;\n}', '.matrix-explore-main-screen .history-panel-title .section-title {\n  font-size: clamp(.9375rem, 4.1vw, 1.0625rem);\n}')
          replace_once('src/matrix-explore-spacing.css', '.matrix-explore-main-screen .history-panel .panel-heading > button:last-child {\n  font-size: .8125rem;\n}', '.matrix-explore-main-screen .history-panel .panel-heading > button:last-child {\n  font-size: clamp(.6875rem, 3.1vw, .8125rem);\n}')
          replace_once('src/matrix-explore-spacing.css', '''.matrix-explore-main-screen .history-row,
.matrix-explore-main-screen .history-row.history-head,
.matrix-explore-main-screen .history-row:not(.history-head) {
  display: grid;
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  height: auto;
  min-height: 54px;
  padding: .5rem 0;
  grid-template-columns: 2.1fr 2.5fr 7.4fr;
  align-items: center;
  gap: .25rem;
  border-top: 0;
  border-bottom: 1px solid rgba(90, 87, 80, .7);
}''', '''.matrix-explore-main-screen .history-row,
.matrix-explore-main-screen .history-row.history-head,
.matrix-explore-main-screen .history-row:not(.history-head) {
  display: grid;
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  height: auto;
  min-height: 40px;
  padding: .25rem 0;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 2.2fr) minmax(0, 6.65fr);
  align-items: center;
  gap: 0;
  border-top: 0;
  border-bottom: 1px solid rgba(90, 87, 80, .72);
}''')
          replace_once('src/matrix-explore-spacing.css', '''.matrix-explore-main-screen .history-row.history-head {
  min-height: 40px;
  padding-block: .25rem;
  color: #d2a52a;
  font-size: .875rem;
}''', '''.matrix-explore-main-screen .history-row.history-head {
  min-height: 34px;
  padding-block: .1875rem;
  color: #d2a52a;
  font-size: clamp(.75rem, 3.4vw, .875rem);
  font-weight: 700;
}''')
          replace_once('src/matrix-explore-spacing.css', '''.matrix-explore-main-screen .history-row > :nth-child(1) {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  font-size: .875rem;
  font-weight: 700;
}''', '''.matrix-explore-main-screen .history-row > :nth-child(1) {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  font-size: clamp(.75rem, 3.3vw, .8125rem);
  font-weight: 700;
}''')
          replace_once('src/matrix-explore-spacing.css', '.matrix-explore-main-screen .history-row > :nth-child(2) {\n  font-size: .8125rem;\n  opacity: .9;\n}', '.matrix-explore-main-screen .history-row > :nth-child(2) {\n  font-size: clamp(.6875rem, 3vw, .75rem);\n  opacity: .92;\n}')
          replace_once('src/matrix-explore-spacing.css', '''.matrix-explore-main-screen .history-row > span,
.matrix-explore-main-screen .history-row > span + span,
.matrix-explore-main-screen .history-row:not(.history-head) > span:first-child,
.matrix-explore-main-screen .history-row:not(.history-head) > span:nth-child(2) {
  min-width: 0;
  padding: 0;
  border-left: 0;
}''', '''.matrix-explore-main-screen .history-row > span,
.matrix-explore-main-screen .history-row > span + span,
.matrix-explore-main-screen .history-row:not(.history-head) > span:first-child,
.matrix-explore-main-screen .history-row:not(.history-head) > span:nth-child(2) {
  min-width: 0;
  padding: 0;
  border-left: 0;
}
.matrix-explore-main-screen .history-row > :nth-child(1),
.matrix-explore-main-screen .history-row > :nth-child(2) {
  border-right: 1px solid rgba(90, 87, 80, .55);
}''')
          replace_once('src/matrix-explore-spacing.css', '.matrix-explore-main-screen .history-date-stack strong {\n  font-size: .8125rem;\n}\n\n.matrix-explore-main-screen .history-date-stack small {\n  font-size: .75rem;\n}', '.matrix-explore-main-screen .history-date-stack strong {\n  font-size: clamp(.6875rem, 3vw, .75rem);\n}\n\n.matrix-explore-main-screen .history-date-stack small {\n  font-size: clamp(.625rem, 2.8vw, .6875rem);\n}')
          replace_once('src/matrix-explore-spacing.css', '.matrix-explore-main-screen .history-main-numbers {\n  gap: .3125rem;\n}', '.matrix-explore-main-screen .history-main-numbers {\n  gap: clamp(.125rem, .7vw, .25rem);\n}')
          replace_once('src/matrix-explore-spacing.css', '''.matrix-explore-main-screen .repeat-stats-heading {
  display: flex;
  width: 100%;
  min-width: 0;
  min-height: 1.75rem;
  margin-bottom: .75rem;
  align-items: center;
  gap: .5rem;
}''', '''.matrix-explore-main-screen .repeat-stats-heading {
  display: flex;
  width: 100%;
  min-width: 0;
  min-height: 2rem;
  margin-bottom: .5rem;
  align-items: center;
  gap: .5rem;
}''')
          replace_once('src/matrix-explore-spacing.css', '.matrix-explore-main-screen .repeat-stats-heading > span {\n  margin-left: auto;\n  font-size: .75rem;\n}', '.matrix-explore-main-screen .repeat-stats-heading > span {\n  margin-left: auto;\n  font-size: clamp(.625rem, 2.8vw, .75rem);\n}')
          replace_once('src/matrix-explore-spacing.css', '''.matrix-explore-main-screen .result-summary {
  display: grid;
  width: 100%;
  min-width: 0;
  margin: 0;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  column-gap: .375rem;
  row-gap: .5rem;
}''', '''.matrix-explore-main-screen .result-summary {
  display: grid;
  width: 100%;
  min-width: 0;
  margin: 0;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  column-gap: clamp(.25rem, 1.2vw, .375rem);
  row-gap: clamp(.375rem, 1.6vw, .5rem);
}''')
          replace_once('src/matrix-explore-spacing.css', '''.matrix-explore-main-screen .result-summary > div {
  display: flex;
  min-width: 0;
  min-height: 58px;
  height: 58px;
  padding: .5rem .25rem;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid #1e293b;
  border-radius: .75rem;
  background: #141A26;
}''', '''.matrix-explore-main-screen .result-summary > div {
  display: flex;
  min-width: 0;
  min-height: clamp(44px, 12vw, 48px);
  height: auto;
  padding: .3125rem .125rem;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(112, 108, 99, .72);
  border-radius: .5rem;
  background: rgba(7, 16, 24, .72);
}''')
          replace_once('src/matrix-explore-spacing.css', '''.matrix-explore-main-screen .result-summary b {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  font-size: 1.0625rem;
  font-weight: 700;
}''', '''.matrix-explore-main-screen .result-summary b {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  font-size: clamp(.875rem, 3.8vw, 1rem);
  font-weight: 600;
}''')
          replace_once('src/matrix-explore-spacing.css', '.matrix-explore-main-screen .result-summary small {\n  margin-top: .125rem;\n  font-size: .75rem;\n  opacity: .7;\n}', '.matrix-explore-main-screen .result-summary small {\n  margin-top: .0625rem;\n  font-size: clamp(.5625rem, 2.5vw, .6875rem);\n  opacity: .72;\n}')
          replace_once('src/number-ball.css', '''.matrix-explore-main-screen .history-panel .number-ball-component.history-lottery-ball {
  --number-ball-size: clamp(26px, 7.6vw, 30px);
  --number-font-size: clamp(11px, 3.1vw, 13px);
}''', '''.matrix-explore-main-screen .history-panel .number-ball-component.history-lottery-ball {
  --number-ball-size: clamp(22px, 6.2vw, 24px);
  --number-font-size: clamp(10px, 2.8vw, 11px);
  --underline-width: clamp(9px, 2.8vw, 11px);
}''')
          PY

      - name: Verify GREEN and build
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('src/matrix-explore-spacing.css').read_text()
          balls = Path('src/number-ball.css').read_text()
          assert 'min-height: 42px;' in css
          assert 'min-height: 40px;' in css
          assert 'minmax(0, 1.15fr) minmax(0, 2.2fr) minmax(0, 6.65fr)' in css
          assert 'min-height: clamp(44px, 12vw, 48px);' in css
          assert 'border-right: 1px solid rgba(90, 87, 80, .55);' in css
          assert '--number-ball-size: clamp(22px, 6.2vw, 24px);' in balls
          assert 'grid-template-columns: repeat(6, minmax(0, 1fr));' in css
          assert 'grid-template-columns: 2.1fr 2.5fr 7.4fr;' not in css
          assert 'height: 58px;' not in css
          PY
          npm ci
          npm run build
          git diff --check

      - name: Restore pre-task workflow state and commit verified change
        run: |
          git checkout 63c4f5c19839d250a49feb737cca76f8ed78f31d -- .github/workflows/matrix-explore-pr-patch.yml .github/workflows/matrix-explore-reference-proportions-one-shot.yml
          rm -f .github/workflows/matrix-explore-reference-one-shot.yml
          rm -f .github/matrix-explore-reference-trigger-v2.txt
          rm -f .github/matrix-explore-reference-merge-trigger.txt
          rm -f .github/matrix-explore-reference-pr.txt
          git config user.name 'spyuilin688-sudo'
          git config user.email 'spyuilin688@gmail.com'
          git add -A
          git commit -m 'style: match Matrix Explore history and repeat stats reference'
          git push origin main
