name: Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Runtime commit atomicity
        env:
          RUNTIME_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          RUNTIME_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-runtime-commit-integrity.mjs "$RUNTIME_BASE_SHA" "$RUNTIME_HEAD_SHA"

      - name: Runtime atomic-commit regression
        run: node --test tests/runtime-integrity-atomic-commit.test.mjs

      - name: Runtime integrity check
        run: npm run check:runtime

      - name: Production build
        run: npm run build

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Targeted Explore tests
        run: node --test tests/matrix-explore-fluid-layout.test.mjs tests/matrix-explore-option-layout.test.mjs tests/recent-history-layout.test.mjs

      - name: Production build for packaging tests
        run: npm run build

      - name: Diagnostic tests A-F
        continue-on-error: true
        run: node --test tests/[a-f]*.test.mjs

      - name: Diagnostic tests G-L
        continue-on-error: true
        run: node --test tests/[g-l]*.test.mjs

      - name: Diagnostic tests M-R
        continue-on-error: true
        run: node --test tests/[m-r]*.test.mjs

      - name: Diagnostic tests S-Z
        continue-on-error: true
        run: node --test tests/[s-z]*.test.mjs

      - name: Diagnostic full tests serial
        continue-on-error: true
        run: node --test --test-concurrency=1 tests/*.test.mjs

      - name: Diagnostic full tests concurrency 2
        continue-on-error: true
        run: node --test --test-concurrency=2 tests/*.test.mjs

      - name: Full tests
        run: node --test tests/*.test.mjs

  matrix-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/matrix-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/matrix-api/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Matrix API tests
        run: uv run pytest -q
