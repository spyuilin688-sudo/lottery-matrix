name: Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-approved-explore-patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/explore-validation-formula-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply approved Matrix Explore validation patch
        shell: bash
        run: |
          python - <<'PY'
