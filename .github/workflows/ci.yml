name: Project CI

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement-reference-compact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply approved Explore reference sizing
        shell: bash
        run: |
          python <<'EXTRACT'
          from pathlib import Path
          source = Path('.github/workflows/matrix-explore-reference-compact.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_explore.py').write_text('\n'.join(lines) + '\n')
          EXTRACT
          python /tmp/apply_explore.py

      - name: Add compact reference contract
        shell: bash
        run: |
          cat > tests/matrix-explore-reference-density.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const css = readFileSync('src/feature-pages.css','utf8');
          const start = css.indexOf('/* Matrix Explore formal layout rules */');
          const end = css.indexOf('/* v55 scoped density and hierarchy refinements */');
          assert.notEqual(start,-1); assert.notEqual(end,-1);
          const formal = css.slice(start,end);
          test('Explore main compact reference dimensions are canonical',()=>{
            assert.match(formal,/explore-settings \.setting-grid label \{\nmin-width: 0; width: 100%; min-height: 34px/);
            assert.match(formal,/explore-settings \.setting-grid label > span \.setting-label-icon \{\nwidth: 30px; height: 30px/);
            assert.match(formal,/explore-settings \.setting-grid \.select-box \{\nwidth: 100%; max-width: none; min-width: 0; height: 34px/);
            assert.match(formal,/hit-options button \{\nheight: 38px; min-height: 38px/);
            assert.match(formal,/\.matrix-explore-main-screen \.primary-action \{\nwidth: 100%; height: 42px/);
            assert.match(formal,/history-panel \.panel-heading \{\nmin-height: 44px; padding: 6px 10px/);
            assert.match(formal,/result-summary > div \{\ndisplay: flex; min-width: 0; height: 42px/);
          });
          test('unchanged reference constraints stay intact',()=>{
            assert.match(formal,/\.matrix-explore-screen \.matrix-title-banner \{\nmargin-bottom: 8px;/);
            assert.doesNotMatch(formal,/scale\(|zoom\s*:|!important|margin-(?:top|right|bottom|left):\s*-/);
          });
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Targeted Explore tests
        run: node --test tests/matrix-explore-reference-density.test.mjs tests/matrix-explore-option-layout.test.mjs tests/recent-history-layout.test.mjs

      - name: Full legacy structure tests
        run: node --test tests/*.test.mjs

      - name: Build
        run: npm run build

      - name: Commit verified Explore implementation and restore CI
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout HEAD^ -- .github/workflows/ci.yml
          git rm .github/workflows/matrix-explore-reference-compact.yml
          git add src/feature-pages.css tests/matrix-explore-reference-density.test.mjs .github/workflows/ci.yml
          git commit -m 'refactor(explore): match compact reference proportions'
          git push origin main
