            font-variant-numeric: tabular-nums;
            line-height: 1.25;
          }

          .explore-validation-formula-row {
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            height: auto;
            min-height: var(--explore-validation-row-min-height);
            padding: 2px;
            color: #bac5d2;
            background: transparent;
            overflow-wrap: normal;
            white-space: nowrap;
          }
