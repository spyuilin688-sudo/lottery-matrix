name: Project CI

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply approved Matrix Explore B+C layout
        run: python scripts/apply_matrix_explore_bc_cleanup.py

      - name: Targeted Explore tests
        run: node --test tests/matrix-explore-option-layout.test.mjs tests/recent-history-layout.test.mjs

      - name: Full tests
        run: node --test tests/*.test.mjs

      - name: Build
        run: npm run build

      - name: Sync verified Matrix Explore CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/feature-pages.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: align Matrix Explore with approved B+C reference"
          git push origin HEAD:main
