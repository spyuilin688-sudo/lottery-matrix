name: Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose legacy test source
        run: |
          echo '=== tracked legacy tests ==='
          git ls-files 'tests/*.test.mjs' | sort
          echo '=== runner legacy tests ==='
          find tests -maxdepth 1 -type f -name '*.test.mjs' -print | sort
          echo '=== git status ==='
          git status --short
          for file in tests/admin-auth-turnstile.test.mjs tests/homepage-layout-regression.test.mjs tests/homepage-spacing.test.mjs; do
            if [ -f "$file" ]; then
              echo "=== $file ==="
              sed -n '1,240p' "$file"
            fi
          done

      - name: Unit tests
        run: npm run test:unit

      - name: Legacy structure tests
        run: node --test tests/*.test.mjs

      - name: Build
        run: npm run build
