name: Admin member name fix runner once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  admin-member-name-repair:
    if: github.head_ref == 'fix/admin-member-names-provider-ids-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/admin-member-names-provider-ids-20260916
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install admin dependencies
        working-directory: apps/admin
        run: npm ci

      - name: Apply minimal repair
        run: python scripts/admin-member-name-fix-once.py

      - name: Verify backend member identity and names
        run: npx vitest run apps/admin/backend/member-provider-identity.test.ts apps/admin/backend/admin-data.test.ts

      - name: Verify admin user management
        working-directory: apps/admin
        run: npx vitest run src/AdminApp.recovery.test.tsx src/UserInfoDialog.test.tsx

      - name: Verify production build
        run: npm run build

      - name: Verify standalone admin build
        working-directory: apps/admin
        run: APPDEPLOY_CI_EXTERNALS=true npm run build

      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/admin-member-name-fix-runner-once.yml scripts/admin-member-name-fix-once.py
          git add -- \
            apps/admin/backend/member-provider-identity.ts \
            apps/admin/backend/member-provider-identity.test.ts \
            apps/admin/backend/admin-data.ts \
            apps/admin/src/AdminApp.tsx \
            apps/admin/src/AdminApp.recovery.test.tsx \
            apps/admin/src/UserInfoDialog.tsx
          git commit -m 'Restore member names beside provider IDs'
          git push origin HEAD:fix/admin-member-names-provider-ids-20260916
