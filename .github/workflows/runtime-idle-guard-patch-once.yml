name: Runtime idle guard patch once

on:
  push:
    branches:
      - fix/runtime-idle-guards-20260916
    paths:
      - .github/workflows/runtime-idle-guard-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/runtime-idle-guards-20260916
          fetch-depth: 0
      - name: Apply scoped patch and remove one-off helpers
        run: |
          python scripts/patch_runtime_idle_guards_once.py
          rm scripts/patch_runtime_idle_guards_once.py
          rm .github/workflows/runtime-idle-guard-patch-once.yml
          git diff --check
          git diff --exit-code --quiet && { echo 'expected worker/test changes'; exit 1; } || true
      - name: Commit scoped runtime changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(worker): fast-exit completed periods and dedupe notifications'
          git push origin HEAD:fix/runtime-idle-guards-20260916
