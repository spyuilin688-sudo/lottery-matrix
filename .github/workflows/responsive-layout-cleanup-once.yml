name: Responsive layout cleanup once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/responsive-layout-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: RED - define responsive cleanup contract
        shell: bash
        run: |
          cat > tests/responsive-layout-cleanup.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import test from 'node:test';

          const base = readFileSync('src/feature-pages.css', 'utf8');
          const explore = readFileSync('src/matrix-explore-spacing.css', 'utf8');
          const styles = readFileSync('src/styles.css', 'utf8');

          function rule(source, selector) {
            const escaped = selector.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const match = source.match(new RegExp(`${escaped}\\s*\\{([^}]*)\\}`, 's'));
            assert.ok(match, `missing ${selector}`);
            return match[1];
          }

          test('mobile viewport keeps the 390px maximum without fixing internal component widths', () => {
            assert.match(styles, /--app-layout-viewport:\s*390px/);
            assert.match(styles, /\.mobile-app-viewport\s*\{[^}]*width:\s*min\(100%,\s*var\(--app-layout-viewport\)\);[^}]*max-width:\s*var\(--app-layout-viewport\)/s);
          });

          test('shared title surfaces use the 12px layout token instead of a hard-coded 32px subtraction', () => {
            const card = rule(base, '.feature-title-card');
            const banner = rule(base, '.matrix-title-banner');
            assert.match(card, /width:\s*auto/);
            assert.match(card, /margin:\s*8px var\(--layout-page-inline\) 0/);
            assert.doesNotMatch(card, /calc\(100%\s*-\s*32px\)/);
            assert.match(banner, /width:\s*auto/);
            assert.match(banner, /margin:\s*0 var\(--layout-page-inline\)/);
            assert.doesNotMatch(banner, /calc\(100%\s*-\s*32px\)/);
          });

          test('Matrix Explore uses the shared 12px page-inline token and does not re-lock the title width', () => {
            const body = rule(explore, '.matrix-explore-main-screen .feature-body');
            const banner = rule(explore, '.matrix-explore-main-screen .matrix-title-banner');
            assert.match(body, /padding:\s*0 var\(--layout-page-inline\) 1rem/);
            assert.doesNotMatch(body, /padding:\s*0 16px 1rem/);
            assert.doesNotMatch(banner, /width:\s*calc\(100%\s*-\s*32px\)/);
          });

          test('latest responsive recent-history rules remain intact', () => {
            assert.match(explore, /grid-template-columns:\s*minmax\(0, \.88fr\) minmax\(0, \.82fr\) minmax\(0, 3\.3fr\)/);
            assert.match(explore, /--matrix-history-ball-size:\s*clamp\(22px, 7\.2vw, 28px\)/);
          });
          EOF

          set +e
          node --test tests/responsive-layout-cleanup.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'RED test unexpectedly passed before production change.'
            exit 1
          fi
          echo 'RED confirmed.'

      - name: GREEN - modify existing responsive control sources
        shell: python
        run: |
          from pathlib import Path

          base_path = Path('src/feature-pages.css')
          base = base_path.read_text()

          old_card = 'width: calc(100% - 32px); min-height: 56px; margin-top: 8px;'
          new_card = 'width: auto; min-height: 56px; margin: 8px var(--layout-page-inline) 0;'
          assert base.count(old_card) == 1, base.count(old_card)
          base = base.replace(old_card, new_card, 1)

          old_banner = '''.matrix-title-banner {\n  position: relative;\n  width: calc(100% - 32px);\n  margin: 0 auto;\n'''
          new_banner = '''.matrix-title-banner {\n  position: relative;\n  width: auto;\n  margin: 0 var(--layout-page-inline);\n'''
          assert base.count(old_banner) == 1, base.count(old_banner)
          base = base.replace(old_banner, new_banner, 1)
          base_path.write_text(base)

          explore_path = Path('src/matrix-explore-spacing.css')
          explore = explore_path.read_text()
          assert explore.count('padding: 0 16px 1rem;') == 1
          explore = explore.replace('padding: 0 16px 1rem;', 'padding: 0 var(--layout-page-inline) 1rem;', 1)

          selector = '.matrix-explore-main-screen .matrix-title-banner {'
          start = explore.index(selector)
          end = explore.index('}', start)
          block = explore[start:end]
          assert '  width: calc(100% - 32px);\n' in block
          block = block.replace('  width: calc(100% - 32px);\n', '')
          explore = explore[:start] + block + explore[end:]
          explore_path.write_text(explore)

      - name: Verify targeted and full tests
        run: |
          node --test tests/responsive-layout-cleanup.test.mjs
          node --test tests/matrix-explore-fluid-layout.test.mjs tests/matrix-explore-option-layout.test.mjs tests/recent-history-layout.test.mjs
          node --test tests/*.test.mjs
          npm run build

      - name: Commit verified cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/feature-pages.css src/matrix-explore-spacing.css tests/responsive-layout-cleanup.test.mjs
          git commit -m 'Refine responsive layout constraints'
          git push origin main
