name: Responsive layout cleanup once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'responsive-layout-cleanup-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: RED - define responsive cleanup contract
        shell: bash
        run: |
          cat > tests/responsive-layout-cleanup.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import test from 'node:test';

          const base = readFileSync('src/feature-pages.css', 'utf8');
          const explore = readFileSync('src/matrix-explore-spacing.css', 'utf8');
          const tokens = readFileSync('src/design-tokens.css', 'utf8');
          const styles = readFileSync('src/styles.css', 'utf8');

          test('390px remains only the mobile viewport maximum', () => {
            assert.match(styles, /--app-layout-viewport:\s*390px/);
            assert.match(styles, /\.mobile-app-viewport\s*\{[^}]*width:\s*min\(100%,\s*var\(--app-layout-viewport\)\);[^}]*max-width:\s*var\(--app-layout-viewport\)/s);
          });

          test('shared layout token remains 12px', () => {
            assert.match(tokens, /--layout-page-inline:\s*12px/);
          });

          test('shared title surfaces no longer subtract 32px', () => {
            assert.match(base, /\.feature-title-card\s*\{[^}]*width:\s*auto;[^}]*margin:\s*8px var\(--layout-page-inline\) 0;/s);
            assert.match(base, /\.matrix-title-banner\s*\{[^}]*width:\s*auto;[^}]*margin:\s*0 var\(--layout-page-inline\);/s);
            assert.doesNotMatch(base, /\.feature-title-card\s*\{[^}]*calc\(100%\s*-\s*32px\)/s);
          });

          test('number reference title uses the same 12px source', () => {
            assert.match(base, /\.number-reference-screen \.matrix-title-banner\s*\{[^}]*width:\s*auto;[^}]*margin:\s*0 var\(--layout-page-inline\);/s);
          });

          test('Matrix Explore uses shared 12px page inset without a width re-lock', () => {
            assert.match(explore, /\.matrix-explore-main-screen \.feature-body\s*\{[^}]*padding:\s*0 var\(--layout-page-inline\) 1rem;/s);
            assert.doesNotMatch(explore, /\.matrix-explore-main-screen \.feature-body\s*\{[^}]*padding:\s*0 16px 1rem;/s);
            assert.doesNotMatch(explore, /\.matrix-explore-main-screen \.matrix-title-banner\s*\{[^}]*width:\s*calc\(100%\s*-\s*32px\)/s);
          });

          test('latest responsive recent-history rules remain intact', () => {
            assert.match(explore, /grid-template-columns:\s*minmax\(0, \.88fr\) minmax\(0, \.82fr\) minmax\(0, 3\.3fr\)/);
            assert.match(explore, /--matrix-history-ball-size:\s*clamp\(22px, 7\.2vw, 28px\)/);
          });
          EOF

          set +e
          node --test tests/responsive-layout-cleanup.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'RED test unexpectedly passed before production change.'
            exit 1
          fi
          echo 'RED confirmed.'

      - name: GREEN - modify existing formal style sources only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          base_path = Path('src/feature-pages.css')
          base = base_path.read_text()

          old = 'width: calc(100% - 32px); min-height: 56px; margin-top: 8px;'
          new = 'width: auto; min-height: 56px; margin: 8px var(--layout-page-inline) 0;'
          count = base.count(old)
          if count != 1:
              raise SystemExit(f'feature-title-card source count={count}')
          base = base.replace(old, new, 1)

          old = '.matrix-title-banner {\n  position: relative;\n  width: calc(100% - 32px);\n  margin: 0 auto;\n'
          new = '.matrix-title-banner {\n  position: relative;\n  width: auto;\n  margin: 0 var(--layout-page-inline);\n'
          count = base.count(old)
          if count != 1:
              raise SystemExit(f'base matrix-title-banner source count={count}')
          base = base.replace(old, new, 1)

          old = '.number-reference-screen .matrix-title-banner {\n  width: calc(100% - 32px);\n  margin-top: 0;\n}'
          new = '.number-reference-screen .matrix-title-banner {\n  width: auto;\n  margin: 0 var(--layout-page-inline);\n}'
          count = base.count(old)
          if count != 1:
              raise SystemExit(f'number-reference title source count={count}')
          base = base.replace(old, new, 1)
          base_path.write_text(base)

          explore_path = Path('src/matrix-explore-spacing.css')
          explore = explore_path.read_text()
          old_padding = 'padding: 0 16px 1rem;'
          count = explore.count(old_padding)
          if count != 1:
              raise SystemExit(f'explore 16px padding source count={count}')
          explore = explore.replace(old_padding, 'padding: 0 var(--layout-page-inline) 1rem;', 1)

          selector = '.matrix-explore-main-screen .matrix-title-banner {'
          start = explore.index(selector)
          end = explore.index('}', start)
          block = explore[start:end]
          locked = '  width: calc(100% - 32px);\n'
          if locked not in block:
              raise SystemExit('Matrix Explore title width lock not found in expected rule')
          block = block.replace(locked, '')
          explore = explore[:start] + block + explore[end:]
          explore_path.write_text(explore)
          PY

      - name: Verify targeted and full tests
        run: |
          node --test tests/responsive-layout-cleanup.test.mjs
          node --test tests/matrix-explore-fluid-layout.test.mjs tests/matrix-explore-option-layout.test.mjs tests/recent-history-layout.test.mjs
          node --test tests/*.test.mjs
          npm run build

      - name: Commit verified cleanup to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/responsive-layout-cleanup-once.yml
          git add -- src/feature-pages.css src/matrix-explore-spacing.css tests/responsive-layout-cleanup.test.mjs
          git commit -m 'Refine responsive layout constraints'
          git push origin main
