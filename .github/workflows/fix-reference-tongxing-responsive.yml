name: Fix number reference responsive source
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.issue.title == 'run-number-reference-responsive-source-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: RED - confirm legacy reference constraints exist
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const css=fs.readFileSync('src/feature-pages.css','utf8');
          assert.match(css,/grid-template-columns:\s*100px\s+92px\s+minmax\(0, 1fr\)/);
          assert.match(css,/\.reference-query-panel\[data-floating="true"\][^{]*\{[^}]*left:\s*50%[^}]*translateX\(-50%\)/s);
          EOF
      - name: Replace legacy rules at their formal source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/feature-pages.css')
          s=p.read_text()

          def replace_once(old,new,label):
              global s
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s=s.replace(old,new,1)

          replace_once(
            '.number-reference-screen .query-selects.three-cols { grid-template-columns: 88px 84px minmax(0, 1fr); margin-bottom: 12px; }',
            '.number-reference-screen .query-selects.three-cols { display: grid; width: 100%; min-width: 0; grid-template-columns: minmax(0, .9fr) minmax(0, .85fr) minmax(0, 1.65fr); gap: 8px; margin-bottom: 10px; }',
            'primary query-select grid'
          )
          replace_once(
            '.number-reference-screen .reference-select { height: 36px; }',
            '.number-reference-screen .reference-select { width: 100%; min-width: 0; height: 40px; }',
            'reference select size'
          )
          replace_once(
            '.number-reference-screen .reference-select select { padding-right: 28px; font-size: 14px; font-weight: 600; text-align: center; text-align-last: center; }',
            '.number-reference-screen .reference-select select { min-width: 0; padding-left: 8px; padding-right: 28px; font-size: clamp(12px, 3.4vw, 14px); font-weight: 600; text-align: center; text-align-last: center; }',
            'reference select text'
          )
          replace_once(
            '.number-reference-screen .reference-order-select select { padding-left: 5px; padding-right: 22px; font-size: 11.5px; }',
            '.number-reference-screen .reference-order-select select { min-width: 0; padding-left: 6px; padding-right: 24px; font-size: clamp(10.5px, 3vw, 12px); text-align: center; text-align-last: center; }',
            'reference order select'
          )
          replace_once(
            '.reference-search > div { display: grid; grid-template-columns: repeat(3, 48px) minmax(0, 1fr); gap: 8px; }',
            '.reference-search > div { display: grid; width: 100%; min-width: 0; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(92px, 1.5fr); gap: 8px; align-items: stretch; }',
            'reference input row'
          )
          replace_once(
            '.reference-search input,\n.reference-search .gold-button { height: 36px; }',
            '.reference-search input,\n.reference-search .gold-button { height: 40px; }',
            'reference control height'
          )
          replace_once(
            '.reference-row { display: grid; min-height: 40px; grid-template-columns: 72px minmax(0, 1fr); border-top: 1px solid #4f391d; color: #ccc4b8; font-size: 13px; text-align: center; }',
            '.reference-row { display: grid; width: 100%; min-width: 0; min-height: 44px; grid-template-columns: minmax(64px, 22%) minmax(0, 1fr); border-top: 1px solid #4f391d; color: #ccc4b8; font-size: 13px; text-align: center; }',
            'reference table columns'
          )

          old_float='''.reference-query-panel[data-floating="true"] {
  position: absolute;
  z-index: 40;
  left: 50%;
  box-sizing: border-box;
  width: min(calc(100vw - 8px), 382px);
  max-height: calc(100dvh - 24px);
  padding: 8px;
  overflow-y: auto;
  border: 1px solid #6c4a20;
  border-radius: 11px;
  background: linear-gradient(145deg, rgba(8, 16, 22, .99), rgba(2, 8, 13, .99));
  box-shadow: 0 12px 34px rgba(0, 0, 0, .72), inset 0 0 18px rgba(150, 102, 34, .04);
  transform: translateX(-50%);
}'''
          new_float='''.reference-query-panel[data-floating="true"] {
  position: absolute;
  z-index: 40;
  right: 16px;
  left: 16px;
  box-sizing: border-box;
  width: auto;
  max-width: none;
  max-height: calc(100dvh - 24px);
  padding: 8px;
  overflow-y: auto;
  border: 1px solid #6c4a20;
  border-radius: 11px;
  background: linear-gradient(145deg, rgba(8, 16, 22, .99), rgba(2, 8, 13, .99));
  box-shadow: 0 12px 34px rgba(0, 0, 0, .72), inset 0 0 18px rgba(150, 102, 34, .04);
}'''
          replace_once(old_float,new_float,'floating query panel')

          replace_once(
            '.number-reference-screen .query-selects.three-cols { grid-template-columns: 100px 92px minmax(0, 1fr); }\n',
            '',
            'duplicate query grid override'
          )
          replace_once(
            '.number-reference-screen .reference-select select { padding-left: 7px; padding-right: 25px; font-size: 13px; }\n',
            '',
            'duplicate select override'
          )
          replace_once(
            '.number-reference-screen .reference-order-select select { padding-left: 5px; padding-right: 22px; font-size: 11.5px; }\n',
            '',
            'duplicate order override'
          )
          replace_once(
            '.number-reference-screen .feature-body { padding-top: 8px; }',
            '.number-reference-screen .feature-body { box-sizing: border-box; width: 100%; min-width: 0; padding-top: 8px; padding-inline: 16px; overflow-x: hidden; }',
            'reference body inset'
          )
          replace_once(
            '.number-reference-screen .reference-row.head { min-height: 32px; font-size: 14px; }',
            '.number-reference-screen .reference-row.head { min-height: 36px; font-size: 14px; }',
            'reference table head'
          )

          p.write_text(s)
          PY
      - name: GREEN - verify responsive contract and build
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const css=fs.readFileSync('src/feature-pages.css','utf8');
          assert.match(css,/\.number-reference-screen \.feature-body\s*\{[^}]*padding-inline:\s*16px/s);
          assert.match(css,/\.number-reference-screen \.query-selects\.three-cols\s*\{[^}]*\.9fr[^}]*\.85fr[^}]*1\.65fr/s);
          assert.match(css,/\.reference-search > div\s*\{[^}]*repeat\(3, minmax\(0, 1fr\)\)[^}]*minmax\(92px, 1\.5fr\)/s);
          assert.match(css,/\.reference-row\s*\{[^}]*minmax\(64px, 22%\)[^}]*minmax\(0, 1fr\)/s);
          assert.doesNotMatch(css,/grid-template-columns:\s*88px\s+84px/);
          assert.doesNotMatch(css,/grid-template-columns:\s*100px\s+92px/);
          assert.doesNotMatch(css,/\.reference-query-panel\[data-floating="true"\][^{]*\{[^}]*left:\s*50%/s);
          assert.doesNotMatch(css,/\.reference-query-panel\[data-floating="true"\][^{]*\{[^}]*translateX/s);
          for (const width of [360,390,412,430]) {
            const inner=width-32;
            assert.ok(inner >= 328);
            const available=inner-24-92;
            assert.ok(available/3 > 70);
          }
          EOF
          npm ci
          npm run build
      - name: Commit source and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-reference-tongxing-responsive.yml
          git add src/feature-pages.css
          git commit -m 'fix: reflow number reference mobile layout'
          git push origin main
