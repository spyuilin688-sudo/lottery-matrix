name: Fix reference title spacing
on:
  push:
    paths:
      - '.github/workflows/fix-reference-title-spacing.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: RED - verify current spacing does not satisfy requested values
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const css=fs.readFileSync('src/feature-pages.css','utf8');
          const ok=/\.number-reference-screen \.matrix-title-banner\s*\{[^}]*margin-top:\s*0(?:px)?;/s.test(css)&&/\.number-reference-screen \.feature-body\s*\{[^}]*padding-top:\s*8px;/s.test(css);
          if(ok) process.exit(1);
          console.log('RED confirmed: requested 0px top / 8px bottom spacing is not yet present');
          EOF
      - name: Apply canonical spacing fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/feature-pages.css')
          s=p.read_text()
          old='''.number-reference-screen .matrix-title-banner {\n  width: calc(100% - 8px);\n  margin-top: 8px;\n}'''
          new='''.number-reference-screen .matrix-title-banner {\n  width: calc(100% - 8px);\n  margin-top: 0;\n}'''
          if old not in s: raise SystemExit('canonical title rule not found')
          s=s.replace(old,new,1)
          old2='''.number-reference-screen .feature-body,\n.calculator-screen .feature-body { padding-top: 4px; }'''
          new2='''.number-reference-screen .feature-body { padding-top: 8px; }\n.calculator-screen .feature-body { padding-top: 4px; }'''
          if old2 not in s: raise SystemExit('canonical body spacing rule not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: GREEN - verify exact requested spacing and build
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const css=fs.readFileSync('src/feature-pages.css','utf8');
          assert.match(css,/\.number-reference-screen \.matrix-title-banner\s*\{[^}]*margin-top:\s*0;/s);
          assert.match(css,/\.number-reference-screen \.feature-body\s*\{[^}]*padding-top:\s*8px;/s);
          assert.match(css,/\.calculator-screen \.feature-body\s*\{[^}]*padding-top:\s*4px;/s);
          EOF
          npm ci
          npm run build
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-reference-title-spacing.yml
          git add src/feature-pages.css
          git commit -m 'fix: adjust reference title spacing'
          git push origin main