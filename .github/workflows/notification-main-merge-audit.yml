name: Audit notification-main merge conflicts

on:
  push:
    branches: ["通知"]
    paths:
      - .github/workflows/notification-main-merge-audit.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "通知"
          fetch-depth: 0
      - name: Fetch main and inspect merge conflicts
        run: |
          git config user.name "spy854540-cmd"
          git config user.email "spy854540@gmail.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main > merge-output.txt 2>&1
          status=$?
          set -e
          echo "merge_status=$status" > merge-audit.txt
          cat merge-output.txt >> merge-audit.txt
          echo "--- conflicts ---" >> merge-audit.txt
          git diff --name-only --diff-filter=U >> merge-audit.txt
          echo "--- status ---" >> merge-audit.txt
          git status --short >> merge-audit.txt
          git merge --abort || true
      - uses: actions/upload-artifact@v4
        with:
          name: notification-main-merge-audit
          path: merge-audit.txt
