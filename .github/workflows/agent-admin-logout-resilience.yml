name: Verify admin logout resilience

on:
  push:
    branches:
      - fix/admin-subscription-login-info-20260916

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/admin/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install admin dependencies
        working-directory: apps/admin
        run: npm ci
      - name: Add logout failure regression and implementation
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('apps/admin/backend/admin-credential-auth.ts')
          source = source_path.read_text()
          old = """    if (loginRecordId) {
                await transport.updateRows('admin_login_records', `id=eq.${encodeURIComponent(loginRecordId)}&logout_at=is.null`, { logout_at: now().toISOString() });
              }
          """
          new = """    if (loginRecordId) {
                try {
                  await transport.updateRows('admin_login_records', `id=eq.${encodeURIComponent(loginRecordId)}&logout_at=is.null`, { logout_at: now().toISOString() });
                } catch { /* Login record storage failure must not prevent logout. */ }
              }
          """
          if source.count(old) != 1:
              raise SystemExit('Expected one logout record update block')
          source_path.write_text(source.replace(old, new))

          test_path = Path('apps/admin/backend/admin-session-login-record.test.ts')
          test = test_path.read_text()
          addition = """

          it('still removes the administrator session when logout timestamp storage fails', async () => {
            const state = makeTransport();
            const auth = createAdminCredentialAuth(state.transport, () => new Date('2026-09-16T09:00:00Z'));
            state.admins.push({ id: 'a1', account: 'operator', name: 'Operator', role: '營運管理員', status: '啟用', ...await auth.passwordFields('correct', true) });
            const login = await auth.login('operator', 'correct');
            state.loginRecords.push({ id: login.loginRecordId, logout_at: null });
            state.transport.updateRows.mockRejectedValueOnce(new Error('logout record unavailable'));
            await expect(auth.logout({ cookie: 'matrix_admin_session=' + login.token })).resolves.toBeUndefined();
            expect(state.sessions).toHaveLength(0);
            expect(state.loginRecords[0].logout_at).toBeNull();
          });
          """
          if 'still removes the administrator session when logout timestamp storage fails' in test:
              raise SystemExit('Regression test already exists')
          test_path.write_text(test.rstrip() + addition)
      - name: Run directly related regression tests
        working-directory: apps/admin
        run: npx vitest run src/admin-subscription-login-details.test.tsx src/user-info-completeness.test.tsx src/UserInfoDialog.test.tsx src/admin-user-display.test.tsx backend/admin-session-login-record.test.ts backend/admin-login-logout-wiring.test.ts backend/admin-location-normalization.test.ts backend/admin-credential-auth.test.ts backend/member-login-history.test.ts --reporter=verbose
      - name: Build admin AppDeploy target
        working-directory: apps/admin
        env:
          APPDEPLOY_CI_EXTERNALS: 'true'
        run: npm run build
      - name: Build Cloudflare Pages admin target
        working-directory: apps/admin
        run: npm run build:pages
      - name: Commit verified resilience fix
        shell: bash
        run: |
          rm .github/workflows/agent-admin-logout-resilience.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(admin): preserve logout on audit write failure'
          git push origin HEAD:fix/admin-subscription-login-info-20260916
