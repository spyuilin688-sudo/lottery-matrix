name: Fix Homepage Bottom Clearance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-homepage-bottom-clearance.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Verify regression test is red before fix
        run: |
          if node --test tests/bottom-navigation-safe-area-position.test.mjs; then
            echo "Regression test unexpectedly passed before homepage fix"
            exit 1
          fi
          echo "Regression test failed as expected before homepage fix"

      - name: Fix homepage bottom clearance source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/homepage-repair.css')
          text = path.read_text()
          old = '  padding-bottom: calc(var(--bottom-navigation-height) + var(--mobile-safe-area-height, 0px));'
          new = '  padding-bottom: var(--layout-bottom-nav-clearance);'
          if text.count(old) != 1:
              raise SystemExit('homepage bottom clearance source not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify target regression test is green
        run: node --test tests/bottom-navigation-safe-area-position.test.mjs

      - name: Full tests
        run: node --test tests/*.test.mjs

      - name: Build
        run: npm run build

      - name: Commit verified fix to main
        run: |
          rm .github/workflows/fix-homepage-bottom-clearance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/homepage-repair.css tests/bottom-navigation-safe-area-position.test.mjs .github/workflows/fix-homepage-bottom-clearance.yml
          git commit -m "fix: remove duplicate homepage bottom clearance"
          git push origin HEAD:main
