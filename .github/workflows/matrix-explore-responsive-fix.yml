name: Matrix Explore settings density update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/matrix-explore-responsive-fix.yml'

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update Explore settings formal sizing sources
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('src/feature-pages.css')
          s = p.read_text()

          def one(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          one(
            '.matrix-explore-screen .section-title {\nmin-height: 28px; gap: 10px; font-size: 19px; font-weight: 700; line-height: 26px; letter-spacing: 0;\n}\n\n.matrix-explore-screen .section-title > span {\nwidth: 4px; height: 24px; border-radius: 2px; box-shadow: 0 0 4px rgba(255, 194, 42, .18);\n}\n',
            '.matrix-explore-screen:not(.matrix-explore-main-screen) .section-title,\n.matrix-explore-main-screen .panel:not(.explore-settings) .section-title {\nmin-height: 28px; gap: 10px; font-size: 19px; font-weight: 700; line-height: 26px; letter-spacing: 0;\n}\n\n.matrix-explore-main-screen .explore-settings > .section-title {\nmin-height: 22.4px; gap: 8px; font-size: 15.2px; font-weight: 700; line-height: 20.8px; letter-spacing: 0;\n}\n\n.matrix-explore-screen:not(.matrix-explore-main-screen) .section-title > span,\n.matrix-explore-main-screen .panel:not(.explore-settings) .section-title > span {\nwidth: 4px; height: 24px; border-radius: 2px; box-shadow: 0 0 4px rgba(255, 194, 42, .18);\n}\n\n.matrix-explore-main-screen .explore-settings > .section-title > span {\nwidth: 3.2px; height: 19.2px; border-radius: 1.6px; box-shadow: 0 0 4px rgba(255, 194, 42, .18);\n}\n',
            'Explore settings title sizing'
          )

          one(
            '.matrix-explore-screen .setting-grid {\nmin-width: 0; width: 100%; margin-top: 12px; gap: 8px;\n}\n',
            '.matrix-explore-screen:not(.matrix-explore-main-screen) .setting-grid {\nmin-width: 0; width: 100%; margin-top: 12px; gap: 8px;\n}\n\n.matrix-explore-main-screen .explore-settings .setting-grid {\nmin-width: 0; width: 100%; margin-top: 8px; gap: 8px;\n}\n',
            'Explore settings title-to-content gap'
          )

          one(
            '.matrix-explore-screen .setting-grid label,\n.matrix-explore-screen .advanced-panel label {\nmin-width: 0; width: 100%; min-height: 44px; grid-template-columns: minmax(102px, 110px) minmax(0, 1fr); align-items: center; gap: 8px;\n}\n',
            '.matrix-explore-screen:not(.matrix-explore-main-screen) .setting-grid label,\n.matrix-explore-main-screen .advanced-panel label {\nmin-width: 0; width: 100%; min-height: 44px; grid-template-columns: minmax(102px, 110px) minmax(0, 1fr); align-items: center; gap: 8px;\n}\n\n.matrix-explore-main-screen .explore-settings .setting-grid label {\nmin-width: 0; width: 100%; min-height: 37.4px; grid-template-columns: minmax(102px, 110px) minmax(0, 1fr); align-items: center; gap: 8px;\n}\n',
            'Explore settings row height'
          )

          one(
            '.matrix-explore-screen .setting-grid label > span,\n.matrix-explore-screen .advanced-panel label > .advanced-setting-title {\ndisplay: grid; width: 100%; min-width: 0; grid-template-columns: 32px minmax(0, 1fr); align-items: center; gap: 8px; color: #bdb8b0; font-size: 16px; font-weight: 600; line-height: 22px; text-align: left; white-space: nowrap;\n}\n',
            '.matrix-explore-screen:not(.matrix-explore-main-screen) .setting-grid label > span,\n.matrix-explore-main-screen .advanced-panel label > .advanced-setting-title {\ndisplay: grid; width: 100%; min-width: 0; grid-template-columns: 32px minmax(0, 1fr); align-items: center; gap: 8px; color: #bdb8b0; font-size: 16px; font-weight: 600; line-height: 22px; text-align: left; white-space: nowrap;\n}\n\n.matrix-explore-main-screen .explore-settings .setting-grid label > span {\ndisplay: grid; width: 100%; min-width: 0; grid-template-columns: 36.8px minmax(0, 1fr); align-items: center; gap: 8px; color: #bdb8b0; font-size: 16px; font-weight: 600; line-height: 22px; text-align: left; white-space: nowrap;\n}\n',
            'Explore settings icon track'
          )

          one(
            '.matrix-explore-screen .setting-grid label > span .setting-label-icon,\n.matrix-explore-screen .advanced-panel .advanced-setting-title .setting-label-icon {\nwidth: 32px; height: 32px; flex: 0 0 32px; border-radius: 5px; transform: none;\n}\n',
            '.matrix-explore-screen:not(.matrix-explore-main-screen) .setting-grid label > span .setting-label-icon,\n.matrix-explore-main-screen .advanced-panel .advanced-setting-title .setting-label-icon {\nwidth: 32px; height: 32px; flex: 0 0 32px; border-radius: 5px; transform: none;\n}\n\n.matrix-explore-main-screen .explore-settings .setting-grid label > span .setting-label-icon {\nwidth: 36.8px; height: 36.8px; flex: 0 0 36.8px; border-radius: 5.75px; transform: none;\n}\n',
            'Explore settings icons 115 percent'
          )

          one(
            '.matrix-explore-screen .setting-grid .select-box,\n.matrix-explore-screen .advanced-panel .select-box {\nwidth: 100%; max-width: none; min-width: 0; height: 44px; min-height: 44px; padding: 0; font-size: 16px; font-weight: 700;\n}\n',
            '.matrix-explore-screen:not(.matrix-explore-main-screen) .setting-grid .select-box,\n.matrix-explore-main-screen .advanced-panel .select-box {\nwidth: 100%; max-width: none; min-width: 0; height: 44px; min-height: 44px; padding: 0; font-size: 16px; font-weight: 700;\n}\n\n.matrix-explore-main-screen .explore-settings .setting-grid .select-box {\nwidth: 100%; max-width: none; min-width: 0; height: 37.4px; min-height: 37.4px; padding: 0; font-size: 13.6px; font-weight: 700;\n}\n',
            'Explore settings select 85 percent'
          )

          one(
            '.matrix-explore-screen .setting-grid .select-box,\n.matrix-explore-screen .setting-grid .segmented,\n.matrix-explore-screen .setting-grid .segmented button,\n.matrix-explore-screen .advanced-panel .select-box,\n.matrix-explore-screen .advanced-panel .segmented,\n.matrix-explore-screen .advanced-panel .segmented button,\n.matrix-explore-screen .hit-options,\n.matrix-explore-screen .hit-options button {\nheight: 44px;\n  min-height: 44px;\n}\n',
            '.matrix-explore-screen:not(.matrix-explore-main-screen) .setting-grid .select-box,\n.matrix-explore-screen:not(.matrix-explore-main-screen) .setting-grid .segmented,\n.matrix-explore-screen:not(.matrix-explore-main-screen) .setting-grid .segmented button,\n.matrix-explore-main-screen .advanced-panel .select-box,\n.matrix-explore-main-screen .advanced-panel .segmented,\n.matrix-explore-main-screen .advanced-panel .segmented button,\n.matrix-explore-screen .hit-options,\n.matrix-explore-screen .hit-options button {\nheight: 44px;\n  min-height: 44px;\n}\n\n.matrix-explore-main-screen .explore-settings .setting-grid .select-box,\n.matrix-explore-main-screen .explore-settings .setting-grid .segmented,\n.matrix-explore-main-screen .explore-settings .setting-grid .segmented button {\nheight: 37.4px;\n  min-height: 37.4px;\n}\n',
            'Explore settings control height split'
          )

          one(
            '.matrix-explore-screen .setting-grid .segmented button,\n.matrix-explore-screen .advanced-panel .segmented button,\n.matrix-explore-screen .hit-options button {\npadding: 0 4px;\n  border-radius: 10px;\n  font-weight: 600;\n  white-space: nowrap;\n}\n',
            '.matrix-explore-screen:not(.matrix-explore-main-screen) .setting-grid .segmented button,\n.matrix-explore-main-screen .advanced-panel .segmented button,\n.matrix-explore-screen .hit-options button {\npadding: 0 4px;\n  border-radius: 10px;\n  font-weight: 600;\n  white-space: nowrap;\n}\n\n.matrix-explore-main-screen .explore-settings .setting-grid .segmented button {\npadding: 0 3.4px;\n  border-radius: 8.5px;\n  font-weight: 600;\n  white-space: nowrap;\n}\n',
            'Explore settings button chrome 85 percent'
          )

          one(
            '.matrix-explore-screen .segmented.three {\ngap: 6px;\n}\n\n.matrix-explore-screen .segmented.three button {\nmin-width: 0; height: 44px; min-height: 44px; padding: 0 4px; border-radius: 10px; font-size: 13px; font-weight: 600; line-height: 1.15; white-space: normal; overflow: visible;\n}\n',
            '.matrix-explore-screen:not(.matrix-explore-main-screen) .segmented.three,\n.matrix-explore-main-screen .advanced-panel .segmented.three {\ngap: 6px;\n}\n\n.matrix-explore-main-screen .explore-settings .segmented.three {\ngap: 5.1px;\n}\n\n.matrix-explore-screen:not(.matrix-explore-main-screen) .segmented.three button,\n.matrix-explore-main-screen .advanced-panel .segmented.three button {\nmin-width: 0; height: 44px; min-height: 44px; padding: 0 4px; border-radius: 10px; font-size: 13px; font-weight: 600; line-height: 1.15; white-space: normal; overflow: visible;\n}\n\n.matrix-explore-main-screen .explore-settings .segmented.three button {\nmin-width: 0; height: 37.4px; min-height: 37.4px; padding: 0 3.4px; border-radius: 8.5px; font-size: 11.05px; font-weight: 600; line-height: 1.15; white-space: normal; overflow: visible;\n}\n',
            'Explore settings segmented three 85 percent'
          )

          p.write_text(s)
          PY

      - name: Verify requested sizing and forbidden techniques
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          css = Path('src/feature-pages.css').read_text()
          a = css.index('/* Matrix Explore formal layout rules */')
          b = css.index('/* v55 scoped density and hierarchy refinements */')
          formal = css[a:b]
          required = [
            'margin-top: 8px; gap: 8px;',
            'font-size: 15.2px',
            'width: 36.8px; height: 36.8px',
            'height: 37.4px; min-height: 37.4px',
            'font-size: 13.6px',
            'font-size: 11.05px',
          ]
          missing = [item for item in required if item not in formal]
          if missing:
              raise SystemExit('missing sizing rules: ' + ', '.join(missing))
          forbidden = ['zoom:', 'scale(', '!important', 'margin-top: -', 'margin-bottom: -']
          bad = [item for item in forbidden if item in formal]
          if bad:
              raise SystemExit('forbidden technique present in formal Explore block: ' + ', '.join(bad))
          if '.matrix-explore-screen .matrix-title-banner {\nmargin-bottom: 8px;\n}' not in formal:
              raise SystemExit('confirmed 8px title-banner spacing changed')
          print('Explore settings sizing verification passed')
          PY

      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      - name: Commit verified source change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/matrix-explore-responsive-fix.yml
          git add src/feature-pages.css
          git commit -m 'fix(explore): refine settings card sizing'
          git push origin main
