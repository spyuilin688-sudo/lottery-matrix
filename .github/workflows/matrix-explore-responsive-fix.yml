name: Matrix Explore responsive fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/matrix-explore-responsive-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply canonical responsive cleanup
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              return text.replace(old, new, 1)

          p = Path('src/feature-pages.css')
          s = p.read_text()
          s = one(s, '.matrix-explore-screen .setting-grid label > span {\ndisplay: grid; width: 110px; grid-template-columns: 32px 70px; align-items: center; gap: 8px;\n}\n\n', '', 'duplicate label lock')
          s = one(s, '.matrix-explore-main-screen .history-panel .panel-heading .section-title,\n.matrix-explore-main-screen .history-panel .panel-heading button {\nwhite-space: nowrap;\n}\n', '.matrix-explore-main-screen .history-panel .panel-heading .section-title {\nmin-width: 0; white-space: normal; line-height: 1.25;\n}\n\n.matrix-explore-main-screen .history-panel .panel-heading button {\nwhite-space: nowrap;\n}\n', 'history heading nowrap')
          s = one(s, '.matrix-explore-main-screen .history-row {\ngrid-template-columns: 66px 68px minmax(0, 1fr);\n  border-top-width: 1px;\n}\n\n.matrix-explore-main-screen .history-panel[data-lottery="六合彩"] .history-row {\ngrid-template-columns: 66px 68px minmax(0, 1fr);\n}\n', '.matrix-explore-main-screen .history-row {\ngrid-template-columns: 56px 58px minmax(0, 1fr);\n  border-top-width: 1px;\n}\n', 'history grid')
          s = one(s, '.matrix-explore-screen .setting-grid {\nmargin-top: 12px; gap: 8px;\n}\n', '.matrix-explore-screen .setting-grid {\nmin-width: 0; width: 100%; margin-top: 12px; gap: 8px;\n}\n', 'setting grid width')
          s = one(s, '.matrix-explore-screen .setting-grid label,\n.matrix-explore-screen .advanced-panel label {\nmin-height: 44px; grid-template-columns: 110px minmax(0, 222px); align-items: center; gap: 8px;\n}\n', '.matrix-explore-screen .setting-grid label,\n.matrix-explore-screen .advanced-panel label {\nmin-width: 0; width: 100%; min-height: 44px; grid-template-columns: minmax(102px, 110px) minmax(0, 1fr); align-items: center; gap: 8px;\n}\n', 'fixed 110+222 grid')
          s = one(s, '.matrix-explore-screen .setting-grid label > span,\n.matrix-explore-screen .advanced-panel label > .advanced-setting-title {\ndisplay: grid; width: 110px; grid-template-columns: 32px 70px; align-items: center; gap: 8px; color: #bdb8b0; font-size: 16px; font-weight: 600; line-height: 22px; text-align: left; white-space: nowrap;\n}\n\n.matrix-explore-screen .explore-settings .setting-grid label:first-child > span {\nwidth: 110px; grid-template-columns: 32px 70px; gap: 8px; text-align: left;\n}\n', '.matrix-explore-screen .setting-grid label > span,\n.matrix-explore-screen .advanced-panel label > .advanced-setting-title {\ndisplay: grid; width: 100%; min-width: 0; grid-template-columns: 32px minmax(0, 1fr); align-items: center; gap: 8px; color: #bdb8b0; font-size: 16px; font-weight: 600; line-height: 22px; text-align: left; white-space: nowrap;\n}\n', 'label inner lock')
          s = one(s, '.matrix-explore-screen .setting-grid .select-box,\n.matrix-explore-screen .advanced-panel .select-box {\nwidth: 222px; max-width: 222px; height: 44px; min-height: 44px; padding: 0; font-size: 16px; font-weight: 700;\n}\n', '.matrix-explore-screen .setting-grid .select-box,\n.matrix-explore-screen .advanced-panel .select-box {\nwidth: 100%; max-width: none; min-width: 0; height: 44px; min-height: 44px; padding: 0; font-size: 16px; font-weight: 700;\n}\n', 'select 222 lock')
          s = one(s, '.matrix-explore-screen .setting-grid .segmented,\n.matrix-explore-screen .advanced-panel .segmented {\nwidth: 222px; max-width: 222px;\n}\n', '.matrix-explore-screen .setting-grid .segmented,\n.matrix-explore-screen .advanced-panel .segmented {\nwidth: 100%; max-width: none; min-width: 0;\n}\n', 'segmented 222 lock')
          s = one(s, '.matrix-explore-screen .segmented.three button {\nmin-width: 0; height: 44px; min-height: 44px; padding: 0 4px; border-radius: 10px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: visible;\n}\n', '.matrix-explore-screen .segmented.three button {\nmin-width: 0; height: 44px; min-height: 44px; padding: 0 4px; border-radius: 10px; font-size: 13px; font-weight: 600; line-height: 1.15; white-space: normal; overflow: visible;\n}\n', 'segmented nowrap')
          s = one(s, '.matrix-explore-screen .advanced-panel {\npadding-top: 8px; gap: 8px;\n}\n', '.matrix-explore-screen .advanced-panel {\nmin-width: 0; width: 100%; padding-top: 8px; gap: 8px;\n}\n', 'advanced panel width')
          p.write_text(s)

          p = Path('src/number-ball.css')
          s = p.read_text()
          s = one(s, '.history-panel .history-numbers[data-has-special="true"] .number-ball-component.history-lottery-ball[data-lottery="六合彩"] {\n  --number-ball-size: 26px;\n  --number-ball-asset-scale: 1.62;\n  --underline-height: .75px;\n  --underline-y: -1.5px;\n}\n', '.history-panel .history-numbers[data-has-special="true"] .number-ball-component.history-lottery-ball[data-lottery="六合彩"] {\n  --number-ball-asset-scale: 1.62;\n  --underline-height: .75px;\n  --underline-y: -1.5px;\n}\n', 'Mark Six 26px lock')
          p.write_text(s)
          PY

      - name: Replace obsolete fixed-width contract with responsive tests
        shell: bash
        run: |
          rm -f tests/matrix-explore-fixed-width.test.mjs
          cat > tests/matrix-explore-option-layout.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const css = readFileSync("src/feature-pages.css", "utf8");
          const a = css.indexOf("/* Matrix Explore formal layout rules */");
          const b = css.indexOf("/* v55 scoped density and hierarchy refinements */");
          assert.notEqual(a, -1); assert.notEqual(b, -1);
          const formal = css.slice(a, b);
          test("Matrix Explore removes fixed 222px layout locks", () => {
            assert.doesNotMatch(formal, /width:\s*222px|max-width:\s*222px|110px minmax\(0,\s*222px\)/);
          });
          test("settings and advanced controls shrink inside mobile width", () => {
            assert.match(formal, /grid-template-columns:\s*minmax\(102px,\s*110px\) minmax\(0,\s*1fr\)/);
            assert.match(formal, /width:\s*100%; max-width:\s*none; min-width:\s*0; height:\s*44px/);
            assert.match(formal, /line-height:\s*1\.15; white-space:\s*normal/);
          });
          test("recent history heading and columns fit mobile width", () => {
            assert.match(formal, /panel-heading \.section-title \{\nmin-width: 0; white-space: normal/);
            assert.match(formal, /grid-template-columns:\s*56px 58px minmax\(0,\s*1fr\)/);
            assert.doesNotMatch(formal, /history-panel\[data-lottery="六合彩"\] \.history-row/);
          });
          EOF

          cat > tests/recent-history-layout.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";
          const css = readFileSync(new URL("../src/feature-pages.css", import.meta.url), "utf8");
          const ballCss = readFileSync(new URL("../src/number-ball.css", import.meta.url), "utf8");
          const source = readFileSync(new URL("../src/FeaturePages.tsx", import.meta.url), "utf8");
          test("近10期標題列保留正式分隔線", () => {
            assert.match(css, /\.history-panel \.history-head\s*\{[^}]*min-height:\s*28px[^}]*border-bottom:\s*1px solid rgba\(195, 145, 54, \.70\)/s);
          });
          test("近10期六加一使用共用 23.5px，六合彩不另鎖 26px", () => {
            assert.match(ballCss, /history-lottery-ball:is\(\[data-lottery="六合彩"\], \[data-lottery="大樂透"\]\)\s*\{[^}]*--number-ball-size:\s*23\.5px/s);
            assert.doesNotMatch(ballCss, /history-lottery-ball\[data-lottery="六合彩"\]\s*\{[^}]*--number-ball-size:\s*26px/s);
          });
          test("近10期資料列依日期標記跨週分隔線", () => {
            assert.match(source, /data-week-boundary=\{isNearHistoryWeekBoundary\(lottery, previousDate, date\)\}/);
          });
          EOF

      - name: Install dependencies
        run: npm ci
      - name: Run targeted tests
        run: node --test tests/matrix-explore-option-layout.test.mjs tests/recent-history-layout.test.mjs
      - name: Run full tests
        run: node --test tests/*.test.mjs
      - name: Build
        run: npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/matrix-explore-responsive-fix.yml
          git add -A
          git commit -m 'fix(explore): make mobile layout responsive'
          git push origin main
