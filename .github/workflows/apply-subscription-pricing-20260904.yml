name: Apply subscription pricing update

on:
  push:
    branches:
      - fix/subscription-pricing-title-assets-20260904
    paths:
      - .github/workflows/apply-subscription-pricing-20260904.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact scoped replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          feature_path = Path('src/FeaturePages.tsx')
          text = feature_path.read_text(encoding='utf-8')

          def replace_all(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'missing expected source text: {old}')
              text = text.replace(old, new)
              if old in text:
                  raise SystemExit(f'old source text remains after replacement: {old}')

          replace_all('Matrix Pro 會員方案與收費標準', 'Matrix Pro 訂閱方案與收費標準')
          replace_all('/assets/lottery/functions/會員方案標題K.png', '/assets/lottery/functions/訂閱方案標題K.png')
          replace_all('會員方案／收費標準', '訂閱方案／收費標準')
          replace_all('Matrix Pro 方案與收費標準', 'Matrix Pro 訂閱方案與收費標準')
          replace_all('$1,880', '$2,880')
          replace_all('$4,580', '$5,580')
          replace_all('$16,800', '$17,800')
          replace_all('month: { name: "月費方案", amount: 1880 }', 'month: { name: "月費方案", amount: 2880 }')
          replace_all('quarter: { name: "季費方案", amount: 4580 }', 'quarter: { name: "季費方案", amount: 5580 }')
          replace_all('year: { name: "年費方案", amount: 16800 }', 'year: { name: "年費方案", amount: 17800 }')

          legal_art = ' headerArtwork="/assets/lottery/functions/法律資訊標題K.png"'
          legal_shells = [
              'return <ProfileDetailShell title="關於 樂彩 Matrix" onNavigate={onNavigate} className="profile-info-screen">',
              'return <ProfileDetailShell title="服務內容與使用說明" onNavigate={onNavigate} className="profile-info-screen">',
              'return <ProfileDetailShell title="退款規範" onNavigate={onNavigate} className="profile-info-screen">',
              'return <ProfileDetailShell title="會員服務條例" onNavigate={onNavigate} className="profile-info-screen">',
              'return <ProfileDetailShell title="隱私權政策" onNavigate={onNavigate} className="profile-info-screen">',
              'return <ProfileDetailShell title="聲明與免責事項" onNavigate={onNavigate} className="profile-info-screen">',
          ]
          for old in legal_shells:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one legal shell: {old}')
              text = text.replace(old, old[:-1] + legal_art + '>', 1)

          activation_old = '<ProfileDetailShell title="我的推薦碼/啟動碼" onNavigate={onNavigate} className="activation-code-screen" hidePageTitle>'
          activation_new = '<ProfileDetailShell title="我的推薦碼/啟動碼" onNavigate={onNavigate} className="activation-code-screen" hidePageTitle headerArtwork="/assets/lottery/functions/推薦啟動標題K.png">'
          if text.count(activation_old) != 1:
              raise SystemExit('expected exactly one activation-code shell')
          text = text.replace(activation_old, activation_new, 1)

          if text.count('headerArtwork="/assets/lottery/functions/法律資訊標題K.png"') != 6:
              raise SystemExit('legal artwork must be applied to exactly six pages')
          if '會員方案標題K.png' in text:
              raise SystemExit('deleted membership-plan artwork is still referenced')

          feature_path.write_text(text, encoding='utf-8')

          test_path = Path('src/__tests__/ManualBankTransferPage.test.tsx')
          test_text = test_path.read_text(encoding='utf-8')
          replacements = [
              ("id: 'transfer-1', planName: '月費方案', amount: 1880,", "id: 'transfer-1', planName: '月費方案', amount: 2880,"),
              ("id: 'pending-1', planName: '月費方案', amount: 1880,", "id: 'pending-1', planName: '月費方案', amount: 2880,"),
              ("expect(await screen.findByText('連線銀行')).toBeInTheDocument();", "expect(await screen.findByText('連線銀行')).toBeInTheDocument();\n    expect(screen.getByText('NT$2,880')).toBeInTheDocument();"),
          ]
          for old, new in replacements:
              if test_text.count(old) != 1:
                  raise SystemExit(f'expected exactly one test target: {old}')
              test_text = test_text.replace(old, new, 1)
          test_path.write_text(test_text, encoding='utf-8')
          PY

      - name: Verify targeted pricing contract
        run: node --test tests/subscription-copy-assets.test.mjs

      - name: Commit scoped changes and remove one-off workflow
        run: |
          rm .github/workflows/apply-subscription-pricing-20260904.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FeaturePages.tsx src/__tests__/ManualBankTransferPage.test.tsx .github/workflows/apply-subscription-pricing-20260904.yml
          git commit -m "fix: update subscription pricing and title artwork"
          git push origin HEAD:fix/subscription-pricing-title-assets-20260904
