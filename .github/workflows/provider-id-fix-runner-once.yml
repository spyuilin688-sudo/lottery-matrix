name: Provider ID fix runner once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  provider-id-repair:
    if: github.head_ref == 'fix/provider-login-id-display-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/provider-login-id-display-20260916
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install admin dependencies
        working-directory: apps/admin
        run: npm ci

      - name: Apply minimal provider-ID repair
        run: python scripts/provider-id-fix-runner.py

      - name: Verify PWA provider identity
        run: npx vitest run src/__tests__/provider-login-identity.test.ts src/__tests__/MemberProfilePage.test.tsx

      - name: Verify admin backend provider identity
        run: npx vitest run apps/admin/backend/member-provider-identity.test.ts apps/admin/backend/admin-data.test.ts apps/admin/backend/push-notifications.test.ts

      - name: Verify admin member identity UI
        working-directory: apps/admin
        run: npx vitest run src/UserInfoDialog.test.tsx src/payment-reversal-panel.test.tsx src/notification-management.test.ts src/notification-management-ui.test.tsx src/admin-member-page.test.tsx

      - name: Verify production build
        run: npm run build

      - name: Verify standalone admin build
        working-directory: apps/admin
        run: APPDEPLOY_CI_EXTERNALS=true npm run build

      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/provider-id-fix-runner-once.yml scripts/provider-id-fix-once.py scripts/provider-id-fix-runner.py
          git add -- \
            src/auth/provider-identity.ts \
            src/features/MemberPages.tsx \
            src/__tests__/provider-login-identity.test.ts \
            src/__tests__/MemberProfilePage.test.tsx \
            apps/admin/backend/member-provider-identity.ts \
            apps/admin/backend/member-provider-identity.test.ts \
            apps/admin/backend/admin-data.ts \
            apps/admin/backend/admin-data.test.ts \
            apps/admin/backend/push-notifications.ts \
            apps/admin/backend/push-notifications.test.ts \
            apps/admin/src/AdminApp.tsx \
            apps/admin/src/UserInfoDialog.tsx \
            apps/admin/src/UserInfoDialog.test.tsx \
            apps/admin/src/PaymentReversalPanel.tsx \
            apps/admin/src/payment-reversal-panel.test.tsx \
            apps/admin/src/NotificationManagement.tsx \
            apps/admin/src/notification-management.ts \
            apps/admin/src/notification-management.test.ts \
            apps/admin/src/notification-management-ui.test.tsx
          git commit -m 'Show LINE or Google ID across member views'
          git push origin HEAD:fix/provider-login-id-display-20260916
