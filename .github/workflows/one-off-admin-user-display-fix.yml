name: One-off admin user display fix

on:
  push:
    branches:
      - fix/admin-user-names-no-id

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/admin-user-names-no-id
          fetch-depth: 0
      - name: Apply exact AdminApp patch
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/admin/src/AdminApp.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              '  users: [\n    "memberDisplayName",\n    "identityDisplay",\n    "registeredAt",',
              '  users: [\n    "memberDisplayName",\n    "registeredAt",'
            ],
            [
              '  const fields = ["memberDisplayName", "identityDisplay", "registeredAt", "lastOnlineAt", "recentOnlineMinutes", "status", "recentIp", "estimatedRegion"];',
              '  const fields = ["memberDisplayName", "registeredAt", "lastOnlineAt", "recentOnlineMinutes", "status", "recentIp", "estimatedRegion"];'
            ],
            [
              '  const showValue = (field: string, row: Row) => field === "status"\n    ? statusText(row[field])\n    : field === "recentOnlineMinutes" ? `${Number(row[field] || 0)} 分鐘` : displayValue(field, row[field]);',
              '  const showValue = (field: string, row: Row) => field === "status"\n    ? statusText(row[field])\n    : field === "recentOnlineMinutes" ? `${Number(row[field] || 0)} 分鐘`\n      : field === "memberDisplayName" ? displayValue(field, row.memberDisplayName ?? row.lineDisplayName)\n        : displayValue(field, row[field]);'
            ],
          ];
          for (const [from, to] of replacements) {
            const first = source.indexOf(from);
            if (first < 0) throw new Error(`Expected source pattern not found: ${from.slice(0, 80)}`);
            if (source.indexOf(from, first + from.length) >= 0) throw new Error(`Source pattern is not unique: ${from.slice(0, 80)}`);
            source = source.replace(from, to);
          }
          fs.writeFileSync(path, source);
          NODE
      - name: Commit patch and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/AdminApp.tsx
          git rm .github/workflows/one-off-admin-user-display-fix.yml
          git diff --cached --check
          git commit -m "fix(admin): restore names and remove user identity column"
          git push origin HEAD:fix/admin-user-names-no-id
