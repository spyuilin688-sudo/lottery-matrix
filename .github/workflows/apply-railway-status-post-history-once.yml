name: Apply Railway status post history once

# trigger: 2026-08-29-2
on:
  push:
    branches:
      - api/railway-status-post-history-20260829

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: api/railway-status-post-history-20260829

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/matrix-api/uv.lock

      - name: Apply implementation commit without committing
        run: |
          git config user.name "spyuilin688-sudo"
          git config user.email "spyuilin688@gmail.com"
          git cherry-pick -n -X theirs ba53d51923bd68c52903f1268ee29222c935fbd6
          git checkout 23362e58b79e977b9acb01165f9e53306224710f -- \
            apps/admin/backend/algorithm-api.test.ts \
            apps/admin/backend/worker-api.test.ts

      - name: Preserve complete draw history semantics
        shell: python
        run: |
          from pathlib import Path

          repo_path = Path('services/matrix-api/app/repositories/analysis_repository.py')
          text = repo_path.read_text()
          if 'DRAW_PAGE_SIZE = 1000' not in text:
              text = text.replace(
                  'RETENTION = timedelta(days=3)\n',
                  'RETENTION = timedelta(days=3)\nDRAW_PAGE_SIZE = 1000\n',
                  1,
              )

          old_supabase = '''    def list_draws(self, lottery: str, limit: int) -> list[dict[str, Any]]:\n        response = (\n            self.client.table("lottery_draws")\n            .select("period,draw_date,numbers,sorted_numbers,draw_order_numbers")\n            .eq("lottery", lottery)\n            .order("draw_date", desc=True)\n            .order("period", desc=True)\n            .limit(max(0, limit))\n            .execute()\n        )\n        return [self._normalize_draw(dict(draw)) for draw in response.data]\n'''
          new_supabase = '''    def list_draws(self, lottery: str, limit: int | None = None) -> list[dict[str, Any]]:\n        if limit is not None and limit <= 0:\n            return []\n\n        draws: list[dict[str, Any]] = []\n        offset = 0\n        while limit is None or len(draws) < limit:\n            page_size = DRAW_PAGE_SIZE if limit is None else min(DRAW_PAGE_SIZE, limit - len(draws))\n            response = (\n                self.client.table("lottery_draws")\n                .select("period,draw_date,numbers,sorted_numbers,draw_order_numbers")\n                .eq("lottery", lottery)\n                .order("draw_date", desc=True)\n                .order("period", desc=True)\n                .range(offset, offset + page_size - 1)\n                .execute()\n            )\n            page = [dict(draw) for draw in response.data]\n            draws.extend(page)\n            if len(page) < page_size:\n                break\n            offset += len(page)\n\n        return [self._normalize_draw(draw) for draw in draws]\n'''
          if old_supabase not in text:
              raise SystemExit('Supabase list_draws pattern not found after status implementation cherry-pick')
          text = text.replace(old_supabase, new_supabase, 1)

          text = text.replace(
              'def list_draws(self, lottery: str, limit: int) -> list[dict[str, Any]]:',
              'def list_draws(self, lottery: str, limit: int | None = None) -> list[dict[str, Any]]:',
          )
          old_memory = '''        newest = sorted(\n            matches,\n            key=lambda draw: (str(draw.get("drawDate", "")), str(draw["period"])),\n            reverse=True,\n        )[: max(0, limit)]\n'''
          new_memory = '''        ordered = sorted(\n            matches,\n            key=lambda draw: (str(draw.get("drawDate", "")), str(draw["period"])),\n            reverse=True,\n        )\n        newest = ordered if limit is None else ordered[: max(0, limit)]\n'''
          if old_memory not in text:
              raise SystemExit('In-memory list_draws pattern not found after status implementation cherry-pick')
          text = text.replace(old_memory, new_memory, 1)
          repo_path.write_text(text)

          worker_path = Path('services/matrix-api/app/worker.py')
          worker = worker_path.read_text()
          worker = worker.replace('REQUIRED_HISTORY_DRAWS = 80\n', '')
          worker = worker.replace('refresh.ensure_history(lottery, REQUIRED_HISTORY_DRAWS)', 'refresh.ensure_history(lottery)')
          worker = worker.replace('repository.list_draws(lottery, REQUIRED_HISTORY_DRAWS)', 'repository.list_draws(lottery, None)')
          worker = worker.replace('if len(history) < REQUIRED_HISTORY_DRAWS:', 'if not history:')
          if 'REQUIRED_HISTORY_DRAWS' in worker:
              raise SystemExit('Fixed 80-draw rule remains in worker')
          worker_path.write_text(worker)

      - name: Matrix API tests
        working-directory: services/matrix-api
        run: |
          uv sync --frozen
          uv run pytest -q

      - name: Admin worker adapter tests
        run: |
          npm install --prefix apps/admin --no-package-lock
          npm --prefix apps/admin test -- backend/worker-api.test.ts backend/algorithm-api.test.ts

      - name: Verify no fixed history limit returned
        run: |
          ! grep -R "REQUIRED_HISTORY_DRAWS" services/matrix-api/app/worker.py
          grep -F "repository.list_draws(lottery, None)" services/matrix-api/app/worker.py
          grep -F "DRAW_PAGE_SIZE = 1000" services/matrix-api/app/repositories/analysis_repository.py

      - name: Commit and self-remove
        run: |
          git rm .github/workflows/apply-railway-status-post-history-once.yml
          git add services/matrix-api apps/admin/backend
          git commit -m "feat: add Railway operational status after full-history fix"
          git push origin HEAD:api/railway-status-post-history-20260829
