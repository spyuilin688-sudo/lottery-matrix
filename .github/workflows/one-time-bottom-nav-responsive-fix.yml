name: One-time responsive bottom navigation fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-bottom-nav-responsive-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply scoped responsive clearance changes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExactly(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            const count = source.split(before).length - 1;
            if (count !== 1) {
              throw new Error(`${path}: expected exactly one match, found ${count}`);
            }
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceExactly(
            'src/feature-pages.css',
            '.calculator-screen > .feature-body { box-sizing: border-box; min-width: 0; min-height: 0; flex: 1 1 auto; padding-bottom: 80px; overflow-y: auto; overscroll-behavior-y: contain; }',
            '.calculator-screen > .feature-body { box-sizing: border-box; min-width: 0; min-height: 0; flex: 1 1 auto; padding-bottom: var(--layout-bottom-nav-clearance); overflow-y: auto; overscroll-behavior-y: contain; }'
          );

          replaceExactly(
            'src/matrix-explore-spacing.css',
            '  --layout-bottom-nav-clearance: calc(var(--bottom-navigation-height) + var(--mobile-safe-area-height, 34px));\n',
            ''
          );

          replaceExactly(
            'src/matrix-explore-spacing.css',
            '  padding: 0 16px 1rem;',
            '  padding: 0 16px var(--layout-bottom-nav-clearance);'
          );

          replaceExactly(
            'tests/calculator-responsive-layout.test.mjs',
            '  assert.match(body, /padding-bottom:\\s*80px/);',
            '  assert.match(body, /padding-bottom:\\s*var\\(--layout-bottom-nav-clearance\\)/);\n  assert.doesNotMatch(body, /padding-bottom:\\s*80px/);'
          );

          replaceExactly(
            'tests/bottom-navigation-safe-area-position.test.mjs',
            'const homepageCss = await readFile(new URL("../src/homepage-repair.css", import.meta.url), "utf8");',
            'const homepageCss = await readFile(new URL("../src/homepage-repair.css", import.meta.url), "utf8");\nconst featureCss = await readFile(new URL("../src/feature-pages.css", import.meta.url), "utf8");\nconst matrixExploreCss = await readFile(new URL("../src/matrix-explore-spacing.css", import.meta.url), "utf8");'
          );

          const navTestPath = 'tests/bottom-navigation-safe-area-position.test.mjs';
          const navTest = fs.readFileSync(navTestPath, 'utf8');
          const extraTest = `\n\ntest("Matrix 探索與連碰立柱共用響應式底部導覽安全區避讓", () => {\n  assert.doesNotMatch(matrixExploreCss, /--layout-bottom-nav-clearance:[^;]*var\\(--mobile-safe-area-height/);\n  assert.match(matrixExploreCss, /\\.matrix-explore-main-screen \\.feature-body\\s*\\{[\\s\\S]*?padding:\\s*0 16px var\\(--layout-bottom-nav-clearance\\);/);\n  assert.match(featureCss, /\\.calculator-screen > \\.feature-body\\s*\\{[^}]*padding-bottom:\\s*var\\(--layout-bottom-nav-clearance\\);/);\n  assert.doesNotMatch(featureCss, /\\.calculator-screen > \\.feature-body\\s*\\{[^}]*padding-bottom:\\s*80px;/);\n});\n`;
          if (navTest.includes('Matrix 探索與連碰立柱共用響應式底部導覽安全區避讓')) {
            throw new Error('responsive clearance regression test already exists');
          }
          fs.writeFileSync(navTestPath, navTest.trimEnd() + extraTest);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Remove one-time workflow and commit verified changes
        run: |
          rm .github/workflows/one-time-bottom-nav-responsive-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/feature-pages.css src/matrix-explore-spacing.css tests/calculator-responsive-layout.test.mjs tests/bottom-navigation-safe-area-position.test.mjs .github/workflows/one-time-bottom-nav-responsive-fix.yml
          git commit -m "Fix responsive bottom navigation clearance"
          git push origin HEAD:main
