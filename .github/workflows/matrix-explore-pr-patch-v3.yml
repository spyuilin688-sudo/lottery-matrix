name: Matrix Explore PR patch runner v3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/explore-validation-state-box-inset'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply scoped validation state-box correction
        id: patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path('src/explore-result-preview.css')
          css = path.read_text()

          old_state = '''.explore-validation-number--source,
.explore-validation-number--step,
.explore-validation-number--hit {
  padding-block: 0.5px;
  padding-inline: 0.5px;
}
'''
          new_state = '''.explore-validation-number--source,
.explore-validation-number--step,
.explore-validation-number--hit {
  height: auto;
  aspect-ratio: auto;
  padding-block: 0.5px;
  padding-inline: 1px;
}
'''
          wide_anchor = '''.explore-validation-group[data-wide-numbers="true"] .explore-validation-number {
  height: clamp(16px, 4.36vw, 17px);
}
'''
          wide_override = '''
.explore-validation-group[data-wide-numbers="true"] .explore-validation-number--source,
.explore-validation-group[data-wide-numbers="true"] .explore-validation-number--step,
.explore-validation-group[data-wide-numbers="true"] .explore-validation-number--hit {
  height: auto;
  aspect-ratio: auto;
}
'''

          changed = False
          if old_state in css:
              if css.count(old_state) != 1:
                  raise SystemExit('state block is not unique')
              css = css.replace(old_state, new_state, 1)
              changed = True
          elif new_state not in css:
              raise SystemExit('state block is neither old nor expected new form')

          if wide_override not in css:
              if css.count(wide_anchor) != 1:
                  raise SystemExit('wide-number anchor is not unique')
              css = css.replace(wide_anchor, wide_anchor + wide_override, 1)
              changed = True

          path.write_text(css)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'changed={str(changed).lower()}\n')
          PY

      - name: Verify targeted regression and production build
        run: |
          git diff --check
          node --test tests/matrix-explore-validation-preview-merge.test.mjs
          npm ci
          npm run build

      - name: Commit verified CSS-only change
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "src/explore-result-preview.css"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/explore-result-preview.css
          git commit -m "fix(explore): compact validation state boxes"
          git push origin HEAD:${{ github.head_ref }}
