name: Google member perks once
on:
  push:
    branches:
      - fix/google-member-perks-20260916
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/__tests__/GoogleMemberPerks.test.ts --reporter=verbose
