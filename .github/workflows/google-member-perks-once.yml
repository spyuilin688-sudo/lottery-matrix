name: Google member perks once
on:
  push:
    branches:
      - fix/google-member-perks-20260916
permissions:
  contents: write
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Google member perk parity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          member_pages = 'src/features/MemberPages.tsx'
          replace_once(
              member_pages,
              'LINE_IDENTITY_REQUIRED: "請先以 LINE 登入後再輸入推薦碼",',
              'LINE_IDENTITY_REQUIRED: "請先使用 LINE 或 Google 登入後再輸入推薦碼",',
          )
          replace_once(
              member_pages,
              '{referralLoginRequired && <p className="activation-result" role="status">請先以 LINE 登入</p>}',
              '{referralLoginRequired && <p className="activation-result" role="status">請先使用 LINE 或 Google 登入</p>}',
          )
          replace_once(
              member_pages,
              '"每個 LINE 帳號，僅能輸入一次推薦碼。"',
              '"每個 LINE 或 Google 帳號，僅能輸入一次推薦碼。"',
          )

          migration = r'''-- Extend member promotional privileges from LINE-only to LINE or Google.
-- LINE registration trials remain LINE-only and are intentionally untouched.

create or replace function private.member_login_perks_eligible(
  p_auth_user_id uuid,
  p_line_user_id text
)
returns boolean
language sql
stable
security definer
set search_path to ''
as $function$
  select p_auth_user_id is not null
    and (
      nullif(pg_catalog.btrim(p_line_user_id), '') is not null
      or exists (
        select 1
        from auth.identities as identity
        where identity.user_id = p_auth_user_id
          and identity.provider = 'google'
      )
    );
$function$;
revoke all on function private.member_login_perks_eligible(uuid, text) from public, anon, authenticated;

create or replace function private.matrix_result_entitlements()
returns jsonb
language plpgsql
stable security definer
set search_path to ''
as $function$
declare
  v_uid uuid := auth.uid();
  v_member public.members%rowtype;
  v_plan text := 'free';
  v_paid boolean := false;
  v_free_access boolean := false;
  v_referrals integer := 0;
  v_dow integer := extract(isodow from pg_catalog.timezone('Asia/Taipei', pg_catalog.now()));
begin
  if v_uid is not null then
    select * into v_member from public.members where auth_user_id = v_uid limit 1;
    if not found or coalesce(v_member.status, '') in ('停用', 'disabled', 'inactive') then
      raise exception using errcode = '42501', message = 'FORBIDDEN';
    end if;

    select registered_member_free_access into v_free_access
    from private.matrix_permission_settings where singleton;
    v_free_access := coalesce(v_free_access, false);

    if v_member.is_lifetime then
      v_plan := 'lifetime';
      v_paid := true;
    else
      select case plan.name
        when '試用方案' then 'trial'
        when '月費方案' then 'monthly'
        when '季費方案' then 'quarterly'
        when '年費方案' then 'yearly'
        else 'free'
      end into v_plan
      from public.plans as plan where plan.id = v_member.current_plan_id;
      v_plan := coalesce(v_plan, 'free');
      v_paid := v_plan <> 'free'
        and coalesce(v_member.plan_expires_at > pg_catalog.now(), false);
    end if;

    if coalesce(v_member.referral_code, '') <> '' then
      select pg_catalog.count(distinct invited.id)::integer into v_referrals
      from public.members as invited
      where invited.invitation_code = v_member.referral_code
        and exists (
          select 1 from public.payments as payment
          where payment.member_id = invited.id and payment.status = 'confirmed'
        );
    end if;
  end if;

  return pg_catalog.jsonb_build_object(
    'canUseSeven', v_free_access or v_paid or v_referrals >= 15
      or (v_uid is not null and private.member_login_perks_eligible(v_uid, v_member.line_user_id) and v_dow in (2, 5))
      or (v_referrals >= 10 and v_dow in (1, 4)),
    'canUseThirteen', v_free_access or v_paid,
    'canUseFullRange', v_free_access or v_paid or v_referrals >= 50
      or (v_referrals >= 30 and v_dow in (2, 5)),
    'canUseTianyan', v_free_access
      or (v_paid and v_plan in ('quarterly', 'yearly', 'lifetime'))
      or coalesce(v_member.line_trial_started_at <= pg_catalog.now()
        and v_member.line_trial_started_at + interval '48 hours' > pg_catalog.now(), false),
    'canUseTiangong', v_free_access
      or (v_paid and v_plan in ('yearly', 'lifetime'))
      or coalesce(v_member.line_trial_started_at <= pg_catalog.now()
        and v_member.line_trial_started_at + interval '24 hours' > pg_catalog.now(), false),
    'canViewFullStatus', v_paid,
    'canCustomizeStatus', v_paid and v_plan <> 'trial',
    'canUseCompositeCustomRoad', v_paid and v_plan in ('quarterly', 'yearly', 'lifetime')
  );
end;
$function$;

create or replace function public.member_referral_summary()
returns jsonb
language plpgsql
security definer
set search_path to ''
as $function$
declare
  v_member_id uuid := private.active_member_id();
  v_member public.members%rowtype;
  v_referral_code text;
  v_referral_success_count integer := 0;
  v_has_invitation_code boolean := false;
begin
  select member.*
  into v_member
  from public.members as member
  where member.id = v_member_id
  for update;

  if not found then
    raise exception using errcode = '42501', message = 'FORBIDDEN';
  end if;

  if not private.member_login_perks_eligible(v_member.auth_user_id, v_member.line_user_id) then
    raise exception using errcode = '42501', message = 'LINE_IDENTITY_REQUIRED';
  end if;

  v_referral_code := private.ensure_member_referral_code(v_member_id);
  v_has_invitation_code := nullif(pg_catalog.btrim(v_member.invitation_code), '') is not null;

  select pg_catalog.count(distinct invited.id)::integer
  into v_referral_success_count
  from public.members as invited
  where pg_catalog.upper(pg_catalog.btrim(invited.invitation_code)) = v_referral_code
    and exists (
      select 1
      from public.payments as payment
      where payment.member_id = invited.id
        and payment.status = 'confirmed'
    );

  return pg_catalog.jsonb_build_object(
    'referralCode', v_referral_code,
    'referralSuccessCount', v_referral_success_count,
    'hasInvitationCode', v_has_invitation_code,
    'canSubmitReferralCode', not v_has_invitation_code
  );
end;
$function$;

create or replace function public.member_referral_submit(p_referral_code text)
returns jsonb
language plpgsql
security definer
set search_path to ''
as $function$
declare
  v_member_id uuid := private.active_member_id();
  v_referral_code text := pg_catalog.upper(nullif(pg_catalog.btrim(p_referral_code), ''));
  v_target_member_id uuid;
  v_member public.members%rowtype;
  v_target_member public.members%rowtype;
begin
  if v_referral_code is null then
    raise exception using errcode = '22023', message = 'INVALID_REFERRAL_CODE';
  end if;

  select member.*
  into v_member
  from public.members as member
  where member.id = v_member_id;

  if not found then
    raise exception using errcode = '42501', message = 'FORBIDDEN';
  end if;

  if not private.member_login_perks_eligible(v_member.auth_user_id, v_member.line_user_id) then
    raise exception using errcode = '42501', message = 'LINE_IDENTITY_REQUIRED';
  end if;

  select member.id
  into v_target_member_id
  from public.members as member
  where pg_catalog.upper(pg_catalog.btrim(member.referral_code)) = v_referral_code
  limit 1;

  if not found then
    raise exception using errcode = 'P0001', message = 'REFERRAL_CODE_NOT_FOUND';
  end if;

  if v_target_member_id = v_member_id then
    raise exception using errcode = '22023', message = 'SELF_REFERRAL_NOT_ALLOWED';
  end if;

  perform 1
  from public.members as locked_member
  where locked_member.id = any (array[v_member_id, v_target_member_id])
  order by locked_member.id
  for update;

  select member.*
  into v_member
  from public.members as member
  where member.id = v_member_id;

  if not found then
    raise exception using errcode = '42501', message = 'FORBIDDEN';
  end if;

  if not private.member_login_perks_eligible(v_member.auth_user_id, v_member.line_user_id) then
    raise exception using errcode = '42501', message = 'LINE_IDENTITY_REQUIRED';
  end if;

  if nullif(pg_catalog.btrim(v_member.invitation_code), '') is not null then
    raise exception using errcode = 'P0001', message = 'REFERRAL_CODE_ALREADY_SUBMITTED';
  end if;

  select member.*
  into v_target_member
  from public.members as member
  where member.id = v_target_member_id;

  if not found
     or pg_catalog.upper(pg_catalog.btrim(v_target_member.referral_code)) <> v_referral_code then
    raise exception using errcode = 'P0001', message = 'REFERRAL_CODE_NOT_FOUND';
  end if;

  update public.members
  set invitation_code = v_referral_code
  where id = v_member_id;

  return public.member_referral_summary();
end;
$function$;
'''
          Path('supabase/migrations/20260916015000_google_member_perks.sql').write_text(migration, encoding='utf-8')
          PY
      - name: Focused member perk tests
        run: npx vitest run src/__tests__/GoogleMemberPerks.test.ts src/__tests__/MemberProfilePage.test.tsx src/activation/__tests__/redeemActivationCode.test.ts --reporter=verbose
      - name: Protected runtime integrity
        run: npm run check:runtime
      - name: Cloudflare Pages production build
        run: npm run build:pages
      - name: Commit verified change and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/google-member-perks-once.yml
          git add src/features/MemberPages.tsx src/__tests__/GoogleMemberPerks.test.ts supabase/migrations/20260916015000_google_member_perks.sql
          git commit -m 'Give Google members LINE promotional perks'
          git push origin HEAD:fix/google-member-perks-20260916
