name: Google member perks once
on:
  push:
    branches:
      - fix/google-member-perks-20260916
permissions:
  contents: write
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Update provider-neutral referral copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/MemberPages.tsx')
          text = p.read_text(encoding='utf-8')
          pairs = [
              ('LINE_IDENTITY_REQUIRED: "請先以 LINE 登入後再輸入推薦碼",', 'LINE_IDENTITY_REQUIRED: "請先使用 LINE 或 Google 登入後再輸入推薦碼",'),
              ('{referralLoginRequired && <p className="activation-result" role="status">請先以 LINE 登入</p>}', '{referralLoginRequired && <p className="activation-result" role="status">請先使用 LINE 或 Google 登入</p>}'),
              ('"每個 LINE 帳號，僅能輸入一次推薦碼。"', '"每個 LINE 或 Google 帳號，僅能輸入一次推薦碼。"'),
          ]
          for old, new in pairs:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'expected one match, found {count}: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Focused member perk tests
        run: npx vitest run src/__tests__/GoogleMemberPerks.test.ts src/__tests__/MemberProfilePage.test.tsx src/activation/__tests__/redeemActivationCode.test.ts --reporter=verbose
      - name: Protected runtime integrity
        run: npm run check:runtime
      - name: Cloudflare Pages production build
        run: npm run build:pages
      - name: Commit verified change and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/google-member-perks-once.yml
          git add src/features/MemberPages.tsx src/__tests__/GoogleMemberPerks.test.ts supabase/migrations/20260916015000_google_member_perks.sql
          git commit -m 'Give Google members LINE promotional perks'
          git push origin HEAD:fix/google-member-perks-20260916
