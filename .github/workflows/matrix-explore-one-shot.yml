name: Matrix Explore approved source patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify RED before source-copy change
        run: |
          set +e
          node --test tests/matrix-explore-ui-refinement.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected date-copy assertions to fail before FeaturePages patch."
            exit 1
          fi
          echo "RED verified."

      - name: Patch only approved Matrix Explore copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/FeaturePages.tsx')
          text = p.read_text()
          replacements = [
            ('const [exploreDate, setExploreDate] = useState("本日（最新）");', 'const [exploreDate, setExploreDate] = useState("本日 (最新)");'),
            ('["本日（最新）", "昨日（上1期）", "前日（上2期）"]', '["本日 (最新)", "昨日 (上1期)", "前日 (上2期)"]'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one FeaturePages match, found {count}: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          Path('.github/workflows/matrix-explore-one-shot.yml').unlink()
          PY

      - name: Verify GREEN and build
        run: |
          node --test tests/matrix-explore-ui-refinement.test.mjs tests/matrix-explore-fluid-layout.test.mjs tests/matrix-explore-filter-hit-area.test.mjs
          npm ci
          npm run build
          git diff --check

      - name: Commit approved source change to main
        run: |
          git config user.name "spyuilin688-sudo"
          git config user.email "spyuilin688@gmail.com"
          git add -A
          git commit -m "style: use halfwidth Matrix Explore date labels"
          git push origin main
