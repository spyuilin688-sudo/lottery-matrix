name: Matrix Tianshu layout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tianshu-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: PLAYWRIGHT_BROWSERS_PATH=.sites-runtime/playwright npx playwright install --with-deps chromium
      - name: Verify Matrix Tianshu layout
        run: PLAYWRIGHT_BROWSERS_PATH=.sites-runtime/playwright npx playwright test tests/matrix-tianshu-layout.spec.ts --config=playwright.matrix-tianshu.config.ts --workers=1 --reporter=line
      - name: Keep Matrix Tianshu screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-tianshu-layout
          path: test-results/
          retention-days: 7
