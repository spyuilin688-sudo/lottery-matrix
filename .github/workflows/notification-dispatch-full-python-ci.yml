name: Notification Dispatch Full Python CI

on:
  push:
    branches:
      - work/notification-dispatch-20260904-v2

jobs:
  matrix-api-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Matrix API test dependencies
        working-directory: services/matrix-api
        shell: bash
        run: |
          python - <<'PY' > /tmp/matrix-api-test-requirements.txt
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path('pyproject.toml').read_text())
          for dependency in data['project']['dependencies']:
              print(dependency)
          for dependency in data.get('dependency-groups', {}).get('dev', []):
              print(dependency)
          PY
          python -m pip install -r /tmp/matrix-api-test-requirements.txt
      - name: Full Matrix API test suite
        working-directory: services/matrix-api
        run: pytest -q
