name: Apply Matrix Explore refinement
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-explore-refinement.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply confirmed Explore changes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/FeaturePages.tsx')
          s = p.read_text()
          s = s.replace('useState("本日（最新）")', 'useState("本日 (最新)")')
          s = s.replace('["本日（最新）", "昨日（上1期）", "前日（上2期）"]', '["本日 (最新)", "昨日 (上1期)", "前日 (上2期)"]')
          p.write_text(s)

          p = Path('src/matrix-explore-spacing.css')
          s = p.read_text()
          old = '''  text-align: left;\n  white-space: nowrap;\n}'''
          new = '''  margin-bottom: 4px;\n  text-align: left;\n  white-space: nowrap;\n}'''
          if old not in s: raise SystemExit('label rule anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('font-size: clamp(.625rem, 2.8vw, .75rem);\n  font-weight: 700;\n  font-variant-numeric: tabular-nums;', 'font-size: clamp(.5625rem, 2.5vw, .6875rem);\n  font-weight: 700;\n  font-variant-numeric: tabular-nums;', 1)
          s = s.replace('gap: clamp(.0625rem, .45vw, .125rem);', 'gap: clamp(.125rem, .8vw, .25rem);', 1)
          s = s.replace('margin-left: .125rem;\n  flex: 0 0 auto;\n  gap: .125rem;', 'margin-left: .25rem;\n  flex: 0 0 auto;\n  gap: .1875rem;', 1)
          s = s.replace('grid-template-rows: auto auto;\n  row-gap: 0;\n  place-items: center;', 'grid-template-rows: 0 auto;\n  row-gap: 0;\n  place-items: center;', 1)
          p.write_text(s)

          Path('.github/workflows/apply-explore-refinement.yml').unlink()
          PY
      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: refine Matrix Explore labels and recent draws'
          git push origin main
