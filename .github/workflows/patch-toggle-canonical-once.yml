name: Patch canonical toggle owner once

on:
  push:
    branches:
      - fix/toggle-canonical-owner-20260915
    paths:
      - .github/workflows/patch-toggle-canonical-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Move toggle palette to the shared owner
        shell: python
        run: |
          from pathlib import Path

          shared_path = Path("src/feature-pages.css")
          shared = shared_path.read_text(encoding="utf-8")
          shared_replacements = [
              (
                  '.toggle::before { position: absolute; top: 8px; left: 0; box-sizing: border-box; width: 46px; height: 28px; border: 1px solid #46505C; border-radius: 14px; background: #151B22; content: ""; }',
                  '.toggle::before { position: absolute; top: 8px; left: 0; box-sizing: border-box; width: 46px; height: 28px; border: 1px solid #46505B; border-radius: 14px; background: #111923; content: ""; }',
              ),
              (
                  '.toggle span { position: absolute; top: 10px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #dadada; transition: transform .18s; }',
                  '.toggle span { position: absolute; top: 10px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #929AA3; transition: transform .18s; }',
              ),
              (
                  '.toggle[data-checked="true"]::before { border-color: var(--pwa-frame-secondary); background: var(--pwa-control-selected); box-shadow: none; }',
                  '.toggle[data-checked="true"]::before { border-color: #D7AE55; background: rgba(202, 160, 70, .28); box-shadow: none; }',
              ),
              (
                  '.toggle[data-checked="true"] span { transform: translateX(18px); background: white; }',
                  '.toggle[data-checked="true"] span { transform: translateX(18px); background: #FFF9EA; }',
              ),
          ]
          for old, new in shared_replacements:
              if old not in shared:
                  raise SystemExit(f"shared toggle owner changed unexpectedly: {old}")
              shared = shared.replace(old, new, 1)
          shared_path.write_text(shared, encoding="utf-8")

          adjustment_path = Path("src/feature-page-adjustments.css")
          adjustment = adjustment_path.read_text(encoding="utf-8")
          old_adjustment = ".notifications-screen-v2 .toggle::before {\n  top: 0;\n  width: 38px;\n  height: 18px;\n  border: 1px solid #46505B;\n  border-radius: 9px;\n  background: #111923;\n}\n\n.notifications-screen-v2 .toggle[data-checked=\"true\"]::before {\n  border-color: #D7AE55;\n  background: rgba(202, 160, 70, .28);\n}\n"
          new_adjustment = ".notifications-screen-v2 .toggle::before {\n  top: 0;\n  width: 38px;\n  height: 18px;\n  border-radius: 9px;\n}\n"
          if old_adjustment not in adjustment:
              raise SystemExit("notification-v2 track override changed unexpectedly")
          adjustment = adjustment.replace(old_adjustment, new_adjustment, 1)

          old_thumb = ".notifications-screen-v2 .toggle span {\n  top: 2px;\n  width: 14px;\n  height: 14px;\n  background: #929AA3;\n}\n\n.notifications-screen-v2 .toggle[data-checked=\"true\"] span {\n  transform: translateX(20px);\n  background: #FFF9EA;\n}\n"
          new_thumb = ".notifications-screen-v2 .toggle span {\n  top: 2px;\n  width: 14px;\n  height: 14px;\n}\n\n.notifications-screen-v2 .toggle[data-checked=\"true\"] span {\n  transform: translateX(20px);\n}\n"
          if old_thumb not in adjustment:
              raise SystemExit("notification-v2 thumb override changed unexpectedly")
          adjustment = adjustment.replace(old_thumb, new_thumb, 1)
          adjustment_path.write_text(adjustment, encoding="utf-8")

      - name: Commit the focused CSS change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/feature-pages.css src/feature-page-adjustments.css
          git diff --cached --check
          git commit -m "fix: make shared toggle palette canonical"
          git push origin HEAD:${GITHUB_REF_NAME}
