name: Restore registered algorithm access once
on:
  push:
    branches:
      - fix/restore-registered-algorithm-access-20260915
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-registered-algorithm-access-20260915
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused guest access regression
        run: npx vitest run src/__tests__/AlgorithmGuestAccess.test.ts --reporter=verbose
