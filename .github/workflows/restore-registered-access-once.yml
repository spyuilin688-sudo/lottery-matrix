name: Restore registered algorithm access once
on:
  push:
    branches:
      - fix/restore-registered-algorithm-access-20260915
permissions:
  contents: write
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-registered-algorithm-access-20260915
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply registered-member boundary
        run: python3 scripts/restore-registered-access-v2-once.py
      - name: Focused algorithm and onboarding tests
        run: npx vitest run src/__tests__/AlgorithmGuestAccess.test.ts src/__tests__/MatrixExploreGuest.test.tsx src/__tests__/FirstVisitGuideGuest.test.tsx src/matrix-algorithm-api.test.ts --reporter=verbose
      - name: Protected runtime integrity
        run: npm run check:runtime
      - name: Cloudflare Pages production build
        run: npm run build:pages
      - name: Commit verified source change and remove one-off files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restore-registered-access-once.yml scripts/restore-registered-access-once.py scripts/restore-registered-access-v2-once.py
          git add src/matrix-algorithm-api.ts src/auth/algorithm-cache-scope.ts src/onboarding/FirstVisitGuide.tsx src/__tests__/AlgorithmGuestAccess.test.ts src/__tests__/MatrixExploreGuest.test.tsx src/__tests__/FirstVisitGuideGuest.test.tsx
          git commit -m 'Restore registered-member algorithm access'
          git push origin HEAD:fix/restore-registered-algorithm-access-20260915
