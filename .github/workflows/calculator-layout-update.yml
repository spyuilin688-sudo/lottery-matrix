name: Apply calculator layout specification
on:
  push:
    paths:
      - '.github/workflows/calculator-layout-update.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply calculator specification
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/feature-pages.css')
          s = p.read_text()
          replacements = [
          (''' .matrix-explore-main-screen > .feature-body,
.matrix-tianyan-screen > .feature-body,
.matrix-tiangong-screen > .feature-body,
.draw-history-screen > .feature-body,
.number-reference-screen > .feature-body,
.calculator-screen > .feature-body { padding-inline: 4px; }'''.strip(), '''.matrix-explore-main-screen > .feature-body,
.matrix-tianyan-screen > .feature-body,
.matrix-tiangong-screen > .feature-body,
.draw-history-screen > .feature-body,
.number-reference-screen > .feature-body { padding-inline: 4px; }
.calculator-screen > .feature-body { box-sizing: border-box; min-width: 0; padding-inline: 12px; overflow-x: hidden; }'''),
          ('''.mode-tabs { display: grid; width: 100%; height: 44px; margin: 0 0 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mode-tabs button { min-width: 0; border-radius: 0; font-size: 14px; }''', '''.mode-tabs { display: grid; box-sizing: border-box; width: 366px; max-width: 100%; height: 42px; margin: 0 0 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid rgba(200, 150, 34, .5); border-radius: 4px; overflow: hidden; }
.mode-tabs button { min-width: 0; height: 40px; min-height: 40px; padding: 0; border: 0; border-right: 1px solid rgba(200, 150, 34, .28); border-radius: 0; background: #071018; color: rgba(255,255,255,.68); font-size: 15px; font-weight: 500; line-height: 20px; box-shadow: none; }
.mode-tabs button:last-child { border-right: 0; }
.mode-tabs button[data-selected="true"] { border-color: transparent; background: rgba(126, 89, 20, .12); color: #f2cf67; font-weight: 600; box-shadow: none; }'''),
          ('''.calculator-panel { min-width: 0; padding: 12px; }
.calculator-panel > header { display: grid; min-width: 0; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.calculator-panel > header > div { display: flex; min-width: 0; margin-left: 0; align-items: center; gap: 9px; color: #bcb6ad; font-size: 10.5px; }
.calculator-panel > header .calculator-heading { min-width: 0; gap: 9px; }
.calculator-panel > header .calculator-actions { margin-left: 0; justify-self: end; }
.calculator-panel header strong { color: #e5a829; font-size: 16px; }
.calculator-panel header button { display: flex; min-height: 29px; padding: 3px 8px; align-items: center; gap: 5px; border: 1px solid #9e191f; border-radius: 6px; background: transparent; color: #f02c32; font-size: 11px; }''', '''.calculator-panel { box-sizing: border-box; width: 366px; max-width: 100%; min-width: 0; height: auto; min-height: 0; padding: 12px; border: 1px solid rgba(108, 74, 32, .52); border-radius: 12px; box-shadow: none; font-family: system-ui, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
.calculator-panel > header { display: grid; min-width: 0; min-height: 40px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.calculator-panel > header > div { display: flex; min-width: 0; margin-left: 0; align-items: center; gap: 8px; color: #bcb6ad; font-size: 13px; line-height: 20px; }
.calculator-panel > header .calculator-heading { min-width: 0; gap: 8px; }
.calculator-panel > header .calculator-actions { display: grid; grid-template-columns: 56px 72px; gap: 8px; margin-left: 0; justify-self: end; }
.calculator-screen .section-title { gap: 8px; font-size: 20px; font-weight: 700; line-height: 24px; letter-spacing: 0; white-space: nowrap; }
.calculator-screen .section-title > span { width: 4px; height: 24px; border-radius: 2px; box-shadow: none; }
.calculator-panel header strong { color: #e5a829; font-size: 20px; font-weight: 700; line-height: 24px; font-variant-numeric: tabular-nums; }
.calculator-panel header button { display: flex; width: 100%; height: 40px; min-height: 40px; padding: 0 8px; align-items: center; justify-content: center; gap: 6px; border: 1px solid #9e191f; border-radius: 8px; background: transparent; color: #f02c32; font-size: 14px; font-weight: 600; line-height: 20px; box-shadow: none; white-space: nowrap; }
.calculator-panel header .mode-select-button { border-color: rgba(200, 150, 34, .55); color: #d6b45a; }'''),
          ('''.number-grid { display: grid; min-width: 0; margin-top: 12px; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px 6px; }
.number-grid button { min-width: 0; aspect-ratio: 1; border: 1px solid #78501c; border-radius: 50%; background: #050d13; color: #d8d0c3; }
.number-grid button[data-selected="true"] { border-color: #e4be54; background: radial-gradient(circle, rgba(145, 104, 25, .52), rgba(37, 29, 14, .9)); box-shadow: 0 0 10px rgba(223, 183, 76, .25); color: #fff1c8; }''', '''.number-grid { display: grid; min-width: 0; margin-top: 10px; grid-template-columns: repeat(7, 42px); justify-content: space-between; row-gap: 8px; }
.number-grid button { width: 42px; height: 42px; min-width: 42px; padding: 0; border: 1px solid rgba(120, 80, 28, .45); border-radius: 50%; background: rgba(5, 13, 19, .86); color: rgba(255,255,255,.85); font-size: 16px; font-weight: 500; line-height: 16px; font-variant-numeric: tabular-nums; box-shadow: none; transition: background-color 100ms linear; }
.number-grid button[data-selected="true"] { border-color: #e4be54; background: rgba(145, 104, 25, .18); box-shadow: none; color: #f3cf70; font-weight: 600; }
.number-grid button:active { background: rgba(145, 104, 25, .26); transform: none; }'''),
          ('''.quick-actions { display: grid; min-width: 0; margin: 8px 0; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.quick-actions button { min-width: 0; height: 36px; border: 1px solid #8b631c; border-radius: 6px; background: #061018; color: #d6b45a; font-size: 12px; }''', '''.quick-actions { display: grid; min-width: 0; margin: 10px 0 8px; grid-template-columns: repeat(3, minmax(0, 1fr)) 74px; gap: 6px; }
.quick-actions button { min-width: 0; height: 40px; padding: 0 6px; border: 1px solid rgba(139, 99, 28, .45); border-radius: 8px; background: rgba(6, 16, 24, .82); color: #d6b45a; font-size: 14px; font-weight: 500; line-height: 20px; white-space: nowrap; box-shadow: none; }
.quick-actions .clear-button { border-color: #9e191f; color: #f02c32; }'''),
          ('''.column-grid { display: grid; min-width: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #76511e; border-radius: 8px; overflow: hidden; }
.column-grid > div { display: grid; min-width: 0; min-height: 52px; grid-template-columns: minmax(0, 1fr) 28px 28px 28px; align-items: center; border-right: 1px solid #76511e; border-bottom: 1px solid #76511e; }
.column-grid > div:nth-child(even) { border-right: 0; }
.column-grid span { min-width: 0; padding-left: 8px; color: #aaa49c; font-size: 13px; font-weight: 700; white-space: nowrap; }
.column-grid button { width: 26px; height: 28px; border: 1px solid #76511e; border-radius: 5px; background: transparent; color: #d5cdc0; font-size: 16px; }
.column-grid strong { text-align: center; font-weight: 500; }''', '''.column-grid { display: grid; box-sizing: border-box; width: 340px; max-width: 100%; min-width: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid rgba(118, 81, 30, .5); border-radius: 10px; overflow: hidden; }
.column-grid > div { display: grid; box-sizing: border-box; min-width: 0; height: 52px; min-height: 52px; padding-inline: 6px; grid-template-columns: 52px 34px 24px 34px; column-gap: 4px; align-items: center; border-right: 1px solid rgba(118, 81, 30, .3); border-bottom: 1px solid rgba(118, 81, 30, .24); }
.column-grid > div:nth-child(even) { border-right: 0; }
.column-grid span { width: 52px; min-width: 52px; padding-left: 0; color: #aaa49c; font-size: 15px; font-weight: 600; line-height: 20px; white-space: nowrap; }
.column-grid button { display: grid; width: 34px; height: 34px; padding: 0; place-items: center; border: 1px solid rgba(118, 81, 30, .42); border-radius: 7px; background: transparent; color: #d5cdc0; font-size: 20px; font-weight: 500; line-height: 1; box-shadow: none; }
.column-grid strong { width: 24px; text-align: center; font-size: 20px; font-weight: 500; line-height: 24px; font-variant-numeric: tabular-nums; }'''),
          ('''.calculation-results { min-width: 0; margin-top: 12px; padding: 12px; }
.calculation-results > div { display: grid; min-width: 0; margin-top: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.calculation-results article { display: flex; min-width: 0; min-height: 80px; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #6d4c1e; border-radius: 7px; }
.calculation-results article span { color: #f0e8dc; font-size: 15px; font-weight: 700; }
.calculation-results article strong { margin-top: 7px; color: #dca52b; font-size: 20px; font-weight: 600; }''', '''.calculation-results { box-sizing: border-box; width: 366px; max-width: 100%; min-width: 0; height: auto; margin-top: 8px; padding: 12px; border: 1px solid rgba(108, 74, 32, .52); border-radius: 12px; box-shadow: none; }
.calculation-results > div { display: grid; min-width: 0; margin-top: 10px; grid-template-columns: repeat(4, 79px); justify-content: space-between; gap: 8px; }
.calculation-results article { display: flex; box-sizing: border-box; width: 79px; min-width: 79px; height: 92px; min-height: 92px; padding: 10px 4px; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(109, 76, 30, .42); border-radius: 8px; box-shadow: none; }
.calculation-results article span { color: #f0e8dc; font-size: 16px; font-weight: 700; line-height: 20px; }
.calculation-results article strong { margin-top: 6px; color: #dca52b; font-size: 26px; font-weight: 700; line-height: 30px; font-variant-numeric: tabular-nums; text-shadow: none; white-space: nowrap; }''')
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('required CSS block not found:\n'+old[:160])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate build
        run: npm ci && npm run build
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/feature-pages.css
          git commit -m 'style: align calculator layout with specification'
          git push
