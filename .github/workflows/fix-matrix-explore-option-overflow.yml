name: Fix Matrix Explore option overflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-matrix-explore-option-overflow.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Add regression test first
        shell: python
        run: |
          from pathlib import Path

          test = r'''import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const css = readFileSync("src/feature-pages.css", "utf8");

          test("Matrix Explore option grid cannot overflow its mobile column", () => {
            assert.match(
              css,
              /\.setting-grid label,\s*\.advanced-panel label\s*\{[^}]*min-width:\s*0;[^}]*width:\s*100%;[^}]*grid-template-columns:\s*102px minmax\(0, 1fr\);/s,
            );
            assert.doesNotMatch(
              css,
              /\.setting-grid label,\s*\.advanced-panel label\s*\{[^}]*grid-template-columns:\s*102px 1fr;/s,
            );
          });

          test("native select wrapper and select can shrink inside Matrix Explore grid", () => {
            assert.match(
              css,
              /\.native-select\s*\{[^}]*width:\s*100%;[^}]*max-width:\s*100%;[^}]*min-width:\s*0;/s,
            );
            assert.match(
              css,
              /\.native-select select\s*\{[^}]*width:\s*100%;[^}]*max-width:\s*100%;[^}]*min-width:\s*0;/s,
            );
          });
          '''
          Path('tests/matrix-explore-option-layout.test.mjs').write_text(test, encoding='utf-8')

      - name: Confirm regression test fails before repair
        run: |
          if node --test tests/matrix-explore-option-layout.test.mjs; then
            echo 'Regression test unexpectedly passed before repair.'
            exit 1
          else
            echo 'Matrix Explore option overflow reproduced by regression test.'
          fi

      - name: Repair existing formal layout rules
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/feature-pages.css')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              '.setting-grid label, .advanced-panel label { display: grid; grid-template-columns: 102px 1fr; align-items: center; gap: 8px; }',
              '.setting-grid label, .advanced-panel label { display: grid; min-width: 0; width: 100%; grid-template-columns: 102px minmax(0, 1fr); align-items: center; gap: 8px; }',
            ),
            (
              '.native-select { position: relative; padding: 0; }',
              '.native-select { position: relative; width: 100%; max-width: 100%; min-width: 0; padding: 0; }',
            ),
            (
              '.native-select select {\n  position: relative;\n  z-index: 1;\n  width: 100%;\n  height: 100%;',
              '.native-select select {\n  position: relative;\n  z-index: 1;\n  width: 100%;\n  max-width: 100%;\n  min-width: 0;\n  height: 100%;',
            ),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one formal rule to replace, found {count}: {old[:90]}')
            text = text.replace(old, new, 1)

          prohibited = [
            'grid-template-columns: 102px 1fr;',
            '.native-select { position: relative; padding: 0; }',
          ]
          for item in prohibited:
            if item in text:
              raise SystemExit('Old Matrix Explore overflow rule remains: ' + item)

          path.write_text(text, encoding='utf-8')

      - name: Verify focused regression
        run: node --test tests/matrix-explore-option-layout.test.mjs

      - name: Run project tests
        run: npm test --if-present

      - name: Build project
        run: npm run build --if-present

      - name: Commit verified repair and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-matrix-explore-option-overflow.yml
          git add src/feature-pages.css tests/matrix-explore-option-layout.test.mjs .github/workflows/fix-matrix-explore-option-overflow.yml
          git commit -m 'fix: prevent Matrix Explore option overflow'
          git push origin HEAD:main
