name: Temporary Explore Formula Structure Fix

on:
  push:
    branches:
      - fix/explore-result-refinement-20260904

permissions:
  contents: write

jobs:
  fix-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply formula structure and stale-test fix
        run: |
          python - <<'PY'
          from pathlib import Path

          preview_path = Path("src/ExploreResultPreviewPage.tsx")
          preview = preview_path.read_text()
          expression_start = preview.index('<span className="explore-validation-formula-expression">')
          first = preview.index('<span>第</span>', expression_start)
          base = preview.index('<span>{baseNumber}</span>', first)
          line_start = preview.rfind('\n', 0, first) + 1
          indent = preview[line_start:first]
          group = (
              '<span className="explore-validation-formula-position">\n'
              f'{indent}  <span>第</span>\n'
              f'{indent}  <span>{{position}}</span>\n'
              f'{indent}  <span>顆</span>\n'
              f'{indent}</span>\n'
              f'{indent}'
          )
          preview = preview[:first] + group + preview[base:]
          preview_path.write_text(preview)

          test_path = Path("src/__tests__/app-production-shell.test.tsx")
          test_source = test_path.read_text()
          start = test_source.index('  it("inserts the requested half-width spaces in validation formulas", () => {')
          end = test_source.index('\n\n  it("keeps the scoped tag selector and lets the period column fit its content", () => {', start)
          replacement = '''  it("keeps validation formula content while spacing 第、球位、顆 independently", () => {
            window.history.replaceState({}, "", "/explore-result-preview");
            render(<App />);
            fireEvent.click(screen.getByRole("button", { name: "展開版路 result-09" }));

            const formula = Array.from(document.querySelectorAll<HTMLElement>(".explore-validation-formula-expression"))
              .find((element) => element.textContent === "第2顆09+21=30");
            expect(formula).toBeDefined();

            const position = formula?.querySelector<HTMLElement>(".explore-validation-formula-position");
            expect(position?.textContent).toBe("第2顆");
            expect(position?.children).toHaveLength(3);

            const css = readFileSync(`${process.cwd()}/src/explore-result-preview.css`, "utf8");
            expect(css).toMatch(/\.explore-validation-formula-position\s*\{[^}]*gap:\s*1px/s);
          });'''
          test_source = test_source[:start] + replacement + test_source[end:]
          test_path.write_text(test_source)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Targeted formula and Explore tests
        run: npx vitest run src/__tests__/app-production-shell.test.tsx src/__tests__/MatrixExplorePage.test.tsx

      - name: Full Vitest suite
        run: npm run test:unit

      - name: New Explore regression suite
        run: node --test tests/matrix-explore-result-refinement-20260904.test.mjs

      - name: Production build
        run: npm run build

      - name: Diff safety check
        run: git diff --check

      - name: Commit verified fix
        run: |
          rm .github/workflows/tmp-fix-explore-formula-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(explore): align formula structure regression"
          git push origin HEAD:fix/explore-result-refinement-20260904
