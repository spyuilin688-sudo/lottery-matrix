name: Apply history lottery filter specification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-history-lottery-filter-spec.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply confirmed specification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/FeaturePages.tsx')
          s = p.read_text()
          page_start = s.index('export function DrawHistoryPage')
          page_end = s.index('function RoadValidationProcess', page_start)

          title_start = s.index('  const historyTitleActions = (', page_start, page_end)
          title_end = s.index('  );', title_start, page_end) + len('  );')
          title_block = s[title_start:title_end]
          lottery_start_marker = '      <div className="history-title-lottery native-select">'
          trigger_marker = '      <button type="button" className="history-filter-trigger"'
          if lottery_start_marker in title_block:
              lottery_start = s.index(lottery_start_marker, title_start, title_end)
              trigger_start = s.index(trigger_marker, lottery_start, title_end)
              s = s[:lottery_start] + s[trigger_start:]
              page_end -= trigger_start - lottery_start
          elif 'aria-label="彩種"' in title_block:
              raise SystemExit('history title lottery selector exists in an unexpected structure')

          filter_fields = s.index('className="history-filter-fields"', page_start, page_end)
          issue_marker = '                  <label>\n                    <span className="history-filter-icon"><img src="/assets/history-filter/issue.png" alt="期數" /></span>'
          lottery_icon = '/assets/lottery/functions/彩種.png'
          if lottery_icon not in s[filter_fields:page_end]:
              issue_start = s.index(issue_marker, filter_fields, page_end)
              lottery_field = '\n'.join([
                  '                  <label>',
                  '                    <span className="history-filter-icon"><img src="/assets/lottery/functions/彩種.png" alt="彩種" /></span>',
                  '                    <div className="select-box native-select">',
                  '                      <select aria-label="彩種" value={lottery} onChange={(event) => setLottery(event.target.value as LotteryId)}>',
                  '                        {LOTTERIES.map((item) => <option value={item} key={item}>{item}</option>)}',
                  '                      </select>',
                  '                      <ChevronDownIcon />',
                  '                    </div>',
                  '                  </label>',
                  '',
              ])
              s = s[:issue_start] + lottery_field + s[issue_start:]
          p.write_text(s)

          t = Path('tests/page-title-card.test.mjs')
          ts = t.read_text()
          old_name = 'test("history title card owns the lottery dropdown and filter trigger", () => {'
          new_name = 'test("history lottery selector is the first filter field and no longer appears in the title actions", () => {'
          new_test = '\n'.join([
              'test("history lottery selector is the first filter field and no longer appears in the title actions", () => {',
              '  const start = featurePages.indexOf("export function DrawHistoryPage");',
              '  const end = featurePages.indexOf("function RoadValidationProcess", start);',
              '  const historyPage = featurePages.slice(start, end);',
              "  const titleActionsStart = historyPage.indexOf('const historyTitleActions');",
              "  const titleActionsEnd = historyPage.indexOf('\\n  );', titleActionsStart) + 5;",
              '  const titleActions = historyPage.slice(titleActionsStart, titleActionsEnd);',
              "  const filterFieldsStart = historyPage.indexOf('className=\\\"history-filter-fields\\\"');",
              "  const lotteryIconIndex = historyPage.indexOf('/assets/lottery/functions/彩種.png', filterFieldsStart);",
              "  const issueIconIndex = historyPage.indexOf('/assets/history-filter/issue.png', filterFieldsStart);",
              '  assert.match(titleActions, /篩選條件/);',
              '  assert.doesNotMatch(titleActions, /aria-label="彩種"/);',
              '  assert.ok(lotteryIconIndex > filterFieldsStart);',
              '  assert.ok(issueIconIndex > lotteryIconIndex);',
              '  assert.match(historyPage.slice(filterFieldsStart), /aria-label="彩種"/);',
              '  assert.doesNotMatch(historyPage, /<LotteryTabs/);',
              '});',
          ])
          if new_name in ts:
              test_start = ts.index(new_name)
              test_end = ts.index('\n});', test_start) + len('\n});')
              ts = ts[:test_start] + new_test + ts[test_end:]
          elif old_name in ts:
              test_start = ts.index(old_name)
              test_end = ts.index('\n});', test_start) + len('\n});')
              ts = ts[:test_start] + new_test + ts[test_end:]
          else:
              raise SystemExit('history title-card test block not found')
          t.write_text(ts)
          PY
      - name: Verify focused tests
        run: node --test tests/page-title-card.test.mjs tests/history-filter-select-layering.test.mjs tests/draw-history-table-layout.test.mjs
      - name: Verify build
        run: npm run build
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'spy854540-cmd'
          git config user.email 'spy854540@gmail.com'
          git add src/FeaturePages.tsx tests/page-title-card.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'feat: move history lottery selector into filters'
          git push origin main
