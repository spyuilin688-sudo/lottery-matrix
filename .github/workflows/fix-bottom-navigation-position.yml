name: Fix Bottom Navigation Position

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-bottom-navigation-position.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove conflicting positioning rules
        run: |
          python - <<'PY'
          from pathlib import Path

          prototype = Path('src/prototype.css')
          prototype_text = prototype.read_text()
          prototype_block = '.mobile-page:has(.bottom-navigation) {\n  transform: translateZ(0);\n}\n\n'
          if prototype_text.count(prototype_block) != 1:
              raise SystemExit('prototype positioning block not found exactly once')
          prototype.write_text(prototype_text.replace(prototype_block, '', 1))

          styles = Path('src/styles.css')
          styles_text = styles.read_text()
          android_block = '.mobile-app-viewport[data-platform="android"][data-keyboard-visible="false"] {\n  bottom: var(--device-safe-area-bottom, 48px);\n}\n\n'
          if styles_text.count(android_block) != 1:
              raise SystemExit('android viewport bottom block not found exactly once')
          styles.write_text(styles_text.replace(android_block, '', 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify bottom navigation regression test
        run: node --test tests/bottom-navigation-safe-area-position.test.mjs

      - name: Full tests
        run: node --test tests/*.test.mjs

      - name: Build
        run: npm run build

      - name: Commit fix to main and remove one-shot workflow
        run: |
          rm .github/workflows/fix-bottom-navigation-position.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/prototype.css src/styles.css tests/bottom-navigation-safe-area-position.test.mjs .github/workflows/fix-bottom-navigation-position.yml
          git commit -m "fix: anchor bottom navigation to viewport bottom"
          git push origin HEAD:main
