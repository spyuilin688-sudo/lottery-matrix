name: Apply Matrix Explore fluid layout now

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.title == 'RUN Matrix Explore fluid layout'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Write fluid-layout contract
        run: |
          cat > tests/matrix-explore-fluid-layout.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import test from 'node:test';

          const css = readFileSync('src/feature-pages.css', 'utf8');
          const startMarker = '/* Matrix Explore main canonical mobile sizing */';
          const endMarker = '/* v55 scoped density and hierarchy refinements */';
          const start = css.indexOf(startMarker);
          const end = css.indexOf(endMarker);
          assert.notEqual(start, -1);
          assert.notEqual(end, -1);
          const block = css.slice(start, end);

          test('main container is fluid', () => {
            assert.match(block, /\.matrix-explore-main-screen \.feature-body\s*\{[\s\S]*?width:\s*100%;[\s\S]*?padding:\s*1rem;[\s\S]*?gap:\s*\.875rem;/);
            assert.doesNotMatch(block, /^\s*width:\s*\d+px\b/m);
          });
          test('rows stack then switch at md', () => {
            assert.match(block, /\.matrix-explore-main-screen \.explore-settings \.setting-grid label,[\s\S]*?flex-direction:\s*column;[\s\S]*?gap:\s*\.5rem;/);
            assert.match(block, /@media \(min-width:\s*48rem\)[\s\S]*?flex-direction:\s*row;[\s\S]*?align-items:\s*center;[\s\S]*?justify-content:\s*space-between;/);
            assert.match(block, /flex:\s*0 0 auto;/);
          });
          test('controls use min-heights and fluid grids', () => {
            assert.match(block, /min-height:\s*34px;/);
            assert.match(block, /\.matrix-explore-main-screen \.primary-action\s*\{[\s\S]*?min-height:\s*38px;/);
            assert.match(block, /grid-template-columns:\s*repeat\(3,\s*minmax\(0,\s*1fr\)\);/);
            assert.match(block, /grid-template-columns:\s*repeat\(2,\s*minmax\(0,\s*1fr\)\);/);
          });
          test('badges stay locked to parent buttons', () => {
            assert.match(block, /\.matrix-explore-main-screen \.segmented button,[\s\S]*?position:\s*relative;/);
            assert.match(block, /\.matrix-explore-main-screen \.segmented button em\s*\{[\s\S]*?position:\s*absolute;[\s\S]*?top:\s*-7px;[\s\S]*?right:\s*\.375rem;[\s\S]*?padding-inline:\s*\.375rem;[\s\S]*?transform:\s*scale\(\.9\);[\s\S]*?white-space:\s*nowrap;/);
          });
          EOF
      - name: RED - verify current layout fails contract
        run: |
          if node --test tests/matrix-explore-fluid-layout.test.mjs; then
            echo 'Expected current layout to fail before patch.'
            exit 1
          fi
      - name: Apply canonical layout patch
        run: python scripts/apply_matrix_explore_fluid_layout.py
      - name: GREEN - verify new layout
        run: node --test tests/matrix-explore-fluid-layout.test.mjs
      - name: Targeted existing Explore tests
        run: node --test tests/matrix-explore-option-layout.test.mjs tests/recent-history-layout.test.mjs
      - name: Build
        run: npm run build
      - name: Commit verified source and clean temporary execution files
        run: |
          rm -f .github/workflows/tmp-issue-matrix-explore-fluid.yml
          rm -f .github/workflows/tmp-scheduled-matrix-explore-fluid.yml
          rm -f .github/workflows/tmp-explore-reference-final.yml
          rm -f scripts/apply_matrix_explore_fluid_layout.py
          rm -f tests/matrix-explore-fluid-layout.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: make Matrix Explore layout fluid and responsive'
          git push origin HEAD:main
