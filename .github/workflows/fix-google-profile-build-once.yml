name: Fix Google profile build once

on:
  push:
    branches:
      - fix/google-profile-build-20260915

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/google-profile-build-20260915
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact contract fix
        run: python3 scripts/fix-google-profile-build-once.py

      - name: Run focused Google/profile tests only
        run: >-
          npx vitest run
          src/__tests__/MemberProfilePage.test.tsx
          src/auth/__tests__/google-auth.test.ts
          src/auth/__tests__/google-logout.test.ts
          src/auth/__tests__/google-member-session-bridge.test.tsx
          src/auth/__tests__/member-page-guard.test.ts

      - name: Verify protected runtime integrity
        run: npm run check:runtime

      - name: Reproduce Cloudflare Pages build
        env:
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
        run: npm run build:pages

      - name: Verify only intended source files changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          src/__tests__/MemberProfilePage.test.tsx
          src/features/MemberPages.tsx
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - name: Remove one-off files and commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-google-profile-build-once.yml scripts/fix-google-profile-build-once.py
          git add src/__tests__/MemberProfilePage.test.tsx src/features/MemberPages.tsx
          git commit -m 'Fix Google profile OAuth build contract'
          git push origin HEAD:fix/google-profile-build-20260915
