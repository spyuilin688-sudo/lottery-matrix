# Verification-only workflow; removed after a successful branch check.
name: Verify history branch cleanup

on:
  push:
    branches:
      - "歷史開獎紀錄"
    paths:
      - ".github/workflows/apply-history-uploaded-spec.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "歷史開獎紀錄"
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run executable focused history tests
        run: |
          node --test \
            tests/draw-history-table-layout.test.mjs \
            tests/history-filter-select-layering.test.mjs \
            tests/number-ball-style-source.test.mjs \
            tests/number-ball-visible-size.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Production bundle
        run: npx vite build

      - name: Prepare sites build
        run: npm run prepare-sites-build

      - name: Verify history pagination
        run: npx vitest run src/history-pagination.test.ts

      - name: Remove temporary audit tooling
        run: |
          rm .github/workflows/apply-history-uploaded-spec.yml
          rm scripts/apply-history-uploaded-spec.py

      - name: Commit verified cleanup
        run: |
          git config user.name "openai-history-bot"
          git config user.email "openai-history-bot@users.noreply.github.com"
          git add .github/workflows/apply-history-uploaded-spec.yml scripts/apply-history-uploaded-spec.py
          git commit -m "chore(history): remove failed temporary audit tooling"
          git push origin HEAD:"歷史開獎紀錄"
