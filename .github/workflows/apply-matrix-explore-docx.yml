name: Apply Matrix Explore DOCX spec

on:
  push:
    branches:
      - "探索"
    paths:
      - .github/workflows/apply-matrix-explore-docx.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exploration branch
        uses: actions/checkout@v4
        with:
          ref: "探索"
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify RED test fails before production change
        shell: bash
        run: |
          set +e
          node --test tests/matrix-explore-option-layout.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected Matrix Explore document-layout test to fail before CSS change."
            exit 1
          fi
          echo "RED confirmed."

      - name: Replace duplicated Matrix Explore formal rules
        env:
          PATCH_B64: >-
            
        run: python -c "import os,base64; exec(base64.b64decode(''.join(os.environ['PATCH_B64'].split())).decode())"

      - name: Verify GREEN focused regression test
        run: node --test tests/matrix-explore-option-layout.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify patch scope and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/apply-matrix-explore-docx.yml
          git diff --check
          git status --short

      - name: Commit and push only to exploration branch
        shell: bash
        run: |
          git config user.name "spy854540-cmd"
          git config user.email "spy854540@gmail.com"
          git add src/feature-pages.css .github/workflows/apply-matrix-explore-docx.yml
          git commit -m "style: align Matrix Explore with document spec"
          git push origin HEAD:"探索"
