name: Apply Matrix Explore DOCX spec

on:
  push:
    branches:
      - "探索"
    paths:
      - .github/workflows/apply-matrix-explore-docx.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exploration branch
        uses: actions/checkout@v4
        with:
          ref: "探索"
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify RED test fails before production change
        shell: bash
        run: |
          set +e
          node --test tests/matrix-explore-option-layout.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected Matrix Explore document-layout test to fail before CSS change."
            exit 1
          fi
          echo "RED confirmed: document-layout regression test fails before the CSS change."

      - name: Replace duplicated Matrix Explore formal rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/feature-pages.css")
          css = path.read_text()
          start_marker = "/* Matrix Explore formal layout rules */"
          end_marker = "/* v55 scoped density and hierarchy refinements */"

          if css.count(start_marker) != 1:
              raise SystemExit(f"Expected one Matrix Explore formal marker, found {css.count(start_marker)}")
          if css.count(end_marker) != 1:
              raise SystemExit(f"Expected one v55 marker, found {css.count(end_marker)}")

          canonical = r'''/* Matrix Explore formal layout rules */

.matrix-explore-screen .panel {
  border: 1px solid rgba(108, 74, 32, .50);
  border-radius: 12px;
  background: linear-gradient(145deg, rgba(8, 16, 22, .96), rgba(2, 8, 13, .98));
  box-shadow: none;
}
.matrix-explore-screen .explore-settings,
.matrix-explore-screen .hit-advanced-panel,
.matrix-explore-screen .history-panel,
.matrix-explore-screen .repeat-stats-panel,
.matrix-explore-screen .result-panel {
  box-sizing: border-box;
  width: 366px;
  max-width: 100%;
  min-width: 0;
  height: auto;
  padding: 12px;
  border-radius: 12px;
  box-shadow: none;
}
.matrix-explore-screen .matrix-title-banner { margin-bottom: 8px; }
.matrix-explore-screen .section-title {
  min-height: 28px;
  gap: 10px;
  font-size: 19px;
  font-weight: 700;
  line-height: 26px;
  letter-spacing: 0;
}
.matrix-explore-screen .section-title > span {
  width: 4px;
  height: 24px;
  border-radius: 2px;
  box-shadow: 0 0 4px rgba(255, 194, 42, .18);
}
.matrix-explore-screen .setting-grid {
  margin-top: 12px;
  gap: 8px;
}
.matrix-explore-screen .setting-grid label,
.matrix-explore-screen .advanced-panel label {
  min-height: 44px;
  grid-template-columns: 110px minmax(0, 222px);
  align-items: center;
  gap: 8px;
}
.matrix-explore-screen .setting-grid label > span,
.matrix-explore-screen .advanced-panel label > .advanced-setting-title {
  display: grid;
  width: 110px;
  grid-template-columns: 32px 70px;
  align-items: center;
  gap: 8px;
  color: #bdb8b0;
  font-size: 16px;
  font-weight: 600;
  line-height: 22px;
  text-align: left;
  white-space: nowrap;
}
.matrix-explore-screen .explore-settings .setting-grid label:first-child > span {
  width: 110px;
  grid-template-columns: 32px 70px;
  gap: 8px;
  text-align: left;
}
.matrix-explore-screen .explore-settings .setting-grid label:first-child > span b {
  font: inherit;
  text-align: left;
}
.matrix-explore-screen .setting-grid label > span .setting-label-icon,
.matrix-explore-screen .advanced-panel .advanced-setting-title .setting-label-icon {
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  border-radius: 5px;
  transform: none;
}
.matrix-explore-screen .setting-label-icon img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.matrix-explore-screen .setting-grid .select-box,
.matrix-explore-screen .advanced-panel .select-box {
  width: 222px;
  max-width: 222px;
  height: 44px;
  min-height: 44px;
  padding: 0;
  font-size: 16px;
  font-weight: 700;
}
.matrix-explore-screen .native-select select {
  padding-inline: 36px;
}
.matrix-explore-screen .setting-grid .native-select svg,
.matrix-explore-screen .advanced-panel .native-select svg {
  right: 12px;
  width: 14px;
  height: 14px;
}
.matrix-explore-screen .segmented {
  overflow: visible;
}
.matrix-explore-screen .setting-grid .segmented,
.matrix-explore-screen .advanced-panel .segmented {
  width: 222px;
  max-width: 222px;
}
.matrix-explore-screen .segmented.three {
  gap: 6px;
}
.matrix-explore-screen .segmented.three button {
  min-width: 0;
  height: 44px;
  min-height: 44px;
  padding: 0 4px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: visible;
}
.matrix-explore-screen .segmented.three button[data-selected="true"] {
  font-weight: 700;
}
.matrix-explore-screen .segmented.two,
.matrix-explore-screen .hit-options {
  gap: 8px;
}
.matrix-explore-screen .segmented.two button,
.matrix-explore-screen .hit-options button {
  height: 44px;
  min-height: 44px;
  padding: 0 4px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  white-space: nowrap;
  overflow: visible;
}
.matrix-explore-screen .segmented button[data-selected="true"],
.matrix-explore-screen .hit-options button[data-selected="true"] {
  border: 1px solid #d4a52f;
  background: rgba(212, 165, 47, .10);
  color: #f1c75a;
  box-shadow: 0 0 3px rgba(212, 165, 47, .16);
}
.matrix-explore-screen .segmented button:not([data-selected="true"]),
.matrix-explore-screen .hit-options button:not([data-selected="true"]) {
  border: 1px solid rgba(120, 100, 70, .65);
  background: rgba(3, 11, 17, .35);
  color: #b9b5ae;
  box-shadow: none;
}
.matrix-explore-screen .segmented button em {
  top: -7px;
  right: 4px;
  height: 16px;
  min-height: 16px;
  padding: 0 5px;
  border: 1px solid #9a6f1e;
  border-radius: 8px;
  font-size: 9px;
  line-height: 14px;
  overflow: visible;
}
.matrix-explore-screen .segmented button em svg {
  width: 9px;
  height: 9px;
}
.matrix-explore-screen .hit-options {
  margin-top: 12px;
}
.matrix-explore-screen .advanced-row {
  height: 44px;
  min-height: 44px;
  margin: 12px 0 0;
  padding: 0;
  grid-template-columns: 32px minmax(0, 1fr) 14px;
  align-items: center;
  border-top: 1px solid rgba(212, 165, 47, .28);
  font-size: 17px;
  font-weight: 700;
}
.matrix-explore-screen .advanced-row > img:first-child {
  width: 32px;
  height: 32px;
  border-radius: 5px;
  object-fit: contain;
}
.matrix-explore-screen .advanced-row svg:last-child {
  width: 14px;
  height: 14px;
}
.matrix-explore-screen .advanced-panel {
  padding-top: 8px;
  gap: 8px;
}
.matrix-explore-screen .primary-action {
  width: 366px;
  max-width: 100%;
  height: 50px;
  margin: 12px 0;
  border: 1px solid #d4a52f;
  border-radius: 12px;
  background: #071018;
  color: #f6d472;
  font-size: 21px;
  font-weight: 700;
  letter-spacing: 0;
  box-shadow: 0 0 4px rgba(212, 165, 47, .18);
}
.matrix-explore-screen .primary-action svg {
  width: 24px;
  height: 24px;
}
.matrix-explore-screen .branded-explore-action::before { opacity: .20; }
.matrix-explore-screen .branded-explore-action::after { opacity: .30; box-shadow: none; }
.matrix-explore-screen .repeat-stats-heading {
  display: grid;
  min-height: 28px;
  grid-template-columns: auto auto minmax(0, 1fr);
  align-items: center;
  gap: 12px;
}
.matrix-explore-screen .repeat-stats-heading .section-title,
.matrix-explore-screen .result-title .section-title {
  font-size: 19px;
  font-weight: 700;
}
.matrix-explore-screen .repeat-stats-heading button {
  height: 26px;
  min-height: 26px;
  padding: 0 8px;
  border: 1px solid rgba(170, 123, 28, .55);
  border-radius: 8px;
  background: rgba(128, 87, 13, .10);
  color: #ead295;
  font-size: 13px;
  font-weight: 600;
}
.matrix-explore-screen .repeat-stats-heading > span {
  color: #9e9a93;
  font-size: 12px;
  font-weight: 400;
  text-align: right;
  white-space: nowrap;
}
.matrix-explore-screen .result-summary {
  display: grid;
  margin-top: 12px;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 6px;
}
.matrix-explore-screen .result-summary > div {
  display: flex;
  min-width: 0;
  height: 48px;
  min-height: 48px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(79, 75, 69, .72);
  border-radius: 8px;
  box-shadow: none;
}
.matrix-explore-screen .result-summary b {
  font-size: 20px;
  font-weight: 500;
  line-height: 22px;
}
.matrix-explore-screen .result-summary small {
  margin-top: 1px;
  font-size: 11px;
  font-weight: 400;
  line-height: 13px;
}
.matrix-explore-screen .explore-result-disclaimer {
  box-sizing: border-box;
  width: 366px;
  max-width: 100%;
  margin: 0 auto;
  padding: 14px 12px;
  color: #aaa49a;
  font-size: 13px;
  font-weight: 400;
  line-height: 1.55;
  text-align: center;
}
.matrix-explore-screen .result-panel {
  padding-top: 12px;
}
.matrix-explore-screen .result-title {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr);
  align-items: center;
  column-gap: 8px;
  row-gap: 6px;
}
.matrix-explore-screen .consecutive-filter-button {
  position: relative;
  min-height: 28px;
  height: 28px;
  padding: 0 10px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}
.matrix-explore-screen .consecutive-filter-button::before {
  position: absolute;
  inset: -8px 0;
  content: "";
}
.matrix-explore-screen .result-count {
  display: block;
  margin-left: 0;
  grid-column: 1 / -1;
  justify-self: end;
  color: #c6c0b8;
  font-size: 13px;
  font-weight: 400;
  line-height: 20px;
  text-align: right;
  white-space: nowrap;
}
.matrix-explore-screen .result-count > span {
  color: inherit;
  font-size: inherit;
  font-weight: inherit;
}
.matrix-explore-screen .result-count .numeric-text {
  color: #35bff0;
  font-size: 17px;
  font-weight: 700;
}
.matrix-explore-main-screen .history-panel .panel-heading { align-items: center; }
.matrix-explore-main-screen .history-panel .panel-heading .section-title,
.matrix-explore-main-screen .history-panel .panel-heading button { white-space: nowrap; }
.matrix-explore-main-screen .history-row {
  grid-template-columns: 66px 68px minmax(0, 1fr);
  border-top-width: 1px;
}
.matrix-explore-main-screen .history-panel[data-lottery="六合彩"] .history-row {
  grid-template-columns: 66px 68px minmax(0, 1fr);
}
.matrix-explore-main-screen .history-panel:not([data-lottery="六合彩"]) .history-numbers[data-has-special="true"] .history-main-numbers { gap: 2px; }
.matrix-explore-main-screen .history-panel .history-numbers[data-has-special="true"] .history-special-number {
  margin-left: 3px;
  gap: 2px;
}
.matrix-explore-main-screen .history-panel[data-lottery="六合彩"] .history-special-number > span:first-child,
.matrix-explore-main-screen .history-panel[data-lottery="大樂透"] .history-special-number > span:first-child {
  margin-inline: 2px;
  color: #f6c95f;
  font-size: 14px;
  font-weight: 700;
}
.matrix-explore-screen .road-result-row > strong {
  font-size: 15px;
  font-weight: 700;
}

'''

          prefix, rest = css.split(start_marker, 1)
          _, suffix = rest.split(end_marker, 1)
          css = prefix + canonical + end_marker + suffix

          conflicting = '''.repeat-stats-heading button {
  min-height: 22px;
  padding-block: 1px;
}

.result-summary > div {
  min-height: 46px;
}

.consecutive-filter-button {
  min-height: 22px;
  padding-block: 1px;
}

'''
          if css.count(conflicting) != 1:
              raise SystemExit(f"Expected one legacy Matrix Explore density block, found {css.count(conflicting)}")
          css = css.replace(conflicting, "", 1)

          path.write_text(css)
          PY

      - name: Verify GREEN focused regression test
        run: node --test tests/matrix-explore-option-layout.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify patch scope and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/apply-matrix-explore-docx.yml
          git diff --check
          git status --short
          git diff -- src/feature-pages.css .github/workflows/apply-matrix-explore-docx.yml

      - name: Commit and push only to exploration branch
        shell: bash
        run: |
          git config user.name "spy854540-cmd"
          git config user.email "spy854540@gmail.com"
          git add src/feature-pages.css .github/workflows/apply-matrix-explore-docx.yml
          git commit -m "style: align Matrix Explore with document spec"
          git push origin HEAD:"探索"
