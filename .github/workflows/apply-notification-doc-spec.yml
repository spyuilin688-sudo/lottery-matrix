name: Apply notification document spec

on:
  push:
    branches: ["通知"]
    paths:
      - .github/workflows/apply-notification-doc-spec.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout notification branch
        uses: actions/checkout@v4
        with:
          ref: "通知"
          fetch-depth: 0

      - name: Guard branch scope
        run: |
          test "${GITHUB_REF_NAME}" = "通知"
          test "$(git branch --show-current)" = "通知"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture baseline structure tests
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > legacy-tests.txt 2>&1
          status=$?
          echo "$status" > legacy-tests.exit
          cat legacy-tests.txt
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: notification-test-diagnostics
          path: |
            legacy-tests.txt
            legacy-tests.exit
          if-no-files-found: error
          retention-days: 1
