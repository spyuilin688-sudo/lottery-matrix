name: Fix home switcher single source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-home-switcher-single-source.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch duplicate switcher visual source
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/Prototype.tsx')
          source = source_path.read_text()
          replacements = [
            ('  independentCards?: boolean;\n', ''),
            ('export function LotterySwitcher({ selected, onChange, className = "", independentCards = false }: LotterySwitcherProps) {',
             'export function LotterySwitcher({ selected, onChange, className = "" }: LotterySwitcherProps) {'),
            ('      data-independent-cards={independentCards}\n', ''),
            ('              {independentCards ? <img src={lottery.logo} alt="" draggable={false} /> : null}\n', ''),
            ('<LotterySwitcher selected={selected} onChange={setSelected} className="home-switcher-box" independentCards />',
             '<LotterySwitcher selected={selected} onChange={setSelected} className="home-switcher-box" />'),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected Prototype fragment once, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)
          source_path.write_text(source)

          css_path = Path('src/homepage-repair.css')
          css = css_path.read_text()
          old_css = '''.home-screen .lottery-switcher > .lottery-switcher-hit-grid > .lottery-card > img {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            object-position: center;
            pointer-events: none;
          }

'''
          if css.count(old_css) != 1:
              raise SystemExit(f'Expected independent-logo CSS once, found {css.count(old_css)}')
          css_path.write_text(css.replace(old_css, '', 1))

          Path('.github/workflows/fix-home-switcher-single-source.yml').unlink()
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify switcher regression tests
        run: npx vitest run src/__tests__/homepage-lottery-switcher-style.test.ts src/__tests__/homepage-lottery-switcher-structure.test.ts src/__tests__/useLatestLotteryDraw.test.tsx
      - name: Verify scope
        run: |
          git diff --check
          git diff -- src/Prototype.tsx src/homepage-repair.css .github/workflows/fix-home-switcher-single-source.yml
      - name: Commit
        run: |
          git config user.name "spy854540-cmd"
          git config user.email "spy854540@gmail.com"
          git add -A
          git commit -m "fix(home): use one lottery switcher visual source"
          git push origin main
