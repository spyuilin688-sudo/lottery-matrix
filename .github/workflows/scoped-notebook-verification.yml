name: Scoped notebook and test verification
on:
  push:
    branches: [fix/notebook-test-reliability-20260909]
permissions:
  contents: read
jobs:
  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Related component tests in Taipei
        run: TZ=Asia/Taipei npx vitest run src/__tests__/MatrixNotebookPage.test.tsx src/__tests__/MatrixExplorePage.test.tsx src/__tests__/requested-layout-refinement.test.ts
      - name: Taipei date behavior on a UTC host
        run: TZ=UTC npx vitest run src/__tests__/MatrixNotebookPage.test.tsx -t 'Taipei date|calendar day'
      - run: npm run build:pages
      - run: PLAYWRIGHT_BROWSERS_PATH=.sites-runtime/playwright npx playwright install --with-deps chromium
      - name: Related browser scenarios only
        run: PLAYWRIGHT_BROWSERS_PATH=.sites-runtime/playwright npx playwright test tests/bottom-navigation.spec.ts tests/home-pro-plans-layout-runtime.spec.ts tests/mobile-runtime.spec.ts tests/tongxing-reference-responsive.spec.ts tests/notebook-reliability.spec.ts --workers=2 --reporter=line
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npx vitest run src/admin-member-page.test.tsx src/subscription-save.test.tsx
      - run: APPDEPLOY_CI_EXTERNALS=true npm run build
