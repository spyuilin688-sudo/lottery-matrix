name: Audit remediation GREEN

on:
  push:
    branches:
      - fix/remaining-audit-issues-20260904
    paths:
      - .github/workflows/audit-remediation-green.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remaining-audit-issues-20260904
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply audited frontend fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          # #4 Notifications: failed load is visible, recoverable, and non-editable.
          path = 'src/NotificationsPagePatched.tsx'
          text = read(path)
          text = replace_once(
              text,
              '  const notificationSettingsLoadState = useRef<"loading" | "ready" | "failed">("loading");\n',
              '  const notificationSettingsLoadState = useRef<"loading" | "ready" | "failed">("loading");\n'
              '  const [notificationSettingsLoadUiState, setNotificationSettingsLoadUiState] = useState<"loading" | "ready" | "failed">("loading");\n'
              '  const notificationSettingsLoadRevision = useRef(0);\n',
              'notification load ui state',
          )
          old_effect = '''  useEffect(() => {
            let active = true;
            componentActive.current = true;
            void fetchNotificationSettings().then((stored) => {
              if (!active) return;
              const merged = pendingLoadEdits.current.reduce((current, edit) => edit(current), stored);
              pendingLoadEdits.current = [];
              lastSavedSettings.current = JSON.stringify(stored);
              latestNotificationSettings.current = merged;
              setNotificationSettings(merged);
              notificationSettingsLoadState.current = "ready";
            }).catch(() => {
              if (!active) return;
              pendingLoadEdits.current = [];
              notificationSettingsLoadState.current = "failed";
            });
            return () => {
              active = false;
              componentActive.current = false;
'''
          new_effect = '''  const loadNotificationSettings = async () => {
            const revision = notificationSettingsLoadRevision.current + 1;
            notificationSettingsLoadRevision.current = revision;
            notificationSettingsLoadState.current = "loading";
            setNotificationSettingsLoadUiState("loading");
            try {
              const stored = await fetchNotificationSettings();
              if (!componentActive.current || revision != notificationSettingsLoadRevision.current) return;
              const merged = pendingLoadEdits.current.reduce((current, edit) => edit(current), stored);
              pendingLoadEdits.current = [];
              lastSavedSettings.current = JSON.stringify(stored);
              latestNotificationSettings.current = merged;
              setNotificationSettings(merged);
              notificationSettingsLoadState.current = "ready";
              setNotificationSettingsLoadUiState("ready");
            } catch {
              if (!componentActive.current || revision != notificationSettingsLoadRevision.current) return;
              pendingLoadEdits.current = [];
              notificationSettingsLoadState.current = "failed";
              setNotificationSettingsLoadUiState("failed");
            }
          };

          useEffect(() => {
            componentActive.current = true;
            void loadNotificationSettings();
            return () => {
              notificationSettingsLoadRevision.current += 1;
              componentActive.current = false;
'''
          text = replace_once(text, old_effect, new_effect, 'notification load effect')
          text = replace_once(
              text,
              '''  const applyNotificationSettingsEdit = (edit: NotificationSettingsEdit) => {
            if (notificationSettingsLoadState.current === "loading") pendingLoadEdits.current.push(edit);
            setNotificationSettings(edit);
          };
''',
              '''  const applyNotificationSettingsEdit = (edit: NotificationSettingsEdit) => {
            if (notificationSettingsLoadState.current === "failed") return;
            if (notificationSettingsLoadState.current === "loading") pendingLoadEdits.current.push(edit);
            setNotificationSettings(edit);
          };
''',
              'notification failed edit guard',
          )
          text = text.replace('<select aria-label={`${lottery}時間${index + 1}`} value={betTimes[lottery][index]} onChange=', '<select aria-label={`${lottery}時間${index + 1}`} value={betTimes[lottery][index]} disabled={notificationSettingsLoadUiState === "failed"} onChange=')
          text = text.replace('<input type="checkbox" checked={statusOptions[lottery].includes(status)} onChange=', '<input type="checkbox" checked={statusOptions[lottery].includes(status)} disabled={notificationSettingsLoadUiState === "failed"} onChange=')
          text = text.replace('name={key === "win" ? "win-notification" : undefined} checked={selectedOptions[key]?.includes(option)} onChange=', 'name={key === "win" ? "win-notification" : undefined} checked={selectedOptions[key]?.includes(option)} disabled={notificationSettingsLoadUiState === "failed"} onChange=')
          text = replace_once(
              text,
              '''    const disabled = !settings[key] || key === "collision";
            const expanded = expandedKey === key && !disabled;
            const settingsPanelId = `notification-settings-${key}`;
            const isSystemRow = key === "system";
''',
              '''    const isSystemRow = key === "system";
            const settingsLoadFailed = notificationSettingsLoadUiState === "failed";
            const disabled = !settings[key] || key === "collision" || (!isSystemRow && settingsLoadFailed);
            const expanded = expandedKey === key && !disabled;
            const settingsPanelId = `notification-settings-${key}`;
''',
              'notification row disabled state',
          )
          text = replace_once(
              text,
              'disabled={isSystemRow ? pushBusy || pushToggleUnavailable : key === "collision"}',
              'disabled={isSystemRow ? pushBusy || pushToggleUnavailable : key === "collision" || settingsLoadFailed}',
              'notification toggle disabled state',
          )
          text = replace_once(
              text,
              '''        <div className="notification-content">
                  <div className="notification-bulk-actions" role="group" aria-label="批次通知設定">
                    <button type="button" className="notification-bulk-enable primary-action branded-explore-action" onClick={() => setAvailableNotifications(true)}><span>全部開啟</span></button>
                    <button type="button" className="notification-bulk-disable branded-explore-action" onClick={() => setAvailableNotifications(false)}><span>全部關閉</span></button>
''',
              '''        <div className="notification-content">
                  {notificationSettingsLoadUiState === "failed" ? <div className="notification-settings-load-error panel" role="alert"><span>通知設定載入失敗</span><button type="button" className="title-card-compact-action" aria-label="重新載入通知設定" onClick={() => void loadNotificationSettings()}>重新載入</button></div> : null}
                  <div className="notification-bulk-actions" role="group" aria-label="批次通知設定">
                    <button type="button" className="notification-bulk-enable primary-action branded-explore-action" disabled={notificationSettingsLoadUiState === "failed"} onClick={() => setAvailableNotifications(true)}><span>全部開啟</span></button>
                    <button type="button" className="notification-bulk-disable branded-explore-action" disabled={notificationSettingsLoadUiState === "failed"} onClick={() => setAvailableNotifications(false)}><span>全部關閉</span></button>
''',
              'notification failure alert and bulk lock',
          )
          write(path, text)

          # #5 History: explicit load state and retry.
          path = 'src/FeaturePagesCore.tsx'
          text = read(path)
          old_hook = '''function useLotteryHistory(lottery: LotteryId, limit?: number) {
            const [data, setData] = useState<LotteryDrawRecord[]>([]);
            const requestLimit = typeof limit === "number" ? Math.max(limit * 3, limit <= 10 ? 50 : 30) : undefined;
            useEffect(() => {
              let active = true;
              setData([]);
              const refresh = () => {
                fetchLotteryHistory(lottery, requestLimit).then((records) => {
                  if (!active) return;
                  const seen = new Set<string>();
                  const uniqueRecords = records.filter((record) => {
                    const key = getHistoryRecordKey(record);
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                  });
                  setData(typeof limit === "number" ? uniqueRecords.slice(0, limit) : uniqueRecords);
                }).catch(() => { if (active) setData([]); });
              };
              refresh();
              const timer = window.setInterval(refresh, 60_000);
              return () => { active = false; window.clearInterval(timer); };
            }, [lottery, limit, requestLimit]);
            return data;
          }
'''
          new_hook = '''type DataLoadState = "loading" | "success" | "empty" | "error";

          function useLotteryHistory(lottery: LotteryId, limit?: number) {
            const [data, setData] = useState<LotteryDrawRecord[]>([]);
            const [loadState, setLoadState] = useState<DataLoadState>("loading");
            const [reloadRevision, setReloadRevision] = useState(0);
            const requestLimit = typeof limit === "number" ? Math.max(limit * 3, limit <= 10 ? 50 : 30) : undefined;
            useEffect(() => {
              let active = true;
              setData([]);
              setLoadState("loading");
              const refresh = () => {
                fetchLotteryHistory(lottery, requestLimit).then((records) => {
                  if (!active) return;
                  const seen = new Set<string>();
                  const uniqueRecords = records.filter((record) => {
                    const key = getHistoryRecordKey(record);
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                  });
                  const nextData = typeof limit === "number" ? uniqueRecords.slice(0, limit) : uniqueRecords;
                  setData(nextData);
                  setLoadState(nextData.length > 0 ? "success" : "empty");
                }).catch(() => { if (active) setLoadState("error"); });
              };
              refresh();
              const timer = window.setInterval(refresh, 60_000);
              return () => { active = false; window.clearInterval(timer); };
            }, [lottery, limit, requestLimit, reloadRevision]);
            return { data, loadState, reload: () => setReloadRevision((current) => current + 1) };
          }
'''
          text = replace_once(text, old_hook, new_hook, 'history load-state hook')
          text = replace_once(
              text,
              '''  const selectedLotteryLatest = useLotteryHistory(lottery, 1);
            const history = useLotteryHistory(appliedHistorySettings.lottery, getHistoryLimit(appliedHistorySettings.range));
''',
              '''  const { data: selectedLotteryLatest } = useLotteryHistory(lottery, 1);
            const { data: history, loadState: historyLoadState, reload: reloadHistory } = useLotteryHistory(appliedHistorySettings.lottery, getHistoryLimit(appliedHistorySettings.range));
''',
              'history hook consumers',
          )
          text = replace_once(
              text,
              '''      <div className="matrix-explore-main-screen draw-history-history-scope">
                <div className="draw-history-week-list" data-lottery={appliedHistorySettings.lottery} aria-label={`${appliedHistorySettings.lottery}歷史開獎號碼`}>
''',
              '''      <div className="matrix-explore-main-screen draw-history-history-scope">
                {historyLoadState === "error" ? <div className="panel" role="alert"><span>歷史開獎號碼載入失敗</span><button type="button" aria-label="重新載入歷史開獎號碼" onClick={reloadHistory}>重新載入</button></div> : null}
                {historyLoadState === "loading" ? <p role="status">歷史開獎號碼載入中</p> : null}
                {historyLoadState === "empty" ? <p>目前沒有歷史開獎號碼。</p> : null}
                <div className="draw-history-week-list" data-lottery={appliedHistorySettings.lottery} aria-label={`${appliedHistorySettings.lottery}歷史開獎號碼`} hidden={historyLoadState === "error" || historyLoadState === "loading" || historyLoadState === "empty"}>
''',
              'history states render',
          )

          # #5 TongXing: explicit result state and retry.
          text = replace_once(
              text,
              '  const [resultGroups, setResultGroups] = useState<TongXingPair[]>([]);\n',
              '  const [resultGroups, setResultGroups] = useState<TongXingPair[]>([]);\n  const [resultLoadState, setResultLoadState] = useState<"idle" | "loading" | "success" | "empty" | "error">("idle");\n',
              'tongxing result state',
          )
          text = replace_once(
              text,
              '''    setResultGroups([]);
              try {
                const response = await fetchTongXing({ lottery, numberOrder: order as MatrixNumberOrder, numbers: normalizedValues, futureOffset: periodOffset });
                setResultGroups(response.groups);
              } catch { setResultGroups([]); }
              setSearched(true);
''',
              '''    setResultGroups([]);
              setResultLoadState("loading");
              try {
                const response = await fetchTongXing({ lottery, numberOrder: order as MatrixNumberOrder, numbers: normalizedValues, futureOffset: periodOffset });
                setResultGroups(response.groups);
                setResultLoadState(response.groups.length > 0 ? "success" : "empty");
              } catch {
                setResultGroups([]);
                setResultLoadState("error");
              }
              setSearched(true);
''',
              'tongxing request state',
          )
          old_result = '''      {searched ? <><div className="ornament-title"><span />探索結果<span /></div><section ref={resultsEndRef} className="panel tongxing-results"><div className="tongxing-table" data-columns={resultColumns.length} aria-label={`${appliedLottery}同星探索結果`}><div className="tongxing-table-row tongxing-table-head"><span>期數</span>{resultColumns.map((column) => <span key={column}>{column}</span>)}</div>{resultGroups.map(({ lockedEntry, predictedEntry }) => <article className="tongxing-result-group" key={getDrawIssue(lockedEntry)}>{renderResultRow(lockedEntry, "locked")}{renderResultRow(predictedEntry, "predicted")}</article>)}</div></section></> : null}
'''
          new_result = '''      {searched ? <><div className="ornament-title"><span />探索結果<span /></div>{resultLoadState === "error" ? <section ref={resultsEndRef} className="panel tongxing-results" role="alert"><span>Matrix 同星資料載入失敗</span><button type="button" aria-label="重新載入 Matrix 同星資料" onClick={() => void handleSearch()}>重新載入</button></section> : <section ref={resultsEndRef} className="panel tongxing-results">{resultLoadState === "loading" ? <p role="status">Matrix 同星資料載入中</p> : resultLoadState === "empty" ? <p>目前沒有符合條件的同星結果。</p> : <div className="tongxing-table" data-columns={resultColumns.length} aria-label={`${appliedLottery}同星探索結果`}><div className="tongxing-table-row tongxing-table-head"><span>期數</span>{resultColumns.map((column) => <span key={column}>{column}</span>)}</div>{resultGroups.map(({ lockedEntry, predictedEntry }) => <article className="tongxing-result-group" key={getDrawIssue(lockedEntry)}>{renderResultRow(lockedEntry, "locked")}{renderResultRow(predictedEntry, "predicted")}</article>)}</div>}</section>}</> : null}
'''
          text = replace_once(text, old_result, new_result, 'tongxing states render')
          write(path, text)

          # #5 Number reference, payment history; #6 referral; #11 dead MatrixCorePage.
          path = 'src/FeaturePages.tsx'
          text = read(path)
          text = replace_once(
              text,
              '  const [referenceItems, setReferenceItems] = useState<NumberReferenceItem[] | null>(null);\n',
              '  const [referenceItems, setReferenceItems] = useState<NumberReferenceItem[] | null>(null);\n  const [referenceLoadState, setReferenceLoadState] = useState<"idle" | "loading" | "success" | "empty" | "error">("idle");\n',
              'reference load state',
          )
          text = replace_once(
              text,
              '''    try {
                const response = await fetchNumberReference({
                  lottery,
                  numberOrder: order as MatrixNumberOrder,
                  historyRange,
                  numbers: unique,
                });
                setReferenceItems(response.items);
              } catch {
                setReferenceItems([]);
              }
''',
              '''    setReferenceLoadState("loading");
              try {
                const response = await fetchNumberReference({
                  lottery,
                  numberOrder: order as MatrixNumberOrder,
                  historyRange,
                  numbers: unique,
                });
                setReferenceItems(response.items);
                setReferenceLoadState(response.items.length > 0 ? "success" : "empty");
              } catch {
                setReferenceItems([]);
                setReferenceLoadState("error");
              }
''',
              'reference request state',
          )
          text = replace_once(
              text,
              '''      <section className="panel reference-table-panel">
                <header><h2>{appliedLottery}（{appliedOrder}）</h2></header>
''',
              '''      {referenceLoadState === "error" ? <div className="panel" role="alert"><span>號碼對照資料載入失敗</span><button type="button" aria-label="重新載入號碼對照資料" onClick={() => void startReferenceSearch()}>重新載入</button></div> : null}
              {referenceLoadState === "loading" ? <p role="status">號碼對照資料載入中</p> : null}
              <section className="panel reference-table-panel" hidden={referenceLoadState === "error" || referenceLoadState === "loading"}>
                <header><h2>{appliedLottery}（{appliedOrder}）</h2></header>
''',
              'reference states render',
          )
          old_payment = '''export function PaymentHistoryPage({ onNavigate }: { onNavigate: Navigate }) {
            const [history, setHistory] = useState<MemberPaymentHistoryItem[] | null>(null);
            useEffect(() => {
              void fetchMemberPaymentHistory().then(setHistory).catch(() => setHistory([]));
            }, []);
            return (
              <ProfileDetailShell title="付款紀錄" onNavigate={onNavigate} className="payment-history-screen">
                <DetailCard title="付款紀錄">
                  {history === null ? <p role="status">付款紀錄載入中</p> : history.length === 0 ? <p>目前沒有付款紀錄。</p> : (
'''
          new_payment = '''export function PaymentHistoryPage({ onNavigate }: { onNavigate: Navigate }) {
            const [history, setHistory] = useState<MemberPaymentHistoryItem[] | null>(null);
            const [historyError, setHistoryError] = useState(false);
            const loadPaymentHistory = () => {
              setHistory(null);
              setHistoryError(false);
              void fetchMemberPaymentHistory().then(setHistory).catch(() => setHistoryError(true));
            };
            useEffect(() => {
              loadPaymentHistory();
            }, []);
            return (
              <ProfileDetailShell title="付款紀錄" onNavigate={onNavigate} className="payment-history-screen">
                <DetailCard title="付款紀錄">
                  {historyError ? <div role="alert"><span>付款紀錄載入失敗</span><button type="button" aria-label="重新載入付款紀錄" onClick={loadPaymentHistory}>重新載入</button></div> : history === null ? <p role="status">付款紀錄載入中</p> : history.length === 0 ? <p>目前沒有付款紀錄。</p> : (
'''
          text = replace_once(text, old_payment, new_payment, 'payment states')
          old_invite = '''function InviteFriendsPage({ onNavigate }: { onNavigate: Navigate }) {
            return <ProfileDetailShell title="邀請好友" onNavigate={onNavigate}><DetailCard title="邀請好友"><p>推薦碼/邀請碼尚未提供。</p></DetailCard></ProfileDetailShell>;
          }
'''
          new_invite = '''function InviteFriendsPage({ onNavigate }: { onNavigate: Navigate }) {
            const [summary, setSummary] = useState<MemberReferralSummary | null>(null);
            const [loadState, setLoadState] = useState<"loading" | "ready" | "error">("loading");
            const requestRevision = useRef(0);
            const loadReferralSummary = async () => {
              const revision = requestRevision.current + 1;
              requestRevision.current = revision;
              setLoadState("loading");
              try {
                const nextSummary = await fetchMemberReferralSummary();
                if (revision !== requestRevision.current) return;
                setSummary(nextSummary);
                setLoadState("ready");
              } catch {
                if (revision !== requestRevision.current) return;
                setSummary(null);
                setLoadState("error");
              }
            };
            useEffect(() => {
              void loadReferralSummary();
              return () => { requestRevision.current += 1; };
            }, []);
            const copyReferralCode = async () => {
              if (!summary?.referralCode) return;
              await navigator.clipboard?.writeText(summary.referralCode);
            };
            return <ProfileDetailShell title="邀請好友" onNavigate={onNavigate}><DetailCard title="邀請好友">{loadState === "loading" ? <p role="status">推薦資料載入中</p> : loadState === "error" ? <div role="alert"><span>推薦資料載入失敗</span><button type="button" aria-label="重新載入推薦資料" onClick={() => void loadReferralSummary()}>重新載入</button></div> : summary ? <div className="referral-share-card"><strong>{summary.referralCode}</strong><p>{`推薦成功 ${summary.referralSuccessCount} 人`}</p><button type="button" aria-label="複製推薦碼" onClick={() => void copyReferralCode()}>複製推薦碼</button></div> : null}</DetailCard></ProfileDetailShell>;
          }
'''
          text = replace_once(text, old_invite, new_invite, 'invite referral summary')
          text, count = re.subn(r'export function MatrixCorePage\([\s\S]*?(?=export function MatrixExplorePage)', '', text, count=1)
          if count != 1:
              raise SystemExit(f'matrix core dead component: expected one block, got {count}')
          write(path, text)

          # #8 Contract follows the implemented referral mutation.
          path = 'UX-CONTRACT.md'
          text = read(path)
          lines = text.splitlines()
          found = 0
          for index, line in enumerate(lines):
              if line.startswith('| Submit referral code |'):
                  lines[index] = '| Submit referral code | `確認` next to referral code → `member_referral_submit` | Button is disabled while pending; duplicate submit is blocked | Stay on the current referral view | Inline status `推薦碼已儲存` after the server accepts the code | Inline API error remains visible; the user may edit and retry when allowed by `canSubmitReferralCode` | Focus remains on the referral form and its status/error feedback | Current member referral API and `member_referral_submit` |'
                  found += 1
          if found != 1:
              raise SystemExit(f'UX referral row: expected one row, got {found}')
          write(path, '\n'.join(lines) + '\n')

          # Make the static contract test part of Vitest without Node typings.
          old_test = Path('src/__tests__/AuditRemediationContracts.test.mjs')
          if old_test.exists():
              old_test.unlink()
          Path('src/__tests__/AuditRemediationContracts.test.ts').write_text('''import { describe, expect, test } from "vitest";\nimport contract from "../../UX-CONTRACT.md?raw";\nimport featurePages from "../FeaturePages.tsx?raw";\nimport prototype from "../Prototype.tsx?raw";\n\ndescribe("outstanding audit remediation contracts", () => {\n  test("推薦碼 UX contract 反映現行 member_referral_submit，而不是宣告功能停用", () => {\n    const referralRow = contract.split("\\n").find((line) => line.includes("| Submit referral code |")) ?? "";\n    expect(referralRow).toContain("member_referral_submit");\n    expect(referralRow).toContain("推薦碼已儲存");\n    expect(referralRow).not.toContain("Disabled because no mutation API is specified");\n    expect(referralRow).not.toContain("No success is claimed");\n  });\n\n  test("matrix-core 保留相容路由但不保留不可達 MatrixCorePage 元件", () => {\n    expect(featurePages).not.toMatch(/(?:export\\s+)?function\\s+MatrixCorePage\\s*\\(/);\n    expect(featurePages).toContain('if (screen === "matrix-core") return <MatrixExplorePage onNavigate={onNavigate} />;');\n    expect(prototype).toContain('<MatrixCoreBanner onOpen={() => navigate("explore")} />');\n  });\n});\n''', encoding='utf-8')

          # jsdom does not implement scrollIntoView; keep the product behavior and fix the test environment.
          path = 'src/__tests__/DataPageFailureStates.test.tsx'
          text = read(path)
          text = replace_once(
              text,
              '''  window.requestAnimationFrame = (callback: FrameRequestCallback) => {
                callback(0);
                return 1;
              };
''',
              '''  window.requestAnimationFrame = (callback: FrameRequestCallback) => {
                callback(0);
                return 1;
              };
              Element.prototype.scrollIntoView = vi.fn();
''',
              'jsdom scrollIntoView stub',
          )
          write(path, text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run remediation regression tests
        run: npx vitest run src/__tests__/NotificationsLoadFailure.test.tsx src/__tests__/DataPageFailureStates.test.tsx src/__tests__/InviteFriendsReferral.test.tsx src/__tests__/AuditRemediationContracts.test.ts --reporter=verbose

      - name: Run existing notification regression suite
        run: npx vitest run src/__tests__/NotificationsPagePatched.test.tsx --reporter=dot

      - name: Build production PWA
        run: npm run build

      - name: Commit verified frontend fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NotificationsPagePatched.tsx src/FeaturePagesCore.tsx src/FeaturePages.tsx UX-CONTRACT.md src/__tests__/AuditRemediationContracts.test.ts src/__tests__/AuditRemediationContracts.test.mjs src/__tests__/DataPageFailureStates.test.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: implement frontend audit remediation"
          git push origin HEAD:fix/remaining-audit-issues-20260904
