name: Audit remediation GREEN

on:
  push:
    branches:
      - fix/remaining-audit-issues-20260904
    paths:
      - .github/workflows/audit-remediation-green.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/remaining-audit-issues-20260904
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate patch script
        run: python -m py_compile scripts/audit_remediation_frontend.py

      - name: Apply frontend remediation
        run: python scripts/audit_remediation_frontend.py

      - name: Install dependencies
        run: npm ci

      - name: Run remediation regression tests
        run: npx vitest run src/__tests__/NotificationsLoadFailure.test.tsx src/__tests__/DataPageFailureStates.test.tsx src/__tests__/InviteFriendsReferral.test.tsx --reporter=verbose

      - name: Run remediation contract tests
        run: node --test tests/audit-remediation-contract.test.mjs

      - name: Run existing notification regression suite
        run: npx vitest run src/__tests__/NotificationsPagePatched.test.tsx --reporter=dot

      - name: Build production PWA
        run: npm run build

      - name: Commit verified frontend fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NotificationsPagePatched.tsx src/FeaturePagesCore.tsx src/FeaturePages.tsx UX-CONTRACT.md tests/audit-remediation-contract.test.mjs src/__tests__/AuditRemediationContracts.test.mjs src/__tests__/DataPageFailureStates.test.tsx
          if git diff --cached --quiet; then
            echo "No verified changes to commit"
            exit 0
          fi
          git commit -m "fix: implement frontend audit remediation"
          git push origin HEAD:fix/remaining-audit-issues-20260904
