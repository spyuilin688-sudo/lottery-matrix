name: Matrix scheduled analysis

on:
  push:
    branches: [main]
    paths:
      - "services/matrix-api/**"
  schedule:
    - cron: "50 1 * * *"
    - cron: "50 2 * * *"
    - cron: "50 12 * * 1-6"
    - cron: "50 13 * * *"
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: daily539
            lottery: 今彩539
          - id: fantasy5
            lottery: 天天樂
          - id: marksix
            lottery: 六合彩
          - id: lotto649
            lottery: 大樂透
    concurrency:
      group: matrix-scheduled-analysis-${{ matrix.id }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: services/matrix-api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Gate lottery for event
        id: gate
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          LOTTERY_ID: ${{ matrix.id }}
        run: |
          should_run=false
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_SCHEDULE" == "*/15 * * * *" ]]; then
            should_run=true
          elif [[ ( "$EVENT_SCHEDULE" == "50 1 * * *" || "$EVENT_SCHEDULE" == "50 2 * * *" ) && "$LOTTERY_ID" == "fantasy5" ]]; then
            should_run=true
          elif [[ "$EVENT_SCHEDULE" == "50 12 * * 1-6" && ( "$LOTTERY_ID" == "daily539" || "$LOTTERY_ID" == "lotto649" ) ]]; then
            should_run=true
          elif [[ "$EVENT_SCHEDULE" == "50 13 * * *" && "$LOTTERY_ID" == "marksix" ]]; then
            should_run=true
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv and Python
        if: steps.gate.outputs.should_run == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/matrix-api/uv.lock

      - name: Install production dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: uv sync --frozen --no-dev

      - name: Refresh and analyze one lottery
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          LOTTERY: ${{ matrix.lottery }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" && "$LOTTERY" == "天天樂" && ( "$EVENT_SCHEDULE" == "50 1 * * *" || "$EVENT_SCHEDULE" == "50 2 * * *" ) ]]; then
            due="$(uv run python -m app.schedule --lottery "$LOTTERY")"
            if [[ "$due" != "due" ]]; then
              echo "Skip 天天樂 refresh: current trigger is not Pacific 18:50"
              exit 0
            fi
          fi
          uv run python -m app.worker --lottery "$LOTTERY"
