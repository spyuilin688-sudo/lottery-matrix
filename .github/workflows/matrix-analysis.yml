name: Matrix scheduled analysis

on:
  schedule:
    - cron: "50 1 * * *"
    - cron: "50 2 * * *"
    - cron: "50 12 * * 1-6"
    - cron: "50 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-scheduled-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: services/matrix-api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/matrix-api/uv.lock

      - name: Install production dependencies
        run: uv sync --frozen --no-dev

      - name: Refresh and analyze new draws
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$EVENT_SCHEDULE" in
            "50 1 * * *"|"50 2 * * *")
              lotteries=("天天樂")
              ;;
            "50 12 * * 1-6")
              lotteries=("今彩539" "大樂透")
              ;;
            "50 13 * * *")
              lotteries=("六合彩")
              ;;
            "")
              if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
                echo "Missing schedule for non-manual run"
                exit 1
              fi
              lotteries=("今彩539" "天天樂" "六合彩" "大樂透")
              ;;
            *)
              echo "Unsupported schedule: $EVENT_SCHEDULE"
              exit 1
              ;;
          esac

          failed=0
          for lottery in "${lotteries[@]}"; do
            if [[ "$EVENT_NAME" == "schedule" && "$lottery" == "天天樂" ]]; then
              due="$(uv run python -m app.schedule --lottery "$lottery")"
              if [[ "$due" != "due" ]]; then
                echo "Skip 天天樂: current trigger is not Pacific 18:50"
                continue
              fi
            fi
            if ! uv run python -m app.worker --lottery "$lottery"; then
              failed=1
            fi
          done
          exit "$failed"
