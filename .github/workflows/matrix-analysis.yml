name: Matrix scheduled analysis

on:
  push:
    branches: [main]
    paths:
      - "services/matrix-api/**"
  schedule:
    - cron: "50 1 * * *"
    - cron: "50 2 * * *"
    - cron: "50 12 * * 1-6"
    - cron: "50 13 * * *"
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '*/15 * * * *' ||
      ((github.event.schedule == '50 1 * * *' || github.event.schedule == '50 2 * * *') && matrix.id == 'fantasy5') ||
      (github.event.schedule == '50 12 * * 1-6' && (matrix.id == 'daily539' || matrix.id == 'lotto649')) ||
      (github.event.schedule == '50 13 * * *' && matrix.id == 'marksix')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: daily539
            lottery: 今彩539
          - id: fantasy5
            lottery: 天天樂
          - id: marksix
            lottery: 六合彩
          - id: lotto649
            lottery: 大樂透
    concurrency:
      group: matrix-scheduled-analysis-${{ matrix.id }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: services/matrix-api
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/matrix-api/uv.lock

      - name: Install production dependencies
        run: uv sync --frozen --no-dev

      - name: Refresh and analyze one lottery
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          LOTTERY: ${{ matrix.lottery }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" && "$LOTTERY" == "天天樂" && ( "$EVENT_SCHEDULE" == "50 1 * * *" || "$EVENT_SCHEDULE" == "50 2 * * *" ) ]]; then
            due="$(uv run python -m app.schedule --lottery "$LOTTERY")"
            if [[ "$due" != "due" ]]; then
              echo "Skip 天天樂 refresh: current trigger is not Pacific 18:50"
              exit 0
            fi
          fi
          uv run python -m app.worker --lottery "$LOTTERY"
