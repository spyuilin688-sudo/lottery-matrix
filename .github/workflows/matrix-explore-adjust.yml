name: Apply Matrix Explore settings adjustment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/matrix-explore-adjust.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify requested state is not already fully applied
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          tsx = Path('src/FeaturePages.tsx').read_text()
          css = Path('src/feature-pages.css').read_text()
          checks = [
              '<b>彩球類型</b>' in tsx,
              'margin-top: 4px;\n  gap: 4px;' in css,
              'grid-template-columns: max-content minmax(0, 1fr);\n  align-items: center;\n  gap: 4px;' in css,
              'width: 36px; height: 36px; flex: 0 0 36px;' in css,
              'height: 32px;\n  min-height: 32px;' in css,
          ]
          raise SystemExit(0 if all(checks) else 1)
          PY
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Unexpected: requested state already fully present.'
            exit 1
          fi
          echo 'RED verified: current main does not yet satisfy the requested state.'
      - name: Apply bounded source changes
        run: |
          python - <<'PY'
          from pathlib import Path

          tsx_path = Path('src/FeaturePages.tsx')
          tsx = tsx_path.read_text()
          old_label = 'src="/assets/matrix-explore/lottery.png" alt="" aria-hidden="true" /> : <SettingLabelIcon type="lottery" />}<b>彩種</b></span>'
          new_label = 'src="/assets/matrix-explore/lottery.png" alt="" aria-hidden="true" /> : <SettingLabelIcon type="lottery" />}<b>彩球類型</b></span>'
          if tsx.count(old_label) != 1:
              raise SystemExit(f'Expected exactly one Matrix Explore 彩種 label, found {tsx.count(old_label)}')
          tsx = tsx.replace(old_label, new_label, 1)
          tsx_path.write_text(tsx)

          css_path = Path('src/feature-pages.css')
          css = css_path.read_text()

          old_icon = '.matrix-explore-setting-icon { display: block; object-fit: contain; border-radius: 6px; }'
          new_icon = '.matrix-explore-setting-icon { display: block; width: 36px; height: 36px; flex: 0 0 36px; object-fit: contain; border-radius: 6px; }'
          if css.count(old_icon) != 1:
              raise SystemExit(f'Expected exactly one Matrix Explore icon rule, found {css.count(old_icon)}')
          css = css.replace(old_icon, new_icon, 1)

          anchor = '.matrix-explore-main-screen .native-select select { font-weight: 700; }'
          replacement = '''.matrix-explore-main-screen .native-select select { font-weight: 700; }

.matrix-explore-main-screen .explore-settings .setting-grid {
  margin-top: 4px;
  gap: 4px;
}

.matrix-explore-main-screen .explore-settings .setting-grid label {
  grid-template-columns: max-content minmax(0, 1fr);
  align-items: center;
  gap: 4px;
}

.matrix-explore-main-screen .explore-settings .setting-grid .select-box,
.matrix-explore-main-screen .explore-settings .setting-grid .segmented,
.matrix-explore-main-screen .explore-settings .setting-grid .segmented button {
  height: 32px;
  min-height: 32px;
}'''
          if css.count(anchor) != 1:
              raise SystemExit(f'Expected exactly one Matrix Explore main anchor rule, found {css.count(anchor)}')
          css = css.replace(anchor, replacement, 1)
          css_path.write_text(css)
          PY
      - name: Verify bounded source state
        run: |
          python - <<'PY'
          from pathlib import Path
          tsx = Path('src/FeaturePages.tsx').read_text()
          css = Path('src/feature-pages.css').read_text()
          assert tsx.count('<b>彩球類型</b>') == 1
          assert '.matrix-explore-main-screen .explore-settings .setting-grid {\n  margin-top: 4px;\n  gap: 4px;\n}' in css
          assert 'grid-template-columns: max-content minmax(0, 1fr);\n  align-items: center;\n  gap: 4px;' in css
          assert '.matrix-explore-setting-icon { display: block; width: 36px; height: 36px; flex: 0 0 36px; object-fit: contain; border-radius: 6px; }' in css
          assert '.matrix-explore-main-screen .explore-settings .setting-grid .select-box,\n.matrix-explore-main-screen .explore-settings .setting-grid .segmented,\n.matrix-explore-main-screen .explore-settings .setting-grid .segmented button {\n  height: 32px;\n  min-height: 32px;\n}' in css
          assert '.section-title { display: flex; margin: 0;' in css
          PY
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Commit source changes and remove one-time workflow
        run: |
          rm .github/workflows/matrix-explore-adjust.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/FeaturePages.tsx src/feature-pages.css .github/workflows/matrix-explore-adjust.yml
          git commit -m 'Adjust Matrix Explore settings layout'
          git push origin main

# trigger: 2
