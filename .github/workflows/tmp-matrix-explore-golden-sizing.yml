name: Temporary Matrix Explore Golden Sizing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch canonical Matrix Explore rules
        run: python scripts/tmp_matrix_explore_golden_sizing.py

      - name: Apply requested Matrix Explore spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/feature-pages.css")
          css = path.read_text()
          marker = "/* Matrix Explore requested spacing override */"
          end_marker = "/* v55 scoped density and hierarchy refinements */"

          if marker in css:
              start = css.index(marker)
              end = css.index(end_marker, start)
              css = css[:start] + css[end:]

          override = r'''/* Matrix Explore requested spacing override */
          .matrix-explore-main-screen .feature-body {
            padding-inline: 16px;
            gap: 8px;
          }

          .matrix-explore-main-screen .matrix-title-banner {
            width: calc(100% - 32px);
          }

          .matrix-explore-main-screen .explore-settings,
          .matrix-explore-main-screen .hit-advanced-panel {
            padding: 8px;
          }

          .matrix-explore-main-screen .explore-settings .setting-grid {
            margin-top: 32px;
            row-gap: 16px;
          }

          .matrix-explore-main-screen .explore-settings .setting-grid label {
            grid-template-columns: max-content minmax(0, 1fr);
            column-gap: 12px;
          }

          .matrix-explore-main-screen .explore-settings .setting-grid label:first-child {
            column-gap: 28px;
          }

          .matrix-explore-main-screen .explore-settings .setting-grid label > span {
            column-gap: 12px;
          }

          .matrix-explore-main-screen .explore-settings .setting-grid label:first-child > span {
            column-gap: 28px;
          }

          .matrix-explore-main-screen .explore-settings .segmented.three {
            gap: 8px;
          }

          .matrix-explore-main-screen .hit-options {
            gap: 8px;
            margin-top: 24px;
            padding-bottom: 0;
          }

          .matrix-explore-main-screen .advanced-row {
            margin-top: 8px;
            column-gap: 8px;
          }

          .matrix-explore-main-screen .advanced-panel {
            padding-top: 32px;
            row-gap: 16px;
          }

          .matrix-explore-main-screen .advanced-panel label {
            grid-template-columns: max-content minmax(0, 1fr);
            column-gap: 12px;
          }

          .matrix-explore-main-screen .advanced-panel label > .advanced-setting-title {
            column-gap: 12px;
          }

          .matrix-explore-main-screen .advanced-panel .segmented.three,
          .matrix-explore-main-screen .advanced-panel .segmented.two {
            gap: 8px;
          }

          .matrix-explore-main-screen .primary-action {
            margin: 0;
          }

          '''
          css = css.replace(end_marker, override + end_marker, 1)
          path.write_text(css)
          PY

      - name: Verify 12px global page inline token
        run: grep -R --line-number --include='*.css' -- '--layout-page-inline: 12px' src

      - name: Targeted tests
        run: node --test tests/matrix-explore-option-layout.test.mjs tests/recent-history-layout.test.mjs

      - name: Full tests
        run: node --test tests/*.test.mjs

      - name: Build
        run: npm run build

      - name: Commit verified result and remove temporary files
        run: |
          git rm scripts/tmp_matrix_explore_golden_sizing.py
          git rm .github/workflows/tmp-matrix-explore-golden-sizing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/feature-pages.css tests/matrix-explore-option-layout.test.mjs
          git commit -m "style: apply Matrix Explore requested spacing"
          git push origin main
