name: Temporary Matrix Explore Golden Sizing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch canonical Matrix Explore rules
        run: python scripts/tmp_matrix_explore_golden_sizing.py

      - name: Verify 12px page inline token
        run: grep -R --line-number --include='*.css' -- '--layout-page-inline: 12px' src

      - name: Targeted tests
        run: node --test tests/matrix-explore-option-layout.test.mjs tests/recent-history-layout.test.mjs

      - name: Full tests
        run: node --test tests/*.test.mjs

      - name: Build
        run: npm run build

      - name: Commit verified result and remove temporary files
        run: |
          git rm scripts/tmp_matrix_explore_golden_sizing.py
          git rm .github/workflows/tmp-matrix-explore-golden-sizing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/feature-pages.css
          git commit -m "style: apply Matrix Explore golden mobile sizing"
          git push origin main
