name: Diagnose Node full tests

on:
  push:
    branches:
      - fix/remaining-audit-issues-20260904
    paths:
      - .github/workflows/diagnose-node-full-tests.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remaining-audit-issues-20260904
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run each Node test file separately
        shell: bash
        run: |
          set -o pipefail
          for f in tests/*.test.mjs; do
            echo "===== $f ====="
            if ! node --test "$f"; then
              echo "FAILED_FILE=$f"
              exit 1
            fi
          done
