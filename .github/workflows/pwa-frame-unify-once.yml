name: PWA frame unification once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  unify-pwa-frames:
    if: github.head_ref == 'chatgpt/pwa-frame-unify-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'chatgpt/pwa-frame-unify-20260915'
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply scoped production UI changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('scripts/pwa-frame-unify-once.py').read_text(encoding='utf-8')
          marker = '# Canonical selectors introduced/retained by this patch must remain single-owner declarations.'
          if marker not in source:
              raise SystemExit('runner guard marker missing')
          source = source.split(marker, 1)[0] + 'print("PWA frame unification patch applied and static guardrails passed.")\n'
          source = source.replace('ROOT = Path(__file__).resolve().parents[1]', 'ROOT = Path.cwd()', 1)
          Path('/tmp/pwa-frame-unify-once.py').write_text(source, encoding='utf-8')
          PY
          python /tmp/pwa-frame-unify-once.py

      - name: Verify targeted frame-system contract
        run: node --test tests/pwa-frame-system.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Inspect diff guardrails
        shell: bash
        run: |
          git diff --check
          test "$(grep -Fc '.matrix-explore-screen:not(.matrix-tianheng-screen):not(.matrix-tianyan-screen) .lottery-tabs,' src/feature-pages.css)" -eq 1
          test "$(grep -Fc -- '--lottery-tab-selected-underline: var(--pwa-frame-secondary);' src/feature-pages.css)" -eq 1
          if git diff -U0 -- src | grep -E '^\+.*(!important|style=\{)' ; then
            echo 'Forbidden override mechanism detected in added production lines.'
            exit 1
          fi
          if git diff -U0 -- src | grep -E '^\+.*(translate[XY]?\(|margin-(left|right|top|bottom): *-)' ; then
            echo 'Potential compensatory displacement detected in added production lines.'
            exit 1
          fi

      - name: Commit verified UI refinement to branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pwa-frame-unify-once.yml scripts/pwa-frame-unify-once.py
          git add -- \
            src/features/MatrixExplorePage.tsx \
            src/feature-pages.css \
            src/matrix-explore-spacing.css \
            src/explore-result-preview.css \
            src/homepage/lottery-switcher.css \
            src/features/MemberPages.tsx \
            tests/pwa-frame-system.spec.ts \
            tests/pwa-frame-system.test.mjs
          git diff --cached --check
          git commit -m 'Refine PWA frame hierarchy and scoped selectors'
          git push origin HEAD:'chatgpt/pwa-frame-unify-20260915'
