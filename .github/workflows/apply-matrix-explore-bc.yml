name: Apply Matrix Explore B+C
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-matrix-explore-bc.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: python scripts/tmp-explore-reference-final.py
      - run: node --test tests/matrix-explore-option-layout.test.mjs tests/recent-history-layout.test.mjs
      - run: npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/feature-pages.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: align Matrix Explore with approved reference'
          git push origin HEAD:main
