name: Homepage E hierarchy fix once
# trigger: 2026-08-23T05:43Z

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/homepage-e-hierarchy-fix-once.yml'

permissions:
  contents: write

jobs:
  fix-homepage-hierarchy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: RED - confirm current hierarchy is still too subtle
        shell: bash
        run: |
          set +e
          node --test tests/homepage-visual-hierarchy.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'RED test unexpectedly passed before the visible hierarchy change.'
            exit 1
          fi
          echo 'RED confirmed.'

      - name: GREEN - strengthen existing formal homepage style source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/homepage-repair.css')
          css = path.read_text()

          replacements = [
              (
                  '  box-shadow: inset 0 0 8px rgba(196, 145, 69, .04);\n  overflow: hidden;',
                  '  box-shadow: inset 0 0 8px rgba(196, 145, 69, .04);\n  filter: brightness(.72) saturate(.78);\n  overflow: hidden;',
              ),
              (
                  '  background: url("/assets/lottery/functions/開獎資訊卡.png") center / 100% 100% no-repeat;\n  box-shadow: inset 0 0 0 1px rgba(118, 84, 43, .26);',
                  '  background-color: rgba(2, 7, 12, .34);\n  background-image: url("/assets/lottery/functions/開獎資訊卡.png");\n  background-repeat: no-repeat;\n  background-position: center;\n  background-size: 100% 100%;\n  background-blend-mode: multiply;\n  box-shadow: inset 0 0 0 1px rgba(118, 84, 43, .26);',
              ),
              (
                  '  filter: brightness(.88) saturate(.9);\n  opacity: .96;',
                  '  filter: brightness(.72) saturate(.8);\n  opacity: .92;',
              ),
              (
                  '.home-screen .matrix-status-hit-grid > button[data-active="true"] {\n  filter: drop-shadow(0 0 4px rgba(255, 214, 102, .52));\n}',
                  '.home-screen .matrix-status-hit-grid > button[data-active="true"] {\n  background: rgba(244, 206, 103, .035);\n  box-shadow: inset 0 0 0 1px rgba(244, 206, 103, .72), inset 0 0 14px rgba(244, 206, 103, .12);\n}',
              ),
              (
                  '  filter: brightness(.84) saturate(.88);\n  opacity: .95;',
                  '  filter: brightness(.7) saturate(.76);\n  opacity: .9;',
              ),
              (
                  '.home-screen .lottery-switcher > .lottery-switcher-hit-grid > .lottery-card[data-selected="true"] {\n  border-color: rgba(244, 206, 103, .9);\n  box-shadow: inset 0 0 8px rgba(244, 206, 103, .06), 0 0 5px rgba(255, 206, 105, .16);\n}',
                  '.home-screen .lottery-switcher > .lottery-switcher-hit-grid > .lottery-card[data-selected="true"] {\n  border-color: rgba(244, 206, 103, .9);\n  box-shadow: inset 0 0 8px rgba(244, 206, 103, .06), 0 0 5px rgba(255, 206, 105, .16);\n  filter: brightness(1) saturate(1);\n}',
              ),
              (
                  '.home-screen .bottom-navigation-artwork {\n  filter: brightness(.82) saturate(.72);\n  opacity: .86;\n}',
                  '.home-screen .bottom-navigation-artwork {\n  filter: brightness(.7) saturate(.62);\n  opacity: .8;\n}',
              ),
          ]

          for old, new in replacements:
              count = css.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one formal source match, found {count}: {old[:80]}')
              css = css.replace(old, new, 1)

          path.write_text(css)
          PY

      - name: Verify targeted, full tests and build
        run: |
          node --test tests/homepage-visual-hierarchy.test.mjs
          node --test tests/*.test.mjs
          npm run build

      - name: Commit verified fix to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/homepage-e-hierarchy-fix-once.yml
          git add -- src/homepage-repair.css tests/homepage-visual-hierarchy.test.mjs
          git commit -m 'Make homepage visual hierarchy clearly visible'
          git push origin main
