name: Apply Matrix status switcher specification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-status-switcher-spec.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply status switcher specification
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply.py
          python /tmp/apply.py
      - name: Verify focused tests
        run: node --test tests/page-title-card.test.mjs tests/number-reference-title-actions.test.mjs
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/feature-pages.css
          git diff --cached --check
          git commit -m "style: use shared Matrixbba switcher on status page"
          git push origin HEAD:main
