name: Explore reference final
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-explore-reference-final.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Narrow temporary delete helper to standalone selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp_matrix_explore_golden_sizing.py')
          text = path.read_text()
          old = 'pattern = re.compile(re.escape(selector) + r"\\s*\\{[^{}]*\\}\\s*", re.S)'
          new = 'pattern = re.compile(r"(?m)(?<!,\\n)^[ \\t]*" + re.escape(selector) + r"\\s*\\{[^{}]*\\}[ \\t]*\\n?")'
          if old not in text:
              raise SystemExit('temporary delete helper source not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Patch canonical Matrix Explore rules
        run: python scripts/tmp_matrix_explore_golden_sizing.py
      - name: Verify 12px page inline token
        run: |
          grep -R --line-number --include='*.css' -- '--layout-page-inline: 12px' src
      - name: Targeted tests
        run: node --test tests/matrix-explore-option-layout.test.mjs tests/recent-history-layout.test.mjs
      - name: Full tests
        run: node --test tests/*.test.mjs
      - name: Build
        run: npm run build
      - name: Commit verified CSS
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/feature-pages.css
          git diff --cached --quiet && exit 1
          git commit -m "style: apply Matrix Explore golden mobile sizing"
          git push origin HEAD:main
