name: Runtime Integrity Scope Branch

on:
  push:
    branches: [runtime-integrity-scope-fix]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Runtime integrity scope test
        run: node --test tests/runtime-integrity-scope.test.mjs
      - name: Runtime integrity check
        run: npm run check:runtime
      - name: Production build
        run: npm run build
