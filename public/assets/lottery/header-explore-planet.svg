<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 136" fill="none">
  <defs>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(448 66) rotate(5) scale(450 118)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8f611b" stop-opacity=".10"/>
      <stop offset=".42" stop-color="#3a2609" stop-opacity=".055"/>
      <stop offset="1" stop-color="#010407" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetBody" cx="0" cy="0" r="1" gradientTransform="translate(708 10) rotate(125) scale(174 154)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a88035" stop-opacity=".58"/>
      <stop offset=".24" stop-color="#6f5522" stop-opacity=".53"/>
      <stop offset=".56" stop-color="#2a1e0b" stop-opacity=".89"/>
      <stop offset="1" stop-color="#070604" stop-opacity=".99"/>
    </radialGradient>
    <linearGradient id="planetRim" x1="648" y1="0" x2="688" y2="136" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff4c7" stop-opacity=".98"/>
      <stop offset=".22" stop-color="#ffd36f" stop-opacity=".94"/>
      <stop offset=".58" stop-color="#dc9b2b" stop-opacity=".82"/>
      <stop offset="1" stop-color="#75440b" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="orbitGold" x1="12" y1="104" x2="806" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8e5b12" stop-opacity="0"/>
      <stop offset=".14" stop-color="#d8941e" stop-opacity=".20"/>
      <stop offset=".32" stop-color="#ffe39a" stop-opacity=".70"/>
      <stop offset=".52" stop-color="#d89a2d" stop-opacity=".28"/>
      <stop offset=".72" stop-color="#ffdfa0" stop-opacity=".84"/>
      <stop offset=".9" stop-color="#c88217" stop-opacity=".26"/>
      <stop offset="1" stop-color="#6f4309" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbitDim" x1="6" y1="112" x2="802" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8a5c16" stop-opacity=".03"/>
      <stop offset=".27" stop-color="#bd7d18" stop-opacity=".14"/>
      <stop offset=".66" stop-color="#e0aa43" stop-opacity=".27"/>
      <stop offset="1" stop-color="#70410a" stop-opacity=".03"/>
    </linearGradient>
    <clipPath id="planetClip">
      <circle cx="786" cy="56" r="132"/>
    </clipPath>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="planetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.3"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .74 0 0 0 0 .55 0 0 0 0 .22 0 0 0 .12 0"/>
    </filter>
  </defs>

  <rect width="800" height="136" fill="#010407"/>
