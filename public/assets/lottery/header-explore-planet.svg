    <circle cx="621" cy="41" r=".52" opacity=".27"/><circle cx="654" cy="112" r=".40" opacity=".18"/>
    <circle cx="687" cy="27" r=".52" opacity=".28"/><circle cx="709" cy="89" r=".42" opacity=".20"/>
