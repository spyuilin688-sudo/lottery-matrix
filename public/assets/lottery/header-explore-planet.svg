<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" fill="none">
  <defs>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(524 58) rotate(180) scale(510 108)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#744b12" stop-opacity=".09"/>
      <stop offset=".58" stop-color="#2d1b05" stop-opacity=".035"/>
      <stop offset="1" stop-color="#010407" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="18" y1="105" x2="765" y2="35" gradientUnits="userSpaceOnUse">
      <stop stop-color="#81500c" stop-opacity="0"/>
      <stop offset=".2" stop-color="#c8891f" stop-opacity=".22"/>
      <stop offset=".42" stop-color="#f1c66a" stop-opacity=".5"/>
      <stop offset=".64" stop-color="#c98a22" stop-opacity=".24"/>
      <stop offset=".82" stop-color="#f0c66b" stop-opacity=".46"/>
      <stop offset="1" stop-color="#704307" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="planetBody" cx="0" cy="0" r="1" gradientTransform="translate(748 18) rotate(34) scale(185 156)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a97e35" stop-opacity=".68"/>
      <stop offset=".24" stop-color="#694817" stop-opacity=".84"/>
      <stop offset=".55" stop-color="#291b09" stop-opacity=".98"/>
      <stop offset=".82" stop-color="#0e0b05"/>
      <stop offset="1" stop-color="#030403"/>
    </radialGradient>
    <linearGradient id="planetShade" x1="725" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020302" stop-opacity=".08"/>
      <stop offset=".46" stop-color="#020302" stop-opacity=".46"/>
      <stop offset="1" stop-color="#010201" stop-opacity=".84"/>
    </linearGradient>
    <linearGradient id="rim" x1="731" y1="-18" x2="728" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8d9" stop-opacity=".95"/>
      <stop offset=".24" stop-color="#ffe19a" stop-opacity=".92"/>
      <stop offset=".57" stop-color="#e8ad3f" stop-opacity=".82"/>
      <stop offset=".84" stop-color="#9a5d10" stop-opacity=".38"/>
      <stop offset="1" stop-color="#5f3507" stop-opacity=".06"/>
    </linearGradient>
    <clipPath id="planetClip"><circle cx="846" cy="55" r="116"/></clipPath>
    <filter id="spaceGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="19" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .72 0 0 0 0 .51 0 0 0 0 .18 0 0 0 .09 0"/>
    </filter>
    <filter id="planetTexture" x="-15%" y="-20%" width="130%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".045 .1" numOctaves="4" seed="31" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values=".8 0 0 0 .08 .38 0 0 0 .025 .1 0 0 0 0 0 0 0 .32 0"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="limbBlur" x="-120%" y="-30%" width="340%" height="160%"><feGaussianBlur stdDeviation="4.2"/></filter>
  </defs>

  <rect width="800" height="120" fill="#010407"/>
  <rect width="800" height="120" fill="url(#ambient)"/>
  <rect width="800" height="120" filter="url(#spaceGrain)" opacity=".16"/>

  <g fill="#dcae55">
    <circle cx="42" cy="30" r=".45" opacity=".24"/><circle cx="83" cy="90" r=".38" opacity=".18"/>
    <circle cx="124" cy="18" r=".52" opacity=".28"/><circle cx="164" cy="75" r=".4" opacity=".2"/>
    <circle cx="205" cy="25" r=".38" opacity=".2"/><circle cx="248" cy="103" r=".46" opacity=".22"/>
    <circle cx="301" cy="43" r=".42" opacity=".18"/><circle cx="345" cy="12" r=".36" opacity=".18"/>
    <circle cx="390" cy="96" r=".5" opacity=".22"/><circle cx="442" cy="27" r=".42" opacity=".2"/>
    <circle cx="488" cy="84" r=".38" opacity=".18"/><circle cx="534" cy="16" r=".5" opacity=".22"/>
    <circle cx="581" cy="98" r=".43" opacity=".22"/><circle cx="625" cy="35" r=".39" opacity=".2"/>
    <circle cx="670" cy="18" r=".48" opacity=".26"/><circle cx="704" cy="103" r=".38" opacity=".18"/>
  </g>

  <g id="upperOrbit" fill="none" stroke-linecap="round">
    <path d="M-18 36C120 2 245 7 366 29C482 50 585 48 730 19" stroke="#b77918" stroke-width=".42" stroke-opacity=".22"/>
    <path d="M-8 47C125 14 245 17 368 36C488 54 596 52 734 24" stroke="url(#trail)" stroke-width=".68" stroke-opacity=".55"/>
    <path d="M60 4C177 -7 273 4 371 30C473 57 566 58 690 31" stroke="#c98d25" stroke-width=".42" stroke-opacity=".2"/>
    <path d="M92 0C197 18 293 24 401 20C515 16 611 4 704 -8" stroke="#9d6413" stroke-width=".34" stroke-opacity=".16"/>
  </g>

  <g id="lowerOrbit" fill="none" stroke-linecap="round">
    <path d="M-28 110C109 74 225 70 346 85C477 102 592 93 735 53" stroke="#a96d15" stroke-width=".5" stroke-opacity=".24"/>
    <path d="M-20 101C117 66 237 65 355 79C486 96 601 87 737 48" stroke="url(#trail)" stroke-width="1.15" stroke-opacity=".82"/>
    <path d="M6 94C128 63 249 61 367 74C493 88 603 80 737 43" stroke="#d39a35" stroke-width=".52" stroke-opacity=".34"/>
    <path d="M42 116C161 83 274 79 389 91C504 104 611 95 740 59" stroke="#9f6614" stroke-width=".38" stroke-opacity=".2"/>
    <path d="M175 109C270 88 356 84 444 91C536 98 622 89 735 62" stroke="#e4b24f" stroke-width=".44" stroke-opacity=".26"/>
  </g>

  <g clip-path="url(#planetClip)">
    <circle cx="846" cy="55" r="116" fill="url(#planetBody)"/>
    <rect id="planetSurfaceTexture" x="724" y="-65" width="196" height="240" fill="#c99743" filter="url(#planetTexture)" opacity=".19"/>
    <ellipse cx="766" cy="15" rx="76" ry="25" fill="#e1b15b" opacity=".055"/>
    <circle cx="846" cy="55" r="116" fill="url(#planetShade)"/>
  </g>

  <ellipse id="planetLimbGlow" cx="731" cy="55" rx="7" ry="95" fill="#e8ad3c" opacity=".22" filter="url(#limbBlur)"/>
  <g id="planetAtmosphere" fill="none">
    <circle cx="846" cy="55" r="116" stroke="url(#rim)" stroke-width="1.45"/>
    <circle cx="846" cy="55" r="118.2" stroke="#d99527" stroke-width=".42" stroke-opacity=".22"/>
  </g>

  <g id="leftStarFlare">
    <circle cx="126" cy="17" r="5" fill="#f6b93d" opacity=".18" filter="url(#softGlow)"/>
    <circle cx="126" cy="17" r="1.05" fill="#fff8da"/>
    <path d="M115 17H137M126 9V25" stroke="#f6cb70" stroke-width=".42" stroke-opacity=".72"/>
  </g>
  <g id="rightStarFlare">
    <circle cx="692" cy="88" r="5.5" fill="#f7bd44" opacity=".18" filter="url(#softGlow)"/>
    <circle cx="692" cy="88" r="1.05" fill="#fff8da"/>
    <path d="M680 88H704M692 79V97" stroke="#f6cc75" stroke-width=".42" stroke-opacity=".7"/>
  </g>
  <g opacity=".54">
    <circle cx="510" cy="92" r=".9" fill="#fff0b9"/>
    <path d="M503 92H517M510 86V98" stroke="#dca23a" stroke-width=".32"/>
    <circle cx="635" cy="29" r=".75" fill="#ffe6a2"/>
    <path d="M629 29H641M635 24V34" stroke="#c98920" stroke-width=".3"/>
  </g>
</svg>
