    <circle cx="163" cy="115" r=".52" opacity=".28"/><circle cx="198" cy="37" r=".40" opacity=".18"/>
    <circle cx="236" cy="92" r=".56" opacity=".27"/><circle cx="274" cy="23" r=".45" opacity=".22"/>
    <circle cx="311" cy="110" r=".50" opacity=".26"/><circle cx="349" cy="43" r=".44" opacity=".22"/>
    <circle cx="388" cy="18" r=".46" opacity=".19"/><circle cx="427" cy="106" r=".52" opacity=".23"/>
    <circle cx="468" cy="34" r=".42" opacity=".24"/><circle cx="507" cy="116" r=".48" opacity=".22"/>
