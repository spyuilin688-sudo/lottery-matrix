    <stop offset=".34" stop-color="#E7AA34" stop-opacity=".22"/>
    <stop offset="1" stop-color="#C27B1E" stop-opacity="0"/>
  </radialGradient>
  <filter id="flowGlow" x="-80%" y="-300%" width="260%" height="700%">
