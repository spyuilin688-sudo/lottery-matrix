<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/feature-pages.css" />
    <link rel="stylesheet" href="/src/matrix-explore-spacing.css" />
    <title>Matrix Explore setting geometry fixture</title>
  </head>
  <body>
    <main class="feature-screen matrix-explore-screen matrix-explore-main-screen">
      <div class="feature-body">
        <section class="panel explore-settings">
          <div class="setting-grid">
            <label><span><img class="setting-label-icon matrix-explore-setting-icon" alt="" />彩球類型</span><div class="select-box native-select"><select aria-label="彩種"><option>今彩539</option></select></div></label>
            <label><span><img class="setting-label-icon matrix-explore-setting-icon" alt="" />探索期數</span><div class="segmented three"><button type="button" data-selected="true">二期</button><button type="button" data-selected="false">七期</button><button type="button" data-selected="false">十三期<em><svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M5 4.63601C5 3.76031 5.24219 3.1054 5.64323 2.67357C6.03934 2.24705 6.64582 1.9783 7.5014 1.9783C8.35745 1.9783 8.96306 2.24652 9.35823 2.67208C9.75838 3.10299 10 3.75708 10 4.63325V5.99999H5V4.63601ZM4 5.99999V4.63601C4 3.58148 4.29339 2.65754 4.91049 1.99307C5.53252 1.32329 6.42675 0.978302 7.5014 0.978302C8.57583 0.978302 9.46952 1.32233 10.091 1.99162C10.7076 2.65557 11 3.57896 11 4.63325V5.99999H12C12.5523 5.99999 13 6.44771 13 6.99999V13C13 13.5523 12.5523 14 12 14H3C2.44772 14 2 13.5523 2 13V6.99999C2 6.44771 2.44772 5.99999 3 5.99999H4ZM3 6.99999H12V13H3V6.99999Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path></svg>Matrix Pro</em></button></div></label>
            <label><span><img class="setting-label-icon matrix-explore-setting-icon" alt="" />版路類型</span><div class="segmented three"><button type="button" data-selected="true">加減版路</button><button type="button" data-selected="false">合值版路</button><button type="button" data-selected="false">拖牌版路<em>推薦</em></button></div></label>
          </div>
        </section>
        <section class="panel hit-advanced-panel">
          <div class="segmented two hit-options"><button type="button" data-selected="true">準4+（鎖定1碼）</button><button type="button" data-selected="false">準5+（鎖定2碼）</button></div>
          <button class="advanced-row" type="button"><img alt="" /><span>進階探索設定</span><svg aria-hidden="true"></svg></button>
          <div class="advanced-panel">
            <label>
              <span class="advanced-setting-title"><img class="setting-label-icon matrix-explore-setting-icon" alt="" />號碼順序</span>
              <div class="select-box native-select"><select aria-label="號碼順序"><option>依號碼由小到大排序</option><option>依實際開獎順序排序</option></select></div>
            </label>
            <label>
              <span class="advanced-setting-title"><img class="setting-label-icon matrix-explore-setting-icon" alt="" />探索日期</span>
              <div class="segmented three advanced-date-options"><button type="button" data-selected="true">本日 (最新)</button><button type="button" data-selected="false">昨日 (上1期)</button><button type="button" data-selected="false">前日 (上2期)</button></div>
            </label>
            <label>
              <span class="advanced-setting-title"><img class="setting-label-icon matrix-explore-setting-icon" alt="" />探索範圍</span>
              <div class="segmented two"><button type="button" data-selected="true">標準範圍</button><button type="button" data-selected="false">完整範圍<em><svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M5 4.63601C5 3.76031 5.24219 3.1054 5.64323 2.67357C6.03934 2.24705 6.64582 1.9783 7.5014 1.9783C8.35745 1.9783 8.96306 2.24652 9.35823 2.67208C9.75838 3.10299 10 3.75708 10 4.63325V5.99999H5V4.63601ZM4 5.99999V4.63601C4 3.58148 4.29339 2.65754 4.91049 1.99307C5.53252 1.32329 6.42675 0.978302 7.5014 0.978302C8.57583 0.978302 9.46952 1.32233 10.091 1.99162C10.7076 2.65557 11 3.57896 11 4.63325V5.99999H12C12.5523 5.99999 13 6.44771 13 6.99999V13C13 13.5523 12.5523 14 12 14H3C2.44772 14 2 13.5523 2 13V6.99999C2 6.44771 2.44772 5.99999 3 5.99999H4ZM3 6.99999H12V13H3V6.99999Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path></svg>Matrix Pro</em></button></div>
            </label>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
